# Nexus local Kafka topic manifest.
# Format is pipe-delimited data, not shell source:
#   default|partitions|<positive-int>
#   default|replication.factor|<positive-int>
#   config|<key>|<value>
#   topic|<name>|<owner>|<partition-key>|<status>|<description>

default|partitions|1
default|replication.factor|1
config|cleanup.policy|delete
config|retention.ms|604800000

topic|nexus.user.events|user-service|userId|proposed|User domain events; no business handler is wired yet.
topic|nexus.catalog.events|catalog-service|productId|proposed|Catalog domain events; no business handler is wired yet.
topic|nexus.commerce.events|commerce-service|orderId|proposed|Commerce domain events; no business handler is wired yet.
topic|nexus.auction.events|auction-service|auctionId|proposed|Auction domain events; no business handler is wired yet.
topic|nexus.fulfillment.events|fulfillment-service|orderId|proposed|Fulfillment domain events; no business handler is wired yet.
topic|nexus.training.integration.v1|commerce-service -> notification-service|request key / aggregateId|demo|Active smoke topic used to prove producer-to-consumer flow and Kafka UI visibility.
