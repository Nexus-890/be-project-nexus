name: nexus-local

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: nexus-postgres

    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - nexus-network

  # Config Server and Eureka run on the host in the local development stack.
  # Package the payment JAR first; enable this service with --profile payment.
  payment-service:
    profiles: ["payment"]
    image: eclipse-temurin:21-jre
    working_dir: /app
    user: "10001:10001"
    command: ["java", "-jar", "/app/payment-service.jar"]

    volumes:
      - ../../payment-service/target/payment-service-0.0.1-SNAPSHOT.jar:/app/payment-service.jar:ro

    environment:
      TZ: ${TZ}
      CONFIG_SERVER_URL: http://host.docker.internal:8888
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://host.docker.internal:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: host.docker.internal
      EUREKA_INSTANCE_NON_SECURE_PORT: ${PAYMENT_PORT:-8087}
      EUREKA_INSTANCE_INSTANCE_ID: payment-service:${PAYMENT_PORT:-8087}
      EUREKA_INSTANCE_HEALTH_CHECK_URL: http://host.docker.internal:${PAYMENT_PORT:-8087}/actuator/health
      EUREKA_INSTANCE_STATUS_PAGE_URL: http://host.docker.internal:${PAYMENT_PORT:-8087}/actuator/info
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://host.docker.internal:8081/.well-known/jwks.json}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-SEPAY}
      PAYMENT_RETRY_LIMIT: ${PAYMENT_RETRY_LIMIT:-3}
      SEPAY_BANK_ID: ${SEPAY_BANK_ID:-970415}
      SEPAY_BANK_ACCOUNT: ${SEPAY_BANK_ACCOUNT:-}
      SEPAY_ACCOUNT_NAME: ${SEPAY_ACCOUNT_NAME:-}
      SEPAY_VIETQR_TEMPLATE: ${SEPAY_VIETQR_TEMPLATE:-compact}
      SEPAY_TRANSFER_CONTENT_PREFIX: ${SEPAY_TRANSFER_CONTENT_PREFIX-SEVQR}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}

    ports:
      - "${PAYMENT_PORT:-8087}:8087"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8087; printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    restart: unless-stopped

    networks:
      - nexus-network

  # Config Server and Eureka run on the host in the local development stack.
  # Package the shipment JAR first; enable this service with --profile shipment.
  shipment-service:
    profiles: ["shipment"]
    image: eclipse-temurin:21-jre
    working_dir: /app
    user: "10001:10001"
    command: ["java", "-jar", "/app/shipment-service.jar"]

    volumes:
      - ../../shipment-service/target/shipment-service-0.0.1-SNAPSHOT.jar:/app/shipment-service.jar:ro

    environment:
      TZ: ${TZ}
      CONFIG_SERVER_URL: http://host.docker.internal:8888
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://host.docker.internal:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: host.docker.internal
      EUREKA_INSTANCE_NON_SECURE_PORT: "8088"
      EUREKA_INSTANCE_INSTANCE_ID: shipment-service:8088
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://host.docker.internal:8081/.well-known/jwks.json}

    ports:
      - "8088:8088"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8088; printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    restart: unless-stopped

    networks:
      - nexus-network

  # Package the rating JAR first; enable this service with --profile rating.
  rating-service:
    container_name: nexus-rating-service
    profiles: ["rating"]
    image: eclipse-temurin:21-jre
    working_dir: /app
    user: "10001:10001"
    command: ["java", "-jar", "/app/rating-service.jar"]

    volumes:
      - ../../rating-service/target/rating-service-0.0.1-SNAPSHOT.jar:/app/rating-service.jar:ro

    environment:
      TZ: ${TZ}
      CONFIG_SERVER_URL: http://host.docker.internal:8888
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://host.docker.internal:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: host.docker.internal
      EUREKA_INSTANCE_NON_SECURE_PORT: ${RATING_PORT:-8089}
      EUREKA_INSTANCE_INSTANCE_ID: rating-service:${RATING_PORT:-8089}
      EUREKA_INSTANCE_HEALTH_CHECK_URL: http://host.docker.internal:${RATING_PORT:-8089}/actuator/health
      EUREKA_INSTANCE_STATUS_PAGE_URL: http://host.docker.internal:${RATING_PORT:-8089}/actuator/info
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://host.docker.internal:8081/.well-known/jwks.json}

    ports:
      - "${RATING_PORT:-8089}:8089"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8089; printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    restart: unless-stopped

    networks:
      - nexus-network

  auth-service:
    image: quay.io/keycloak/keycloak:26.7.5
    container_name: nexus-auth-service
    command: ["start-dev", "--import-realm"]

    environment:
      TZ: ${TZ}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/auth_db
      KC_DB_USERNAME: ${DB_USERNAME}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"

    ports:
      - "${KEYCLOAK_PORT}:8080"

    volumes:
      - ./keycloak/realm-nexus.json:/opt/keycloak/data/import/nexus-realm.json:ro
      - ./keycloak/themes/nexus:/opt/keycloak/themes/nexus:ro

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

    restart: unless-stopped

    networks:
      - nexus-network

  # Explicit password provisioning: .\keycloak\seed-users.ps1 on Windows
  auth-seed:
    profiles: ["tools"]
    image: quay.io/keycloak/keycloak:26.7.5
    entrypoint: ["/bin/bash", "/opt/nexus/seed-users.sh", "--container"]
    environment:
      KEYCLOAK_SERVER_URL: http://auth-service:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_SELLER_PASSWORD: ${DEMO_SELLER_PASSWORD:-}
      DEMO_BUYER_PASSWORD: ${DEMO_BUYER_PASSWORD:-}
      KEYCLOAK_USER_SERVICE_CLIENT_SECRET: ${KEYCLOAK_USER_SERVICE_CLIENT_SECRET:-}
      KEYCLOAK_NOTIFICATION_SERVICE_CLIENT_SECRET: ${KEYCLOAK_NOTIFICATION_SERVICE_CLIENT_SECRET:-}
    volumes:
      - ./keycloak/seed-users.sh:/opt/nexus/seed-users.sh:ro
    depends_on:
      auth-service:
        condition: service_healthy
    restart: "no"
    networks:
      - nexus-network

  kafka:
    image: apache/kafka:4.3.1
    container_name: nexus-kafka

    environment:
      TZ: ${TZ}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:${KAFKA_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    restart: unless-stopped

    networks:
      - nexus-network

  # One-shot CLI client: create/validate project topics after Kafka is ready.
  # Exited (0) is expected; this is not another broker or controller.
  kafka-init:
    image: apache/kafka:4.3.1
    entrypoint: ["/bin/bash", "/opt/nexus/create-topics.sh"]

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    volumes:
      - ./create-topics.sh:/opt/nexus/create-topics.sh:ro
      - ./kafka:/opt/nexus/kafka:ro

    depends_on:
      kafka:
        condition: service_healthy

    restart: "no"

    networks:
      - nexus-network

  redis:
    image: redis:8-alpine
    container_name: nexus-redis

    environment:
      TZ: ${TZ}

    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - nexus-network

  kafka-ui:
    profiles: ["debug"]
    image: kafbat/kafka-ui:v1.5.0
    container_name: nexus-kafka-ui

    environment:
      TZ: ${TZ}
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: nexus-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    ports:
      - "${KAFKA_UI_PORT}:8080"

    depends_on:
      kafka-init:
        condition: service_completed_successfully

    restart: unless-stopped

    networks:
      - nexus-network

  mailpit:
    image: axllent/mailpit:v1.31
    container_name: nexus-mailpit

    environment:
      TZ: ${TZ}
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"

    restart: unless-stopped

    networks:
      - nexus-network

  zipkin:
    image: openzipkin/zipkin:3.6.1
    container_name: nexus-zipkin

    environment:
      TZ: ${TZ}

    ports:
      - "${ZIPKIN_PORT:-9411}:9411"

    restart: unless-stopped

    networks:
      - nexus-network

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.15.0
    container_name: nexus-prometheus

    environment:
      TZ: ${TZ}

    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    networks:
      - nexus-network

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.3
    container_name: nexus-grafana

    environment:
      TZ: ${TZ}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    ports:
      - "${GRAFANA_PORT:-3001}:3000"

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

    restart: unless-stopped

    networks:
      - nexus-network


networks:
  nexus-network:
    driver: bridge


volumes:
  postgres-data:
    driver: local
  kafka-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
