name: nexus-local

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: nexus-postgres

    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - nexus-network

  kafka:
    image: apache/kafka:4.3.1
    container_name: nexus-kafka

    environment:
      TZ: ${TZ}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:${KAFKA_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    restart: unless-stopped

    networks:
      - nexus-network

  # One-shot CLI client: create/validate project topics after Kafka is ready.
  # Exited (0) is expected; this is not another broker or controller.
  kafka-init:
    image: apache/kafka:4.3.1
    entrypoint: ["/bin/bash", "/opt/nexus/kafka/init-topics.sh"]

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    volumes:
      - ./kafka:/opt/nexus/kafka:ro

    depends_on:
      kafka:
        condition: service_healthy

    restart: "no"

    networks:
      - nexus-network

  redis:
    image: redis:8-alpine
    container_name: nexus-redis

    environment:
      TZ: ${TZ}

    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - nexus-network

  kafka-ui:
    profiles: ["debug"]
    image: kafbat/kafka-ui:v1.5.0
    container_name: nexus-kafka-ui

    environment:
      TZ: ${TZ}
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: nexus-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    ports:
      - "${KAFKA_UI_PORT}:8080"

    depends_on:
      kafka-init:
        condition: service_completed_successfully

    restart: unless-stopped

    networks:
      - nexus-network

  mailpit:
    image: axllent/mailpit:v1.31
    container_name: nexus-mailpit

    environment:
      TZ: ${TZ}
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"

    restart: unless-stopped

    networks:
      - nexus-network


networks:
  nexus-network:
    driver: bridge


volumes:
  postgres-data:
    driver: local
  kafka-data:
    driver: local
  redis-data:
    driver: local
