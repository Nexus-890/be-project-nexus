# envsubst substitutes DOMAIN only; nginx request variables must stay intact.
resolver 127.0.0.11 valid=10s ipv6=off;
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name ${DOMAIN};
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://${DOMAIN}$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};
    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;

    # Gateway is never published. Ignore all client-supplied forwarding headers.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header Forwarded "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;

    set $gateway http://api-gateway:8080;
    set $frontend http://frontend:3000;
    set $identity http://auth-service:8080;

    # Keep operational endpoints off the public surface.
    location ~ ^/(actuator|swagger|v3/api-docs)(/|$) { return 404; }
    location ~ ^/api/v1/(internal|inventory/reservations)(/|$) { return 404; }
    location = /api { proxy_pass $gateway$request_uri; }
    location /api/ {
        proxy_buffering off;
        proxy_cache off;
        proxy_pass $gateway$request_uri;
    }
    location ^~ /.well-known/ { proxy_pass $gateway$request_uri; }
    # Keycloak uses /auth in its own http-relative-path; do not strip it.
    location ~ ^/auth/(admin|metrics|health)(/|$) { return 404; }
    location /auth/ { proxy_pass $identity$request_uri; }
    location / {
        proxy_pass $frontend$request_uri;
    }
}
