map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream nexus_gateway  { server api-gateway:8080; keepalive 32; }
upstream nexus_web      { server web:3000;         keepalive 16; }
upstream nexus_keycloak { server auth-service:8080; keepalive 8; }

server {
    listen 80 default_server;
    server_name ${STAGING_HOST};

    location = /.nginx-health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name ${STAGING_HOST};

    ssl_certificate     /etc/letsencrypt/live/${STAGING_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${STAGING_HOST}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 30m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;
    proxy_set_header Forwarded         "";
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;

    location /api/ {
        proxy_pass http://nexus_gateway;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /.well-known/ {
        proxy_pass http://nexus_gateway;
    }

    location /realms/ {
        proxy_pass http://nexus_keycloak;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    location /resources/ {
        proxy_pass http://nexus_keycloak;
    }

    location ^~ /realms/master/ {
        return 404;
    }

    location / {
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://nexus_web;
    }
}
