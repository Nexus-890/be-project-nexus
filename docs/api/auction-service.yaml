    post:
      tags:
      - Bids
      operationId: placeBid
      summary: Place a bid
      x-service: auction-service
      x-catalogue-id: BID-01
      x-owning-issue: '#146, #147'
      x-actor-roles:
      - BUYER
      x-gateway-privilege: AUCTION.BID
      description: 'A new bid returns 201. A key seen before returns 200 with the first response. In the
        mock, 200 is the default because Prism picks the lowest 2xx: send `Prefer: code=201` for a new
        bid. AUCTION_REPUTATION_TOO_LOW applies only with FEATURE_REPUTATION_ENFORCEMENT on (#214).'
      x-required-privileges:
      - AUCTION.BID
      x-ownership: Not the auction's seller; caller-scoped idempotency key
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id.
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        description: One UUID per bid attempt.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceBidRequest'
            example:
              amount: 1250000.0
      responses:
        '200':
          description: The first response, when the key was seen before.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceBidReplayResponse'
              example:
                code: 0
                message: response success
                data:
                  bidId: 00000081-1111-4111-8111-111111111111
                  currentPrice: 1250000.0
                  leaderBidderId: 00000071-1111-4111-8111-111111111111
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceBidResponse'
              example:
                code: 0
                message: response success
                data:
                  bidId: 00000081-1111-4111-8111-111111111111
                  currentPrice: 1250000.0
                  leaderBidderId: 00000071-1111-4111-8111-111111111111
