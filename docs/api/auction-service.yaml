components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT issued by user-service. Prism checks that the header is present, not its
        signature, roles or ownership.
  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page number.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: \S
          minLength: 1
          description: Stable symbolic identifier. Branch on code and status; tolerate future unknown
            codes.
        traceId:
          type: string
          pattern: \S
          minLength: 1
          description: Active trace/correlation identifier when available; optional without tracing.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      type: object
      required:
      - field
      - code
      - detail
      properties:
        field:
          type: string
        code:
          type: string
        detail:
          type: string
    PageInfo:
      type: object
      additionalProperties: false
      required:
      - number
      - size
      - totalElements
      - totalPages
      properties:
        number:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    CreateAuctionRequest:
      type: object
      additionalProperties: false
      required:
      - productId
      - skuId
      - title
      - startingPrice
      - startAt
      - endAt
      properties:
        productId:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 255
