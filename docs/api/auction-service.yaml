      x-gateway-privilege: public
      description: 'Public. Reads auction-service''s own tables only. No bidder id is exposed: use the
        state endpoint for the masked leader name.'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id.
        schema:
          type: string
          format: uuid
      responses:
