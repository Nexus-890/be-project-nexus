        '403':
          description: 'Forbidden. Codes: `FORBIDDEN`, `AUCTION_FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                FORBIDDEN:
                  value:
                    type: urn:problem:forbidden
                    title: Forbidden
                    status: 403
                    detail: The required privilege is missing
