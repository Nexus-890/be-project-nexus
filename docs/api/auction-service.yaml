x-business-error-codes:
  AUCTION_BID_TOO_LOW:
    status: 400
    detail: The bid is below the minimum
  AUCTION_CATALOG_UNAVAILABLE:
    status: 503
    detail: catalog-service is unavailable
  AUCTION_DURATION_OUT_OF_BOUNDS:
    status: 400
    detail: The auction duration is outside the configured bounds
  AUCTION_FORBIDDEN:
    status: 403
    detail: Only the owner can do this
  AUCTION_HAS_BIDS:
    status: 409
    detail: The auction is not eligible for cancellation
  AUCTION_IDEMPOTENCY_KEY_REQUIRED:
    status: 400
    detail: The Idempotency-Key header is required
  AUCTION_ILLEGAL_TRANSITION:
    status: 409
    detail: The auction cannot move to this status from its current status
  AUCTION_INVALID_WINDOW:
    status: 400
    detail: endAt must be after startAt
  AUCTION_LIVE_AUCTION_EXISTS:
    status: 409
    detail: This SKU already has a live auction
  AUCTION_NOT_ACTIVE:
    status: 409
    detail: The auction is not ACTIVE
  AUCTION_NOT_EDITABLE:
    status: 409
    detail: The auction has started; its configuration is frozen
  AUCTION_NOT_FOUND:
    status: 404
    detail: Auction not found
  AUCTION_PRODUCT_NOT_FOUND:
    status: 404
    detail: Product not found
  AUCTION_REPUTATION_TOO_LOW:
    status: 403
    detail: The caller's reputation is below the required minimum
  AUCTION_SELLER_CANNOT_BID:
    status: 409
    detail: The seller cannot bid on their own auction
  AUCTION_SELLER_LIMIT_REACHED:
    status: 409
    detail: The seller has reached the active auction limit
  AUCTION_SKU_NOT_FOUND:
    status: 404
    detail: SKU not found
