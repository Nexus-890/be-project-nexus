                    instance: /api/v1/auctions/00000051-1111-4111-8111-111111111111/bids
                    code: AUCTION_IDEMPOTENCY_KEY_REQUIRED
                AUCTION_BID_TOO_LOW:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: The bid is below the minimum
                    instance: /api/v1/auctions/00000051-1111-4111-8111-111111111111/bids
                    code: AUCTION_BID_TOO_LOW
                    minimum: 1300000.0
                VALIDATION_FAILED:
                  value:
                    type: urn:problem:validation-error
                    title: Bad Request
                    status: 400
                    detail: The request data is invalid
                    instance: /api/v1/auctions/00000051-1111-4111-8111-111111111111/bids
                    code: VALIDATION_FAILED
                    errors:
                    - field: amount
                      code: VALIDATION_NOT_NULL
                      detail: must not be null
        '401':
          description: 'Unauthorized. Codes: `UNAUTHENTICATED`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                UNAUTHENTICATED:
                  value:
                    type: urn:problem:unauthorized
                    title: Unauthorized
                    status: 401
                    detail: A valid bearer token is required
                    instance: /api/v1/auctions/00000051-1111-4111-8111-111111111111/bids
                    code: UNAUTHENTICATED
          headers:
            WWW-Authenticate:
              description: Bearer challenge.
              schema:
                type: string
                example: Bearer
        '403':
          description: 'Forbidden. Codes: `FORBIDDEN`, `AUCTION_REPUTATION_TOO_LOW`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                FORBIDDEN:
                  value:
                    type: urn:problem:forbidden
                    title: Forbidden
                    status: 403
                    detail: The required privilege is missing
                    instance: /api/v1/auctions/00000051-1111-4111-8111-111111111111/bids
                    code: FORBIDDEN
                AUCTION_REPUTATION_TOO_LOW:
                  value:
                    type: urn:problem:domain-error
