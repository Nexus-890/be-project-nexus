                  imageUrl: https://cdn.example.com/products/camera.jpg
                  startingPrice: 1100000.0
                  bidIncrement: 50000.0
                  currentPrice: 1100000.0
                  bidCount: 0
                  currency: VND
                  startAt: '2026-11-05T12:00:00Z'
                  endAt: '2026-11-06T12:00:00Z'
                  originalEndAt: '2026-11-06T12:00:00Z'
