openapi: 3.0.3
info:
  title: Project Nexus — Auction API shapes (#124)
  version: 0.1.0-draft
  description: |
    Draft for frontend mocks, not an implementation or proof of gateway enforcement. Access per path is in `docs/api/gateway-permissions.md`, section "API shapes draft (#124)".

    The runnable frontend guide is in `docs/api/inventory-service.yaml`, under `info.description`, "Frontend quick start". This mock runs on `http://localhost:4013`.
servers:
- url: http://localhost:4013
  description: Prism mock
tags:
- name: Auctions
  description: 'Auction sessions: create, schedule, read and cancel.'
- name: Bids
  description: Placing bids and reading bid history.
security:
- bearerAuth: []
paths:
  /api/v1/auctions:
    post:
      tags:
      - Auctions
      operationId: createAuction
      summary: Create an auction
      x-service: auction-service
      x-catalogue-id: AUC-01
      x-owning-issue: '#140, #141, #142'
      x-actor-roles:
      - ADMIN
      - SELLER
      x-gateway-privilege: AUCTION.CREATE
      description: The new auction has status CREATED, currentPrice = startingPrice and originalEndAt
        = endAt. A SKU can have one live auction (CREATED, SCHEDULED or ACTIVE). AUCTION_REPUTATION_TOO_LOW
        applies only with FEATURE_REPUTATION_ENFORCEMENT on (#214).
      x-required-privileges:
      - AUCTION.CREATE
      x-ownership: Seller of the product; ADMIN on behalf of a seller
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuctionRequest'
            example:
              productId: 00000002-1111-4111-8111-111111111111
              skuId: 00000003-1111-4111-8111-111111111111
              title: Vintage film camera
              startingPrice: 1000000.0
              bidIncrement: 50000.0
              startAt: '2026-11-05T10:00:00Z'
              endAt: '2026-11-06T10:00:00Z'
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAuctionResponse'
              example:
                code: 0
                message: response success
                data:
                  id: 00000051-1111-4111-8111-111111111111
                  productId: 00000002-1111-4111-8111-111111111111
                  skuId: 00000003-1111-4111-8111-111111111111
                  sellerId: 00000061-1111-4111-8111-111111111111
                  title: Vintage film camera
                  imageUrl: https://cdn.example.com/products/camera.jpg
                  startingPrice: 1000000.0
                  bidIncrement: 50000.0
                  currentPrice: 1000000.0
                  bidCount: 0
                  currency: VND
                  startAt: '2026-11-05T10:00:00Z'
                  endAt: '2026-11-06T10:00:00Z'
                  originalEndAt: '2026-11-06T10:00:00Z'
                  extensionCount: 0
                  status: CREATED
                  finalPrice: null
                  paymentDueAt: null
                  orderId: null
                  cancelledBy: null
                  cancelledReason: null
        '400':
          description: 'Bad Request. Codes: `VALIDATION_FAILED`, `AUCTION_INVALID_WINDOW`, `AUCTION_DURATION_OUT_OF_BOUNDS`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                VALIDATION_FAILED:
                  value:
                    type: urn:problem:validation-error
                    title: Bad Request
                    status: 400
                    detail: The request data is invalid
                    instance: /api/v1/auctions
                    code: VALIDATION_FAILED
                    errors:
                    - field: productId
                      code: VALIDATION_NOT_NULL
                      detail: must not be null
                AUCTION_INVALID_WINDOW:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: endAt must be after startAt
                    instance: /api/v1/auctions
                    code: AUCTION_INVALID_WINDOW
                AUCTION_DURATION_OUT_OF_BOUNDS:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: The auction duration is outside the configured bounds
                    instance: /api/v1/auctions
                    code: AUCTION_DURATION_OUT_OF_BOUNDS
        '401':
          description: 'Unauthorized. Codes: `UNAUTHENTICATED`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                UNAUTHENTICATED:
                  value:
                    type: urn:problem:unauthorized
                    title: Unauthorized
                    status: 401
                    detail: A valid bearer token is required
                    instance: /api/v1/auctions
                    code: UNAUTHENTICATED
          headers:
            WWW-Authenticate:
              description: Bearer challenge.
              schema:
                type: string
                example: Bearer
        '403':
          description: 'Forbidden. Codes: `FORBIDDEN`, `AUCTION_FORBIDDEN`, `AUCTION_REPUTATION_TOO_LOW`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                FORBIDDEN:
                  value:
                    type: urn:problem:forbidden
                    title: Forbidden
                    status: 403
                    detail: The required privilege is missing
                    instance: /api/v1/auctions
                    code: FORBIDDEN
                AUCTION_FORBIDDEN:
                  value:
                    type: urn:problem:domain-error
                    title: Forbidden
                    status: 403
                    detail: Only the owner can do this
                    instance: /api/v1/auctions
                    code: AUCTION_FORBIDDEN
                AUCTION_REPUTATION_TOO_LOW:
                  value:
                    type: urn:problem:domain-error
                    title: Forbidden
                    status: 403
                    detail: The caller's reputation is below the required minimum
                    instance: /api/v1/auctions
                    code: AUCTION_REPUTATION_TOO_LOW
        '404':
          description: 'Not Found. Codes: `AUCTION_PRODUCT_NOT_FOUND`, `AUCTION_SKU_NOT_FOUND`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                AUCTION_PRODUCT_NOT_FOUND:
                  value:
                    type: urn:problem:domain-error
                    title: Not Found
                    status: 404
                    detail: Product not found
                    instance: /api/v1/auctions
                    code: AUCTION_PRODUCT_NOT_FOUND
                AUCTION_SKU_NOT_FOUND:
                  value:
                    type: urn:problem:domain-error
                    title: Not Found
                    status: 404
                    detail: SKU not found
                    instance: /api/v1/auctions
                    code: AUCTION_SKU_NOT_FOUND
        '409':
          description: 'Conflict. Codes: `AUCTION_LIVE_AUCTION_EXISTS`, `AUCTION_SELLER_LIMIT_REACHED`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                AUCTION_LIVE_AUCTION_EXISTS:
                  value:
                    type: urn:problem:domain-error
                    title: Conflict
                    status: 409
                    detail: This SKU already has a live auction
                    instance: /api/v1/auctions
                    code: AUCTION_LIVE_AUCTION_EXISTS
                AUCTION_SELLER_LIMIT_REACHED:
                  value:
                    type: urn:problem:domain-error
                    title: Conflict
                    status: 409
                    detail: The seller has reached the active auction limit
                    instance: /api/v1/auctions
                    code: AUCTION_SELLER_LIMIT_REACHED
        '503':
          description: 'Service Unavailable. Codes: `AUCTION_CATALOG_UNAVAILABLE`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                AUCTION_CATALOG_UNAVAILABLE:
                  value:
                    type: urn:problem:domain-error
                    title: Service Unavailable
                    status: 503
                    detail: catalog-service is unavailable
                    instance: /api/v1/auctions
                    code: AUCTION_CATALOG_UNAVAILABLE
    get:
      tags:
      - Auctions
      operationId: listAuctions
      summary: List auctions, ending soonest first
      x-service: auction-service
      x-catalogue-id: AUC-05
      x-owning-issue: '#143'
      x-actor-roles:
      - public
      x-gateway-privilege: public
      security: []
      parameters:
      - name: status
        in: query
        description: Filter by status.
        schema:
          type: string
          enum:
          - CREATED
          - SCHEDULED
          - ACTIVE
          - ENDED
          - WON
          - SETTLED
          - FAILED
          - PAYMENT_TIMEOUT
          - CANCELLED
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuctionsResponse'
              example:
                code: 0
                message: response success
                data:
                - id: 00000051-1111-4111-8111-111111111111
                  productId: 00000002-1111-4111-8111-111111111111
                  skuId: 00000003-1111-4111-8111-111111111111
                  sellerId: 00000061-1111-4111-8111-111111111111
                  title: Vintage film camera
                  imageUrl: https://cdn.example.com/products/camera.jpg
                  startingPrice: 1000000.0
                  bidIncrement: 50000.0
                  currentPrice: 1200000.0
                  bidCount: 3
                  currency: VND
                  startAt: '2026-11-05T10:00:00Z'
                  endAt: '2026-11-06T10:00:00Z'
                  originalEndAt: '2026-11-06T10:00:00Z'
                  extensionCount: 0
                  status: ACTIVE
                  finalPrice: null
                  paymentDueAt: null
                  orderId: null
                  cancelledBy: null
                  cancelledReason: null
                page:
                  number: 0
                  size: 10
                  totalElements: 1
                  totalPages: 1
        '400':
          description: 'Bad Request. Codes: `INVALID_PARAMETER`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_PARAMETER:
                  value:
                    type: urn:problem:invalid-parameter
                    title: Bad Request
                    status: 400
                    detail: A request parameter is invalid
                    instance: /api/v1/auctions
                    code: INVALID_PARAMETER
  /api/v1/auctions/{id}:
