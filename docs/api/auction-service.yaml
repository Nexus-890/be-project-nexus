                AUCTION_FORBIDDEN:
                  value:
                    type: urn:problem:domain-error
                    title: Forbidden
                    status: 403
                    detail: Only the owner can do this
                    instance: /api/v1/auctions/00000051-1111-4111-8111-111111111111
