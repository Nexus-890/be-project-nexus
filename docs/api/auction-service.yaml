  /api/v1/auctions/{id}/state:
    get:
      tags:
      - Auctions
      operationId: getAuctionState
      summary: Read the live state of an auction
      x-service: auction-service
      x-catalogue-id: AUC-06
      x-owning-issue: '#168'
      x-actor-roles:
      - public
      x-gateway-privilege: public
      description: Public. Cached 1 second; serverTime is read after the cache.
      security: []
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuctionStateResponse'
              example:
                code: 0
                message: response success
                data:
                  auctionId: 00000051-1111-4111-8111-111111111111
                  currentPrice: 1200000.0
                  bidCount: 3
                  bidIncrement: 50000.0
                  leaderBidderName: Ng**** V**
                  endAt: '2026-11-06T10:00:00Z'
                  status: ACTIVE
                  serverTime: '2026-11-05T15:30:00Z'
        '400':
          description: 'Bad Request. Codes: `INVALID_PARAMETER`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_PARAMETER:
                  value:
                    type: urn:problem:invalid-parameter
                    title: Bad Request
                    status: 400
                    detail: A request parameter is invalid
                    instance: /api/v1/auctions/00000051-1111-4111-8111-111111111111/state
                    code: INVALID_PARAMETER
        '404':
          description: 'Not Found. Codes: `AUCTION_NOT_FOUND`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                AUCTION_NOT_FOUND:
                  value:
                    type: urn:problem:domain-error
                    title: Not Found
                    status: 404
                    detail: Auction not found
                    instance: /api/v1/auctions/00000051-1111-4111-8111-111111111111/state
                    code: AUCTION_NOT_FOUND
  /api/v1/auctions/{id}/cancel:
    post:
      tags:
      - Auctions
      operationId: cancelAuction
      summary: Cancel an auction with no valid bid
      x-service: auction-service
      x-catalogue-id: AUC-07
      x-owning-issue: '#197'
      x-actor-roles:
      - ADMIN
      - SELLER
      x-gateway-privilege: AUCTION.CANCEL
      x-required-privileges:
      - AUCTION.CANCEL
      x-ownership: Owner of the auction; only while it has no valid bid
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
