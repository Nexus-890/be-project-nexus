    get:
      tags: [Ledger]
      operationId: listMovements
      summary: Read the stock ledger
      description: >-
        Every filter is optional and they combine with AND. from is inclusive and to is
        exclusive; both are ISO 8601 date-times with an offset, and from must be before to.
        Newest first (createdAt, then id, descending). createdAt is in UTC. reason is set on
        ADJUSTMENT rows only. The gateway only requires a valid token; the service requires
        ADMIN or SUPPORT_STAFF.
      security:
        - bearerAuth: []
      x-actor-roles: [ADMIN, SUPPORT_STAFF]
      x-required-roles: [ADMIN, SUPPORT_STAFF]
      parameters:
        - name: skuId
          in: query
          description: Only movements of this SKU
          schema:
            type: string
            format: uuid
        - name: warehouseId
          in: query
          description: Only movements in this warehouse
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/MovementType'
        - name: referenceId
          in: query
          description: A reservation id, or the balance id for INTAKE and ADJUSTMENT rows
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          example: '2026-11-10T15:00:00+07:00'
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: One page of ledger rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementPageApiResponse'
              example:
                code: 0
                message: response success
                data:
                  - id: 0195f0a4-4444-7444-8444-444444444444
                    skuId: 0195f0a2-7c1e-7d2a-9b3f-2c4d5e6f7a81
                    warehouseId: 0195f0a1-0000-7000-8000-000000000001
                    movementType: ADJUSTMENT
                    quantity: -2
                    referenceId: 0195f0a4-5555-7555-8555-555555555555
                    reason: Two units damaged in the warehouse
                    createdAt: '2026-11-10T08:02:00Z'
                page:
