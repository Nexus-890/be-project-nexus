                        detail: A valid value is required
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WarehouseNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WarehouseId:
      name: id
      in: path
      required: true
      description: Warehouse identifier
      schema:
        type: string
        format: uuid
  responses:
    WarehouseRead:
      description: Warehouse details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WarehouseApiResponse'
          example:
            code: 0
            message: response success
            data:
              id: 0195f0a1-0000-7000-8000-000000000002
              code: WH_HCM_02
              name: Ho Chi Minh warehouse
              address: 1 Nguyen Hue, District 1, Ho Chi Minh City
              status: ACTIVE
    InvalidWarehouseId:
      description: id is not a UUID. Code INVALID_PARAMETER.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem:invalid-parameter
            title: Bad Request
            status: 400
            detail: A request parameter is invalid
            instance: /api/v1/warehouses/not-a-uuid
            code: INVALID_PARAMETER
            errors:
              - field: id
                code: INVALID_PARAMETER
                detail: A valid value is required
    Unauthenticated:
      description: Missing or invalid bearer token. Code UNAUTHENTICATED.
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem:unauthorized
            title: Unauthorized
            status: 401
            detail: A valid access token is required to access this resource
            instance: /api/v1/warehouses
            code: UNAUTHENTICATED
    Forbidden:
      description: The caller does not have a role allowed by this operation. Code FORBIDDEN.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem:forbidden
            title: Forbidden
            status: 403
            detail: You do not have permission to access this resource
            instance: /api/v1/warehouses
            code: FORBIDDEN
    WarehouseNotFound:
      description: The warehouse does not exist. Code INVENTORY_WAREHOUSE_NOT_FOUND.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem:domain-error
            title: Not Found
            status: 404
            detail: Warehouse not found
            instance: /api/v1/warehouses/0195f0a1-0000-7000-8000-000000000002
            code: INVENTORY_WAREHOUSE_NOT_FOUND
    NotAcceptable:
      description: Unsupported Accept header. Code NOT_ACCEPTABLE.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem:not-acceptable
            title: Not Acceptable
            status: 406
            detail: The requested response format is not supported
            instance: /api/v1/warehouses
            code: NOT_ACCEPTABLE
    UnsupportedMediaType:
      description: Unsupported Content-Type header. Code UNSUPPORTED_MEDIA_TYPE.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem:unsupported-media-type
            title: Unsupported Media Type
            status: 415
            detail: The request content type is not supported
            instance: /api/v1/warehouses
            code: UNSUPPORTED_MEDIA_TYPE
    InternalError:
      description: Unexpected service failure. Code INTERNAL_ERROR.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem:internal-server-error
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred
            instance: /api/v1/warehouses
            code: INTERNAL_ERROR
  schemas:
    LinkedAuctionReservationApiResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [0]
        message:
          type: string
        data:
          type: array
          items:
            type: object
            required: [reservationId, warehouseId, status]
            properties:
              reservationId:
                type: string
                format: uuid
              warehouseId:
                type: string
                format: uuid
              status:
                type: string
                enum: [HELD, CONFIRMED, RELEASED, EXPIRED]
    IntakeRequest:
      type: object
      required: [skuId, quantity]
      properties:
        skuId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
          description: Defaults to the warehouse with code nexus.inventory.default-warehouse-code
        quantity:
          type: integer
          format: int32
          minimum: 1
    BalanceApiResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          default: 0
          example: 0
        message:
          type: string
          default: response success
          example: response success
        data:
          $ref: '#/components/schemas/Balance'
    Balance:
      type: object
      required: [skuId, warehouseId, total, available, reserved, unavailable]
      properties:
        skuId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        total:
          type: integer
          format: int32
          minimum: 0
        available:
          type: integer
          format: int32
          minimum: 0
        reserved:
          type: integer
          format: int32
          minimum: 0
        unavailable:
          type: integer
          format: int32
          minimum: 0
    ReserveRequest:
      type: object
      required: [orderGroupId, items]
      properties:
        orderGroupId:
          type: string
          format: uuid
          description: Identifies the request; not stored
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReserveItem'
    ReserveItem:
      type: object
      required: [orderId, skuId, quantity]
      properties:
        orderId:
          type: string
          format: uuid
          description: The seller order that owns the item; stored on its reservation
        skuId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
    ReservationApiResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          default: 0
          example: 0
        message:
          type: string
          default: response success
          example: response success
        data:
          $ref: '#/components/schemas/Reservation'
    Reservation:
      type: object
      required: [reservationIds, warehouseId, expiresAt]
      properties:
        reservationIds:
          type: array
          description: One per item, in request order
          items:
            type: string
            format: uuid
        warehouseId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: >-
            In UTC with a Z offset; the same for every item of the request. The time of the
            request plus nexus.inventory.reservation-timeout-minutes from Config Server (30 by
            default), read again on /actuator/refresh.
    AdjustmentRequest:
      type: object
      required: [skuId, quantityDelta, reason]
      properties:
        skuId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
          description: Defaults to the warehouse with code nexus.inventory.default-warehouse-code
        quantityDelta:
          type: integer
          format: int32
          minimum: -1000000
          maximum: 1000000
          description: Not 0; negative removes stock, positive adds it
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Stored on the ADJUSTMENT ledger row without leading or trailing spaces
    InsufficientStockProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [skuId, available, requested]
          properties:
            skuId:
              type: string
              format: uuid
            available:
              type: integer
              format: int32
              minimum: 0
            requested:
              type: integer
              format: int32
              minimum: 1
    Problem:
      type: object
      required: [type, title, status, detail, instance, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      type: object
      required: [field, code, detail]
      properties:
        field:
          type: string
        code:
          type: string
        detail:
          type: string
    StockApiResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          default: 0
          example: 0
        message:
          type: string
          default: response success
          example: response success
        data:
          $ref: '#/components/schemas/Stock'
    StockListApiResponse:
      type: object
      required: [code, message, data, page]
      properties:
        code:
          type: integer
          default: 0
          example: 0
        message:
          type: string
          default: response success
          example: response success
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Stock'
        page:
          $ref: '#/components/schemas/PageInfo'
    Stock:
      type: object
      additionalProperties: false
      required: [skuId, available]
      properties:
        skuId:
          type: string
          format: uuid
        available:
          type: integer
          format: int32
          minimum: 0
          description: 0 when the SKU has no balance row in the default warehouse
    PageInfo:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    BalancePageApiResponse:
      type: object
      required: [code, message, data, page]
      properties:
        code:
          type: integer
          default: 0
          example: 0
        message:
          type: string
          default: response success
          example: response success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Balance'
        page:
          $ref: '#/components/schemas/PageInfo'
    ReservationView:
      type: object
      required: [id, skuId, warehouseId, orderId, quantity, status, expiresAt, releasedAt]
      properties:
        id:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
        status:
          type: string
          enum: [HELD, CONFIRMED, RELEASED, EXPIRED]
        expiresAt:
          type: string
          format: date-time
          description: In UTC
        releasedAt:
          type: string
          format: date-time
          nullable: true
          description: In UTC; null while HELD
    ReservationPageApiResponse:
      type: object
      required: [code, message, data, page]
      properties:
        code:
          type: integer
          default: 0
          example: 0
        message:
          type: string
          default: response success
          example: response success
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReservationView'
        page:
          $ref: '#/components/schemas/PageInfo'
    MovementType:
      type: string
      enum: [INTAKE, RESERVE, RELEASE, COMMIT, ADJUSTMENT, RETURN]
    Movement:
      type: object
      required: [id, skuId, warehouseId, movementType, quantity, referenceId, reason, createdAt]
      properties:
        id:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        movementType:
          $ref: '#/components/schemas/MovementType'
        quantity:
          type: integer
          format: int32
          description: Signed for ADJUSTMENT; otherwise the units moved
        referenceId:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          nullable: true
          description: Set on ADJUSTMENT rows only
        createdAt:
          type: string
          format: date-time
          description: In UTC
    MovementPageApiResponse:
      type: object
      required: [code, message, data, page]
      properties:
        code:
          type: integer
          default: 0
          example: 0
        message:
          type: string
          default: response success
          example: response success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Movement'
        page:
          $ref: '#/components/schemas/PageInfo'
    CreateWarehouseRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '\S'
          description: Nonblank, case-sensitive unique code; surrounding ASCII whitespace is trimmed before storage
          example: WH_HCM_02
        name:
          type: string
          minLength: 1
          maxLength: 150
          pattern: '\S'
          description: Nonblank name; surrounding ASCII whitespace is trimmed before storage
          example: Ho Chi Minh warehouse
        address:
          type: string
          nullable: true
          description: Optional warehouse address
          example: 1 Nguyen Hue, District 1, Ho Chi Minh City
    WarehouseApiResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          default: 0
          example: 0
        message:
          type: string
          default: response success
          example: response success
        data:
          $ref: '#/components/schemas/Warehouse'
    UpdateWarehouseRequest:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          pattern: '\S'
          description: Nonblank name; surrounding ASCII whitespace is trimmed before storage
        address:
          type: string
          nullable: true
          description: Omit or set null to clear the warehouse address
        status:
          type: string
          enum: [ACTIVE, INACTIVE, MAINTENANCE]
    WarehouseListApiResponse:
      type: object
      required: [code, message, data, page]
      properties:
        code:
          type: integer
          default: 0
          example: 0
        message:
          type: string
          default: response success
          example: response success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Warehouse'
        page:
          $ref: '#/components/schemas/WarehousePageInfo'
    Warehouse:
      type: object
      required: [id, code, name, status]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 40
        name:
          type: string
          minLength: 1
          maxLength: 150
        address:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, MAINTENANCE]
          description: Newly created warehouses are always ACTIVE
    WarehousePageInfo:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
          minimum: 0
          maximum: 0
          description: Complete warehouse lists always use page number 0
        size:
          type: integer
          minimum: 1
          description: max(1, result count)
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: Number of warehouses matching the optional filter
        totalPages:
          type: integer
          minimum: 0
          maximum: 1
          description: 0 for an empty result or 1 otherwise
