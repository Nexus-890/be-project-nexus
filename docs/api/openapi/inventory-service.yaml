openapi: 3.0.3
info:
  title: Nexus inventory
  version: 1.0.0
  description: >-
    Issue #130 stock intake, #134 stock reservation, #136 confirming and releasing a
    reservation, #199 warehouse management (WH-01 to WH-04) and #200 support reads
    and adjustments. Every 2xx body is an ApiResponse with code, message and data;
    every error is Problem Details. Quantities are stored per SKU and warehouse in inventory_balances,
    where total equals available plus reserved plus unavailable.
servers:
  - url: http://localhost:8080
    description: API gateway
  - url: http://localhost:8085
    description: Inventory service
tags:
  - name: Stock
    description: Receive, correct and read stock per SKU and warehouse
  - name: Reservations
    description: Hold and list stock reservations
  - name: Ledger
    description: Every quantity change, one row each
  - name: Warehouses
    description: Warehouse records
paths:
  /internal/v1/inventory/reservations:
    get:
      tags: [Reservations]
      operationId: getLinkedAuctionReservation
      summary: Read the winner's linked auction hold
      description: >-
        Internal service endpoint for Commerce shipping confirmation. Commerce
        relays the buyer's bearer token. Only the winning buyer can see the
        linked hold. Returns an empty data array before AuctionSettled links
        the order, for an unknown order, or when the buyer does not own it.
      servers:
        - url: http://localhost:8085
          description: Inventory service directly
      security:
        - bearerAuth: []
      x-roles: [BUYER]
      parameters:
        - name: orderId
          in: query
          required: true
          description: Auction order UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Linked hold visible to the winning buyer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedAuctionReservationApiResponse'
        '400':
          description: orderId is missing or invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller lacks the BUYER role
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/inventory/{skuId}:
    get:
      tags: [Stock]
      operationId: getAvailability
      summary: Read how much of one SKU is available
      description: >-
        Public, no token needed. Reads the default warehouse
        (nexus.inventory.default-warehouse-code). Returns skuId and available only, never
        total or reserved. A SKU with no balance row returns available 0, not 404.
      security: []
      x-catalogue-id: INV-02
      parameters:
        - name: skuId
          in: path
          required: true
          description: SKU id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Available quantity of the SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockApiResponse'
              example:
                code: 0
                message: response success
                data:
                  skuId: 0195f0a2-7c1e-7d2a-9b3f-2c4d5e6f7a81
                  available: 97
        '400':
          description: skuId is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:invalid-parameter
                title: Bad Request
                status: 400
                detail: A request parameter is invalid
                instance: /api/v1/inventory/not-a-uuid
                code: INVALID_PARAMETER
        '500':
          description: The configured default warehouse does not exist
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Internal Server Error
                status: 500
                detail: The configured default warehouse does not exist
                instance: /api/v1/inventory/0195f0a2-7c1e-7d2a-9b3f-2c4d5e6f7a81
                code: INVENTORY_DEFAULT_WAREHOUSE_NOT_FOUND
  /api/v1/inventory:
    get:
      tags: [Stock]
      operationId: listAvailability
      summary: Read how much of several SKUs is available
      description: >-
        Public, no token needed. Used by the cart page to read every line at once. All ids
        are read from the default warehouse in one query. The result keeps the request
        order, a repeated id appears once, and an id with no balance row reads as
        available 0. At most 100 ids per request.
      security: []
      x-catalogue-id: INV-03
      parameters:
        - name: skuIds
          in: query
          required: true
          description: Comma-separated SKU ids, 1 to 100
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: One entry per distinct requested SKU, in request order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockListApiResponse'
              example:
                code: 0
                message: response success
                data:
                  - skuId: 0195f0a2-7c1e-7d2a-9b3f-2c4d5e6f7a81
                    available: 97
                  - skuId: 0195f0a2-7c1e-7d2a-9b3f-2c4d5e6f7a82
                    available: 0
                page:
                  number: 0
                  size: 2
                  totalElements: 2
                  totalPages: 1
        '400':
          description: >-
            skuIds is missing or not a list of UUIDs (INVALID_PARAMETER), empty
            (VALIDATION_FAILED), or holds more than 100 ids (INVENTORY_TOO_MANY_SKUS)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_PARAMETER:
                  value:
                    type: urn:problem:invalid-parameter
                    title: Bad Request
                    status: 400
                    detail: A request parameter is invalid
                    instance: /api/v1/inventory
                    code: INVALID_PARAMETER
                INVENTORY_TOO_MANY_SKUS:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: At most 100 SKU ids can be read at once
                    instance: /api/v1/inventory
                    code: INVENTORY_TOO_MANY_SKUS
        '500':
          description: The configured default warehouse does not exist
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Internal Server Error
                status: 500
                detail: The configured default warehouse does not exist
                instance: /api/v1/inventory
                code: INVENTORY_DEFAULT_WAREHOUSE_NOT_FOUND
  /api/v1/inventory/intake:
    post:
      tags: [Stock]
      operationId: intakeStock
      summary: Receive stock into a warehouse
      description: >-
        Raises total and available by the quantity in one statement and creates the
        balance row on the first intake of a SKU in that warehouse. When warehouseId is
        left out, the warehouse is the one whose code is nexus.inventory.default-warehouse-code.
        Only ACTIVE warehouses accept intake: INACTIVE or MAINTENANCE returns 409 for
        both an explicit warehouseId and the configured default, without changing
        balances or writing a movement. The status check and writes share a transaction
        and coordinate with warehouse updates.
        The gateway only requires a valid token; the service requires the ADMIN role.
      security:
        - bearerAuth: []
      x-actor-roles: [ADMIN]
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntakeRequest'
            example:
              skuId: 0195f0a2-7c1e-7d2a-9b3f-2c4d5e6f7a81
              quantity: 100
      responses:
        '201':
          description: Balance after the intake
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceApiResponse'
              example:
                code: 0
                message: response success
                data:
                  skuId: 0195f0a2-7c1e-7d2a-9b3f-2c4d5e6f7a81
                  warehouseId: 0195f0a1-0000-7000-8000-000000000001
                  total: 100
                  available: 100
                  reserved: 0
                  unavailable: 0
        '400':
          description: Missing skuId or quantity, quantity 0 or less, or a malformed body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:validation-error
                title: Bad Request
                status: 400
                detail: The request data is invalid
                instance: /api/v1/inventory/intake
                code: VALIDATION_FAILED
                errors:
                  - field: quantity
                    code: VALIDATION_POSITIVE
                    detail: must be greater than 0
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller does not have the ADMIN role
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:forbidden
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource
                instance: /api/v1/inventory/intake
                code: FORBIDDEN
        '404':
          description: The given warehouseId does not exist
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Not Found
                status: 404
                detail: Warehouse not found
                instance: /api/v1/inventory/intake
                code: INVENTORY_WAREHOUSE_NOT_FOUND
        '409':
          description: The selected or configured default warehouse is INACTIVE or MAINTENANCE. Code INVENTORY_WAREHOUSE_UNAVAILABLE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Conflict
                status: 409
                detail: Warehouse is not active for stock intake
                instance: /api/v1/inventory/intake
                code: INVENTORY_WAREHOUSE_UNAVAILABLE
        '500':
          description: The configured default warehouse code matches no warehouse
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Internal Server Error
                status: 500
                detail: The configured default warehouse does not exist
                instance: /api/v1/inventory/intake
                code: INVENTORY_DEFAULT_WAREHOUSE_NOT_FOUND
  /api/v1/inventory/reservations:
    post:
      tags: [Reservations]
      operationId: reserveStock
      summary: Hold stock for the orders of one order group
      description: >-
        Sent by commerce-service with the buyer's token while it creates the orders; the
        frontend does not call it. Each SKU is reserved by one UPDATE whose WHERE clause
        requires available_quantity to cover the quantity, in SKU order, all in one
        transaction: one shortage reserves nothing. Items of the same SKU are checked
        against their sum. Every reservation is HELD in the warehouse whose code is
        nexus.inventory.default-warehouse-code, keeps its item's orderId and writes one
        RESERVE ledger row. orderGroupId is not stored. Sending the same items again
        returns the reservations already held. The gateway only requires a valid token;
        the service requires the BUYER role.
      security:
        - bearerAuth: []
      x-actor-roles: [BUYER]
      x-required-roles: [BUYER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveRequest'
            example:
              orderGroupId: 0195f0a3-1111-7111-8111-111111111111
              items:
                - orderId: 0195f0a3-2222-7222-8222-222222222222
                  skuId: 0195f0a2-7c1e-7d2a-9b3f-2c4d5e6f7a81
                  quantity: 2
      responses:
        '201':
          description: The reservations held for the items, in request order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationApiResponse'
              example:
                code: 0
                message: response success
                data:
                  reservationIds:
                    - 0195f0a3-3333-7333-8333-333333333333
                  warehouseId: 0195f0a1-0000-7000-8000-000000000001
                  expiresAt: '2026-11-05T10:15:00Z'
        '400':
          description: >-
            A missing orderGroupId, no items or more than 100, a missing field or a quantity
            outside 1 to 999 (VALIDATION_FAILED), or the same orderId and skuId twice
            (INVENTORY_DUPLICATE_RESERVATION_ITEM)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                VALIDATION_FAILED:
                  value:
                    type: urn:problem:validation-error
                    title: Bad Request
                    status: 400
                    detail: The request data is invalid
                    instance: /api/v1/inventory/reservations
                    code: VALIDATION_FAILED
                    errors:
                      - field: items[0].quantity
                        code: VALIDATION_POSITIVE
                        detail: must be greater than 0
                INVENTORY_DUPLICATE_RESERVATION_ITEM:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: Each order and SKU pair may appear only once
                    instance: /api/v1/inventory/reservations
                    code: INVENTORY_DUPLICATE_RESERVATION_ITEM
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller does not have the BUYER role
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:forbidden
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource
                instance: /api/v1/inventory/reservations
                code: FORBIDDEN
        '409':
          description: >-
            Not enough stock for a SKU (INVENTORY_INSUFFICIENT_STOCK, with skuId, available
            and requested), or these orders already hold reservations that differ from the
            request (INVENTORY_RESERVATION_CONFLICT). Nothing is reserved.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InsufficientStockProblem'
                  - $ref: '#/components/schemas/Problem'
              examples:
                INVENTORY_INSUFFICIENT_STOCK:
                  value:
                    type: urn:problem:domain-error
                    title: Conflict
                    status: 409
                    detail: Not enough stock; nothing was reserved
                    instance: /api/v1/inventory/reservations
                    code: INVENTORY_INSUFFICIENT_STOCK
                    skuId: 0195f0a2-7c1e-7d2a-9b3f-2c4d5e6f7a81
                    available: 1
                    requested: 2
                INVENTORY_RESERVATION_CONFLICT:
                  value:
                    type: urn:problem:domain-error
                    title: Conflict
                    status: 409
                    detail: These orders already hold reservations that differ from this request
                    instance: /api/v1/inventory/reservations
                    code: INVENTORY_RESERVATION_CONFLICT
        '500':
          description: The configured default warehouse code matches no warehouse
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Internal Server Error
                status: 500
                detail: The configured default warehouse does not exist
                instance: /api/v1/inventory/reservations
                code: INVENTORY_DEFAULT_WAREHOUSE_NOT_FOUND
    get:
      tags: [Reservations]
      operationId: listReservations
      summary: List reservations for support
      description: >-
        Every filter is optional and they combine with AND. Newest first (createdAt, then id,
        descending). expiresAt and releasedAt are in UTC; releasedAt is null while the
        reservation is HELD. The gateway only requires a valid token; the service requires
        ADMIN or SUPPORT_STAFF.
      security:
        - bearerAuth: []
      x-actor-roles: [ADMIN, SUPPORT_STAFF]
      x-required-roles: [ADMIN, SUPPORT_STAFF]
      parameters:
        - name: orderId
          in: query
          description: The seller order that holds the reservation
          schema:
            type: string
            format: uuid
        - name: skuId
          in: query
          description: Only reservations of this SKU
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [HELD, CONFIRMED, RELEASED, EXPIRED]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: One page of reservations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPageApiResponse'
              example:
                code: 0
                message: response success
                data:
                  - id: 0195f0a3-3333-7333-8333-333333333333
                    skuId: 0195f0a2-7c1e-7d2a-9b3f-2c4d5e6f7a81
                    warehouseId: 0195f0a1-0000-7000-8000-000000000001
                    orderId: 0195f0a3-2222-7222-8222-222222222222
                    quantity: 2
                    status: HELD
                    expiresAt: '2026-11-10T08:30:00Z'
                    releasedAt: null
                page:
                  number: 0
                  size: 10
                  totalElements: 1
                  totalPages: 1
        '400':
          description: >-
            A filter of the wrong type or an unknown enum value (INVALID_PARAMETER), or page below
            0 or size outside 1 to 100 (VALIDATION_FAILED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_PARAMETER:
                  value:
                    type: urn:problem:invalid-parameter
                    title: Bad Request
                    status: 400
                    detail: A request parameter is invalid
                    instance: /api/v1/inventory/reservations
                    code: INVALID_PARAMETER
                VALIDATION_FAILED:
                  value:
                    type: urn:problem:validation-error
                    title: Bad Request
                    status: 400
                    detail: The request data is invalid
                    instance: /api/v1/inventory/reservations
                    code: VALIDATION_FAILED
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller has neither ADMIN nor SUPPORT_STAFF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:forbidden
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource
                instance: /api/v1/inventory/reservations
                code: FORBIDDEN
  /api/v1/inventory/adjustments:
    post:
      tags: [Stock]
      operationId: adjustStock
      summary: Correct a balance by a signed quantity
      description: >-
        Adds quantityDelta to total and available in one UPDATE whose WHERE clause requires
        available plus the delta to stay at 0 or more, then writes one ADJUSTMENT ledger row
        with the delta, the reason and the balance id as referenceId. Reserved and unavailable
        do not change. The balance must already exist; new stock goes through intake. When
        warehouseId is left out, the warehouse is the one whose code is
        nexus.inventory.default-warehouse-code. The gateway only requires a valid token; the
        service requires the ADMIN role.
      security:
        - bearerAuth: []
      x-actor-roles: [ADMIN]
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustmentRequest'
            example:
              skuId: 0195f0a2-7c1e-7d2a-9b3f-2c4d5e6f7a81
              quantityDelta: -2
              reason: Two units damaged in the warehouse
      responses:
        '201':
          description: Balance after the adjustment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceApiResponse'
              example:
                code: 0
                message: response success
                data:
                  skuId: 0195f0a2-7c1e-7d2a-9b3f-2c4d5e6f7a81
                  warehouseId: 0195f0a1-0000-7000-8000-000000000001
                  total: 98
                  available: 98
                  reserved: 0
                  unavailable: 0
        '400':
          description: >-
            Missing skuId, quantityDelta or reason, a quantityDelta of 0 or beyond plus or minus
            1000000, a blank reason or one longer than 500 characters, or a malformed body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:validation-error
                title: Bad Request
                status: 400
                detail: The request data is invalid
                instance: /api/v1/inventory/adjustments
                code: VALIDATION_FAILED
                errors:
                  - field: quantityDelta
                    code: VALIDATION_NON_ZERO
                    detail: must not be 0
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller does not have the ADMIN role
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:forbidden
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource
                instance: /api/v1/inventory/adjustments
                code: FORBIDDEN
        '404':
          description: >-
            The given warehouseId does not exist (INVENTORY_WAREHOUSE_NOT_FOUND), or the SKU has
            no balance in that warehouse (INVENTORY_BALANCE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVENTORY_BALANCE_NOT_FOUND:
                  value:
                    type: urn:problem:domain-error
                    title: Not Found
                    status: 404
                    detail: SKU balance not found
                    instance: /api/v1/inventory/adjustments
                    code: INVENTORY_BALANCE_NOT_FOUND
                INVENTORY_WAREHOUSE_NOT_FOUND:
                  value:
                    type: urn:problem:domain-error
                    title: Not Found
                    status: 404
                    detail: Warehouse not found
                    instance: /api/v1/inventory/adjustments
                    code: INVENTORY_WAREHOUSE_NOT_FOUND
        '409':
          description: The delta would make available negative; nothing is changed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Conflict
                status: 409
                detail: The adjustment would make a quantity negative
                instance: /api/v1/inventory/adjustments
                code: INVENTORY_NEGATIVE_QUANTITY
        '500':
          description: The configured default warehouse code matches no warehouse
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Internal Server Error
                status: 500
                detail: The configured default warehouse does not exist
                instance: /api/v1/inventory/adjustments
                code: INVENTORY_DEFAULT_WAREHOUSE_NOT_FOUND
  /api/v1/inventory/balances:
    get:
      tags: [Stock]
      operationId: listBalances
      summary: List stock balances
      description: >-
        ADMIN may combine the filters freely or leave them out. SELLER must pass skuId, and the
        SKU must belong to one of the caller's products: the service asks catalog-service for the
        SKU and its product and compares the product's sellerId with the caller. A SKU whose
        product catalog does not show publicly counts as not owned. Sorted by skuId, then
        warehouseId. The gateway only requires a valid token; the service requires ADMIN or
        SELLER.
      security:
        - bearerAuth: []
      x-actor-roles: [ADMIN, SELLER]
      x-required-roles: [ADMIN, SELLER]
      parameters:
        - name: skuId
          in: query
          description: Required for SELLER
          schema:
            type: string
            format: uuid
        - name: warehouseId
          in: query
          description: Only balances in this warehouse
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: One page of balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancePageApiResponse'
              example:
                code: 0
                message: response success
                data:
                  - skuId: 0195f0a2-7c1e-7d2a-9b3f-2c4d5e6f7a81
                    warehouseId: 0195f0a1-0000-7000-8000-000000000001
                    total: 98
                    available: 96
                    reserved: 2
                    unavailable: 0
                page:
                  number: 0
                  size: 10
                  totalElements: 1
                  totalPages: 1
        '400':
          description: >-
            A filter of the wrong type or an unknown enum value (INVALID_PARAMETER), or page below
            0 or size outside 1 to 100 (VALIDATION_FAILED), or a SELLER without skuId (INVALID_PARAMETER as a domain error)
