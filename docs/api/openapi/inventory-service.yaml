openapi: 3.0.3
info:
  title: Nexus inventory
  version: 1.0.0
  description: >-
    Issue #130 stock intake, #134 stock reservation and #136 confirming and releasing a
    reservation. Every 2xx body is an ApiResponse with code, message and data; every error
    is Problem Details. Quantities are stored per SKU and warehouse in inventory_balances,
    where total equals available plus reserved plus unavailable.
servers:
  - url: http://localhost:8080
    description: API gateway
  - url: http://localhost:8085
    description: Inventory service
tags:
  - name: Stock
    description: Receive stock into a warehouse
  - name: Reservations
    description: Hold stock for the orders of one order group
paths:
  /api/v1/inventory/intake:
    post:
      tags: [Stock]
      operationId: intakeStock
      summary: Receive stock into a warehouse
      description: >-
        Raises total and available by the quantity in one statement and creates the
        balance row on the first intake of a SKU in that warehouse. When warehouseId is
        left out, the warehouse is the one whose code is nexus.inventory.default-warehouse-code.
        The gateway only requires a valid token; the service requires the ADMIN role.
      security:
        - bearerAuth: []
      x-actor-roles: [ADMIN]
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntakeRequest'
            example:
              skuId: 0195f0a2-7c1e-7d2a-9b3f-2c4d5e6f7a81
              quantity: 100
      responses:
        '201':
          description: Balance after the intake
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceApiResponse'
              example:
                code: 0
                message: response success
                data:
                  skuId: 0195f0a2-7c1e-7d2a-9b3f-2c4d5e6f7a81
                  warehouseId: 0195f0a1-0000-7000-8000-000000000001
                  total: 100
                  available: 100
                  reserved: 0
                  unavailable: 0
        '400':
          description: Missing skuId or quantity, quantity 0 or less, or a malformed body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:validation-error
                title: Bad Request
                status: 400
                detail: The request data is invalid
                instance: /api/v1/inventory/intake
                code: VALIDATION_FAILED
                errors:
                  - field: quantity
                    code: VALIDATION_POSITIVE
                    detail: must be greater than 0
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller does not have the ADMIN role
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:forbidden
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource
                instance: /api/v1/inventory/intake
                code: FORBIDDEN
        '404':
          description: The given warehouseId does not exist
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Not Found
                status: 404
                detail: Warehouse not found
                instance: /api/v1/inventory/intake
                code: INVENTORY_WAREHOUSE_NOT_FOUND
        '500':
          description: The configured default warehouse code matches no warehouse
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Internal Server Error
                status: 500
                detail: The configured default warehouse does not exist
                instance: /api/v1/inventory/intake
                code: INVENTORY_DEFAULT_WAREHOUSE_NOT_FOUND
  /api/v1/inventory/reservations:
    post:
      tags: [Reservations]
      operationId: reserveStock
      summary: Hold stock for the orders of one order group
      description: >-
        Sent by commerce-service with the buyer's token while it creates the orders; the
        frontend does not call it. Each SKU is reserved by one UPDATE whose WHERE clause
        requires available_quantity to cover the quantity, in SKU order, all in one
        transaction: one shortage reserves nothing. Items of the same SKU are checked
        against their sum. Every reservation is HELD in the warehouse whose code is
        nexus.inventory.default-warehouse-code, keeps its item's orderId and writes one
        RESERVE ledger row. orderGroupId is not stored. Sending the same items again
        returns the reservations already held. The gateway only requires a valid token;
        the service requires the BUYER role.
      security:
        - bearerAuth: []
      x-actor-roles: [BUYER]
      x-required-roles: [BUYER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveRequest'
            example:
              orderGroupId: 0195f0a3-1111-7111-8111-111111111111
              items:
                - orderId: 0195f0a3-2222-7222-8222-222222222222
                  skuId: 0195f0a2-7c1e-7d2a-9b3f-2c4d5e6f7a81
                  quantity: 2
      responses:
        '201':
          description: The reservations held for the items, in request order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationApiResponse'
              example:
                code: 0
                message: response success
                data:
                  reservationIds:
                    - 0195f0a3-3333-7333-8333-333333333333
                  warehouseId: 0195f0a1-0000-7000-8000-000000000001
                  expiresAt: '2026-11-05T10:15:00Z'
        '400':
          description: >-
            A missing orderGroupId, no items or more than 100, a missing field or a quantity
            outside 1 to 999 (VALIDATION_FAILED), or the same orderId and skuId twice
            (INVENTORY_DUPLICATE_RESERVATION_ITEM)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                VALIDATION_FAILED:
                  value:
                    type: urn:problem:validation-error
                    title: Bad Request
                    status: 400
                    detail: The request data is invalid
                    instance: /api/v1/inventory/reservations
                    code: VALIDATION_FAILED
                    errors:
                      - field: items[0].quantity
                        code: VALIDATION_POSITIVE
                        detail: must be greater than 0
                INVENTORY_DUPLICATE_RESERVATION_ITEM:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: Each order and SKU pair may appear only once
                    instance: /api/v1/inventory/reservations
                    code: INVENTORY_DUPLICATE_RESERVATION_ITEM
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller does not have the BUYER role
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:forbidden
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource
                instance: /api/v1/inventory/reservations
                code: FORBIDDEN
        '409':
          description: >-
            Not enough stock for a SKU (INVENTORY_INSUFFICIENT_STOCK, with skuId, available
            and requested), or these orders already hold reservations that differ from the
            request (INVENTORY_RESERVATION_CONFLICT). Nothing is reserved.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InsufficientStockProblem'
                  - $ref: '#/components/schemas/Problem'
              examples:
                INVENTORY_INSUFFICIENT_STOCK:
                  value:
                    type: urn:problem:domain-error
                    title: Conflict
                    status: 409
                    detail: Not enough stock; nothing was reserved
                    instance: /api/v1/inventory/reservations
                    code: INVENTORY_INSUFFICIENT_STOCK
                    skuId: 0195f0a2-7c1e-7d2a-9b3f-2c4d5e6f7a81
                    available: 1
                    requested: 2
                INVENTORY_RESERVATION_CONFLICT:
                  value:
                    type: urn:problem:domain-error
                    title: Conflict
                    status: 409
                    detail: These orders already hold reservations that differ from this request
                    instance: /api/v1/inventory/reservations
                    code: INVENTORY_RESERVATION_CONFLICT
        '500':
          description: The configured default warehouse code matches no warehouse
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Internal Server Error
                status: 500
                detail: The configured default warehouse does not exist
                instance: /api/v1/inventory/reservations
                code: INVENTORY_DEFAULT_WAREHOUSE_NOT_FOUND
  /api/v1/inventory/reservations/{id}/confirm:
    post:
      tags: [Reservations]
      operationId: confirmReservation
      summary: Move a held reservation out of stock for good
      description: >-
        Paid: reserved goes down and unavailable goes up by the reservation's quantity, the
        status becomes CONFIRMED and one COMMIT ledger row is written, in one transaction. The
        status change is conditional on HELD inside the UPDATE, so a repeat, or two calls at
        once, change the stock once. Not routed from the gateway: a call from outside gets 404
        there and never reaches inventory-service. The service requires the ADMIN role; the event consumers
        of the later issues call the same service method in-process.
      security:
        - bearerAuth: []
      x-actor-roles: [system]
      x-gateway-privilege: not routed
      x-required-roles: [ADMIN]
      parameters:
        - name: id
          in: path
          required: true
          description: The reservation id
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Done, or already done by an earlier call. No body.
        '400':
          description: The id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:invalid-parameter
                title: Bad Request
                status: 400
                detail: A request parameter is invalid
                instance: /api/v1/inventory/reservations/not-a-uuid/confirm
                code: INVALID_PARAMETER
                errors:
                  - field: id
                    code: INVALID_PARAMETER
                    detail: A valid value is required
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller does not have the ADMIN role
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:forbidden
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource
                instance: /api/v1/inventory/reservations/0195f0a3-3333-7333-8333-333333333333/confirm
                code: FORBIDDEN
        '404':
          description: No reservation has this id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Not Found
                status: 404
                detail: Reservation not found
                instance: /api/v1/inventory/reservations/0195f0a3-3333-7333-8333-333333333333/confirm
                code: INVENTORY_RESERVATION_NOT_FOUND
        '409':
          description: >-
            The reservation is RELEASED or EXPIRED, so its stock is no longer held
            (INVENTORY_ILLEGAL_TRANSITION). Nothing changes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Conflict
                status: 409
                detail: The reservation is not HELD
                instance: /api/v1/inventory/reservations/0195f0a3-3333-7333-8333-333333333333/confirm
                code: INVENTORY_ILLEGAL_TRANSITION
  /api/v1/inventory/reservations/{id}/release:
    post:
      tags: [Reservations]
      operationId: releaseReservation
      summary: Put a held reservation back on the shelf
      description: >-
        Not paid: reserved goes down and available goes up by the reservation's quantity, the
        status becomes RELEASED with released_at set and one RELEASE ledger row is written, in
        one transaction. The status change is conditional on HELD inside the UPDATE, so a repeat
        changes the stock once; an EXPIRED reservation already returned its stock and also gives
        204. Not routed from the gateway: a call from outside gets 404 there and never reaches
        inventory-service. The service requires the ADMIN role; the event consumers
        of the later issues call the same service method in-process.
      security:
        - bearerAuth: []
      x-actor-roles: [system]
      x-gateway-privilege: not routed
      x-required-roles: [ADMIN]
      parameters:
        - name: id
          in: path
          required: true
          description: The reservation id
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Done, or already done by an earlier call. No body.
        '400':
          description: The id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:invalid-parameter
                title: Bad Request
                status: 400
                detail: A request parameter is invalid
                instance: /api/v1/inventory/reservations/not-a-uuid/release
                code: INVALID_PARAMETER
                errors:
                  - field: id
                    code: INVALID_PARAMETER
                    detail: A valid value is required
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller does not have the ADMIN role
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:forbidden
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource
                instance: /api/v1/inventory/reservations/0195f0a3-3333-7333-8333-333333333333/release
                code: FORBIDDEN
        '404':
          description: No reservation has this id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Not Found
                status: 404
                detail: Reservation not found
                instance: /api/v1/inventory/reservations/0195f0a3-3333-7333-8333-333333333333/release
                code: INVENTORY_RESERVATION_NOT_FOUND
        '409':
          description: >-
            The reservation is CONFIRMED, so its stock has left (INVENTORY_ILLEGAL_TRANSITION).
            Nothing changes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Conflict
                status: 409
                detail: The reservation is not HELD
                instance: /api/v1/inventory/reservations/0195f0a3-3333-7333-8333-333333333333/release
                code: INVENTORY_ILLEGAL_TRANSITION
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    IntakeRequest:
      type: object
      required: [skuId, quantity]
      properties:
        skuId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
          description: Defaults to the warehouse with code nexus.inventory.default-warehouse-code
        quantity:
          type: integer
          format: int32
          minimum: 1
    BalanceApiResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          default: 0
          example: 0
        message:
          type: string
          default: response success
          example: response success
        data:
          $ref: '#/components/schemas/Balance'
    Balance:
      type: object
      required: [skuId, warehouseId, total, available, reserved, unavailable]
      properties:
        skuId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        total:
          type: integer
          format: int32
          minimum: 0
        available:
          type: integer
          format: int32
          minimum: 0
        reserved:
          type: integer
          format: int32
          minimum: 0
        unavailable:
          type: integer
          format: int32
          minimum: 0
    ReserveRequest:
      type: object
      required: [orderGroupId, items]
      properties:
        orderGroupId:
          type: string
          format: uuid
          description: Identifies the request; not stored
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReserveItem'
    ReserveItem:
      type: object
      required: [orderId, skuId, quantity]
      properties:
        orderId:
          type: string
          format: uuid
          description: The seller order that owns the item; stored on its reservation
        skuId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
    ReservationApiResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          default: 0
          example: 0
        message:
          type: string
          default: response success
          example: response success
        data:
          $ref: '#/components/schemas/Reservation'
    Reservation:
      type: object
      required: [reservationIds, warehouseId, expiresAt]
      properties:
        reservationIds:
          type: array
          description: One per item, in request order
          items:
            type: string
            format: uuid
        warehouseId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: >-
            In UTC with a Z offset; the same for every item of the request. The time of the
            request plus nexus.inventory.reservation-timeout-minutes from Config Server (30 by
            default), read again on /actuator/refresh.
    InsufficientStockProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [skuId, available, requested]
          properties:
            skuId:
              type: string
              format: uuid
            available:
              type: integer
              format: int32
              minimum: 0
            requested:
              type: integer
              format: int32
              minimum: 1
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      type: object
      required: [field, code, detail]
      properties:
        field:
          type: string
        code:
          type: string
        detail:
          type: string
