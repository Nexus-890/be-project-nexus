openapi: 3.0.3
info:
  title: Nexus rating-service delivered API
  version: 1.1.0
  description: >-
    Ratings and reputation under merged issue 212, including the original issue 213.
    JSON success bodies use ApiResponse
    with code, message, data and sibling page metadata for lists. Service-generated
    errors use application/problem+json and RATING_* codes. Failures generated by the
    gateway before forwarding retain the gateway's own transport/security codes.
    UserRated is consumed asynchronously, so a newly created rating can appear
    before its effect is visible in reputation and eligibility. Internal
    eligibility is called directly by authorized machine principals; the gateway
    does not route /internal/v1.
servers:
  - url: http://localhost:8080
    description: Local API gateway
tags:
  - name: Ratings
    description: Submit one rating per party per completed order and read masked reviews.
  - name: Reputations
    description: Versioned reputation score, trust level and audited changes.
  - name: Internal eligibility
    description: Service-only reputation checks for bidding and auction creation.
security:
  - bearerAuth: []
paths:
  /api/v1/ratings:
    post:
      tags:
        - Ratings
      operationId: createRating
      summary: Rate the other party of a completed order
      description: >-
        Requires REPUTATION.RATE and either BUYER or SELLER. The authenticated
        subject must be the buyer or seller of the completed canonical order;
        the target is always the other party and is derived from the local
        rating_eligibility projection. Neither actor nor target is accepted from
        the request. Only OrderCompleted creates eligibility; rating-service
        does not call commerce to authorize the request. An absent completion
        projection returns 400, including when the completion event has not
        arrived yet. An auction transaction uses its completed orderId and
        cannot be rated again through an auctionId. Each party may submit once
        per order, including concurrent requests; another submission returns
        409. Self-rating returns 400. The rating and UserRated outbox event
        commit together. The rater name is masked from the authenticated display
        name before storage; missing or unusable names produce ***. Responses
        never expose the unmasked name or rater identity.
      x-catalogue-id: REP-01
      x-required-privileges:
        - REPUTATION.RATE
      x-required-roles:
        - BUYER
        - SELLER
      x-ownership: The JWT subject must be an order party; roles are ANY-of, privileges are ALL-of.
      x-error-codes:
        '400':
          - RATING_ORDER_NOT_COMPLETED
          - RATING_SELF_RATING
          - RATING_VALIDATION_FAILED
          - RATING_INVALID_REQUEST_BODY
          - RATING_INVALID_PARAMETER
        '401':
          - RATING_UNAUTHENTICATED
        '403':
          - RATING_FORBIDDEN
          - RATING_NOT_ORDER_PARTICIPANT
        '405':
          - RATING_METHOD_NOT_ALLOWED
        '406':
          - RATING_NOT_ACCEPTABLE
        '409':
          - RATING_ALREADY_EXISTS
        '415':
          - RATING_UNSUPPORTED_MEDIA_TYPE
        '500':
          - RATING_INTERNAL_ERROR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRatingRequest'
            example:
              orderId: 019afe64-9800-7000-8000-000000000001
              score: 5
              comment: The item matched its description.
      responses:
        '201':
          description: Rating created and UserRated written to the local outbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingEnvelope'
              example:
                code: 0
                message: response success
                data:
                  id: 019afe64-9800-7000-8000-000000000002
                  orderId: 019afe64-9800-7000-8000-000000000001
                  auctionId: null
                  score: 5
                  comment: The item matched its description.
                  raterName: N***A
                  createdAt: '2026-11-16T08:00:00Z'
                  ratedByMe: true
        '400':
          $ref: '#/components/responses/InvalidRating'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RatingForbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          description: 'Conflict. Code: RATING_ALREADY_EXISTS.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Conflict
                status: 409
                detail: This order has already been rated by the current user
                instance: /api/v1/ratings
                code: RATING_ALREADY_EXISTS
        '415':
          description: 'Unsupported request content type. Code: RATING_UNSUPPORTED_MEDIA_TYPE.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:unsupported-media-type
                title: Unsupported Media Type
                status: 415
                detail: The request media type is not supported
                instance: /api/v1/ratings
                code: RATING_UNSUPPORTED_MEDIA_TYPE
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Ratings
      operationId: listRatings
      summary: List ratings received by a user
      description: >-
        Requires REPUTATION.VIEW and one of ADMIN, SELLER, BUYER or SUPPORT_STAFF.
        userId identifies the rated user, not the rater. Results are ordered by
        createdAt descending and id descending for stable ties. Defaults page=0,
        size=20; size is limited to 100. A user with no ratings or a page beyond
        the end returns 200 with data:[] and actual page totals. The raterName
        field contains only the stored masked snapshot, or *** for legacy rows
        without one. Raw rater IDs and unmasked names are not returned.
        ratedByMe is computed from the authenticated caller so a buyer can find
        their own order review without revealing another rater's identity.
      x-catalogue-id: REP-03
      x-required-privileges:
        - REPUTATION.VIEW
      x-required-roles:
        - ADMIN
        - SELLER
        - BUYER
        - SUPPORT_STAFF
      x-ownership: Any target userId may be read by permitted roles; roles are ANY-of.
      x-error-codes:
        '400':
          - RATING_VALIDATION_FAILED
          - RATING_INVALID_PARAMETER
        '401':
          - RATING_UNAUTHENTICATED
        '403':
          - RATING_FORBIDDEN
        '405':
          - RATING_METHOD_NOT_ALLOWED
        '406':
          - RATING_NOT_ACCEPTABLE
        '500':
          - RATING_INTERNAL_ERROR
      parameters:
        - name: userId
          in: query
          required: true
          description: UUID of the user receiving the ratings.
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: Zero-based page number.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Requested maximum number of ratings per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of ratings with masked rater names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingPageEnvelope'
              examples:
                ratings:
                  value:
                    code: 0
                    message: response success
                    data:
                      - id: 019afe64-9800-7000-8000-000000000002
                        orderId: 019afe64-9800-7000-8000-000000000001
                        auctionId: null
                        score: 5
                        comment: The item matched its description.
                        raterName: N***A
                        createdAt: '2026-11-16T08:00:00Z'
                        ratedByMe: false
                    page:
                      number: 0
                      size: 20
                      totalElements: 1
                      totalPages: 1
                empty:
                  value:
                    code: 0
                    message: response success
                    data: []
                    page:
                      number: 0
                      size: 20
                      totalElements: 0
                      totalPages: 0
        '400':
          description: 'Invalid or missing userId or pagination. Codes: RATING_VALIDATION_FAILED, RATING_INVALID_PARAMETER.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                RATING_INVALID_PARAMETER:
                  value:
                    type: urn:problem:invalid-parameter
                    title: Bad Request
                    status: 400
                    detail: A request parameter is invalid
                    instance: /api/v1/ratings
                    code: RATING_INVALID_PARAMETER
                    errors:
                      - field: userId
                        code: INVALID_PARAMETER
                        detail: A valid value is required
                RATING_VALIDATION_FAILED:
                  value:
                    type: urn:problem:validation-error
                    title: Bad Request
                    status: 400
                    detail: The request data is invalid
                    instance: /api/v1/ratings
                    code: RATING_VALIDATION_FAILED
                    errors:
                      - field: size
                        code: INVALID_PARAMETER
                        detail: must be less than or equal to 100
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: 'Insufficient role or privilege. Code: RATING_FORBIDDEN.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:forbidden
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource
                instance: /api/v1/ratings
                code: RATING_FORBIDDEN
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/reputations/{userId}:
    get:
      tags: [Reputations]
      operationId: getReputation
      summary: Read a user's reputation snapshot
      description: >-
        Requires REPUTATION.VIEW and one of ADMIN, SELLER, BUYER or SUPPORT_STAFF.
        Returns the committed score and trust level with its policy version.
        A user without an aggregate receives neutral score 50, trust NEW and
        zero counters. Ratings affect this snapshot after UserRated is consumed;
        OrderCompleted updates both parties once. No synchronous commerce call
        is performed.
      x-catalogue-id: REP-02
      x-required-privileges: [REPUTATION.VIEW]
      x-required-roles: [ADMIN, SELLER, BUYER, SUPPORT_STAFF]
      x-ownership: Any target may be read by permitted roles; roles are ANY-of.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Reputation snapshot under its recorded policy version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReputationEnvelope'
              examples:
                neutral:
                  $ref: '#/components/examples/Reputation'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/reputations/{userId}/adjustments:
    post:
      tags: [Reputations]
      operationId: adjustReputation
      summary: Apply an audited admin score adjustment
      description: >-
        Requires ADMIN and USER.REPUTATION.ADJUST. The actor comes from the JWT;
        the target comes from the path. delta is a strict JSON integer in the
        int32 range, including zero. Decimal tokens, strings, booleans and
        overflow are rejected instead of coerced. reason must be nonblank and
        at most 1000 characters. The resulting score must stay in 0..100; an
        out-of-range result returns 400 without clamping or writing changes.
        Aggregate, immutable history and resulting outbox events commit together.
        Idempotency-Key is optional and scoped to the target user. With a key,
        the same actor, target, delta and stripped reason replay the original
        operation/result with 200 and no further history/events. Reusing the
        target's key with another actor, delta or stripped reason returns 409;
        the same key for a different target is independent. A new operation
        returns 201. Without a key, each
        accepted request is a new operation. The reputation field records this
        operation's result; a later live snapshot can differ. Historical
        aggregates with unreconciled transaction inputs return 503 and cannot
        be adjusted to bypass reconciliation.
      x-catalogue-id: REP-05
      x-required-privileges: [USER.REPUTATION.ADJUST]
      x-required-roles: [ADMIN]
      x-ownership: ADMIN may adjust any target; the request cannot declare its actor.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustmentRequest'
            example: {delta: -5, reason: Confirmed administrative correction}
      responses:
        '201':
          description: New adjustment committed; replayed is false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentEnvelope'
              examples:
                created:
                  $ref: '#/components/examples/AdjustmentCreated'
        '200':
          description: Original result replayed; replayed is true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentEnvelope'
              examples:
                replay:
                  $ref: '#/components/examples/AdjustmentReplay'
        '400':
          $ref: '#/components/responses/InvalidAdjustment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          description: 'The target user key was reused with another actor or payload. Code: RATING_IDEMPOTENCY_CONFLICT.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Conflict
                status: 409
                detail: The idempotency key has already been used for another adjustment
                instance: /api/v1/reputations/019afe64-9800-7000-8000-000000000010/adjustments
                code: RATING_IDEMPOTENCY_CONFLICT
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ReconciliationRequired'
  /api/v1/reputations/{userId}/history:
    get:
      tags: [Reputations]
      operationId: listReputationHistory
      summary: Read immutable reputation history
      description: >-
        Requires USER.REPUTATION.VIEW and either ADMIN or SUPPORT_STAFF.
        Ordered by changedAt descending, then id descending for stable ties.
        Defaults page=0,size=20; maximum size=100. Empty or beyond-end pages
        return 200 with data:[] and actual page totals. Each entry records actor,
        reason, source operation/revision and policy version. An accepted input
        or trust change may have delta=0. Duplicate business effects do not
        create another entry. History is read-only and append-only.
      x-catalogue-id: REP-09
      x-required-privileges: [USER.REPUTATION.VIEW]
      x-required-roles: [ADMIN, SUPPORT_STAFF]
      x-ownership: Permitted operational roles may read any target; roles are ANY-of.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of immutable reputation changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReputationHistoryEnvelope'
              examples:
                adjustment:
                  $ref: '#/components/examples/History'
                empty:
                  value:
                    code: 0
                    message: response success
                    data: []
                    page: {number: 0, size: 20, totalElements: 0, totalPages: 0}
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/me/reputation:
    get:
      tags: [Reputations]
      operationId: getOwnReputation
      summary: Read the caller's own reputation
      description: >-
        Requires REPUTATION.VIEW. The gateway routes this path to rating-service.
        The owner is the JWT subject. Returns the committed score and trust level
        with transaction and auction counters, the average rating rounded to one
        decimal (null without ratings) and how many history entries lowered the
        score. A user without an aggregate receives neutral score 50, trust NEW
        and zero counters; reading never creates an aggregate.
      x-required-privileges: [REPUTATION.VIEW]
      x-ownership: JWT subject only.
      responses:
        '200':
          description: Own reputation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyReputationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/me/penalties:
    get:
      tags: [Reputations]
      operationId: listOwnPenalties
      summary: List the caller's own score losses
      description: >-
        Requires REPUTATION.VIEW. The owner is the JWT subject. Returns reputation
        history entries with delta below zero (payment timeouts, low ratings and
        admin deductions), newest first, then id descending. Defaults page=0,
        size=10; maximum size=50. The acting admin is not exposed.
      x-required-privileges: [REPUTATION.VIEW]
      x-ownership: JWT subject only.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 10}
      responses:
        '200':
          description: A page of own score losses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PenaltyEnvelope'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/eligibility/{userId}:
    get:
      tags: [Internal eligibility]
      operationId: checkReputationEligibility
      summary: Check reputation eligibility for one action
      description: >-
        Direct service-to-service endpoint, never routed by the public gateway.
        Requires a valid RS256 bearer with the configured issuer/audience,
        service_account boolean true, an azp listed in
        nexus.rating.eligibility.allowed-clients and RATING.ELIGIBILITY.CHECK
        authority. RATING_ELIGIBILITY_ALLOWED_CLIENTS configures the allowlist;
        its default client is nexus-auction-service. Normal user or ADMIN tokens
        are denied even if they carry the authority. action is required and
        selects MIN_REPUTATION_TO_BID (default 40) or MIN_REPUTATION_TO_SELL
        (default 50). A score equal to the minimum is eligible. A policy denial
        returns 200 with eligible=false and its reason, distinct from validation,
        authentication and availability failures. A user without activity has
        neutral score 50 and trust NEW. Decisions reflect committed state;
        asynchronous UserRated effects can arrive after rating submission.
        Unreconciled historical transaction inputs fail closed with 503 instead
        of producing an eligibility decision from incomplete evidence.
      servers:
        - url: http://localhost:8089
          description: Direct rating-service; internal paths have no gateway route.
      security:
        - machineBearerAuth: []
      x-catalogue-id: REP-10
      x-required-privileges: [RATING.ELIGIBILITY.CHECK]
      x-required-roles: []
      x-ownership: Only allowlisted machine principals may evaluate target users.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: action
          in: query
          required: true
          description: Selects the configured bidding or selling threshold.
          schema:
            $ref: '#/components/schemas/EligibilityAction'
      responses:
        '200':
          description: A valid evaluation; eligible=false is a successful policy decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityEnvelope'
              examples:
                eligible:
                  $ref: '#/components/examples/EligibilityAllowed'
                belowMinimum:
                  $ref: '#/components/examples/EligibilityDenied'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ReconciliationRequired'
components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: Target user's UUID; external user IDs are logical references.
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      description: Zero-based page number.
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      description: Requested number of entries per page.
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional case-sensitive key scoped to the target user. Only 1..128
        visible ASCII characters without spaces are accepted. Reusing it with the
        same actor, delta and stripped reason replays the original result. Another
        actor or payload conflicts; the same key for another target is independent.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]+$'
      example: adjustment-20261116-001
  examples:
    Reputation:
      value:
        code: 0
        message: response success
        data:
          userId: 019afe64-9800-7000-8000-000000000010
          score: 50
          trustLevel: NEW
          totalTransaction: 0
          successfulTransaction: 0
          failedTransaction: 0
          ratingCount: 0
          policyVersion: reputation-policy-1
    AdjustmentCreated:
      value:
        code: 0
        message: response success
        data:
          operationId: 019afe64-9800-7000-8000-000000000020
          reputation:
            userId: 019afe64-9800-7000-8000-000000000010
            score: 45
            trustLevel: BASIC
            totalTransaction: 0
            successfulTransaction: 0
            failedTransaction: 0
            ratingCount: 0
            policyVersion: reputation-policy-1
          replayed: false
    AdjustmentReplay:
      value:
        code: 0
        message: response success
        data:
          operationId: 019afe64-9800-7000-8000-000000000020
          reputation:
            userId: 019afe64-9800-7000-8000-000000000010
            score: 45
            trustLevel: BASIC
            totalTransaction: 0
            successfulTransaction: 0
            failedTransaction: 0
            ratingCount: 0
            policyVersion: reputation-policy-1
          replayed: true
    History:
      value:
        code: 0
        message: response success
        data:
          - id: 019afe64-9800-7000-8000-000000000021
            operationId: 019afe64-9800-7000-8000-000000000020
            userId: 019afe64-9800-7000-8000-000000000010
            sourceId: null
            sourceVersion: null
            changeType: ADMIN_ADJUSTMENT
            previousScore: 50
            newScore: 45
            delta: -5
            previousLevel: NEW
            newLevel: BASIC
            actorId: 019afe64-9800-7000-8000-000000000030
            reason: Confirmed administrative correction
            policyVersion: reputation-policy-1
            changedAt: '2026-11-16T09:00:00Z'
        page: {number: 0, size: 20, totalElements: 1, totalPages: 1}
    EligibilityAllowed:
      value:
        code: 0
        message: response success
        data:
          userId: 019afe64-9800-7000-8000-000000000010
          action: BID
          eligible: true
          score: 50
          trustLevel: NEW
          minimumScore: 40
          reason: Reputation score meets the BID minimum
          policyVersion: reputation-policy-1
    EligibilityDenied:
      value:
        code: 0
        message: response success
        data:
          userId: 019afe64-9800-7000-8000-000000000010
          action: SELL
          eligible: false
          score: 39
          trustLevel: BASIC
          minimumScore: 50
          reason: Reputation score 39 is below 50 required for SELL
          policyVersion: reputation-policy-1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 access token with the configured issuer and nexus-services audience.
    machineBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        RS256 machine access token with service_account=true, allowlisted azp,
        RATING.ELIGIBILITY.CHECK authority, configured issuer and nexus-services
        audience. The marker is a JSON boolean, not the string "true".
  responses:
    ReconciliationRequired:
      description: 'Historical reputation evidence must be reconciled before this operation. Code: RATING_RECONCILIATION_REQUIRED.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem:domain-error
            title: Service Unavailable
            status: 503
            detail: Historical reputation inputs must be reconciled before this operation
            instance: /internal/v1/eligibility/019afe64-9800-7000-8000-000000000010
            code: RATING_RECONCILIATION_REQUIRED
    InvalidQuery:
      description: 'Invalid UUID, action or pagination. Codes: RATING_INVALID_PARAMETER, RATING_VALIDATION_FAILED.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            RATING_INVALID_PARAMETER:
              value:
                type: urn:problem:invalid-parameter
                title: Bad Request
                status: 400
                detail: The request parameter is invalid
                instance: /api/v1/reputations/invalid-user-id
                code: RATING_INVALID_PARAMETER
                errors:
                  - {field: userId, code: INVALID_PARAMETER, detail: A valid value is required}
            RATING_VALIDATION_FAILED:
              value:
                type: urn:problem:validation-error
                title: Bad Request
                status: 400
                detail: The request data is invalid
                instance: /api/v1/reputations/019afe64-9800-7000-8000-000000000010/history
                code: RATING_VALIDATION_FAILED
                errors:
                  - {field: size, code: INVALID_PARAMETER, detail: must be less than or equal to 100}
    Forbidden:
      description: 'The required role, authority or machine-principal policy is not satisfied. Code: RATING_FORBIDDEN.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem:forbidden
            title: Forbidden
            status: 403
            detail: Access is denied
            instance: /api/v1/reputations/019afe64-9800-7000-8000-000000000010
            code: RATING_FORBIDDEN
    UnsupportedMediaType:
      description: 'Unsupported request content type. Code: RATING_UNSUPPORTED_MEDIA_TYPE.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem:unsupported-media-type
            title: Unsupported Media Type
            status: 415
            detail: The request media type is not supported
            instance: /api/v1/reputations/019afe64-9800-7000-8000-000000000010/adjustments
            code: RATING_UNSUPPORTED_MEDIA_TYPE
    InvalidAdjustment:
      description: >-
        Invalid adjustment. Codes: RATING_ADJUSTMENT_OUT_OF_RANGE,
        RATING_VALIDATION_FAILED, RATING_INVALID_REQUEST_BODY, RATING_INVALID_PARAMETER.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            RATING_ADJUSTMENT_OUT_OF_RANGE:
              value:
                type: urn:problem:domain-error
                title: Bad Request
                status: 400
                detail: The adjustment would put the reputation score outside 0..100
                instance: /api/v1/reputations/019afe64-9800-7000-8000-000000000010/adjustments
                code: RATING_ADJUSTMENT_OUT_OF_RANGE
            RATING_VALIDATION_FAILED:
              value:
                type: urn:problem:validation-error
                title: Bad Request
                status: 400
                detail: The request data is invalid
                instance: /api/v1/reputations/019afe64-9800-7000-8000-000000000010/adjustments
                code: RATING_VALIDATION_FAILED
                errors:
                  - {field: reason, code: VALIDATION_NOT_BLANK, detail: must not be blank}
            RATING_INVALID_REQUEST_BODY:
              value:
                type: urn:problem:invalid-request-body
                title: Bad Request
                status: 400
                detail: The request body is invalid
                instance: /api/v1/reputations/019afe64-9800-7000-8000-000000000010/adjustments
                code: RATING_INVALID_REQUEST_BODY
            RATING_INVALID_PARAMETER:
              value:
                type: urn:problem:domain-error
                title: Bad Request
                status: 400
                detail: The request parameter is invalid
                instance: /api/v1/reputations/019afe64-9800-7000-8000-000000000010/adjustments
                code: RATING_INVALID_PARAMETER
    InvalidRating:
      description: >-
        Invalid rating request. Codes: RATING_ORDER_NOT_COMPLETED,
        RATING_SELF_RATING, RATING_VALIDATION_FAILED, RATING_INVALID_REQUEST_BODY,
        RATING_INVALID_PARAMETER.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            RATING_ORDER_NOT_COMPLETED:
              value:
                type: urn:problem:domain-error
                title: Bad Request
                status: 400
                detail: The completed order is not available for rating
                instance: /api/v1/ratings
                code: RATING_ORDER_NOT_COMPLETED
            RATING_SELF_RATING:
              value:
                type: urn:problem:domain-error
                title: Bad Request
                status: 400
                detail: Users cannot rate themselves
                instance: /api/v1/ratings
                code: RATING_SELF_RATING
            RATING_VALIDATION_FAILED:
              value:
                type: urn:problem:validation-error
                title: Bad Request
                status: 400
                detail: The request data is invalid
                instance: /api/v1/ratings
                code: RATING_VALIDATION_FAILED
                errors:
                  - field: score
                    code: VALIDATION_MAX
                    detail: must be less than or equal to 5
            RATING_INVALID_REQUEST_BODY:
              value:
                type: urn:problem:invalid-request-body
                title: Bad Request
                status: 400
                detail: The request body is invalid
                instance: /api/v1/ratings
                code: RATING_INVALID_REQUEST_BODY
            RATING_INVALID_PARAMETER:
              value:
                type: urn:problem:invalid-parameter
                title: Bad Request
                status: 400
                detail: The request parameter is invalid
                instance: /api/v1/ratings
                code: RATING_INVALID_PARAMETER
    Unauthenticated:
      description: 'Missing, expired or invalid access token. Code: RATING_UNAUTHENTICATED.'
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem:unauthorized
            title: Unauthorized
            status: 401
            detail: A valid access token is required
            instance: /api/v1/ratings
            code: RATING_UNAUTHENTICATED
    RatingForbidden:
      description: 'Forbidden. Codes: RATING_FORBIDDEN, RATING_NOT_ORDER_PARTICIPANT.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            RATING_FORBIDDEN:
              value:
                type: urn:problem:forbidden
                title: Forbidden
                status: 403
                detail: Access is denied
                instance: /api/v1/ratings
                code: RATING_FORBIDDEN
            RATING_NOT_ORDER_PARTICIPANT:
              value:
                type: urn:problem:domain-error
                title: Forbidden
                status: 403
                detail: Only the order participants may submit a rating
                instance: /api/v1/ratings
                code: RATING_NOT_ORDER_PARTICIPANT
    MethodNotAllowed:
      description: 'Unsupported HTTP method. Code: RATING_METHOD_NOT_ALLOWED.'
      headers:
        Allow:
          description: HTTP methods accepted by this resource.
          schema:
            type: string
            example: GET, POST
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem:method-not-allowed
            title: Method Not Allowed
            status: 405
            detail: The HTTP method is not supported
            instance: /api/v1/ratings
            code: RATING_METHOD_NOT_ALLOWED
    NotAcceptable:
      description: 'Unsupported response format. Code: RATING_NOT_ACCEPTABLE.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem:not-acceptable
            title: Not Acceptable
            status: 406
            detail: The response format is not supported
            instance: /api/v1/ratings
            code: RATING_NOT_ACCEPTABLE
    InternalError:
      description: 'Unexpected service failure. Code: RATING_INTERNAL_ERROR.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem:internal-server-error
            title: Internal Server Error
            status: 500
            detail: An unexpected rating service error occurred
            instance: /api/v1/ratings
            code: RATING_INTERNAL_ERROR
  schemas:
    TrustLevel:
      type: string
      enum: [NEW, BASIC, TRUSTED, TOP]
      description: Level resolved by the versioned runtime reputation policy.
    Reputation:
      type: object
      required: [userId, score, trustLevel, totalTransaction, successfulTransaction, failedTransaction, ratingCount, policyVersion]
      properties:
        userId: {type: string, format: uuid}
        score: {type: integer, minimum: 0, maximum: 100}
        trustLevel:
          $ref: '#/components/schemas/TrustLevel'
        totalTransaction: {type: integer, format: int32, minimum: 0}
        successfulTransaction: {type: integer, format: int32, minimum: 0}
        failedTransaction: {type: integer, format: int32, minimum: 0}
        ratingCount: {type: integer, format: int64, minimum: 0}
        policyVersion: {type: string, minLength: 1, maxLength: 60}
    ReputationEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, default: 0}
        message: {type: string, default: response success}
        data:
          $ref: '#/components/schemas/Reputation'
    AdjustmentRequest:
      type: object
      required: [delta, reason]
      properties:
        delta:
          type: integer
          format: int32
          minimum: -2147483648
          maximum: 2147483647
          description: >-
            Strict JSON integer token. Decimal forms such as 5.0, strings such as
            "5", booleans and int32 overflow are rejected. Zero is accepted.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '\S'
          description: Required nonblank explanation. Leading/trailing whitespace is stripped before history and replay comparison.
    AdjustmentResult:
      type: object
      required: [operationId, reputation, replayed]
      properties:
        operationId: {type: string, format: uuid}
        reputation:
          $ref: '#/components/schemas/Reputation'
        replayed:
          type: boolean
          description: False for a new operation, true when returning its original result.
    AdjustmentEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, default: 0}
        message: {type: string, default: response success}
        data:
          $ref: '#/components/schemas/AdjustmentResult'
    ReputationHistory:
      type: object
      required: [id, operationId, userId, sourceId, sourceVersion, changeType, previousScore, newScore, delta, previousLevel, newLevel, actorId, reason, policyVersion, changedAt]
      properties:
        id: {type: string, format: uuid}
        operationId:
          type: string
          format: uuid
          description: Stable business operation identity retained across retries.
        userId: {type: string, format: uuid}
        sourceId:
          type: string
          format: uuid
          nullable: true
          description: Rating, order or auction source UUID; may be null for an admin adjustment.
        sourceVersion:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Business source revision, not the event schema version; initial ratings use 0.
        changeType:
          type: string
          enum: [USER_RATED, ORDER_COMPLETED, AUCTION_PAYMENT_TIMEOUT, ADMIN_ADJUSTMENT]
        previousScore: {type: integer, minimum: 0, maximum: 100}
        newScore: {type: integer, minimum: 0, maximum: 100}
        delta:
          type: integer
          minimum: -100
          maximum: 100
          description: Actual newScore minus previousScore; may be zero after clamping or a counter-only change.
        previousLevel:
          $ref: '#/components/schemas/TrustLevel'
        newLevel:
          $ref: '#/components/schemas/TrustLevel'
        actorId:
          type: string
          format: uuid
          description: Authenticated admin actor or the fixed system UUID for consumer changes.
        reason: {type: string, minLength: 1}
        policyVersion: {type: string, minLength: 1, maxLength: 60}
        changedAt:
          type: string
          format: date-time
          description: Persisted change time normalized to UTC.
    MyReputation:
      type: object
      required: [score, trustLevel, totalTransaction, successfulTransaction, failedTransaction, ratingCount, averageRating, successfulAuctions, failedAuctions, penaltyCount, policyVersion]
      properties:
        score: {type: integer, minimum: 0, maximum: 100}
        trustLevel:
          $ref: '#/components/schemas/TrustLevel'
        totalTransaction: {type: integer, minimum: 0}
        successfulTransaction: {type: integer, minimum: 0}
        failedTransaction: {type: integer, minimum: 0}
        ratingCount: {type: integer, format: int64, minimum: 0}
        averageRating:
          type: number
          nullable: true
          minimum: 1
          maximum: 5
          description: Average star rating with one decimal; null without ratings.
        successfulAuctions: {type: integer, minimum: 0}
        failedAuctions: {type: integer, minimum: 0}
        penaltyCount: {type: integer, format: int64, minimum: 0}
        policyVersion: {type: string, minLength: 1, maxLength: 60}
    MyReputationEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, default: 0}
        message: {type: string, default: response success}
        data:
          $ref: '#/components/schemas/MyReputation'
    Penalty:
      type: object
      required: [id, changeType, sourceId, delta, previousScore, newScore, previousLevel, newLevel, reason, changedAt]
      properties:
        id: {type: string, format: uuid}
        changeType:
          type: string
          enum: [USER_RATED, ORDER_COMPLETED, AUCTION_PAYMENT_TIMEOUT, ADMIN_ADJUSTMENT]
        sourceId:
          type: string
          format: uuid
          nullable: true
          description: Rating, order or auction behind the change; null for an admin adjustment.
        delta: {type: integer, minimum: -100, maximum: -1}
        previousScore: {type: integer, minimum: 0, maximum: 100}
        newScore: {type: integer, minimum: 0, maximum: 100}
        previousLevel:
          $ref: '#/components/schemas/TrustLevel'
        newLevel:
          $ref: '#/components/schemas/TrustLevel'
        reason: {type: string, minLength: 1}
        changedAt: {type: string, format: date-time}
    PenaltyEnvelope:
      type: object
      required: [code, message, data, page]
      properties:
        code: {type: integer, default: 0}
        message: {type: string, default: response success}
        data:
          type: array
          items:
            $ref: '#/components/schemas/Penalty'
        page:
          $ref: '#/components/schemas/PageInfo'
    ReputationHistoryEnvelope:
      type: object
      required: [code, message, data, page]
      properties:
        code: {type: integer, default: 0}
        message: {type: string, default: response success}
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReputationHistory'
        page:
          $ref: '#/components/schemas/PageInfo'
    EligibilityAction:
      type: string
      enum: [BID, SELL]
    Eligibility:
      type: object
      required: [userId, action, eligible, score, trustLevel, minimumScore, reason, policyVersion]
      properties:
        userId: {type: string, format: uuid}
        action:
          $ref: '#/components/schemas/EligibilityAction'
        eligible:
          type: boolean
          description: True when score meets or exceeds the selected minimum.
        score: {type: integer, minimum: 0, maximum: 100}
        trustLevel:
          $ref: '#/components/schemas/TrustLevel'
        minimumScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Applied configured threshold for this action.
        reason:
          type: string
          minLength: 1
          description: Nonblank explanation for both eligible and ineligible results.
        policyVersion: {type: string, minLength: 1, maxLength: 60}
    EligibilityEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, default: 0}
        message: {type: string, default: response success}
        data:
          $ref: '#/components/schemas/Eligibility'
    CreateRatingRequest:
      type: object
      required:
        - orderId
        - score
      properties:
        orderId:
          type: string
          format: uuid
          description: Completed canonical seller-order UUID.
        score:
          type: integer
          minimum: 1
          maximum: 5
          description: >-
            Strict JSON integer token, distinct from the 0-100 reputation score.
            Decimal forms such as 5.0, numeric strings, booleans and overflow are
            rejected rather than coerced.
        comment:
          type: string
          nullable: true
          maxLength: 1000
          description: Optional review text. Omitted and null values are accepted.
    Rating:
      type: object
      required:
        - id
        - orderId
        - auctionId
        - score
        - comment
        - raterName
        - createdAt
        - ratedByMe
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
          nullable: true
          description: Required for new ratings; may be null only on legacy rows returned by GET.
        auctionId:
          type: string
          format: uuid
          nullable: true
          description: Auction context derived from the completed order, null for STANDARD orders.
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
          nullable: true
        raterName:
          type: string
          minLength: 1
          description: Stored masked name. Never the raw name or rater UUID; fallback is ***.
          example: N***A
        createdAt:
          type: string
          format: date-time
          description: Original submission time in UTC.
        ratedByMe:
          type: boolean
          description: True only when the authenticated caller submitted this rating; never supplied by the request.
    RatingEnvelope:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          $ref: '#/components/schemas/Rating'
    RatingPageEnvelope:
      type: object
      required:
        - code
        - message
        - data
        - page
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Rating'
        page:
          $ref: '#/components/schemas/PageInfo'
    PageInfo:
      type: object
      required:
        - number
        - size
        - totalElements
        - totalPages
      properties:
        number:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^RATING_[A-Z0-9_]+$'
          description: Stable named code from rating-service's ErrorCode enum.
        traceId:
          type: string
          description: Present only when an active trace is available.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      type: object
      required:
        - field
        - code
        - detail
      properties:
        field:
          type: string
        code:
          type: string
          description: Field constraint identifier, such as VALIDATION_NOT_NULL or VALIDATION_MAX.
        detail:
          type: string
