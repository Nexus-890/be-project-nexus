                          - "VALIDATION_FAILED"
                          - "INVALID_REQUEST_BODY"
                          - "CATALOG_INVALID_PARENT"
                          - "CATALOG_DATA_INVALID"
                          - "CATALOG_CATEGORY_LEVEL_MAX"
              examples:
                INVALID_PARAMETER:
                  summary: "INVALID_PARAMETER"
                  value:
                    type: "urn:problem:invalid-parameter"
                    title: "Bad Request"
                    status: 400
                    detail: "A request parameter is invalid"
                    instance: "/api/v1/categories/c8000000-0000-4000-8000-000000000002"
                    code: "INVALID_PARAMETER"
