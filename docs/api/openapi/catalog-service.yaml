        "500":
          - "INTERNAL_ERROR"
        "503":
          - "SERVICE_UNAVAILABLE"
        "504":
          - "GATEWAY_TIMEOUT"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          description: "Resource UUID."
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/UpdateCategory"
            example:
              name: "Updated Footwear"
      responses:
        "200":
          description: "Successful response."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/UpdateCategoryResponse"
              examples:
                success:
                  summary: "Success"
                  value:
                    code: 0
                    message: "response success"
                    data:
                      id: "c8000000-0000-4000-8000-000000000001"
                      parentId: null
