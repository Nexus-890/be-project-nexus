                        name: "Demo shoes"
                        slug: "demo-shoes-c8000000"
                        status: "ACTIVE"
                        categoryId: "c8000000-0000-4000-8000-000000000001"
                        sellerId: "68000000-0000-4000-8000-000000000002"
                        minPrice: 150000.5
                        maxPrice: 150000.5
                    page:
