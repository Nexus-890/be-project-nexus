  /api/v1/products/search:
    get:
      tags: [Products]
      operationId: searchProducts
      summary: Search public products
      description: >-
        Canonical buyer frontend search and browsing endpoint. Find a phrase in the name or description of nondeleted ACTIVE products,
        ignoring accents and case. An empty q browses the filtered catalog. Price filters
        require the same ACTIVE SKU to satisfy every supplied bound (inclusive); inactive variants do not match.
        Displayed minPrice/maxPrice retain the full ACTIVE variant range. Price sort uses the lowest
        ACTIVE SKU price, with unpriced products last. listingType filters persisted auctionEnable, not live auction state.
        The legacy GET /api/v1/products retains literal title-substring matching for compatibility; new clients use this endpoint.
        Relevance weights name matches above description matches. Remaining ties use newest and ID.
      security: []
      x-catalogue-id: PRD-08
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 255}
        - name: categoryId
          in: query
          schema: {type: string, format: uuid}
        - name: listingType
          in: query
          schema: {type: string, enum: [all, buy-now, auction], default: all}
        - name: minPrice
          in: query
          schema: {type: number, minimum: 0}
        - name: maxPrice
          in: query
          schema: {type: number, minimum: 0}
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, newest]
            default: relevance
        - $ref: '#/components/parameters/CatalogSearchPage'
        - $ref: '#/components/parameters/CatalogSearchSize'
      responses:
        '200':
          description: Product search page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProductsResponse'
        '400':
          description: Invalid parameters or minimum price above maximum price
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/products/mine:
    get:
      tags:
        - "Products"
      operationId: "listOwnProducts"
      summary: "List the current seller products"
      description: " Access: requires PRODUCT.LIST. Additional role requirement: SELLER. Ownership/business restriction: JWT subject products only; includes own nondeleted products regardless of ACTIVE status. Omitting status returns every status; status narrows the list and its page totals to that exact status."
      security:
        -
          bearerAuth: []
      x-required-privileges:
        - "PRODUCT.LIST"
      x-gateway-privilege: "PRODUCT.LIST"
      x-required-roles:
