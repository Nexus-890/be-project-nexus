    get:
      tags:
        - "Products"
      operationId: "listProducts"
      summary: "Search visible products with filters and stable ordering"
      description: "Legacy compatibility endpoint for existing title-substring clients. Buyer frontend search and browsing use GET /api/v1/products/search for accent-insensitive full-text name/description matching. This endpoint retains its original matching and sort parameters. Only ACTIVE/nondeleted products. q is a trimmed case-insensitive literal product-title substring (SQL wildcard characters are literal). Filters combine with AND before pagination. Relevance ranks exact title, title prefix, then substring, newest first within each rank. Every ordering ends with UUID ascending. Price ordering uses the lowest SKU price, null prices last. maxPrice requires at least one SKU at or below the ceiling and retains the full min/max response range. listingType maps to persisted auctionEnable, not active auction state. An unmatched search returns empty data[] and zero totals. Access: public (a supplied invalid bearer token is rejected). Ownership/business restriction: None."
      security: []
      x-required-privileges: []
      x-required-roles: []
      x-ownership: "None."
      x-error-codes:
        "400":
          - "INVALID_PARAMETER"
          - "CATALOG_DATA_INVALID"
        "401":
          - "UNAUTHENTICATED"
        "405":
          - "METHOD_NOT_ALLOWED"
        "406":
          - "NOT_ACCEPTABLE"
        "429":
          - "RATE_LIMITED"
        "500":
          - "INTERNAL_ERROR"
        "503":
          - "SERVICE_UNAVAILABLE"
        "504":
          - "GATEWAY_TIMEOUT"
      parameters:
        -
          name: "q"
          in: "query"
          required: false
          description: "Trimmed case-insensitive literal product-title substring. Blank means all titles."
          schema:
            type: "string"
            maxLength: 255
        -
          name: "sort"
          in: "query"
          required: false
          description: "Stable ordering before pagination; UUID ascending is the final tie-breaker."
          schema:
            type: "string"
            enum: ["relevance", "createdAt,desc", "price,asc", "price,desc"]
            default: "relevance"
        -
          name: "listingType"
          in: "query"
          required: false
          description: "all has no restriction; auction requires auctionEnable=true, buy-now requires false."
          schema:
            type: "string"
            enum: ["all", "buy-now", "auction"]
            default: "all"
        -
          name: "maxPrice"
          in: "query"
          required: false
          description: "Maximum lowest-SKU price in VND; products with no SKU do not match. Decimal(19,2)."
          schema:
            type: "number"
            minimum: 0
            maximum: 99999999999999999.99
            multipleOf: 0.01
        -
          name: "categoryId"
          in: "query"
          required: false
          description: "Optional category UUID."
          schema:
            type: "string"
            format: "uuid"
        -
          name: "page"
          in: "query"
          required: false
          description: "Zero-based page."
          schema:
            type: "integer"
            minimum: 0
            default: 0
        -
          name: "size"
          in: "query"
          required: false
          description: "Positive page size; no maximum is currently enforced."
          schema:
            type: "integer"
            minimum: 1
            default: 10
      responses:
        "200":
          description: "Successful response."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ListProductsResponse"
              examples:
                success:
