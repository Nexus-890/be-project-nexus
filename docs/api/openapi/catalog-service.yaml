components:
  parameters:
    CatalogSearchPage:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    CatalogSearchSize:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 10}
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "RS256 access JWT, issuer user-service, audience nexus-services. privileges are exact SRS strings; roles are mapped as ROLE_<code>."
  schemas:
    Problem:
      type: "object"
      required:
        - "type"
        - "title"
        - "status"
        - "detail"
        - "instance"
        - "code"
      properties:
        type:
          type: "string"
          format: "uri-reference"
        title:
          type: "string"
        status:
          type: "integer"
          minimum: 400
          maximum: 599
        detail:
          type: "string"
        instance:
          type: "string"
          format: "uri-reference"
        code:
          type: "string"
          pattern: "\\S"
          minLength: 1
          description: "Stable symbolic identifier. Branch on code and status; tolerate future unknown codes."
        traceId:
          type: "string"
          pattern: "\\S"
          minLength: 1
          description: "Active trace/correlation identifier when available; optional without tracing."
        errors:
          type: "array"
          items:
            $ref: "#/components/schemas/ValidationError"
    ValidationError:
      type: "object"
      required:
        - "field"
        - "code"
        - "detail"
      properties:
        field:
          type: "string"
          description: "Failed request field; an object-level failure uses the object name."
        code:
          type: "string"
          description: "Constraint identifier, for example VALIDATION_NOT_BLANK, VALIDATION_EMAIL, VALIDATION_SIZE or INVALID_PARAMETER."
        detail:
          type: "string"
    PageInfo:
      type: "object"
      required:
        - "number"
        - "size"
        - "totalElements"
        - "totalPages"
      properties:
        number:
          type: "integer"
          minimum: 0
        size:
          type: "integer"
          minimum: 1
        totalElements:
          type: "integer"
          format: "int64"
          minimum: 0
        totalPages:
          type: "integer"
          minimum: 0
    Category:
      type: "object"
      required:
        - "id"
        - "parentId"
        - "name"
        - "slug"
        - "level"
        - "path"
      properties:
        id:
          type: "string"
          format: "uuid"
        parentId:
          type: "string"
          format: "uuid"
          nullable: true
        name:
          type: "string"
        slug:
          type: "string"
        level:
          type: "integer"
          format: "int32"
        path:
          type: "string"
    CategoryTree:
      type: "object"
      required:
        - "id"
        - "parentId"
        - "name"
        - "slug"
        - "level"
        - "children"
      properties:
        id:
          type: "string"
          format: "uuid"
        parentId:
          type: "string"
          format: "uuid"
          nullable: true
        name:
          type: "string"
        slug:
          type: "string"
        level:
          type: "integer"
        children:
          type: "array"
          items:
            $ref: "#/components/schemas/CategoryTree"
    CreateCategory:
      type: "object"
      required:
        - "name"
        - "slug"
      properties:
        name:
          type: "string"
          pattern: "\\S"
          minLength: 1
          maxLength: 150
        slug:
          type: "string"
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 1
          maxLength: 100
        parentId:
          type: "string"
          format: "uuid"
          nullable: true
        description:
          type: "string"
          maxLength: 1000
          nullable: true
    UpdateCategory:
      type: "object"
      required: []
      properties:
        name:
          type: "string"
          maxLength: 150
          pattern: "\\S"
          description: "When supplied must be nonblank and nonnull. Omitted leaves unchanged."
        slug:
          type: "string"
          maxLength: 100
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: "When supplied must be nonnull. Omitted leaves unchanged."
        parentId:
          type: "string"
          format: "uuid"
          description: "Omitted leaves unchanged; explicit null moves to the root."
          nullable: true
        description:
          type: "string"
          maxLength: 1000
          description: "Omitted leaves unchanged; explicit null clears it."
          nullable: true
    Product:
      type: "object"
      required:
        - "id"
        - "name"
        - "slug"
        - "status"
        - "categoryId"
        - "sellerId"
        - "minPrice"
        - "maxPrice"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        slug:
          type: "string"
        status:
          type: "string"
          enum:
            - "DRAFT"
            - "INACTIVE"
            - "ACTIVE"
        categoryId:
          type: "string"
          format: "uuid"
        sellerId:
          type: "string"
          format: "uuid"
        minPrice:
          type: "number"
          minimum: 0
          description: "Lowest SKU price of the product; null when it has no SKU. Existing BigDecimal JSON number; this migration preserves the delivered numeric wire format."
          nullable: true
        maxPrice:
          type: "number"
          minimum: 0
          description: "Highest SKU price of the product; equals minPrice when every SKU has one price, null when it has no SKU. BigDecimal JSON number."
          nullable: true
        images:
          type: array
          description: Product images sorted by sortOrder then ID; empty when none exist.
          items:
            $ref: "#/components/schemas/Image"
    ProductDetail:
      type: "object"
      required:
        - "id"
        - "name"
        - "slug"
        - "status"
        - "categoryId"
        - "sellerId"
        - "minPrice"
        - "maxPrice"
        - "description"
        - "auctionEnable"
        - "skus"
        - "images"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        slug:
          type: "string"
        status:
          type: "string"
          enum:
            - "DRAFT"
            - "INACTIVE"
            - "ACTIVE"
        categoryId:
          type: "string"
          format: "uuid"
        sellerId:
          type: "string"
          format: "uuid"
        minPrice:
          type: "number"
          minimum: 0
          description: "Lowest SKU price of the product; null when it has no SKU. Existing BigDecimal JSON number; this migration preserves the delivered numeric wire format."
          nullable: true
        maxPrice:
          type: "number"
          minimum: 0
          description: "Highest SKU price of the product; equals minPrice when every SKU has one price, null when it has no SKU. BigDecimal JSON number."
          nullable: true
        description:
          type: "string"
          nullable: true
        auctionEnable:
          type: "boolean"
        skus:
          type: "array"
          items:
            $ref: "#/components/schemas/Sku"
        images:
          type: "array"
          items:
            $ref: "#/components/schemas/Image"
    Image:
      type: "object"
      required:
        - "id"
        - "imageUrl"
        - "sortOrder"
      properties:
        id:
          type: "string"
          format: "uuid"
        imageUrl:
          type: "string"
        sortOrder:
          type: "integer"
          format: "int32"
    CreateProduct:
      type: "object"
      required:
        - "name"
        - "categoryId"
      properties:
        name:
          type: "string"
          pattern: "\\S"
          minLength: 1
          maxLength: 255
        description:
          type: "string"
          nullable: true
        categoryId:
          type: "string"
          format: "uuid"
        auctionEnable:
          type: "boolean"
          description: "Omitted/null defaults false on create."
          nullable: true
    UpdateProduct:
      type: "object"
      required:
        - "name"
        - "categoryId"
        - "auctionEnable"
      properties:
        name:
          type: "string"
          pattern: "\\S"
          minLength: 1
          maxLength: 255
        description:
          type: "string"
          nullable: true
        categoryId:
          type: "string"
          format: "uuid"
        auctionEnable:
          type: "boolean"
    ChangeProductStatus:
      type: "object"
      required:
        - "status"
      properties:
        status:
          type: "string"
          enum:
            - "DRAFT"
            - "INACTIVE"
            - "ACTIVE"
          description: "Allowed transitions: DRAFT -> ACTIVE, ACTIVE -> INACTIVE, INACTIVE -> ACTIVE. Other transitions, including same status, return 400."
    Sku:
      type: "object"
      required:
        - "id"
        - "productId"
        - "skuCode"
        - "color"
        - "size"
        - "price"
        - "status"
      properties:
        id:
          type: "string"
          format: "uuid"
        productId:
          type: "string"
          format: "uuid"
        skuCode:
          type: "string"
          maxLength: 60
          description: "Generated on create as `SKU-<productId without dashes>-<NN>`, NN the next number for that product (01, 02, ...). An update never changes it. SKUs created before keep the code they had."
        color:
          type: "string"
          nullable: true
        size:
          type: "string"
          nullable: true
        price:
          type: "number"
          minimum: 0
          description: "Existing BigDecimal JSON number; this migration preserves the delivered numeric wire format."
        status:
          type: "string"
          description: "Current persisted SKU status string, initially ACTIVE. This issue does not restrict the existing string column to a new enum."
        shippingParcel:
          $ref: "#/components/schemas/ShippingParcel"
        costPrice:
          type: "number"
          minimum: 0
          description: "Seller purchase cost for one unit. Returned only to the owning seller or an admin: on SKU create/update and on GET /api/v1/products/mine/{id}. Public reads omit it. Absent when the seller has not entered a cost."
    ShippingParcel:
      type: "object"
      nullable: true
      description: "Seller supplied shipping-ready package for one SKU unit, measured in grams and centimetres. Null means the seller has not supplied verified measurements; checkout rejects missing measurements rather than inventing them."
      required:
        - "weightGrams"
        - "lengthCm"
        - "widthCm"
        - "heightCm"
      properties:
        weightGrams:
          type: "integer"
          minimum: 1
          maximum: 50000
        lengthCm:
          type: "integer"
          minimum: 1
          maximum: 200
        widthCm:
          type: "integer"
          minimum: 1
          maximum: 200
        heightCm:
          type: "integer"
          minimum: 1
          maximum: 200
      example:
        weightGrams: 1200
        lengthCm: 30
        widthCm: 20
        heightCm: 15
    WriteSku:
      type: "object"
      description: "The SKU code is not part of the request. A `skuCode` sent in the body is ignored."
      required:
        - "color"
        - "size"
        - "price"
      properties:
        color:
          type: "string"
          pattern: "\\S"
          minLength: 1
          maxLength: 50
        size:
          type: "string"
          pattern: "\\S"
          minLength: 1
          maxLength: 50
        price:
          type: "number"
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          maximum: 100000000000000000
          exclusiveMaximum: true
          description: "Greater than zero; at most 17 integer and 2 fractional decimal digits. Stored BigDecimal numeric(19,2)."
        shippingParcel:
          allOf:
            - $ref: "#/components/schemas/ShippingParcel"
          description: "Optional verified package measurements for one SKU unit. Omitted or null on update preserves the existing measurements for older clients. A supplied object must contain all four valid measurements."
        costPrice:
          type: "number"
          nullable: true
          minimum: 0
          multipleOf: 0.01
          maximum: 100000000000000000
          exclusiveMaximum: true
          description: "Optional purchase cost for one unit, zero or more; at most 17 integer and 2 fractional decimal digits. Stored numeric(19,2), private to the owner. It never changes the selling `price`. Omitted or null on update keeps the stored cost."
    CreateCategoryResponse:
