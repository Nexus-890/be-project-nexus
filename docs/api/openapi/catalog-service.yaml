# Delivered API contract for issue #248. Source: controllers, DTO constraints and service behavior.
openapi: "3.0.3"
info:
  title: "Nexus catalog-service delivered API"
  version: "1.0.0"
  description: "Issue #248 response-envelope and Problem Details contract. Covers delivered operations only. All 2xx JSON has top-level data, numeric code (default 0), and message (default response success); paginated lists also have page. 204 has no body. Bearer permissions are exact JWT privileges; ownership is enforced downstream. ADR/style-guide approval and coordinated FE merge date are pending human agreement. Legacy docs/api/*.yaml are separate #88 drafts, not this contract."
servers:
  -
    url: "http://localhost:8080"
    description: "Local API gateway; preserve gateway and downstream authorization."
tags:
  -
    name: "Categories"
    description: "Category administration and public hierarchy reads."
  -
    name: "Products"
    description: "Product CRUD, visibility, status and pagination."
  -
    name: "SKUs"
    description: "Product variants and public reads."
security:
  -
    bearerAuth: []
paths:
  /api/v1/categories:
    get:
      tags: [Categories]
      operationId: listFlatCategories
      summary: List categories as a flat page
      description: Filter nondeleted categories by accent-insensitive and case-insensitive name or slug, direct parent and exact level. SQL wildcard characters in q are literal.
      security: []
      x-catalogue-id: CAT-05
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 150}
        - name: parentId
          in: query
          schema: {type: string, format: uuid}
        - name: level
          in: query
          schema: {type: integer, minimum: 0, maximum: 32767}
        - $ref: '#/components/parameters/CatalogSearchPage'
        - $ref: '#/components/parameters/CatalogSearchSize'
      responses:
        '200':
          description: Category page ordered by name and ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatCategoryPage'
        '400':
          description: Invalid query parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
        - "Categories"
      operationId: "createCategory"
      summary: "Create a category"
      description: "Unique normalized slug. Parent must exist; resulting level must not exceed nexus.catalog.category-max-level (default3). Access: requires CATEGORY.CREATE. Ownership/business restriction: None."
      security:
        -
          bearerAuth: []
      x-required-privileges:
        - "CATEGORY.CREATE"
      x-gateway-privilege: "CATEGORY.CREATE"
      x-required-roles: []
      x-ownership: "None."
      x-error-codes:
        "400":
          - "INVALID_PARAMETER"
          - "VALIDATION_FAILED"
          - "INVALID_REQUEST_BODY"
          - "CATALOG_CATEGORY_LEVEL_MAX"
          - "CATALOG_INVALID_SLUG"
        "401":
          - "UNAUTHENTICATED"
        "403":
          - "FORBIDDEN"
        "404":
          - "CATALOG_NOT_FOUND"
        "405":
          - "METHOD_NOT_ALLOWED"
        "406":
          - "NOT_ACCEPTABLE"
        "409":
          - "CATALOG_SLUG_DUPLICATED"
        "415":
          - "UNSUPPORTED_MEDIA_TYPE"
        "429":
          - "RATE_LIMITED"
        "500":
          - "INTERNAL_ERROR"
        "503":
          - "SERVICE_UNAVAILABLE"
        "504":
          - "GATEWAY_TIMEOUT"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CreateCategory"
            example:
              name: "Footwear"
              slug: "footwear"
      responses:
        "201":
          description: "Created."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CreateCategoryResponse"
              examples:
                success:
                  summary: "Success"
                  value:
                    code: 0
                    message: "response success"
                    data:
                      id: "c8000000-0000-4000-8000-000000000001"
                      parentId: null
                      name: "Footwear"
                      slug: "footwear"
                      level: 1
                      path: "/footwear/"
        "400":
          description: "Bad Request. Codes: `INVALID_PARAMETER`, `VALIDATION_FAILED`, `INVALID_REQUEST_BODY`, `CATALOG_CATEGORY_LEVEL_MAX`, `CATALOG_INVALID_SLUG`."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problem"
                  -
                    type: "object"
                    properties:
                      status:
                        type: "integer"
                        enum:
                          - 400
                      code:
                        type: "string"
                        enum:
                          - "INVALID_PARAMETER"
                          - "VALIDATION_FAILED"
                          - "INVALID_REQUEST_BODY"
                          - "CATALOG_CATEGORY_LEVEL_MAX"
                          - "CATALOG_INVALID_SLUG"
              examples:
                INVALID_PARAMETER:
                  summary: "INVALID_PARAMETER"
                  value:
                    type: "urn:problem:invalid-parameter"
                    title: "Bad Request"
                    status: 400
                    detail: "A request parameter is invalid"
                    instance: "/api/v1/categories"
                    code: "INVALID_PARAMETER"
                VALIDATION_FAILED:
                  summary: "VALIDATION_FAILED"
                  value:
                    type: "urn:problem:validation-error"
                    title: "Bad Request"
                    status: 400
                    detail: "The request data is invalid"
                    instance: "/api/v1/categories"
                    code: "VALIDATION_FAILED"
                    errors:
                      -
                        field: "name"
                        code: "VALIDATION_NOT_BLANK"
                        detail: "Invalid value for name"
                      -
                        field: "slug"
                        code: "VALIDATION_NOT_BLANK"
                        detail: "Invalid value for slug"
                INVALID_REQUEST_BODY:
                  summary: "INVALID_REQUEST_BODY"
                  value:
                    type: "urn:problem:invalid-request-body"
                    title: "Bad Request"
                    status: 400
                    detail: "The request body is invalid or malformed"
                    instance: "/api/v1/categories"
                    code: "INVALID_REQUEST_BODY"
                CATALOG_CATEGORY_LEVEL_MAX:
                  summary: "CATALOG_CATEGORY_LEVEL_MAX"
                  value:
                    type: "urn:problem:domain-error"
                    title: "Bad Request"
                    status: 400
                    detail: "Category max level"
                    instance: "/api/v1/categories"
                    code: "CATALOG_CATEGORY_LEVEL_MAX"
                CATALOG_INVALID_SLUG:
                  summary: "CATALOG_INVALID_SLUG"
                  value:
