                    title: "Bad Request"
                    status: 400
                    detail: "Invalid slug format"
                    instance: "/api/v1/categories"
                    code: "CATALOG_INVALID_SLUG"
        "401":
          description: "Unauthorized. Codes: `UNAUTHENTICATED`."
