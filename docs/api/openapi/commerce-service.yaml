    post:
      tags:
        - "Orders"
      operationId: "createOrder"
      summary: "Place an order from the current cart"
      description: "Requires CHECKOUT.START AND ORDER.CREATE and a UUID Idempotency-Key. Splits the active cart by seller, snapshots current catalog prices and reserves inventory. With nexus.order.idempotency-enabled=true (ORDER_IDEMPOTENCY_ENABLED, default true), a matching replay of the same key, buyer and shipping/payment payload returns the original order group and seller order IDs with 200 and creates no new rows; a fresh key returns 201. UUID letter case is normalized, so uppercase and lowercase forms are the same key. Concurrent requests for one key leave one group and one order per seller; the losing request returns the committed winner's group. A missing or invalid key returns 400 COMMERCE_INVALID_ORDER_REQUEST. A key owned by another buyer returns 400 COMMERCE_IDEMPOTENCY_KEY_NOT_OWNED without that buyer's order data. The same buyer reusing a key with changed shipping/payment data returns 409 COMMERCE_IDEMPOTENCY_CONFLICT. When idempotency is disabled, the UUID header remains required but each successful checkout uses a fresh internal key and does not replay the supplied key. Cart ownership and checkout guards still apply. Unsupported promotion, unavailable item and unrepresentable money fail before checkout completes. Payment method is SEPAY; the current reservation implementation may reject unavailable inventory. Gateway checks ORDER.CREATE; downstream additionally checks CHECKOUT.START."
      security:
        -
          bearerAuth: []

      x-required-privileges:
        - "CHECKOUT.START"
        - "ORDER.CREATE"
      x-required-roles: []
      x-ownership: "See operation description."
      responses:
        "200":
          description: "Idempotent replay: the original order group and seller order IDs, with no new order rows."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
              examples:
                success:
                  summary: "Success"
                  value:
                    code: 0
                    message: "response success"
                    data:
                      orderGroupId: "c8000000-0000-4000-8000-000000000006"
                      status: "PENDING"
                      totalAmount: 150000
                      currency: "VND"
                      dueAt: "2026-10-29T08:15:00Z"
                      orders:
                        -
                          orderId: "c8000000-0000-4000-8000-000000000005"
                          orderNumber: "NX-20261029-00000001"
                          sellerId: "68000000-0000-4000-8000-000000000002"
                          status: "PENDING"
                          totalAmount: 150000
                          items: []

        "201":
          description: "A new order group and one order for each seller in the cart were created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
              examples:
                success:
                  summary: "Success"
                  value:
                    code: 0
                    message: "response success"
                    data:
                      orderGroupId: "c8000000-0000-4000-8000-000000000006"
                      status: "PENDING"
