# Delivered API contract for issue #248. Source: controllers, DTO constraints and service behavior.
openapi: "3.0.3"
info:
  title: "Nexus commerce-service delivered API"
  version: "1.0.0"
  description: "Issue #248 response-envelope and Problem Details contract. Covers delivered operations only. All 2xx JSON has top-level data; paginated lists also have page. 204 has no body. Bearer permissions are exact JWT privileges; ownership is enforced downstream. ADR/style-guide approval and coordinated FE merge date are pending human agreement. Legacy docs/api/*.yaml are separate #88 drafts, not this contract."
servers:
  -
    url: "http://localhost:8080"
    description: "Local API gateway; preserve gateway and downstream authorization."
tags:
  -
    name: "Cart"
    description: "Own active cart get-or-create and item addition."
security:
  -
    bearerAuth: []
paths:
  /api/v1/carts/me:
    get:
      tags:
        - "Cart"
      operationId: "getOwnCart"
      summary: "Get or create the current active cart"
      description: "Returns200 even when first access creates the cart. One active cart per user is protected by a database unique index. Gateway primary privilege is CART.VIEW; downstream additionally checks CART.CREATE. Access: requires CART.VIEW AND CART.CREATE. Ownership/business restriction: JWT subject only; guest carts are not supported."
      security:
        -
          bearerAuth: []
      x-required-privileges:
        - "CART.VIEW"
        - "CART.CREATE"
      x-gateway-privilege: "CART.VIEW"
      x-required-roles: []
      x-ownership: "JWT subject only; guest carts are not supported."
      x-error-codes:
        "400":
          - "INVALID_PARAMETER"
        "401":
          - "UNAUTHENTICATED"
          - "COMMERCE_UNAUTHENTICATED"
        "403":
          - "FORBIDDEN"
        "405":
          - "METHOD_NOT_ALLOWED"
        "406":
          - "NOT_ACCEPTABLE"
        "429":
          - "RATE_LIMITED"
        "500":
          - "INTERNAL_ERROR"
          - "COMMERCE_DB_ERROR"
        "503":
          - "SERVICE_UNAVAILABLE"
        "504":
          - "GATEWAY_TIMEOUT"
      responses:
        "200":
          description: "Successful response."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/GetOwnCartResponse"
              examples:
                success:
                  summary: "Success"
                  value:
                    data:
                      id: "c8000000-0000-4000-8000-000000000004"
                      userId: "68000000-0000-4000-8000-000000000002"
                      status: "ACTIVE"
                      items: []
        "400":
          description: "Bad Request. Codes: `INVALID_PARAMETER`."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problem"
                  -
                    type: "object"
                    properties:
                      status:
                        type: "integer"
                        enum:
                          - 400
                      code:
                        type: "string"
                        enum:
                          - "INVALID_PARAMETER"
              examples:
                INVALID_PARAMETER:
                  summary: "INVALID_PARAMETER"
                  value:
                    type: "urn:problem:invalid-parameter"
                    title: "Bad Request"
                    status: 400
                    detail: "A request parameter is invalid"
                    instance: "/api/v1/carts/me"
                    code: "INVALID_PARAMETER"
        "401":
          description: "Unauthorized. Codes: `UNAUTHENTICATED`, `COMMERCE_UNAUTHENTICATED`."
          headers:
            WWW-Authenticate:
              description: "Bearer challenge is present for security-layer authentication failure. A domain login error does not promise this header."
              schema:
                type: "string"
                example: "Bearer"
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problem"
                  -
                    type: "object"
                    properties:
                      status:
                        type: "integer"
                        enum:
                          - 401
                      code:
                        type: "string"
                        enum:
                          - "UNAUTHENTICATED"
                          - "COMMERCE_UNAUTHENTICATED"
              examples:
                UNAUTHENTICATED:
                  summary: "UNAUTHENTICATED"
                  value:
                    type: "urn:problem:unauthorized"
                    title: "Unauthorized"
                    status: 401
                    detail: "A valid access token is required to access this resource"
                    instance: "/api/v1/carts/me"
                    code: "UNAUTHENTICATED"
                COMMERCE_UNAUTHENTICATED:
                  summary: "COMMERCE_UNAUTHENTICATED"
                  value:
                    type: "urn:problem:domain-error"
                    title: "Unauthorized"
                    status: 401
                    detail: "Unauthenticated"
                    instance: "/api/v1/carts/me"
                    code: "COMMERCE_UNAUTHENTICATED"
        "403":
          description: "Forbidden. Codes: `FORBIDDEN`."
