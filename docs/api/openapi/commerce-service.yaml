                  summary: "COMMERCE_CATALOG_UNAVAILABLE"
                  value:
                    type: "urn:problem:domain-error"
                    title: "Service Unavailable"
                    status: 503
                    detail: "Catalog is unavailable"
                    instance: "/api/v1/carts/me/items"
                    code: "COMMERCE_CATALOG_UNAVAILABLE"
        "504":
          description: "Gateway Timeout. Codes: `GATEWAY_TIMEOUT`."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problem"
                  -
                    type: "object"
                    properties:
                      status:
                        type: "integer"
                        enum:
                          - 504
                      code:
                        type: "string"
                        enum:
                          - "GATEWAY_TIMEOUT"
              examples:
                GATEWAY_TIMEOUT:
                  summary: "GATEWAY_TIMEOUT"
                  value:
                    type: "https://nexus/errors/gateway-timeout"
                    title: "Gateway Timeout"
                    status: 504
                    detail: "The service did not answer in time"
                    instance: "/api/v1/carts/me/items"
                    code: "GATEWAY_TIMEOUT"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "RS256 access JWT, issuer user-service, audience nexus-services. privileges are exact SRS strings; roles are mapped as ROLE_<code>."
  schemas:
    Problem:
      type: "object"
      required:
        - "type"
        - "title"
        - "status"
        - "detail"
        - "instance"
        - "code"
      properties:
        type:
          type: "string"
          format: "uri-reference"
        title:
          type: "string"
        status:
          type: "integer"
          minimum: 400
          maximum: 599
        detail:
          type: "string"
        instance:
          type: "string"
          format: "uri-reference"
        code:
          type: "string"
          pattern: "\\S"
          minLength: 1
          description: "Stable symbolic identifier. Branch on code and status; tolerate future unknown codes."
        traceId:
          type: "string"
          pattern: "\\S"
          minLength: 1
          description: "Active trace/correlation identifier when available; optional without tracing."
        errors:
          type: "array"
          items:
            $ref: "#/components/schemas/ValidationError"
    ValidationError:
      type: "object"
      required:
        - "field"
        - "code"
        - "detail"
      properties:
        field:
          type: "string"
          description: "Failed request field; an object-level failure uses the object name."
        code:
          type: "string"
          description: "Constraint identifier, for example VALIDATION_NOT_BLANK, VALIDATION_EMAIL, VALIDATION_SIZE or INVALID_PARAMETER."
        detail:
          type: "string"
    Cart:
      type: "object"
      required:
        - "id"
        - "userId"
        - "status"
        - "items"
      properties:
        id:
          type: "string"
          format: "uuid"
        userId:
          type: "string"
          format: "uuid"
        status:
          type: "string"
          enum:
            - "ACTIVE"
          description: "Both delivered operations return the current active cart."
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/CartItem"
    CartItem:
      type: "object"
      required:
        - "id"
        - "productId"
        - "skuId"
        - "quantity"
        - "unitPrice"
      properties:
        id:
          type: "string"
          format: "uuid"
        productId:
          type: "string"
          format: "uuid"
        skuId:
          type: "string"
          format: "uuid"
        quantity:
          type: "integer"
          format: "int32"
          minimum: 1
        unitPrice:
          type: "number"
          minimum: 0
          description: "Existing BigDecimal JSON number; this migration preserves the delivered numeric wire format."
    AddCartItem:
      type: "object"
      required:
        - "skuId"
        - "quantity"
      properties:
        skuId:
          type: "string"
          format: "uuid"
        quantity:
          type: "integer"
          format: "int32"
          minimum: 1
    GetOwnCartResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          $ref: "#/components/schemas/Cart"
      additionalProperties: false
    AddCartItemResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          $ref: "#/components/schemas/Cart"
      additionalProperties: false
x-service: "commerce-service"
