  /api/v1/carts/me/items:
    post:
      tags:
        - "Cart"
      operationId: "addCartItem"
      summary: "Add a SKU to the current cart"
      description: "Fetches current SKU from catalog, then atomically inserts or increases existing quantity and refreshes unitPrice. Both a new line and an increased line return201. A missing/invisible or invisible catalog SKU returns404. A malformed catalog envelope/data is502 COMMERCE_INVALID_CATALOG_RESPONSE. Other Feign failures return503 COMMERCE_CATALOG_UNAVAILABLE. No inventory/stock check is introduced. Access: requires CART.UPDATE. Ownership/business restriction: JWT subject active cart only; caller cannot choose userId/cartId."
      security:
        -
          bearerAuth: []
      x-required-privileges:
        - "CART.UPDATE"
      x-gateway-privilege: "CART.UPDATE"
      x-required-roles: []
      x-ownership: "JWT subject active cart only; caller cannot choose userId/cartId."
      x-error-codes:
        "400":
          - "INVALID_PARAMETER"
          - "VALIDATION_FAILED"
          - "INVALID_REQUEST_BODY"
          - "COMMERCE_INVALID_QUANTITY"
        "401":
          - "UNAUTHENTICATED"
          - "COMMERCE_UNAUTHENTICATED"
        "403":
          - "FORBIDDEN"
        "404":
          - "COMMERCE_SKU_NOT_FOUND"
        "405":
          - "METHOD_NOT_ALLOWED"
        "406":
          - "NOT_ACCEPTABLE"
        "415":
          - "UNSUPPORTED_MEDIA_TYPE"
        "429":
          - "RATE_LIMITED"
        "500":
          - "INTERNAL_ERROR"
          - "COMMERCE_DB_ERROR"
        "502":
          - "COMMERCE_INVALID_CATALOG_RESPONSE"
        "503":
          - "SERVICE_UNAVAILABLE"
          - "COMMERCE_CATALOG_UNAVAILABLE"
        "504":
          - "GATEWAY_TIMEOUT"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AddCartItem"
            example:
              skuId: "c8000000-0000-4000-8000-000000000003"
              quantity: 1
      responses:
        "201":
          description: "Created."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AddCartItemResponse"
              examples:
                success:
                  summary: "Success"
                  value:
                    data:
                      id: "c8000000-0000-4000-8000-000000000004"
                      userId: "68000000-0000-4000-8000-000000000002"
                      status: "ACTIVE"
                      items:
                        -
                          id: "c8000000-0000-4000-8000-000000000005"
                          productId: "c8000000-0000-4000-8000-000000000002"
                          skuId: "c8000000-0000-4000-8000-000000000003"
                          quantity: 1
                          unitPrice: 150000.5
        "400":
          description: "Bad Request. Codes: `INVALID_PARAMETER`, `VALIDATION_FAILED`, `INVALID_REQUEST_BODY`, `COMMERCE_INVALID_QUANTITY`."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problem"
                  -
                    type: "object"
                    properties:
                      status:
                        type: "integer"
                        enum:
                          - 400
                      code:
                        type: "string"
                        enum:
                          - "INVALID_PARAMETER"
                          - "VALIDATION_FAILED"
                          - "INVALID_REQUEST_BODY"
                          - "COMMERCE_INVALID_QUANTITY"
              examples:
                INVALID_PARAMETER:
                  summary: "INVALID_PARAMETER"
                  value:
                    type: "urn:problem:invalid-parameter"
                    title: "Bad Request"
                    status: 400
                    detail: "A request parameter is invalid"
                    instance: "/api/v1/carts/me/items"
                    code: "INVALID_PARAMETER"
                VALIDATION_FAILED:
                  summary: "VALIDATION_FAILED"
                  value:
                    type: "urn:problem:validation-error"
                    title: "Bad Request"
                    status: 400
                    detail: "The request data is invalid"
                    instance: "/api/v1/carts/me/items"
                    code: "VALIDATION_FAILED"
                    errors:
                      -
                        field: "skuId"
                        code: "VALIDATION_NOT_NULL"
                        detail: "Invalid value for skuId"
                      -
                        field: "quantity"
                        code: "VALIDATION_POSITIVE"
                        detail: "Invalid value for quantity"
                INVALID_REQUEST_BODY:
                  summary: "INVALID_REQUEST_BODY"
                  value:
                    type: "urn:problem:invalid-request-body"
                    title: "Bad Request"
                    status: 400
                    detail: "The request body is invalid or malformed"
                    instance: "/api/v1/carts/me/items"
                    code: "INVALID_REQUEST_BODY"
                COMMERCE_INVALID_QUANTITY:
                  summary: "COMMERCE_INVALID_QUANTITY"
                  value:
                    type: "urn:problem:domain-error"
                    title: "Bad Request"
                    status: 400
                    detail: "Quantity is invalid"
                    instance: "/api/v1/carts/me/items"
                    code: "COMMERCE_INVALID_QUANTITY"
