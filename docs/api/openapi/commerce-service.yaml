# Delivered API contract for issue #248. Source: controllers, DTO constraints and service behavior.
openapi: "3.0.3"
info:
  title: "Nexus commerce-service delivered API"
  version: "1.0.0"
  description: "Issue #248 response-envelope and Problem Details contract. Covers delivered operations only. All 2xx JSON has top-level data, numeric code (default 0), and message (default response success); paginated lists also have page. 204 has no body. Bearer permissions are exact JWT privileges; ownership is enforced downstream. ADR/style-guide approval and coordinated FE merge date are pending human agreement. Legacy docs/api/*.yaml are separate #88 drafts, not this contract."
servers:
  -
    url: "http://localhost:8080"
    description: "Local API gateway; preserve gateway and downstream authorization."
tags:
  -
    name: "Cart"
    description: "Own active cart get-or-create and item addition."
  -
    name: "Orders"
    description: "Checkout, order reads, administrative status changes and order history."
  -
    name: "Order references"
    description: "Internal product reference lookup."
security:
  -
    bearerAuth: []
paths:
  /api/v1/carts/me:
    get:
      tags:
        - "Cart"
      operationId: "getOwnCart"
      summary: "Get or create the current active cart"
      description: "Returns200 even when first access creates the cart. One active cart per user is protected by a database unique index. Gateway primary privilege is CART.VIEW; downstream additionally checks CART.CREATE. Access: requires CART.VIEW AND CART.CREATE. Ownership/business restriction: JWT subject only; guest carts are not supported."
      security:
        -
          bearerAuth: []
      x-required-privileges:
        - "CART.VIEW"
        - "CART.CREATE"
      x-gateway-privilege: "CART.VIEW"
      x-required-roles: []
      x-ownership: "JWT subject only; guest carts are not supported."
      x-error-codes:
