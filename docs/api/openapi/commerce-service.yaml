          - "INVALID_PARAMETER"
        "401":
          - "UNAUTHENTICATED"
          - "COMMERCE_UNAUTHENTICATED"
        "403":
          - "FORBIDDEN"
        "405":
          - "METHOD_NOT_ALLOWED"
        "406":
          - "NOT_ACCEPTABLE"
        "429":
          - "RATE_LIMITED"
        "500":
          - "INTERNAL_ERROR"
          - "COMMERCE_DB_ERROR"
        "503":
          - "SERVICE_UNAVAILABLE"
        "504":
          - "GATEWAY_TIMEOUT"
      responses:
        "200":
          description: "Successful response."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/GetOwnCartResponse"
              examples:
                success:
                  summary: "Success"
                  value:
                    code: 0
                    message: "response success"
                    data:
                      id: "c8000000-0000-4000-8000-000000000004"
                      userId: "68000000-0000-4000-8000-000000000002"
                      status: "ACTIVE"
                      items: []
        "400":
          description: "Bad Request. Codes: `INVALID_PARAMETER`."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problem"
                  -
                    type: "object"
                    properties:
                      status:
                        type: "integer"
                        enum:
                          - 400
                      code:
                        type: "string"
                        enum:
                          - "INVALID_PARAMETER"
              examples:
                INVALID_PARAMETER:
                  summary: "INVALID_PARAMETER"
                  value:
                    type: "urn:problem:invalid-parameter"
                    title: "Bad Request"
                    status: 400
                    detail: "A request parameter is invalid"
                    instance: "/api/v1/carts/me"
                    code: "INVALID_PARAMETER"
        "401":
          description: "Unauthorized. Codes: `UNAUTHENTICATED`, `COMMERCE_UNAUTHENTICATED`."
          headers:
            WWW-Authenticate:
              description: "Bearer challenge is present for security-layer authentication failure. A domain login error does not promise this header."
              schema:
                type: "string"
                example: "Bearer"
