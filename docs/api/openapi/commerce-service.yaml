          type: "string"
          minLength: 1
          maxLength: 150
          pattern: "\\S"
        phoneNumber:
          type: "string"
          minLength: 8
          maxLength: 20
          pattern: "\\S"
        addressLine:
          type: "string"
          minLength: 1
          maxLength: 500
          pattern: "\\S"
        ward:
          type: "string"
          minLength: 1
          maxLength: 100
          pattern: "\\S"
        district:
          type: "string"
          minLength: 1
          maxLength: 100
          pattern: "\\S"
        city:
          type: "string"
          minLength: 1
          maxLength: 100
          pattern: "\\S"
        countryCode:
          type: "string"
          enum:
            - "VN"
