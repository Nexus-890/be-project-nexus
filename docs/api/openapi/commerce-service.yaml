                        type: "integer"
                        enum:
                          - 403
                      code:
                        type: "string"
                        enum:
                          - "FORBIDDEN"
              examples:
                FORBIDDEN:
                  summary: "FORBIDDEN"
                  value:
                    type: "urn:problem:forbidden"
                    title: "Forbidden"
                    status: 403
                    detail: "You do not have permission to access this resource"
                    instance: "/api/v1/carts/me"
                    code: "FORBIDDEN"
