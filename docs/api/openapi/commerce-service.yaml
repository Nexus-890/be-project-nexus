  COMMERCE_DB_ERROR:
    status: 500
    detail: "Database error"
  COMMERCE_UNAUTHENTICATED:
    status: 401
    detail: "Unauthenticated"
  COMMERCE_INVALID_CATALOG_RESPONSE:
