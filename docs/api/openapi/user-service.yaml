components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "RS256 access JWT, issuer user-service, audience nexus-services. privileges are exact SRS strings; roles are mapped as ROLE_<code>."
  schemas:
    Problem:
      type: "object"
      required:
        - "type"
        - "title"
        - "status"
        - "detail"
        - "instance"
        - "code"
      properties:
        type:
          type: "string"
          format: "uri-reference"
        title:
          type: "string"
        status:
          type: "integer"
          minimum: 400
          maximum: 599
        detail:
          type: "string"
        instance:
          type: "string"
          format: "uri-reference"
        code:
          type: "string"
          pattern: "\\S"
          minLength: 1
          description: "Stable symbolic identifier. Branch on code and status; tolerate future unknown codes."
        traceId:
          type: "string"
          pattern: "\\S"
          minLength: 1
          description: "Active trace/correlation identifier when available; optional without tracing."
        errors:
          type: "array"
          items:
            $ref: "#/components/schemas/ValidationError"
    ValidationError:
      type: "object"
      required:
        - "field"
        - "code"
        - "detail"
      properties:
        field:
          type: "string"
          description: "Failed request field; an object-level failure uses the object name."
        code:
          type: "string"
          description: "Constraint identifier, for example VALIDATION_NOT_BLANK, VALIDATION_EMAIL, VALIDATION_SIZE or INVALID_PARAMETER."
        detail:
          type: "string"
    PageInfo:
      type: "object"
      required:
        - "number"
        - "size"
        - "totalElements"
        - "totalPages"
      properties:
        number:
          type: "integer"
          minimum: 0
        size:
          type: "integer"
          minimum: 1
        totalElements:
          type: "integer"
          format: "int64"
          minimum: 0
        totalPages:
          type: "integer"
          minimum: 0
    User:
      type: "object"
      required:
        - "id"
        - "email"
        - "phone"
        - "fullName"
        - "gender"
        - "address"
        - "dateOfBirth"
        - "roles"
        - "status"
        - "createdAt"
        - "phoneVerifiedAt"
      properties:
        id:
          type: "string"
          format: "uuid"
        email:
          type: "string"
          format: "email"
          maxLength: 255
        phone:
          type: "string"
        fullName:
          type: "string"
        gender:
          type: "string"
          enum:
            - "MALE"
            - "FEMALE"
            - "OTHER"
          nullable: true
        address:
          type: "string"
          nullable: true
        dateOfBirth:
          type: "string"
          format: "date"
          nullable: true
        roles:
          type: "array"
          items:
            type: "string"
        status:
          type: "string"
          enum:
            - "ACTIVE"
            - "LOCKED"
            - "DELETED"
        createdAt:
          type: "string"
          format: "date-time"
        phoneVerifiedAt:
          type: "string"
          format: "date-time"
          nullable: true
          description: "When the current phone was verified; null until verified and after the phone changes."
    Register:
      type: "object"
      required:
        - "email"
        - "phone"
        - "password"
        - "fullName"
        - "identityNumber"
        - "gender"
        - "address"
        - "dateOfBirth"
      properties:
        email:
          type: "string"
          pattern: "\\S"
          format: "email"
          minLength: 1
          maxLength: 255
          description: "Trimmed and normalized to lower case."
        phone:
          type: "string"
          pattern: "^\\+?[0-9]{7,15}$"
          description: "Whitespace, parentheses and hyphens are removed before validation."
        password:
          type: "string"
          pattern: "\\S"
          format: "password"
          minLength: 8
          description: "At least 8 characters. Sent only to Keycloak, which applies the realm password policy; user-service stores no password."
        fullName:
          type: "string"
          pattern: "\\S"
          minLength: 1
          maxLength: 150
        identityNumber:
          type: "string"
          pattern: "\\S"
          minLength: 1
          maxLength: 255
        gender:
          type: "string"
          enum:
            - "MALE"
            - "FEMALE"
            - "OTHER"
        address:
          type: "string"
          pattern: "\\S"
          minLength: 1
        dateOfBirth:
          type: "string"
          format: "date"
          description: "Valid yyyy-MM-dd date; must not be in the future in the service clock."
    UpdateProfile:
      type: "object"
      required: []
      properties:
        fullName:
          type: "string"
          pattern: "\\S"
          minLength: 1
          maxLength: 150
          description: "Trimmed. Omitted/null retains current value."
          nullable: true
        dateOfBirth:
          type: "string"
          format: "date"
          description: "Not in the future; omitted/null retains current value."
          nullable: true
        gender:
          type: "string"
          enum:
            - "MALE"
            - "FEMALE"
            - "OTHER"
          nullable: true
        address:
          type: "string"
          description: "Trimmed. Omitted/null retains current value."
          nullable: true
        email:
          type: "string"
          pattern: "\\S"
          format: "email"
          minLength: 1
          maxLength: 255
          description: "Trimmed and lowercased. Omitted/null retains current value."
          nullable: true
        phone:
          type: "string"
          pattern: "^\\+?[0-9]{7,15}$"
          description: "Whitespace, parentheses and hyphens are removed before validation. A different phone clears phoneVerifiedAt. Omitted/null retains current value."
          nullable: true
      description: "Only listed editable fields are consumed. Unknown properties are ignored; callers cannot change roles, status or identity number through this API."
    RegisterResponse:
      type: "object"
      required:
        - "code"
        - "message"
        - "data"
      properties:
        code:
          type: "integer"
          default: 0
          description: "Numeric success code; omitted or null values default to 0 during response construction. Explicit values are preserved."
        message:
          type: "string"
          default: "response success"
          description: "Omitted or null values default to response success during response construction. Explicit messages are preserved."
        data:
          $ref: "#/components/schemas/User"
      additionalProperties: false
    GetOwnProfileResponse:
      type: "object"
      required:
