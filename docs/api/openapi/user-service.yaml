    VerificationEmail:
      type: "object"
      required:
        - "email"
      properties:
        email:
          type: "string"
          pattern: "\\S"
          format: "email"
          minLength: 1
          maxLength: 255
          description: "Trimmed and normalized to lower case."
    ConfirmPhoneCode:
      type: "object"
      required:
        - "code"
      properties:
        code:
          type: "string"
          pattern: "^[0-9]{6}$"
    PhoneCodeSent:
      type: "object"
