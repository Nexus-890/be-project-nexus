# Delivered API contract for issue #248. Source: controllers, DTO constraints and service behavior.
openapi: "3.0.3"
info:
  title: "Nexus user-service delivered API"
  version: "1.0.0"
  description: "Issue #248 response-envelope and Problem Details contract. Covers delivered operations only. All 2xx JSON has top-level data, numeric code (default 0), and message (default response success); paginated lists also have page. 204 has no body. Bearer permissions are exact JWT privileges; ownership is enforced downstream. ADR/style-guide approval and coordinated FE merge date are pending human agreement. Legacy docs/api/*.yaml are separate #88 drafts, not this contract."
servers:
  -
    url: "http://localhost:8080"
    description: "Local API gateway; preserve gateway and downstream authorization."
tags:
  -
    name: "Authentication"
    description: "Public registration. Sign-in goes through Keycloak."
  -
    name: "Users"
    description: "Own profile, phone verification and privileged user reads."
  - name: Roles
    description: Read-only fixed Keycloak roles and client permissions.
  - name: Sellers
    description: Seller company profiles shared with the seller application lifecycle
  -
    name: "Addresses"
    description: "The caller's own address book."
security:
  -
    bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      tags:
        - "Authentication"
      operationId: "register"
      summary: "Register with the configured default role"
      description: "Requires self-registration to be enabled. Identity values are normalized before uniqueness checks. Creates the Keycloak account with the password and the configured realm role, then stores the profile under the Keycloak user id; the Keycloak account is removed when the profile cannot be stored. Keycloak then emails a verification link; the account cannot sign in until the link is opened. When that email cannot be sent the account is kept, 502 USER_VERIFICATION_EMAIL_FAILED is returned and POST /api/v1/auth/verification-email sends it again. Sign-in goes through Keycloak; user-service issues no tokens. Access: public (a supplied invalid bearer token is rejected). Ownership/business restriction: None."
      security: []
      x-required-privileges: []
      x-required-roles: []
      x-ownership: "None."
      x-error-codes:
        "400":
          - "INVALID_PARAMETER"
          - "VALIDATION_FAILED"
          - "INVALID_REQUEST_BODY"
          - "USER_IDENTITY_REJECTED"
        "401":
          - "UNAUTHENTICATED"
        "403":
          - "USER_REGISTRATION_DISABLED"
        "405":
          - "METHOD_NOT_ALLOWED"
        "406":
          - "NOT_ACCEPTABLE"
        "409":
          - "USER_EMAIL_ALREADY_USED"
          - "USER_PHONE_ALREADY_USED"
          - "USER_IDENTITY_NUMBER_ALREADY_USED"
        "415":
          - "UNSUPPORTED_MEDIA_TYPE"
        "429":
          - "RATE_LIMITED"
        "500":
          - "INTERNAL_ERROR"
        "502":
          - "USER_VERIFICATION_EMAIL_FAILED"
        "503":
          - "SERVICE_UNAVAILABLE"
          - "USER_REGISTRATION_ROLE_UNAVAILABLE"
          - "USER_IDENTITY_PROVIDER_UNAVAILABLE"
        "504":
          - "GATEWAY_TIMEOUT"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/Register"
            example:
              email: "new-buyer@example.com"
              phone: "+84901234567"
              password: "example-password"
              fullName: "New Buyer"
              identityNumber: "012345678901"
              gender: "OTHER"
              address: "Ho Chi Minh City"
              dateOfBirth: "1995-01-01"
      responses:
        "201":
          description: "Created."
          headers:
            Cache-Control:
              description: "Profile data must not be cached."
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/RegisterResponse"
              examples:
                success:
                  summary: "Success"
                  value:
                    code: 0
                    message: "response success"
                    data:
                      id: "68000000-0000-4000-8000-000000000002"
                      email: "seller@example.com"
                      phone: "+84901234567"
                      fullName: "Demo Seller"
                      gender: "OTHER"
                      address: "Ho Chi Minh City"
                      dateOfBirth: "1995-01-01"
                      roles:
                        - "BUYER"
                      status: "ACTIVE"
                      createdAt: "2026-10-23T00:00:00Z"
        "400":
          description: "Bad Request. Codes: `INVALID_PARAMETER`, `VALIDATION_FAILED`, `INVALID_REQUEST_BODY`, `USER_IDENTITY_REJECTED`."
          content:
            "application/problem+json":
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problem"
                  -
                    type: "object"
                    properties:
                      status:
                        type: "integer"
                        enum:
                          - 400
                      code:
                        type: "string"
                        enum:
                          - "INVALID_PARAMETER"
                          - "VALIDATION_FAILED"
                          - "INVALID_REQUEST_BODY"
                          - "USER_IDENTITY_REJECTED"
              examples:
                INVALID_PARAMETER:
                  summary: "INVALID_PARAMETER"
                  value:
                    type: "urn:problem:invalid-parameter"
                    title: "Bad Request"
                    status: 400
                    detail: "A request parameter is invalid"
                    instance: "/api/v1/auth/register"
                    code: "INVALID_PARAMETER"
                VALIDATION_FAILED:
