        "405":
          - "METHOD_NOT_ALLOWED"
        "406":
          - "NOT_ACCEPTABLE"
        "429":
          - "RATE_LIMITED"
        "500":
          - "INTERNAL_ERROR"
        "503":
          - "SERVICE_UNAVAILABLE"
          - "USER_IDENTITY_PROVIDER_UNAVAILABLE"
        "504":
          - "GATEWAY_TIMEOUT"
      parameters:
        -
          name: "q"
          in: "query"
          required: false
          description: "Optional search text."
          schema:
            type: "string"
        -
          name: "status"
          in: "query"
          required: false
          description: "Optional user status."
          schema:
            type: "string"
            enum:
              - "ACTIVE"
              - "LOCKED"
              - "DELETED"
