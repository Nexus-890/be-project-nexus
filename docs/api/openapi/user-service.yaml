          description: "Whitespace, parentheses and hyphens are removed before validation."
        addressLine:
          type: "string"
          pattern: "\\S"
          minLength: 1
          maxLength: 255
          description: "House number and street. Trimmed."
        provinceCode:
          type: "string"
          pattern: "^[1-9][0-9]{0,8}$"
          description: "Province code from /api/v1/shipping/provinces."
