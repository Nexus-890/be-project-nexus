                        field: "email"
                        code: "VALIDATION_NOT_BLANK"
                        detail: "Invalid value for email"
                      -
                        field: "phone"
                        code: "VALIDATION_NOT_BLANK"
                        detail: "Invalid value for phone"
                INVALID_REQUEST_BODY:
                  summary: "INVALID_REQUEST_BODY"
                  value:
                    type: "urn:problem:invalid-request-body"
                    title: "Bad Request"
                    status: 400
