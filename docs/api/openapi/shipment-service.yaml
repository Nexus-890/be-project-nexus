                properties:
                  status:
                    type: integer
                    enum:
                      - 400
                  code:
                    type: string
                    enum:
                      - SHIPMENT_INVALID_REQUEST
                      - SHIPMENT_VALIDATION_FAILED
                      - SHIPMENT_INVALID_REQUEST_BODY
                      - SHIPMENT_INVALID_PARAMETER
                      - SHIPMENT_INVALID_ADDRESS
          examples:
            SHIPMENT_INVALID_REQUEST:
              summary: Dữ liệu báo giá không hợp lệ
              value:
                type: urn:problem:domain-error
                title: Bad Request
                status: 400
                detail: Dữ liệu báo giá không hợp lệ
                instance: /api/v1/shipping/quotes
                code: SHIPMENT_INVALID_REQUEST
            SHIPMENT_VALIDATION_FAILED:
              summary: Dữ liệu yêu cầu không hợp lệ
              value:
                type: urn:problem:validation-error
