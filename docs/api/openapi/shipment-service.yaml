openapi: 3.0.3
info:
  title: Nexus shipping
  version: 2.8.0
  description: >-
    Issue #201: carrier list, the two-level GHN v3 locality catalog after the administrative merger, and
    quotes through preview. Version 2.6 adds the optional applyFreeShipping for #172; it defaults to true, and
    false returns the raw carrier fee so Commerce can apply free shipping on the winning bid. Version 2.1 adds
    the optional insuranceValue, independent of the catalog subtotal; empty or null means 0. Since 2.0 the
    contract is incompatible with the three-level draft: the districts operation is removed and wards takes
    provinceCode. The quote address uses line1 as agreed, together with provinceCode, wardCode and
    recipientName and recipientPhone, which the code requires. The public serviceType uses STANDARD for
    parcels under 20,000g and HEAVY from 20,000g. The extra recipient/parcel fields still need agreement with
    the checkout contract; see shipping-contract-review-201.md. Every successful JSON response has code,
    message, data and page per ADR-008. Errors raised by shipment-service use SHIPMENT_* codes; errors the
    gateway raises before reaching the service keep the gateway's common codes. Version 2.2 adds #202:
    creating a shipment from the OrderPaid snapshot, manual creation with Idempotency-Key, and shipment reads
    with an ownership check. Version 2.3 completes manual creation from the PAID snapshot read directly from
    commerce-service when the shipment does not exist yet. Version 2.6 adds #258: GHN sandbox booking, and the
    quoting carrier is separated from the booking carrier. A snapshot missing preparation data, or an
    unavailable carrier, keeps PENDING_TRACKING. When serviceType is missing, GHN/FAKE derive STANDARD/HEAVY
    from the final parcel. A missing pickup is taken only from the configuration of the same warehouse; a
    retry can also fill empty dispatch fields of a pending shipment. Parcel and recipient data are never
    invented; missing trusted data or configuration keeps PENDING_TRACKING. Version 2.4 adds reading the
    stored tracking and status history for the buyer on the order page. Version 2.4 adds #203: authenticated,
    deduplicated carrier callbacks, a tracking poller, paginated history, status updates and overrides with a
    reason, and handling OrderCancelled before carrier pickup. A successful callback uses its own protocol
    response; errors are still Problem Details.

servers:
  - url: http://localhost:8080
    description: System API gateway
  - url: http://localhost:8088
    description: Shipment service, for direct testing
tags:
  - name: Carriers
    description: Configured quoting carriers
  - name: Shipping addresses
    description: Two-level GHN v3 localities
  - name: Shipping quotes
    description: Quotes and estimated delivery dates
  - name: Shipments
    description: Create and read shipments for paid orders
paths:
  /api/v1/shipments:
    post:
      tags:
        - Shipments
      operationId: createShipment
      summary: Create a shipment manually from a paid order snapshot
      description: >-
        Requires SHIPPING.CREATE_SHIPMENT and one of the roles ADMIN or SUPPORT_STAFF. A buyer with the create
        privilege but no operations role is still rejected with 403. buyerId, shippingFee and shippingInfo
        come from the paid order; these fields are not accepted from the client and commerce_db is not read.
        When no shipment exists, GET /internal/v1/orders/{id}/shipping-snapshot on commerce is called directly
        with the caller's bearer token, with a timeout and a circuit breaker. Only a PAID order with a valid
        snapshot is created. A missing order returns 404 SHIPMENT_ORDER_NOT_FOUND; an order that is not PAID
        returns 409 SHIPMENT_ORDER_NOT_PAID; an unavailable upstream returns 503
        SHIPMENT_COMMERCE_UNAVAILABLE; an invalid snapshot returns 502 SHIPMENT_INVALID_ORDER_SNAPSHOT. The
        optional warehouseId, carrier and serviceType choose the dispatch for a new shipment. The warehouse
        and pickup must come from a trusted source; an old pickup is never used for another warehouse. An
        empty carrier uses SHIPPING_BOOKING_CARRIER (falling back to SHIPPING_CARRIER when it is not
        configured), independent of the quoting carrier stored in the snapshot. The other choices use the
        trusted snapshot or the shipping configuration. When the shipment already exists, any value sent must
        match the stored choice; an existing carrier/service/warehouse is not replaced once a request identity
        exists. An empty service for GHN/FAKE is derived from the final parcel; an empty pickup is filled only
        from the configuration of the same warehouse. A choice that differs from the stored one returns 409
        SHIPMENT_IDEMPOTENCY_CONFLICT. An OrderCancelled that arrives before the shipment is stored as a
        durable tombstone; a later manual create returns 409 SHIPMENT_ORDER_NOT_PAID, and a late OrderPaid
        does not create or book a shipment for the cancelled order. Each order has one shipment. The same
        Idempotency-Key with the same request returns the created shipment; reusing the key for another
        request, or a choice that conflicts with the existing shipment, returns 409. The first key is stored
        on the shipment with a fingerprint of the request body; a different key for a shipment that already
        has one also returns 409 SHIPMENT_IDEMPOTENCY_CONFLICT. A successful response is always 201 with the
        shipment's Location. A temporary carrier error or missing preparation data keeps the shipment
        PENDING_TRACKING with trackingCode=null; the retry job uses shipment.id as a stable request identity.
        The manual transaction writes shipment/history/outbox before calling the carrier; the OrderPaid
        consumer also writes its processed marker in the same transaction. Both creation paths use the same
        order lock and the unique order_id, so concurrent runs still produce one shipment and one creation
        event. ShipmentCreated records the PENDING_TRACKING creation with trackingCode=null; GET reflects
        tracking added later and no further ShipmentCreated is written. SHIPPING_BOOKING_CARRIER=NONE keeps
        the shipment PENDING_TRACKING with trackingCode=null and schedules no booking. A GHN quote with FAKE
        booking creates a FAKE- tracking code and keeps shippingFee from the paid snapshot. GHN booking uses
        the sandbox only, uses shipment.id as client_order_code and reconciles that code before a retry so a
        timeout does not create a duplicate order. TO_ADDRESS_CONFLICT is retried once with the ward and
        province; the shipment history records the fallback address. expected_delivery_time is stored when GHN
        returns it. On creation and on retry, GHN/FAKE can fill an empty serviceType from the final parcel and
        an empty pickupAddress from the configuration of the same warehouse. The default pickup is used only
        when the warehouse matches default-warehouse-id. The request identity and stored choices are never
        replaced, and parcel, recipient and locality codes are never invented; a missing parcel, valid
        recipient address or trusted pickup configuration keeps PENDING_TRACKING.
      security:
        - bearerAuth: []
      x-required-privileges:
        - SHIPPING.CREATE_SHIPMENT
      x-required-roles:
        - ADMIN
        - SUPPORT_STAFF
      x-ownership: >-
        Only ADMIN or SUPPORT_STAFF with the create privilege can act on the order; buyerId always comes from
        the trusted snapshot, not from an identity the client sends. x-required-roles on this operation is
        ANY-of.
      x-error-codes:
        '400':
          - SHIPMENT_IDEMPOTENCY_KEY_REQUIRED
          - SHIPMENT_VALIDATION_FAILED
          - SHIPMENT_INVALID_REQUEST_BODY
          - SHIPMENT_INVALID_PARAMETER
        '401':
          - SHIPMENT_UNAUTHENTICATED
          - UNAUTHENTICATED
        '403':
          - SHIPMENT_FORBIDDEN
          - FORBIDDEN
        '404':
          - SHIPMENT_ORDER_NOT_FOUND
          - SHIPMENT_WAREHOUSE_NOT_FOUND
        '405':
          - SHIPMENT_METHOD_NOT_ALLOWED
        '406':
          - SHIPMENT_NOT_ACCEPTABLE
        '409':
          - SHIPMENT_IDEMPOTENCY_CONFLICT
          - SHIPMENT_ORDER_NOT_PAID
        '415':
          - SHIPMENT_UNSUPPORTED_MEDIA_TYPE
        '422':
          - SHIPMENT_NO_SERVICE
        '429':
          - RATE_LIMITED
        '500':
          - SHIPMENT_INTERNAL_ERROR
          - INTERNAL_ERROR
        '502':
          - SHIPMENT_INVALID_ORDER_SNAPSHOT
        '503':
          - SHIPMENT_COMMERCE_UNAVAILABLE
          - SERVICE_UNAVAILABLE
        '504':
          - GATEWAY_TIMEOUT
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable key for the same create request; do not reuse it for a different body.
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '\S'
          example: manual-order-0001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
            example:
              orderId: 00000000-0000-4000-8000-000000000001
      responses:
        '201':
          description: The new shipment, or the result of an idempotent request that was already processed.
          headers:
            Location:
              description: Path to read the created shipment.
              schema:
                type: string
                format: uri-reference
              example: /api/v1/shipments/00000000-0000-4000-8000-000000000040
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentEnvelope'
              examples:
                created:
                  $ref: '#/components/examples/CreatedShipment'
                pending:
                  $ref: '#/components/examples/PendingShipment'
        '400':
          $ref: '#/components/responses/ShipmentBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ManualOrderNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/ShipmentConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/NoService'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/InvalidOrderSnapshot'
        '503':
          $ref: '#/components/responses/CommerceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    get:
      tags:
        - Shipments
      operationId: listShipments
      summary: List shipments with pagination
      description: >-
        Requires SHIPPING.VIEW_SHIPMENT. ADMIN and SUPPORT_STAFF read every shipment; other actors read only
        shipments whose buyerId equals the JWT sub. Ownership and filters are applied before pagination and
        counting, so the total does not reveal other users' shipments. Sorted by createdAt descending, then
        id. A page past the end returns 200 with data=[] and the real total. Clients have no buyerId filter.
      security:
        - bearerAuth: []
      x-required-privileges:
        - SHIPPING.VIEW_SHIPMENT
      x-required-roles: []
      x-ownership: ADMIN/SUPPORT_STAFF read everything; buyerId equal to sub, or SELLER with sellerId equal to sub.
      x-error-codes:
        '400':
          - SHIPMENT_VALIDATION_FAILED
          - SHIPMENT_INVALID_PARAMETER
        '401':
          - SHIPMENT_UNAUTHENTICATED
          - UNAUTHENTICATED
        '403':
          - SHIPMENT_FORBIDDEN
          - FORBIDDEN
        '405':
          - SHIPMENT_METHOD_NOT_ALLOWED
        '406':
          - SHIPMENT_NOT_ACCEPTABLE
        '429':
          - RATE_LIMITED
        '500':
          - SHIPMENT_INTERNAL_ERROR
          - INTERNAL_ERROR
        '503':
          - SERVICE_UNAVAILABLE
        '504':
          - GATEWAY_TIMEOUT
      parameters:
        - name: page
          in: query
          description: Page index starting at 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Maximum items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: orderId
          in: query
          description: Filter by order UUID; ownership still applies.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter by internal shipment status.
          schema:
            $ref: '#/components/schemas/ShipmentStatus'
      responses:
        '200':
          description: Visible shipments and pagination details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentListResponse'
              example:
                code: 0
                message: response success
                data: []
                page:
                  number: 0
                  size: 20
                  totalElements: 0
                  totalPages: 0
        '400':
          $ref: '#/components/responses/ShipmentBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/RoutingUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/shipments/{id}:
    get:
      tags:
        - Shipments
      operationId: getShipment
      summary: Get shipment details
      description: >-
        Requires SHIPPING.VIEW_SHIPMENT. ADMIN and SUPPORT_STAFF read every shipment; other actors read only
        shipments whose buyerId equals the JWT sub. A missing shipment and one owned by another buyer both
        return the same 404 SHIPMENT_NOT_FOUND. Commerce is not called to decide ownership.
      security:
        - bearerAuth: []
      x-required-privileges:
        - SHIPPING.VIEW_SHIPMENT
      x-required-roles: []
      x-ownership: ADMIN/SUPPORT_STAFF read everything; buyerId equal to sub, or SELLER with sellerId equal to sub.
      x-error-codes:
        '400':
          - SHIPMENT_INVALID_PARAMETER
        '401':
          - SHIPMENT_UNAUTHENTICATED
          - UNAUTHENTICATED
        '403':
          - SHIPMENT_FORBIDDEN
          - FORBIDDEN
        '404':
          - SHIPMENT_NOT_FOUND
        '405':
          - SHIPMENT_METHOD_NOT_ALLOWED
        '406':
          - SHIPMENT_NOT_ACCEPTABLE
        '429':
          - RATE_LIMITED
        '500':
          - SHIPMENT_INTERNAL_ERROR
          - INTERNAL_ERROR
        '503':
          - SERVICE_UNAVAILABLE
        '504':
          - GATEWAY_TIMEOUT
      parameters:
        - name: id
          in: path
          required: true
          description: Shipment UUID, not the order UUID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The visible shipment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentEnvelope'
              examples:
                created:
                  $ref: '#/components/examples/CreatedShipment'
                pending:
                  $ref: '#/components/examples/PendingShipment'
        '400':
          $ref: '#/components/responses/ShipmentBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShipmentNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/RoutingUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/shipments/{id}/tracking:
    get:
      tags:
        - Shipments
      operationId: getShipmentTracking
      summary: Get shipment tracking and status history
      description: >-
        Requires SHIPPING.VIEW_SHIPMENT. ADMIN and SUPPORT_STAFF read every shipment; other actors read only
        shipments whose buyerId equals the JWT sub. A missing shipment and one owned by another buyer both
        return the same 404 SHIPMENT_NOT_FOUND. Ownership is checked before the history is read. Only the
        stored shipment and shipment_history are read; the carrier is not called and no fake events are
        created. history is ordered by createdAt ascending, then id; history=[] is valid for a shipment
        without history. trackingCode=null until one is assigned. To find an order's shipment, use GET
        /api/v1/shipments?orderId={orderId}; data=[] means there is no shipment yet and the UI can hide the
        tracking block.
      security:
        - bearerAuth: []
      x-required-privileges:
        - SHIPPING.VIEW_SHIPMENT
      x-required-roles: []
      x-ownership: ADMIN/SUPPORT_STAFF read everything; buyerId equal to sub, or SELLER with sellerId equal to sub.
      x-error-codes:
        '400':
          - SHIPMENT_INVALID_PARAMETER
        '401':
          - SHIPMENT_UNAUTHENTICATED
          - UNAUTHENTICATED
        '403':
          - SHIPMENT_FORBIDDEN
          - FORBIDDEN
        '404':
          - SHIPMENT_NOT_FOUND
        '405':
          - SHIPMENT_METHOD_NOT_ALLOWED
        '406':
          - SHIPMENT_NOT_ACCEPTABLE
        '429':
          - RATE_LIMITED
        '500':
          - SHIPMENT_INTERNAL_ERROR
          - INTERNAL_ERROR
        '503':
          - SERVICE_UNAVAILABLE
        '504':
          - GATEWAY_TIMEOUT
      parameters:
        - name: id
          in: path
          required: true
          description: Shipment UUID, not the order UUID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current tracking and status history over time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentTrackingEnvelope'
              example:
                code: 0
                message: response success
                data:
                  shipmentId: 00000000-0000-4000-8000-000000000040
                  orderId: 00000000-0000-4000-8000-000000000001
                  carrier: GHN
                  trackingCode: GHN123456
                  status: IN_TRANSIT
                  history:
                    - id: 00000000-0000-4000-8000-000000000041
                      status: SHIPPED
                      description: Shipment handed to carrier
                      createdAt: '2026-11-12T08:00:00Z'
                    - id: 00000000-0000-4000-8000-000000000042
                      status: IN_TRANSIT
                      description: null
                      createdAt: '2026-11-12T09:00:00Z'
        '400':
          $ref: '#/components/responses/ShipmentBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShipmentNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/RoutingUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/carriers:
    get:
      tags:
        - Carriers
      operationId: getCarriers
      summary: List carriers
      description: >-
        Requires a valid JWT and SHIPPING.QUOTE; ADMIN does not bypass this privilege. Reads the metadata and
        circuit breaker state of the selected quoting adapter; the carrier is not probed and the database is
        not read or written. SHIPPING_QUOTE_CARRIER selects this adapter, falling back to SHIPPING_CARRIER
        when it is not configured. A carrier used only for booking is not listed. isDefault marks the default
        quoting adapter. available reflects the current breaker state: false when OPEN/FORCED_OPEN, true when
        CLOSED/HALF_OPEN or when there is no breaker. HALF_OPEN allows a trial call under the breaker policy;
        available reserves nothing and does not guarantee that GHN is up. GHN quotes with
        SHIPPING_QUOTE_CARRIER=GHN; FAKE is enabled explicitly for local/test only; quote carrier NONE returns
        an empty list even when SHIPPING_BOOKING_CARRIER is set. A GHN quote with FAKE booking lists only GHN.
        There is no automatic switch to FAKE when GHN fails. The whole list is returned in one logical page.
      security:
        - bearerAuth: []
      x-required-privileges:
        - SHIPPING.QUOTE
      x-required-roles: []
      x-ownership: Not restricted by owner.
      x-error-codes:
        '401':
          - SHIPMENT_UNAUTHENTICATED
          - UNAUTHENTICATED
        '403':
          - SHIPMENT_FORBIDDEN
          - FORBIDDEN
        '405':
          - SHIPMENT_METHOD_NOT_ALLOWED
        '406':
          - SHIPMENT_NOT_ACCEPTABLE
        '429':
          - RATE_LIMITED
        '500':
          - SHIPMENT_INTERNAL_ERROR
          - INTERNAL_ERROR
        '503':
          - SERVICE_UNAVAILABLE
        '504':
          - GATEWAY_TIMEOUT
      responses:
        '200':
          description: Results and details of one logical page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierListResponse'
              examples:
                ghn:
                  summary: GHN is the default carrier and the breaker allows a trial call
                  value:
                    code: 0
                    message: response success
                    data:
                      - code: GHN
                        name: Giao Hàng Nhanh
                        isDefault: true
                        available: true
                    page:
                      number: 0
                      size: 1
                      totalElements: 1
                      totalPages: 1
                fake:
                  summary: Simulated carrier enabled explicitly
                  value:
                    code: 0
                    message: response success
                    data:
                      - code: FAKE
                        name: Simulated carrier
                        isDefault: true
                        available: true
                    page:
                      number: 0
                      size: 1
                      totalElements: 1
                      totalPages: 1
                openBreaker:
                  summary: GHN is still the default but the breaker is open
                  value:
                    code: 0
                    message: response success
                    data:
                      - code: GHN
                        name: Giao Hàng Nhanh
                        isDefault: true
                        available: false
                    page:
                      number: 0
                      size: 1
                      totalElements: 1
                      totalPages: 1
                empty:
                  summary: No carrier configured
                  value:
                    code: 0
                    message: response success
                    data: []
                    page:
                      number: 0
                      size: 1
                      totalElements: 0
                      totalPages: 0
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/RoutingUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/carriers/performance:
    get:
      tags:
        - Carriers
      operationId: getCarrierPerformance
      summary: Measure the performance of each carrier
      description: >-
        Requires SHIPPING.VIEW_SHIPMENT and the role ADMIN or SUPPORT_STAFF. Groups the shipments created in
        [from, to), at most 366 days, by carrier. delivered counts shipments now DELIVERED; failed counts
        DELIVERY_FAILED, RETURNING or RETURNED; cancelled counts CANCELLED; inProgress is the rest.
        successRate = delivered / (delivered + failed), null when no shipment has finished.
        averageDeliveryHours runs from handover (handed_over_at, or created_at when no handover was recorded)
        to the first DELIVERED history row. onTimeRate is the share of DELIVERED shipments delivered no later
        than estimated_delivery_at, among shipments that have an estimate. A configured carrier with no
        shipments still appears with zeros. Sorted by shipment count descending, then carrier code. The whole
        list is returned in one logical page.
      security:
        - bearerAuth: []
      x-required-privileges:
        - SHIPPING.VIEW_SHIPMENT
      x-required-roles:
        - ADMIN
        - SUPPORT_STAFF
      x-ownership: Not restricted by owner.
      parameters:
        - name: from
          in: query
          required: true
          description: Start time, ISO-8601 with offset, inclusive
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: End time, ISO-8601 with offset, exclusive
          schema:
            type: string
            format: date-time
      x-error-codes:
        '400':
          - SHIPMENT_INVALID_PERIOD
          - SHIPMENT_INVALID_PARAMETER
        '401':
          - SHIPMENT_UNAUTHENTICATED
        '403':
          - SHIPMENT_FORBIDDEN
      responses:
        '200':
          description: One row per carrier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierPerformanceListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/shipping/provinces:
    get:
      tags:
        - Shipping addresses
      operationId: getShippingProvinces
      summary: List provinces and cities from the new catalog
      description: >-
        Reads /shiip/public-api/v3/master-data/province/all; parent_id=1 marks provinces and cities in
        Vietnam. No JWT is required at the gateway or shipment-service; a token that is sent but invalid is
        still rejected. Data is read through the CarrierAdapter from the two-level GHN v3 catalog after the
        administrative merger: province/city → ward/commune. Only records with status=1 and the right
        parent_id are returned. The code is the v3 catalog _id as a canonical positive integer string of at
        most 9 digits, without leading zeros. FAKE mode uses its own fixture. The whole list is returned in
        one logical page; there are no pagination parameters. Carrier credentials are used only in the
        backend. The valid catalog is cached in shipment-service for GHN_MASTER_DATA_CACHE_TTL_MS, 300000ms by
