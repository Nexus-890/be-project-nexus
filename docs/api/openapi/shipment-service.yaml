openapi: 3.0.3
info:
  title: Nexus vận chuyển
  version: 2.3.0
  description: >-
    Issue #201: danh sách nhà vận chuyển, địa giới GHN v3 hai cấp sau sáp nhập và báo giá bằng preview. Bản
    2.1 bổ sung insuranceValue tùy chọn, độc lập với subtotal của catalog; bỏ trống hoặc null tương đương 0.
    Contract từ 2.0 thay đổi không tương thích với draft ba cấp: bỏ operation districts; wards nhận
    provinceCode. Địa chỉ quote dùng line1 theo bản đối chiếu, cùng provinceCode, wardCode và các trường
    recipientName, recipientPhone đang bắt buộc trong code. serviceType public dùng STANDARD cho kiện dưới
    20.000g và HEAVY từ 20.000g. Các trường bổ sung recipient/parcel còn cần chốt với contract checkout; xem
    shipping-contract-review-201.md. Mọi phản hồi JSON thành công có code, message, data và page theo ADR-008.
    Lỗi do shipment-service phát ra có mã SHIPMENT_*; lỗi do gateway phát ra trước khi tới dịch vụ giữ mã
    chung của gateway. Bản 2.2 bổ sung #202: tạo shipment từ snapshot OrderPaid, tạo thủ công có
    Idempotency-Key và đọc shipment có kiểm tra chủ sở hữu. Bản 2.3 hoàn tất manual creation bằng snapshot
    PAID đọc trực tiếp từ commerce-service khi shipment chưa tồn tại. Fake hỗ trợ tạo tracking; GHN create thuộc
    tích hợp riêng. Snapshot thiếu dữ liệu chuẩn bị hoặc carrier chưa khả dụng giữ PENDING_TRACKING.
    Tracking retry không bổ sung dữ liệu chuẩn bị còn thiếu; #202 chưa có endpoint hoàn tất chuẩn bị.
servers:
  - url: http://localhost:8080
    description: Cổng API của hệ thống
  - url: http://localhost:8088
    description: Dịch vụ vận chuyển, dùng để kiểm tra trực tiếp
tags:
  - name: Carriers
    description: Nhà vận chuyển đã cấu hình
  - name: Shipping addresses
    description: Địa giới GHN v3 theo mô hình hai cấp
  - name: Shipping quotes
    description: Báo giá và thời gian giao hàng dự kiến
  - name: Shipments
    description: Tạo và đọc shipment của đơn đã thanh toán
paths:
  /api/v1/shipments:
    post:
      tags:
        - Shipments
      operationId: createShipment
      summary: Tạo shipment thủ công từ snapshot đơn đã thanh toán
      description: >-
        Yêu cầu SHIPPING.CREATE_SHIPMENT và một trong hai vai trò ADMIN hoặc SUPPORT_STAFF. Buyer có
        privilege tạo nhưng thiếu vai trò vận hành vẫn bị từ chối 403. Nguồn buyerId, shippingFee và
        shippingInfo lấy từ đơn đã thanh toán, không nhận các trường này từ client và không đọc commerce_db.
        Khi chưa có shipment, gọi trực tiếp GET /internal/v1/orders/{id}/shipping-snapshot của commerce bằng
        bearer của caller, có timeout và circuit breaker. Chỉ đơn PAID có snapshot hợp lệ được tạo. Đơn
        không tồn tại trả 404 SHIPMENT_ORDER_NOT_FOUND; chưa PAID trả 409 SHIPMENT_ORDER_NOT_PAID; upstream
        không khả dụng trả 503 SHIPMENT_COMMERCE_UNAVAILABLE; snapshot sai trả 502 SHIPMENT_INVALID_ORDER_SNAPSHOT.
        warehouseId, carrier và serviceType tùy chọn được dùng để chọn dispatch cho shipment mới. Kho và
        pickup phải có nguồn tin cậy; không dùng pickup cũ cho kho khác. Bỏ trống dùng lựa chọn tin cậy của
        đơn hoặc cấu hình shipping. Khi shipment đã tồn tại, các giá trị nếu gửi phải khớp lựa chọn đã lưu;
        không đổi carrier/service/kho sau khi có request identity. Khác lựa chọn trả 409 SHIPMENT_IDEMPOTENCY_CONFLICT.
        Mỗi order chỉ có một shipment. Cùng Idempotency-Key và cùng yêu cầu trả lại shipment đã tạo;
        tái dùng khóa cho yêu cầu khác hoặc lựa chọn xung đột với shipment hiện có trả 409. Key đầu tiên
        được lưu trên shipment cùng fingerprint nội dung request; một key khác cho shipment đã gắn key
        cũng trả 409 SHIPMENT_IDEMPOTENCY_CONFLICT.
        Phản hồi thành công luôn là 201 với Location của shipment. Carrier tạm lỗi hoặc thiếu dữ liệu
        chuẩn bị giữ shipment PENDING_TRACKING với trackingCode=null; job retry dùng shipment.id làm
        request identity ổn định. Manual transaction ghi shipment/history/outbox trước khi gọi carrier;
        consumer OrderPaid còn ghi processed marker trong cùng transaction. Hai đường tạo dùng cùng khóa
        order và unique order_id, nên chạy đồng thời vẫn chỉ có một shipment và một creation event.
        ShipmentCreated ghi nhận creation PENDING_TRACKING, trackingCode=null;
        GET phản ánh tracking được bổ sung sau, không ghi thêm ShipmentCreated.
        Retry không thể tự cấp parcel/pickup còn thiếu và #202 chưa có endpoint bổ sung dữ liệu chuẩn bị.
      security:
        - bearerAuth: []
      x-required-privileges:
        - SHIPPING.CREATE_SHIPMENT
      x-required-roles:
        - ADMIN
        - SUPPORT_STAFF
      x-ownership: >-
        Chỉ ADMIN hoặc SUPPORT_STAFF có privilege tạo được thao tác trên đơn; buyerId luôn lấy từ
        snapshot tin cậy, không phải danh tính do client gửi. x-required-roles ở operation này là ANY-of.
      x-error-codes:
        '400':
          - SHIPMENT_IDEMPOTENCY_KEY_REQUIRED
          - SHIPMENT_VALIDATION_FAILED
          - SHIPMENT_INVALID_REQUEST_BODY
          - SHIPMENT_INVALID_PARAMETER
        '401':
          - SHIPMENT_UNAUTHENTICATED
          - UNAUTHENTICATED
        '403':
          - SHIPMENT_FORBIDDEN
          - FORBIDDEN
        '404':
          - SHIPMENT_ORDER_NOT_FOUND
          - SHIPMENT_WAREHOUSE_NOT_FOUND
        '405':
          - SHIPMENT_METHOD_NOT_ALLOWED
        '406':
          - SHIPMENT_NOT_ACCEPTABLE
        '409':
          - SHIPMENT_IDEMPOTENCY_CONFLICT
          - SHIPMENT_ORDER_NOT_PAID
        '415':
          - SHIPMENT_UNSUPPORTED_MEDIA_TYPE
        '422':
          - SHIPMENT_NO_SERVICE
        '429':
          - RATE_LIMITED
        '500':
          - SHIPMENT_INTERNAL_ERROR
          - INTERNAL_ERROR
        '502':
          - SHIPMENT_INVALID_ORDER_SNAPSHOT
        '503':
          - SHIPMENT_COMMERCE_UNAVAILABLE
          - SERVICE_UNAVAILABLE
        '504':
          - GATEWAY_TIMEOUT
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Khóa ổn định cho cùng yêu cầu tạo; không tái dùng cho nội dung khác.
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '\S'
          example: manual-order-0001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
            example:
              orderId: 00000000-0000-4000-8000-000000000001
      responses:
        '201':
          description: Shipment mới hoặc kết quả của yêu cầu idempotent đã xử lý.
          headers:
            Location:
              description: Đường dẫn đọc shipment đã tạo.
              schema:
                type: string
                format: uri-reference
              example: /api/v1/shipments/00000000-0000-4000-8000-000000000040
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentEnvelope'
              examples:
                created:
                  $ref: '#/components/examples/CreatedShipment'
                pending:
                  $ref: '#/components/examples/PendingShipment'
        '400':
          $ref: '#/components/responses/ShipmentBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ManualOrderNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/ShipmentConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/NoService'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/InvalidOrderSnapshot'
        '503':
          $ref: '#/components/responses/CommerceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    get:
      tags:
        - Shipments
      operationId: listShipments
      summary: Đọc danh sách shipment có phân trang
      description: >-
        Yêu cầu SHIPPING.VIEW_SHIPMENT. ADMIN và SUPPORT_STAFF đọc mọi shipment; các actor khác chỉ đọc shipment
        có buyerId bằng sub của JWT. Điều kiện chủ sở hữu và bộ lọc được áp dụng trước khi phân trang và
        đếm tổng, nên tổng không tiết lộ shipment của người khác. Sắp xếp createdAt giảm dần, sau đó id.
        Trang vượt cuối trả 200 với data=[] và tổng thực tế. Không có bộ lọc buyerId cho client.
      security:
        - bearerAuth: []
      x-required-privileges:
        - SHIPPING.VIEW_SHIPMENT
      x-required-roles: []
      x-ownership: ADMIN/SUPPORT_STAFF đọc tất cả; các actor khác chỉ đọc buyerId bằng sub của JWT.
      x-error-codes:
        '400':
          - SHIPMENT_VALIDATION_FAILED
          - SHIPMENT_INVALID_PARAMETER
        '401':
          - SHIPMENT_UNAUTHENTICATED
          - UNAUTHENTICATED
        '403':
          - SHIPMENT_FORBIDDEN
          - FORBIDDEN
        '405':
          - SHIPMENT_METHOD_NOT_ALLOWED
        '406':
          - SHIPMENT_NOT_ACCEPTABLE
        '429':
          - RATE_LIMITED
        '500':
          - SHIPMENT_INTERNAL_ERROR
          - INTERNAL_ERROR
        '503':
          - SERVICE_UNAVAILABLE
        '504':
          - GATEWAY_TIMEOUT
      parameters:
        - name: page
          in: query
          description: Chỉ số trang bắt đầu từ 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Số phần tử tối đa mỗi trang.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: orderId
          in: query
          description: Lọc theo UUID đơn; vẫn áp dụng quyền sở hữu.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Lọc theo trạng thái shipment nội bộ.
          schema:
            $ref: '#/components/schemas/ShipmentStatus'
      responses:
        '200':
          description: Shipment nhìn thấy được và thông tin phân trang.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentListResponse'
              example:
                code: 0
                message: response success
                data: []
                page:
                  number: 0
                  size: 20
                  totalElements: 0
                  totalPages: 0
        '400':
          $ref: '#/components/responses/ShipmentBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/RoutingUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/shipments/{id}:
    get:
      tags:
        - Shipments
      operationId: getShipment
      summary: Đọc chi tiết shipment
      description: >-
        Yêu cầu SHIPPING.VIEW_SHIPMENT. ADMIN và SUPPORT_STAFF đọc mọi shipment; các actor khác chỉ đọc shipment
        có buyerId bằng sub của JWT. Shipment không tồn tại hoặc thuộc buyer khác đều trả cùng 404
        SHIPMENT_NOT_FOUND. Không gọi commerce để quyết định quyền sở hữu.
      security:
        - bearerAuth: []
      x-required-privileges:
        - SHIPPING.VIEW_SHIPMENT
      x-required-roles: []
      x-ownership: ADMIN/SUPPORT_STAFF đọc tất cả; các actor khác chỉ đọc buyerId bằng sub của JWT.
      x-error-codes:
        '400':
          - SHIPMENT_INVALID_PARAMETER
        '401':
          - SHIPMENT_UNAUTHENTICATED
          - UNAUTHENTICATED
        '403':
          - SHIPMENT_FORBIDDEN
          - FORBIDDEN
        '404':
          - SHIPMENT_NOT_FOUND
        '405':
          - SHIPMENT_METHOD_NOT_ALLOWED
        '406':
          - SHIPMENT_NOT_ACCEPTABLE
        '429':
          - RATE_LIMITED
        '500':
          - SHIPMENT_INTERNAL_ERROR
          - INTERNAL_ERROR
        '503':
          - SERVICE_UNAVAILABLE
        '504':
          - GATEWAY_TIMEOUT
      parameters:
        - name: id
          in: path
          required: true
          description: UUID shipment, không phải UUID order.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Shipment nhìn thấy được.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentEnvelope'
              examples:
                created:
                  $ref: '#/components/examples/CreatedShipment'
                pending:
                  $ref: '#/components/examples/PendingShipment'
        '400':
          $ref: '#/components/responses/ShipmentBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShipmentNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/RoutingUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/carriers:
    get:
      tags:
        - Carriers
      operationId: getCarriers
      summary: Lấy danh sách nhà vận chuyển
      description: >-
        Yêu cầu JWT hợp lệ và quyền SHIPPING.QUOTE; ADMIN không tự bỏ qua quyền này. Đọc metadata và trạng
        thái circuit breaker của các adapter đã đăng ký, không gọi thử nhà vận chuyển hoặc đọc/ghi cơ sở dữ
        liệu. isDefault xác định adapter mặc định trong registry. available phản ánh trạng thái breaker hiện
        tại: false khi OPEN/FORCED_OPEN, true khi CLOSED/HALF_OPEN hoặc chưa có breaker. HALF_OPEN cho phép
        một lượt thử theo chính sách breaker; available không giữ chỗ và không bảo đảm GHN đang hoạt động. GHN
        được bật bằng SHIPPING_CARRIER=GHN, FAKE chỉ bật tường minh cho local/test; NONE trả danh sách rỗng.
        Không tự chuyển sang FAKE khi GHN lỗi. Trả toàn bộ danh sách trong một trang logic.
      security:
        - bearerAuth: []
      x-required-privileges:
        - SHIPPING.QUOTE
      x-required-roles: []
      x-ownership: Không giới hạn theo chủ sở hữu.
      x-error-codes:
        '401':
          - SHIPMENT_UNAUTHENTICATED
          - UNAUTHENTICATED
        '403':
          - SHIPMENT_FORBIDDEN
          - FORBIDDEN
        '405':
          - SHIPMENT_METHOD_NOT_ALLOWED
        '406':
          - SHIPMENT_NOT_ACCEPTABLE
        '429':
          - RATE_LIMITED
        '500':
          - SHIPMENT_INTERNAL_ERROR
          - INTERNAL_ERROR
        '503':
          - SERVICE_UNAVAILABLE
        '504':
          - GATEWAY_TIMEOUT
      responses:
        '200':
          description: Danh sách kết quả và thông tin một trang logic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierListResponse'
              examples:
                ghn:
                  summary: GHN là carrier mặc định, breaker cho phép thử gọi
                  value:
                    code: 0
                    message: response success
                    data:
                      - code: GHN
                        name: Giao Hàng Nhanh
                        isDefault: true
                        available: true
                    page:
                      number: 0
                      size: 1
                      totalElements: 1
                      totalPages: 1
                fake:
                  summary: Bật giả lập tường minh
                  value:
                    code: 0
                    message: response success
                    data:
                      - code: FAKE
                        name: Nhà vận chuyển giả lập
                        isDefault: true
                        available: true
                    page:
                      number: 0
                      size: 1
                      totalElements: 1
                      totalPages: 1
                openBreaker:
                  summary: GHN vẫn là mặc định nhưng breaker đang mở
                  value:
                    code: 0
                    message: response success
                    data:
                      - code: GHN
                        name: Giao Hàng Nhanh
                        isDefault: true
                        available: false
                    page:
                      number: 0
                      size: 1
                      totalElements: 1
                      totalPages: 1
                empty:
                  summary: Chưa cấu hình nhà vận chuyển
                  value:
                    code: 0
                    message: response success
                    data: []
                    page:
                      number: 0
                      size: 1
                      totalElements: 0
                      totalPages: 0
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/RoutingUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/shipping/provinces:
    get:
      tags:
        - Shipping addresses
      operationId: getShippingProvinces
      summary: Lấy tỉnh/thành phố theo danh mục mới
      description: >-
        Đọc /shiip/public-api/v3/master-data/province/all; parent_id=1 xác định tỉnh/thành phố thuộc Việt Nam.
        Không yêu cầu JWT tại gateway hoặc shipment-service; token được gửi kèm nhưng không hợp lệ vẫn bị từ
        chối. Dữ liệu đọc qua CarrierAdapter theo danh mục GHN v3 hai cấp sau sáp nhập: tỉnh/thành phố →
        phường/xã. Chỉ trả bản ghi status=1 và đúng parent_id. Code là _id của danh mục v3 được biểu diễn bằng
        chuỗi số nguyên dương chuẩn, tối đa 9 chữ số; không có số 0 ở đầu. Chế độ FAKE dùng fixture riêng. Trả
        toàn bộ danh sách trong một trang logic; không có tham số phân trang. Thông tin xác thực nhà vận
        chuyển chỉ được dùng ở backend.
        Danh mục hợp lệ được cache trong shipment-service theo GHN_MASTER_DATA_CACHE_TTL_MS, mặc định
        300000ms. Chỉ cache kết quả đã validate/lọc active; hết TTL tải lại, lỗi không được cache và không
        dùng lại bản đã hết hạn.
      security: []
      x-required-privileges: []
      x-error-codes:
        '401':
          - SHIPMENT_UNAUTHENTICATED
          - UNAUTHENTICATED
        '405':
          - SHIPMENT_METHOD_NOT_ALLOWED
        '406':
          - SHIPMENT_NOT_ACCEPTABLE
        '429':
          - RATE_LIMITED
        '500':
          - SHIPMENT_INTERNAL_ERROR
          - INTERNAL_ERROR
        '502':
          - SHIPMENT_INVALID_CARRIER_RESPONSE
        '503':
          - SHIPMENT_CARRIER_UNAVAILABLE
          - SHIPMENT_CIRCUIT_OPEN
          - SHIPMENT_CARRIER_CONFIGURATION_ERROR
          - SERVICE_UNAVAILABLE
        '504':
          - GATEWAY_TIMEOUT
      responses:
        '200':
          description: Danh sách kết quả và thông tin một trang logic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalityListResponse'
              examples:
                populated:
                  summary: Ví dụ mã địa giới
                  value:
                    code: 0
                    message: response success
                    data:
                      - code: '1000001'
                        name: Hồ Chí Minh
                    page:
                      number: 0
                      size: 1
                      totalElements: 1
                      totalPages: 1
                empty:
                  summary: Danh sách không có phần tử
                  value:
                    code: 0
                    message: response success
                    data: []
                    page:
                      number: 0
                      size: 1
                      totalElements: 0
                      totalPages: 0
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/CarrierBadUpstream'
        '503':
          $ref: '#/components/responses/CarrierUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/shipping/wards:
    get:
      tags:
        - Shipping addresses
      operationId: getShippingWards
      summary: Lấy phường/xã thuộc một tỉnh/thành phố
      description: >-
        Đọc /shiip/public-api/v3/master-data/ward/all-by-province-id; chỉ trả phường/xã có parent_id trùng
        provinceCode. Tên chuẩn của địa giới được dùng nguyên văn khi báo giá. Không yêu cầu JWT tại gateway
        hoặc shipment-service; token được gửi kèm nhưng không hợp lệ vẫn bị từ chối. Dữ liệu đọc qua
        CarrierAdapter theo danh mục GHN v3 hai cấp sau sáp nhập: tỉnh/thành phố → phường/xã. Chỉ trả bản ghi
        status=1 và đúng parent_id. Code là _id của danh mục v3 được biểu diễn bằng chuỗi số nguyên dương
        chuẩn, tối đa 9 chữ số; không có số 0 ở đầu. Chế độ FAKE dùng fixture riêng. Trả toàn bộ danh sách
        trong một trang logic; không có tham số phân trang. Thông tin xác thực nhà vận chuyển chỉ được dùng ở
        backend.
        Danh mục hợp lệ được cache theo provinceCode trong GHN_MASTER_DATA_CACHE_TTL_MS, mặc định300000ms.
        Hết TTL tải lại; lỗi không cache và không fallback sang danh sách đã hết hạn.
      security: []
      parameters:
        - name: provinceCode
          in: query
          required: true
          description: Mã _id tỉnh/thành phố từ danh mục GHN v3; không dùng mã tỉnh của hệ ba cấp.
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,8}$
            minLength: 1
            maxLength: 9
          example: '1000001'
      x-required-privileges: []
      x-error-codes:
        '400':
          - SHIPMENT_INVALID_PARAMETER
          - SHIPMENT_VALIDATION_FAILED
          - SHIPMENT_INVALID_ADDRESS
        '401':
          - SHIPMENT_UNAUTHENTICATED
          - UNAUTHENTICATED
        '405':
          - SHIPMENT_METHOD_NOT_ALLOWED
        '406':
          - SHIPMENT_NOT_ACCEPTABLE
        '429':
          - RATE_LIMITED
        '500':
          - SHIPMENT_INTERNAL_ERROR
          - INTERNAL_ERROR
        '502':
          - SHIPMENT_INVALID_CARRIER_RESPONSE
        '503':
          - SHIPMENT_CARRIER_UNAVAILABLE
          - SHIPMENT_CIRCUIT_OPEN
          - SHIPMENT_CARRIER_CONFIGURATION_ERROR
          - SERVICE_UNAVAILABLE
        '504':
          - GATEWAY_TIMEOUT
      responses:
        '200':
          description: Danh sách kết quả và thông tin một trang logic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalityListResponse'
              examples:
                populated:
                  summary: Ví dụ mã địa giới
                  value:
                    code: 0
                    message: response success
                    data:
                      - code: '1003646'
                        name: Phường Vũng Tàu
                    page:
                      number: 0
                      size: 1
                      totalElements: 1
                      totalPages: 1
                empty:
                  summary: Danh sách không có phần tử
                  value:
                    code: 0
                    message: response success
                    data: []
                    page:
                      number: 0
                      size: 1
                      totalElements: 0
                      totalPages: 0
        '400':
          description: >-
            Thiếu, rỗng, sai định dạng hoặc không tồn tại provinceCode. GHN trả data=null cho province_id
            không hợp lệ cũng được đổi thành lỗi địa giới 400.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                missingParent:
                  summary: Thiếu provinceCode
                  value:
                    type: urn:problem:invalid-parameter
                    title: Bad Request
                    status: 400
                    detail: Tham số yêu cầu không hợp lệ
                    instance: /api/v1/shipping/wards
                    code: SHIPMENT_INVALID_PARAMETER
                    errors:
                      - field: provinceCode
                        code: INVALID_PARAMETER
                        detail: A valid value is required
                invalidParent:
                  summary: Mã tỉnh/thành phố không hợp lệ
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: Mã địa giới không tồn tại hoặc không đúng quan hệ cha con
                    instance: /api/v1/shipping/wards
                    code: SHIPMENT_INVALID_ADDRESS
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/CarrierBadUpstream'
        '503':
          $ref: '#/components/responses/CarrierUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/shipping/quotes:
    post:
      tags:
        - Shipping quotes
      operationId: getShippingQuotes
      summary: Báo giá vận chuyển và ngày giao hàng dự kiến
      description: >-
        Yêu cầu JWT hợp lệ và quyền SHIPPING.QUOTE; ADMIN không tự bỏ qua quyền. Địa chỉ nhận và pickup dùng
        mã _id GHN v3 hai cấp, được kiểm tra tỉnh → phường đang hoạt động. Tên chuẩn được resolve từ danh mục
        v3 rồi gửi POST /shiip/public-api/v2/shipping-order/preview với is_new_to_address=true và
        is_new_from_address=true; endpoint preview hiện do GHN công bố tại path v2 nhưng hỗ trợ mô hình địa
        chỉ mới. Người nhận phải có tên, số điện thoại và địa chỉ thật; pickup phải có địa chỉ cụ thể đã xác
        minh. Preview chỉ chạy thử, không tạo vận đơn: order_code phải rỗng; fee lấy từ total_fee, ETA từ
        expected_delivery_time. GHN_PAYMENT_TYPE_ID cấu hình bên trả phí, mặc định 1 là shop trả trong luồng
        trả trước SEPAY; GHN_REQUIRED_NOTE cấu hình chính sách kiểm hàng, mặc định KHONGCHOXEMHANG. cod_amount
        gửi bằng 0 vì luồng hiện tại không thu hộ. Tên và số điện thoại người gửi không gửi riêng sẽ theo hồ
        sơ ShopId được GHN công bố. Items cung cấp số lượng đơn vị và số SKU để tóm tắt nội dung; parcel là
        một kiện đã đóng gói. Khi GHN cần items theo kiện, quantity=1 là số kiện, không phải số đơn vị SKU.
        InsuranceValue là giá trị khai bảo hiểm tùy chọn: VND nguyên từ 0 đến 5.000.000, bỏ trống hoặc null
        gửi 0; không tự lấy subtotal, không cắt ngưỡng hoặc làm tròn. WarehouseId ánh xạ tới pickup được cấu
        hình; bỏ trống dùng defaultWarehouseId cho WH_001. Subtotal miễn phí lấy toàn bộ giá SKU hiện tại nhân
        số lượng từ catalog, độc lập insuranceValue. Subtotal lớn hơn hoặc bằng FREE_SHIPPING_THRESHOLD cho
        fee=0 sau khi có preview và ETA hợp lệ. SHIPPING_API_TIMEOUT_MS là ngân sách toàn bộ thao tác gồm
        lookup và retries. SHIPPING_RETRY_LIMIT là số retry tối đa sau lần đầu, chỉ dành cho lỗi tạm thời.
        Mỗi HTTP attempt GHN dùng min(GHN_HTTP_TIMEOUT_MS, deadline còn lại), mặc định GHN_HTTP_TIMEOUT_MS
        là1500ms; không chia deadline tổng theo số retries và không bảo đảm mọi retry đều được chạy.
        Danh mục province/wards hợp lệ có cache TTL mặc định5phút; phí preview, ETA và giá catalog không cache.
        Breaker theo carrier từ chối nhanh bằng 503 khi mở. Không tạo order, reservation hoặc dữ liệu shipment
        và không fallback sang FAKE.
      security:
        - bearerAuth: []
      x-required-privileges:
        - SHIPPING.QUOTE
      x-required-roles: []
      x-ownership: Báo giá chỉ đọc; SKU và giá được xác minh qua catalog.
      x-error-codes:
        '400':
          - SHIPMENT_INVALID_REQUEST
          - SHIPMENT_VALIDATION_FAILED
          - SHIPMENT_INVALID_REQUEST_BODY
          - SHIPMENT_INVALID_PARAMETER
          - SHIPMENT_INVALID_ADDRESS
        '401':
          - SHIPMENT_UNAUTHENTICATED
          - UNAUTHENTICATED
        '403':
          - SHIPMENT_FORBIDDEN
          - FORBIDDEN
        '404':
          - SHIPMENT_WAREHOUSE_NOT_FOUND
          - SHIPMENT_SKU_NOT_FOUND
        '405':
          - SHIPMENT_METHOD_NOT_ALLOWED
        '406':
          - SHIPMENT_NOT_ACCEPTABLE
        '415':
          - SHIPMENT_UNSUPPORTED_MEDIA_TYPE
        '422':
          - SHIPMENT_NO_SERVICE
        '429':
          - RATE_LIMITED
        '500':
          - SHIPMENT_INTERNAL_ERROR
          - INTERNAL_ERROR
        '502':
          - SHIPMENT_INVALID_CARRIER_RESPONSE
          - SHIPMENT_INVALID_CATALOG_RESPONSE
        '503':
          - SHIPMENT_CARRIER_UNAVAILABLE
          - SHIPMENT_CIRCUIT_OPEN
          - SHIPMENT_CARRIER_CONFIGURATION_ERROR
          - SHIPMENT_CATALOG_UNAVAILABLE
          - SERVICE_UNAVAILABLE
        '504':
          - GATEWAY_TIMEOUT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingQuoteRequest'
            example:
              toAddress:
                provinceCode: '1000001'
                wardCode: '1003646'
                line1: Địa chỉ giao hàng đã xác minh
                recipientName: Nguyễn Văn A
                recipientPhone: '0901234567'
              items:
                - skuId: 11111111-1111-4111-8111-111111111111
                  quantity: 1
              parcel:
                weightGrams: 1200
                lengthCm: 30
                widthCm: 20
                heightCm: 15
              warehouseId: 22222222-2222-4222-8222-222222222222
              insuranceValue: 200000
      responses:
        '200':
          description: Danh sách kết quả và thông tin một trang logic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingQuoteListResponse'
              examples:
                standard:
                  summary: Báo giá GHN cho kiện dưới 20.000g
                  value:
                    code: 0
