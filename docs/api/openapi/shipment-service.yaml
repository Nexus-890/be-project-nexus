  securitySchemes:
    carrierCallbackSignature:
      type: apiKey
      in: header
      name: X-Carrier-Signature
      description: >-
        Callback secret configured as a custom carrier header. Compared in constant time and fails closed when
        the secret is missing; it is not a GHN-issued HMAC of the body.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ShipmentMutationConflict:
      description: Invalid transition, or the carrier rejected cancelling the booking before pickup.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status:
                    type: integer
