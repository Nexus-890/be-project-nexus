            instance: /api/v1/shipments
            code: SHIPMENT_COMMERCE_UNAVAILABLE
    ShipmentConflict:
      description: >-
        Khóa idempotency đã dùng cho yêu cầu khác, shipment đã gắn key khác, lựa chọn khác với shipment
        hiện có, hoặc commerce xác nhận đơn chưa PAID. Không tạo shipment bằng dữ liệu buyer/address
