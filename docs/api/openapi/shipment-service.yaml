          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/ShipmentMutationConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/CarrierBadUpstream'
        '503':
          $ref: '#/components/responses/CarrierUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/webhooks/carriers/{carrier}:
    post:
      tags:
        - Carriers
      operationId: receiveCarrierWebhook
      summary: Receive a carrier status callback
      description: >-
        A carrier protocol endpoint marked @ProtocolResponse; HTTP 200 keeps its own acknowledgement body and
        is not wrapped in ApiResponse. GHN supports a custom header in its portal; set X-Carrier-Signature to
        the adapter's callback secret. The value is compared in constant time before the payload is parsed and
        before any write. This is a callback token sent in a header, not a claim that GHN signs the body with
        an HMAC. A missing or wrong token, or a secret that is not configured, returns 401 Problem Details and
        changes nothing. A duplicate webhook is accepted with 200 without repeating history or events; an
        older event never reverses the status. GHN OrderCode identifies the shipment by carrier/trackingCode;
        the callback identity is a stable hash of OrderCode, Type, Status and Time. The same status is a
        no-op. Each valid change writes exactly one history row and one Shipment* outbox event. GHN uses
        GHN_WEBHOOK_SECRET. Fake uses FAKE_WEBHOOK_SECRET with the same callback shape, but needs no ShopID
        and its Status is the internal enum. Status is part of the identity so two different statuses with the
        same timestamp stay distinct; a change to Reason or to the JSON formatting does not create a new
        identity.
      security:
        - carrierCallbackSignature: []
      x-required-privileges: []
      x-required-roles: []
      x-ownership: Authenticated with the per-carrier callback secret; a buyer JWT is not used to confirm callbacks.
      x-error-codes:
        '400':
          - SHIPMENT_UNSUPPORTED_CARRIER
          - SHIPMENT_INVALID_WEBHOOK
          - SHIPMENT_INVALID_REQUEST_BODY
          - SHIPMENT_INVALID_PARAMETER
        '401':
          - SHIPMENT_INVALID_SIGNATURE
        '404':
          - SHIPMENT_NOT_FOUND
        '405':
          - SHIPMENT_METHOD_NOT_ALLOWED
        '406':
          - SHIPMENT_NOT_ACCEPTABLE
        '409':
          - SHIPMENT_INVALID_TRANSITION
        '415':
          - SHIPMENT_UNSUPPORTED_MEDIA_TYPE
        '422':
          - SHIPMENT_INVALID_CARRIER_STATUS
        '429':
          - RATE_LIMITED
        '500':
          - SHIPMENT_INTERNAL_ERROR
          - INTERNAL_ERROR
        '503':
          - SERVICE_UNAVAILABLE
        '504':
          - GATEWAY_TIMEOUT
      parameters:
        - name: carrier
          in: path
          required: true
          description: Carrier namespace; GHN sends OrderCode/Status/Type/Time callbacks.
          schema:
            type: string
            minLength: 1
            maxLength: 40
          example: ghn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/GhnStatusWebhook'
                - $ref: '#/components/schemas/FakeStatusWebhook'
            examples:
              ghn:
                summary: GHN callback with a ShopID matching the configuration
                value:
                  ShopID: 123456
                  OrderCode: GHN-12345
                  Type: switch_status
                  Status: transporting
                  Time: '2026-11-11T10:00:00Z'
                  Reason: ''
              fake:
                summary: Fake callback with its own secret and the internal enum
                value:
                  OrderCode: FAKE-0001
                  Type: switch_status
                  Status: IN_TRANSIT
                  Time: '2026-11-11T10:00:00Z'
      responses:
        '200':
          description: Callback processed, same status, or a redelivery that was already received.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierWebhookAcknowledgement'
              example:
                code: 200
                message: Success
        '400':
          $ref: '#/components/responses/CarrierWebhookBadRequest'
        '401':
          $ref: '#/components/responses/InvalidCarrierSignature'
        '404':
          $ref: '#/components/responses/ShipmentNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/InvalidShipmentTransition'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidCarrierStatus'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/RoutingUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
