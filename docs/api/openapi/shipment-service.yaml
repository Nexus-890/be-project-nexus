        ward/commune. Only records with status=1 and the right parent_id are returned. The code is the v3
        catalog _id as a canonical positive integer string of at most 9 digits, without leading zeros. FAKE
        mode uses its own fixture. The whole list is returned in one logical page; there are no pagination
        parameters. Carrier credentials are used only in the backend. The valid catalog is cached per
