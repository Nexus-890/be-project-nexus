            type: urn:problem:domain-error
            title: Service Unavailable
            status: 503
            detail: The order service is unavailable
            instance: /api/v1/shipments
            code: SHIPMENT_COMMERCE_UNAVAILABLE
    ShipmentConflict:
      description: >-
        The idempotency key was used for another request, the shipment already has another key, a choice
        differs from the existing shipment, or commerce confirms the order is not PAID. A shipment is never
        created from buyer or address data the client declares.
