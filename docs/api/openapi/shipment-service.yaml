      summary: List the wards of a province or city
      description: >-
        Reads /shiip/public-api/v3/master-data/ward/all-by-province-id; returns only wards whose parent_id
        equals provinceCode. The canonical locality name is used as is in quotes. No JWT is required at the
        gateway or shipment-service; a token that is sent but invalid is still rejected. Data is read through
