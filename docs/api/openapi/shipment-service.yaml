  /api/v1/shipping/quotes:
    post:
      tags:
        - Shipping quotes
      operationId: getShippingQuotes
      summary: Shipping quotes and estimated delivery dates
      description: >-
        Requires a valid JWT and SHIPPING.QUOTE; ADMIN does not bypass the privilege. The delivery and pickup
        addresses use two-level GHN v3 _id codes and are checked as an active province → ward. Canonical names
        are resolved from the v3 catalog, then POST /shiip/public-api/v2/shipping-order/preview is sent with
        is_new_to_address=true and is_new_from_address=true; GHN publishes the preview endpoint under the v2
        path, but it supports the new address model. The recipient needs a real name, phone number and
        address; the pickup needs a verified street address. Preview is a dry run and creates no order:
        order_code must be empty; the fee comes from total_fee and the ETA from expected_delivery_time.
        GHN_PAYMENT_TYPE_ID sets who pays the fee, default 1 meaning the shop pays in the SEPAY prepaid flow;
        GHN_REQUIRED_NOTE sets the inspection policy, default KHONGCHOXEMHANG. cod_amount is sent as 0 because
        the current flow collects no cash on delivery. A sender name and phone that are not sent follow the
        ShopId profile published by GHN. Items give the unit count and the SKU count for the content summary;
        parcel is one packed parcel. When GHN needs items per parcel, quantity=1 is the parcel count, not the
        SKU unit count. When SHIPPING_CHECKOUT_CARRIERS is set (for example FAKE), each enabled carrier (the
        quote carrier first, then the listed carriers) is quoted separately; a failing carrier is skipped, and
        an error is returned only when every carrier fails. The list is sorted by SHIPPING_CARRIER_STRATEGY
        (CHEAPEST: fee then delivery date; FASTEST: delivery date then fee) and the first item has
        recommended=true. Without this variable only the quote carrier answers. InsuranceValue is the optional
        declared insurance value: whole VND from 0 to 5,000,000; empty or null sends 0; the subtotal is never
        used in its place and the value is never capped or rounded. WarehouseId maps to a configured pickup;
        empty uses defaultWarehouseId for WH_001. The free-shipping subtotal is the current SKU price times
        quantity from the catalog, independent of insuranceValue. A subtotal greater than or equal to
        FREE_SHIPPING_THRESHOLD gives fee=0 once the preview and ETA are valid, unless
        applyFreeShipping=false. This optional flag defaults to true when empty or null. Commerce sends false
        for auction orders to get the raw carrier fee, then applies free shipping on the fixed winning bid;
        the request cannot supply a replacement price or subtotal. SHIPPING_API_TIMEOUT_MS is the budget for
        the whole operation, including lookups and retries. SHIPPING_RETRY_LIMIT is the maximum number of
        retries after the first attempt, for transient errors only. Each GHN HTTP attempt uses
        min(GHN_HTTP_TIMEOUT_MS, remaining deadline), with GHN_HTTP_TIMEOUT_MS 1500ms by default; the total
        deadline is not split by the retry count and every retry is not guaranteed to run. The valid
        province/ward catalog is cached for 5 minutes by default; the preview fee, ETA and catalog prices are
        not cached. The per-carrier breaker fails fast with 503 when open. No order, reservation or shipment
        data is created and there is no fallback to FAKE.
      security:
        - bearerAuth: []
      x-required-privileges:
        - SHIPPING.QUOTE
      x-required-roles: []
      x-ownership: Quotes are read-only; SKUs and prices are verified through the catalog.
      x-error-codes:
        '400':
          - SHIPMENT_INVALID_REQUEST
          - SHIPMENT_VALIDATION_FAILED
          - SHIPMENT_INVALID_REQUEST_BODY
          - SHIPMENT_INVALID_PARAMETER
          - SHIPMENT_INVALID_ADDRESS
        '401':
          - SHIPMENT_UNAUTHENTICATED
          - UNAUTHENTICATED
        '403':
          - SHIPMENT_FORBIDDEN
          - FORBIDDEN
        '404':
          - SHIPMENT_WAREHOUSE_NOT_FOUND
          - SHIPMENT_SKU_NOT_FOUND
        '405':
          - SHIPMENT_METHOD_NOT_ALLOWED
        '406':
          - SHIPMENT_NOT_ACCEPTABLE
        '415':
          - SHIPMENT_UNSUPPORTED_MEDIA_TYPE
        '422':
          - SHIPMENT_NO_SERVICE
        '429':
          - RATE_LIMITED
        '500':
          - SHIPMENT_INTERNAL_ERROR
          - INTERNAL_ERROR
        '502':
          - SHIPMENT_INVALID_CARRIER_RESPONSE
          - SHIPMENT_INVALID_CATALOG_RESPONSE
        '503':
          - SHIPMENT_CARRIER_UNAVAILABLE
          - SHIPMENT_CIRCUIT_OPEN
          - SHIPMENT_CARRIER_CONFIGURATION_ERROR
          - SHIPMENT_CATALOG_UNAVAILABLE
          - SERVICE_UNAVAILABLE
        '504':
          - GATEWAY_TIMEOUT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingQuoteRequest'
            example:
              toAddress:
                provinceCode: '1000001'
                wardCode: '1003646'
                line1: Verified delivery address
                recipientName: Nguyễn Văn A
                recipientPhone: '0901234567'
              items:
                - skuId: 11111111-1111-4111-8111-111111111111
                  quantity: 1
              parcel:
                weightGrams: 1200
                lengthCm: 30
                widthCm: 20
                heightCm: 15
              warehouseId: 22222222-2222-4222-8222-222222222222
              insuranceValue: 200000
      responses:
        '200':
          description: Results and details of one logical page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingQuoteListResponse'
              examples:
                standard:
                  summary: GHN quote for a parcel under 20,000g
                  value:
                    code: 0
                    message: response success
                    data:
                      - carrier: GHN
                        serviceType: STANDARD
                        fee: 35000
                        estimatedDeliveryAt: '2026-11-13T16:59:59Z'
                    page:
                      number: 0
                      size: 1
                      totalElements: 1
                      totalPages: 1
                heavy:
                  summary: GHN quote for a parcel from 20,000g
                  value:
                    code: 0
                    message: response success
                    data:
                      - carrier: GHN
                        serviceType: HEAVY
                        fee: 90000
                        estimatedDeliveryAt: '2026-11-13T16:59:59Z'
                    page:
                      number: 0
                      size: 1
                      totalElements: 1
                      totalPages: 1
                freeShipping:
                  summary: Order value reaches the free-shipping threshold
                  value:
                    code: 0
                    message: response success
                    data:
                      - carrier: GHN
                        serviceType: STANDARD
                        fee: 0
                        estimatedDeliveryAt: '2026-11-13T16:59:59Z'
                    page:
                      number: 0
                      size: 1
                      totalElements: 1
                      totalPages: 1
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
