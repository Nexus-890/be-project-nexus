                    data:
                      - carrier: GHN
                        serviceType: STANDARD
                        fee: 35000
                        estimatedDeliveryAt: '2026-11-13T16:59:59Z'
                    page:
                      number: 0
                      size: 1
                      totalElements: 1
                      totalPages: 1
                heavy:
                  summary: Báo giá GHN cho kiện từ 20.000g
                  value:
                    code: 0
                    message: response success
                    data:
                      - carrier: GHN
                        serviceType: HEAVY
                        fee: 90000
                        estimatedDeliveryAt: '2026-11-13T16:59:59Z'
                    page:
                      number: 0
                      size: 1
                      totalElements: 1
                      totalPages: 1
                freeShipping:
                  summary: Giá trị hàng đạt ngưỡng miễn phí vận chuyển
                  value:
                    code: 0
                    message: response success
                    data:
                      - carrier: GHN
                        serviceType: STANDARD
                        fee: 0
                        estimatedDeliveryAt: '2026-11-13T16:59:59Z'
                    page:
                      number: 0
                      size: 1
                      totalElements: 1
                      totalPages: 1
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
