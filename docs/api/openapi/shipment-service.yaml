            SHIPMENT_INVALID_TRANSITION:
              value:
                type: urn:problem:domain-error
                title: Conflict
                status: 409
                detail: Cannot move DELIVERED back to IN_TRANSIT
                instance: /api/v1/shipments/00000000-0000-4000-8000-000000000040/status
                code: SHIPMENT_INVALID_TRANSITION
            SHIPMENT_CARRIER_CANCELLATION_REJECTED:
              value:
                type: urn:problem:domain-error
                title: Conflict
                status: 409
                detail: The carrier rejected the shipment cancellation
                instance: /api/v1/shipments/00000000-0000-4000-8000-000000000040/status
                code: SHIPMENT_CARRIER_CANCELLATION_REJECTED
    InvalidShipmentTransition:
      description: The target status conflicts with the current transition rules.
