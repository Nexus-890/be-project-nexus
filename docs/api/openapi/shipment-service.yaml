            instance: /api/v1/shipments/00000000-0000-4000-8000-000000000040
            code: SHIPMENT_NOT_FOUND
    InvalidRequest:
      description: Dữ liệu, địa chỉ, mã địa giới hoặc cấu trúc JSON không hợp lệ. Mỗi field lỗi có field, code và detail.
