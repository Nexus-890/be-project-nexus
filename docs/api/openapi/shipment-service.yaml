              - type: object
                properties:
                  status:
                    type: integer
                    enum:
                      - 409
                  code:
                    type: string
                    enum:
                      - SHIPMENT_INVALID_TRANSITION
          examples:
            SHIPMENT_INVALID_TRANSITION:
              summary: Cannot move DELIVERED back to IN_TRANSIT
              value:
                type: urn:problem:domain-error
                title: Conflict
                status: 409
                detail: Cannot move DELIVERED back to IN_TRANSIT
                instance: /api/v1/shipments/00000000-0000-4000-8000-000000000040/status
                code: SHIPMENT_INVALID_TRANSITION
    InvalidCarrierSignature:
      description: Callback token missing or wrong, or the adapter has no secret configured; nothing is written.
      content:
