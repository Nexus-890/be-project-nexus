  /api/v1/shipments/{id}/status:
    patch:
      tags:
        - Shipments
      operationId: updateShipmentStatus
      summary: Update shipment status
      description: >-
        Requires the matching privilege and one of the roles ADMIN or SUPPORT_STAFF. Every update source uses
        the same transition rules and shipment lock. Skipping steps forward is allowed; DELIVERY_FAILED can go
        back to OUT_FOR_DELIVERY for another attempt. DELIVERED, CANCELLED and RETURNED are terminal; even an
        override cannot move DELIVERED -> IN_TRANSIT. The same status is a no-op that returns 200 and adds no
        history or event. Each accepted change writes status/version, exactly one history row and one
        Shipment* outbox event in the same transaction; the event is published to nexus.shipment.events. The
        actor comes from the JWT, source=MANUAL; reason is normalized for audit. reason is optional. When the
        target is CANCELLED before pickup, the booking is cancelled through the CarrierAdapter before the
        status is committed; if the carrier rejects it or fails, no local cancellation is written. Without a
        trackingCode, a manual change can only keep the status or move to CANCELLED. Every other manual change
        returns 409 SHIPMENT_INVALID_TRANSITION so the PENDING_TRACKING booking retry flow stays intact.
      security:
        - bearerAuth: []
      x-required-privileges:
        - SHIPPING.UPDATE_STATUS
      x-required-roles:
        - ADMIN
        - SUPPORT_STAFF
      x-ownership: ADMIN or SUPPORT_STAFF with the matching privilege can act on the shipment; roles are ANY-of.
      x-error-codes:
        '400':
          - SHIPMENT_VALIDATION_FAILED
          - SHIPMENT_INVALID_REQUEST_BODY
          - SHIPMENT_INVALID_PARAMETER
        '401':
          - SHIPMENT_UNAUTHENTICATED
          - UNAUTHENTICATED
        '403':
          - SHIPMENT_FORBIDDEN
          - FORBIDDEN
        '404':
          - SHIPMENT_NOT_FOUND
        '405':
          - SHIPMENT_METHOD_NOT_ALLOWED
        '406':
          - SHIPMENT_NOT_ACCEPTABLE
        '409':
