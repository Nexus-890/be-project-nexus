  schemas:
    FakeStatusWebhook:
      type: object
      required:
        - OrderCode
        - Type
        - Status
        - Time
      additionalProperties: true
      properties:
        OrderCode:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[A-Za-z0-9_-]+$
        Type:
          type: string
          enum:
            - create
            - switch_status
            - update_weight
            - update_cod
            - update_fee
            - update_payment_type
            - cod
            - update_partial_return
          description: GHN callback type.
        Status:
          $ref: '#/components/schemas/ShipmentStatus'
        Time:
          type: string
          format: date-time
        Reason:
          type: string
          nullable: true
        Description:
          type: string
          nullable: true
    UpdateShipmentStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        reason:
          type: string
          nullable: true
          maxLength: 255
          description: Reason, normalized and stored with the history.
    OverrideShipmentStatusRequest:
      type: object
      required:
        - status
        - reason
      properties:
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        reason:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
          description: Required reason; a whitespace-only string is invalid.
    ShipmentTrackingEntryResponse:
      type: object
      required:
        - id
        - status
        - description
        - source
        - carrierEventId
        - changedBy
        - changedAt
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        description:
          type: string
          nullable: true
          maxLength: 255
        source:
          type: string
          enum:
            - SYSTEM
            - CARRIER_WEBHOOK
            - POLLER
            - MANUAL
        carrierEventId:
          type: string
          nullable: true
          maxLength: 160
        changedBy:
          type: string
          format: uuid
          nullable: true
        changedAt:
          type: string
          format: date-time
    ShipmentTrackingListResponse:
      type: object
      required:
        - code
        - message
        - data
        - page
      additionalProperties: false
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentTrackingEntryResponse'
        page:
          $ref: '#/components/schemas/ShipmentPageInfo'
    GhnStatusWebhook:
      type: object
      required:
        - ShopID
        - OrderCode
        - Type
        - Status
        - Time
      additionalProperties: true
      properties:
        ShopID:
          type: integer
          minimum: 1
          description: GHN shop that sends the callback; must match the shopId configured in the adapter.
        OrderCode:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[A-Za-z0-9_-]+$
        Type:
          type: string
          enum:
            - create
            - switch_status
            - update_weight
            - update_cod
            - update_fee
            - update_payment_type
            - cod
            - update_partial_return
          description: GHN callback type.
        Status:
          type: string
          minLength: 1
          description: GHN status, mapped to exactly one internal ShipmentStatus.
        Time:
          type: string
          format: date-time
        Reason:
          type: string
          nullable: true
          description: Carrier reason, if any; normalized before it is stored.
        Description:
          type: string
          nullable: true
          description: Carrier description when there is no Reason; normalized before it is stored.
    CarrierWebhookAcknowledgement:
      type: object
      required:
        - code
        - message
      additionalProperties: false
      properties:
        code:
          type: integer
          enum:
            - 200
        message:
          type: string
          enum:
            - Success
    CreateShipmentRequest:
      type: object
      required:
        - orderId
      properties:
        orderId:
          type: string
          format: uuid
          description: UUID of a seller order that is PAID in commerce; OrderPaid does not need to have reached shipment-service.
        warehouseId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Chooses the warehouse for a new shipment. Empty uses the trusted warehouse in the snapshot or the
            configured default warehouse. Switching to another warehouse needs a trusted pickup configured for
            it; a missing warehouse or pickup returns 404 SHIPMENT_WAREHOUSE_NOT_FOUND. If the shipment
            already exists, the value sent must match the stored warehouse, otherwise 409
            SHIPMENT_IDEMPOTENCY_CONFLICT.
        carrier:
          type: string
          nullable: true
          minLength: 1
          maxLength: 40
          pattern: '^\S+$'
          description: >-
            Chooses a registered carrier for a new shipment; empty uses the choice from the snapshot or the
            shipping configuration. An unregistered carrier returns 400 SHIPMENT_INVALID_PARAMETER. If the
            shipment already exists, the value sent must equal the stored carrier; a different choice returns
            409 SHIPMENT_IDEMPOTENCY_CONFLICT.
          example: FAKE
        serviceType:
          type: string
          nullable: true
          minLength: 1
          maxLength: 40
          pattern: '^\S+$'
          description: >-
            Chooses a valid service for a new shipment; empty uses the trusted choice or the adapter default.
            An unsupported service returns 422 SHIPMENT_NO_SERVICE. If the shipment already exists, the value
            sent must match the stored choice; a different choice returns 409 SHIPMENT_IDEMPOTENCY_CONFLICT.
          example: STANDARD
    ShipmentStatus:
      type: string
      enum:
        - CREATED
        - PENDING_TRACKING
        - PICKING
        - PACKED
        - READY_TO_SHIP
        - SHIPPED
        - IN_TRANSIT
        - OUT_FOR_DELIVERY
        - DELIVERED
        - DELIVERY_FAILED
        - RETURNING
        - RETURNED
        - CANCELLED
    ShipmentResponse:
      type: object
      required:
        - id
        - orderId
        - warehouseId
        - buyerId
        - carrier
        - serviceType
        - trackingCode
        - status
        - shippingFee
        - shippingInfo
        - createdAt
        - updatedAt
        - version
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        buyerId:
          type: string
          format: uuid
        carrier:
          type: string
          minLength: 1
          maxLength: 40
        serviceType:
          type: string
          nullable: true
          maxLength: 40
        trackingCode:
          type: string
          nullable: true
          minLength: 1
          maxLength: 80
          description: Null until the carrier assigns a code; fake assigns a stable code from the stored shipment.id.
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        shippingFee:
          type: number
          minimum: 0
          description: VND fee frozen from the OrderPaid snapshot or the commerce PAID snapshot; serialized as a JSON number.
        shippingInfo:
          type: object
          additionalProperties: true
          description: >-
            Snapshot of recipient, items, parcel and pickupAddress from OrderPaid or the commerce PAID
            snapshot. It is the order's snapshot, independent of the #201 quote DTO; legacy codes are not
            converted to GHN v3 codes. Parcel can be null; a missing parcel or valid recipient address keeps
            waiting for preparation in PENDING_TRACKING. An empty PickupAddress can be filled from the
            configuration of the same warehouse on creation or retry; the default pickup is used only for
            default-warehouse-id. GHN/FAKE derive an empty serviceType from the final parcel; parcel and
            recipient data are never invented and stored dispatch choices are never replaced.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
    ShipmentHistoryResponse:
      type: object
      required:
        - id
        - status
        - description
        - createdAt
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        description:
          type: string
          nullable: true
          maxLength: 255
        createdAt:
          type: string
          format: date-time
    ShipmentTrackingResponse:
      type: object
      required:
        - shipmentId
        - orderId
        - carrier
        - trackingCode
        - status
        - history
      additionalProperties: false
      properties:
        shipmentId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        carrier:
          type: string
          minLength: 1
          maxLength: 40
        trackingCode:
          type: string
          nullable: true
          minLength: 1
          maxLength: 80
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        history:
          type: array
          description: Stored statuses by createdAt ascending, then id; no fake entries when empty.
          items:
            $ref: '#/components/schemas/ShipmentHistoryResponse'
    ShipmentTrackingEnvelope:
      type: object
      required:
        - code
        - message
        - data
      additionalProperties: false
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          $ref: '#/components/schemas/ShipmentTrackingResponse'
    ShipmentEnvelope:
      type: object
      required:
        - code
        - message
        - data
      additionalProperties: false
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          $ref: '#/components/schemas/ShipmentResponse'
    ShipmentListResponse:
      type: object
      required:
        - code
        - message
        - data
        - page
      additionalProperties: false
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentResponse'
        page:
          $ref: '#/components/schemas/ShipmentPageInfo'
    ShipmentPageInfo:
      type: object
      required:
        - number
        - size
        - totalElements
        - totalPages
      additionalProperties: false
      properties:
        number:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    CarrierListResponse:
      type: object
      required:
        - code
        - message
        - data
        - page
      additionalProperties: false
      properties:
        code:
          type: integer
          enum:
            - 0
          default: 0
        message:
          type: string
          default: response success
        data:
          type: array
          items:
            $ref: '#/components/schemas/CarrierResponse'
        page:
          $ref: '#/components/schemas/PageInfo'
    CarrierPerformance:
      type: object
      additionalProperties: false
      required: [carrier, name, shipments, delivered, failed, inProgress, cancelled, successRate, averageDeliveryHours, onTimeRate]
      properties:
        carrier:
          type: string
          example: GHN
        name:
          type: string
          example: Giao Hàng Nhanh
        shipments:
          type: integer
          format: int64
          minimum: 0
        delivered:
          type: integer
          format: int64
          minimum: 0
        failed:
          type: integer
          format: int64
          minimum: 0
        inProgress:
          type: integer
          format: int64
          minimum: 0
        cancelled:
          type: integer
          format: int64
          minimum: 0
        successRate:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Fraction 0..1, 4 decimal places
          example: 0.9231
        averageDeliveryHours:
          type: number
          nullable: true
          minimum: 0
          description: Average hours, 1 decimal place
          example: 52.4
        onTimeRate:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          example: 0.875
    CarrierPerformanceListResponse:
      type: object
      required:
        - code
        - message
        - data
        - page
      additionalProperties: false
      properties:
        code:
          type: integer
          enum:
            - 0
          default: 0
        message:
          type: string
          default: response success
        data:
          type: array
          items:
            $ref: '#/components/schemas/CarrierPerformance'
        page:
          $ref: '#/components/schemas/PageInfo'
    LocalityListResponse:
      type: object
      required:
        - code
        - message
        - data
        - page
      additionalProperties: false
      properties:
        code:
          type: integer
          enum:
            - 0
          default: 0
        message:
          type: string
          default: response success
        data:
          type: array
          items:
            $ref: '#/components/schemas/LocalityResponse'
        page:
          $ref: '#/components/schemas/PageInfo'
    ShippingQuoteListResponse:
      type: object
      required:
        - code
        - message
        - data
        - page
      additionalProperties: false
      properties:
        code:
          type: integer
          enum:
            - 0
          default: 0
        message:
          type: string
          default: response success
        data:
          type: array
          items:
            $ref: '#/components/schemas/ShippingQuoteResponse'
        page:
          $ref: '#/components/schemas/PageInfo'
    CarrierResponse:
      type: object
      required:
        - code
        - name
        - isDefault
        - available
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - GHN
            - FAKE
        name:
          type: string
          minLength: 1
        isDefault:
          type: boolean
          description: Default adapter chosen by the registry.
        available:
          type: boolean
          description: >-
            Whether the circuit breaker allows a trial call; false when OPEN/FORCED_OPEN. No network probe is
            made and GHN's health at read time is not guaranteed.
    LocalityResponse:
      type: object
      required:
        - code
        - name
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[1-9][0-9]{0,8}$
          minLength: 1
          maxLength: 9
          description: >-
            The two-level GHN v3 catalog _id as a canonical positive integer string; the legacy
            ProvinceID/WardCode is not used.
          example: '1003646'
        name:
          type: string
          minLength: 1
    ShippingServiceType:
      type: string
      enum:
        - STANDARD
        - HEAVY
      description: >-
        STANDARD for parcels under 20,000 grams, mapped to GHN service_type_id=2. HEAVY for parcels from
        20,000 grams, mapped to GHN service_type_id=5. Fake uses the same threshold. GHN's numeric IDs are
        used only inside the adapter.
      example: STANDARD
    ShippingQuoteResponse:
      type: object
      required:
        - carrier
        - serviceType
        - fee
        - estimatedDeliveryAt
      additionalProperties: false
      properties:
        carrier:
          type: string
          enum:
            - GHN
            - FAKE
        serviceType:
          $ref: '#/components/schemas/ShippingServiceType'
        fee:
          type: number
          minimum: 0
          description: Fee the customer pays after FREE_SHIPPING_THRESHOLD, in VND.
          example: 35000
        estimatedDeliveryAt:
          type: string
          format: date-time
          description: Estimated delivery time with a time zone, from expected_delivery_time of a valid preview.
          example: '2026-11-13T16:59:59Z'
        carrierName:
          type: string
          description: Display name of the carrier.
          example: Giao Hàng Nhanh
        recommended:
          type: boolean
          description: true for the first option under SHIPPING_CARRIER_STRATEGY.
    ShippingQuoteRequest:
      type: object
      required:
        - toAddress
        - items
        - parcel
      properties:
        toAddress:
          $ref: '#/components/schemas/ShippingAddressRequest'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ShippingItemRequest'
        parcel:
          $ref: '#/components/schemas/ParcelRequest'
        warehouseId:
          type: string
          format: uuid
          nullable: true
          description: UUID of a warehouse with a configured pickup mapping; empty or null uses the default warehouse.
        pickupAddress:
          type: object
          nullable: true
          description: >-
            Pickup address of the seller's own warehouse, which Commerce reads from Inventory. When set, it
            replaces the warehouseId mapping and the platform pickup address; empty keeps the previous
            selection.
          required: [provinceCode, wardCode, line1]
          properties:
            provinceCode:
              type: string
              pattern: '^[1-9][0-9]{0,8}$'
            wardCode:
              type: string
              pattern: '^[1-9][0-9]{0,8}$'
            line1:
              type: string
              minLength: 1
              maxLength: 255
        insuranceValue:
          type: number
          nullable: true
          minimum: 0
          maximum: 5000000
          multipleOf: 1
          default: 0
          description: >-
            Declared insurance value in whole VND; empty or null sends 0. The subtotal is never used in its
            place, and the value is never capped or rounded. A negative, fractional or above 5,000,000 value
            returns 400 SHIPMENT_VALIDATION_FAILED.
          example: 200000
        applyFreeShipping:
          type: boolean
          nullable: true
          default: true
          description: >-
            Empty, null or true keeps the free-shipping policy based on the Catalog subtotal. False returns
            the checked raw carrier fee; Commerce uses it for auction orders and then applies the threshold to
            the winning bid. This flag only drops the subsidy; it accepts no client-declared price or subtotal
            and does not skip the carrier/ETA checks.
    ShippingAddressRequest:
      type: object
      required:
        - provinceCode
        - wardCode
        - line1
        - recipientName
        - recipientPhone
      properties:
        provinceCode:
          type: string
          pattern: ^[1-9][0-9]{0,8}$
          minLength: 1
          maxLength: 9
          description: Province/city _id in the GHN v3 catalog.
        wardCode:
          type: string
          pattern: ^[1-9][0-9]{0,8}$
          minLength: 1
          maxLength: 9
          description: _id of an active ward that belongs to provinceCode in the GHN v3 catalog.
        line1:
          type: string
          minLength: 1
          maxLength: 255
          description: Delivery address line; named line1 in the public request.
        recipientName:
          type: string
          minLength: 1
          maxLength: 1024
        recipientPhone:
          type: string
          pattern: ^(0[0-9]{9}|\+84[0-9]{9})$
          description: Real recipient phone number; domestic numbers start with 0 or +84.
          example: '0901234567'
    ShippingItemRequest:
      type: object
      required:
        - skuId
        - quantity
      properties:
        skuId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 999
    ParcelRequest:
      type: object
      required:
        - weightGrams
        - lengthCm
        - widthCm
        - heightCm
      properties:
        weightGrams:
          type: integer
          minimum: 1
          maximum: 50000
          description: Packed parcel weight in grams.
        lengthCm:
          type: integer
          minimum: 1
          maximum: 200
          description: Parcel length in cm.
        widthCm:
          type: integer
          minimum: 1
          maximum: 200
          description: Parcel width in cm.
        heightCm:
          type: integer
          minimum: 1
          maximum: 200
          description: Parcel height in cm.
    PageInfo:
      type: object
      required:
        - number
        - size
        - totalElements
        - totalPages
      additionalProperties: false
      properties:
        number:
          type: integer
          enum:
            - 0
        size:
          type: integer
          minimum: 1
          description: max(1, number of items).
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          enum:
            - 0
            - 1
          description: 0 when the list is empty, otherwise 1.
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum:
            - SHIPMENT_INVALID_SIGNATURE
            - SHIPMENT_INVALID_TRANSITION
            - SHIPMENT_UNSUPPORTED_CARRIER
            - SHIPMENT_INVALID_WEBHOOK
            - SHIPMENT_CARRIER_CANCELLATION_REJECTED
            - SHIPMENT_INVALID_CARRIER_STATUS
            - SHIPMENT_INVALID_REQUEST
            - SHIPMENT_VALIDATION_FAILED
            - SHIPMENT_INVALID_REQUEST_BODY
            - SHIPMENT_INVALID_PARAMETER
            - SHIPMENT_IDEMPOTENCY_KEY_REQUIRED
            - SHIPMENT_IDEMPOTENCY_CONFLICT
            - SHIPMENT_ORDER_NOT_FOUND
            - SHIPMENT_ORDER_NOT_PAID
            - SHIPMENT_INVALID_ORDER_SNAPSHOT
            - SHIPMENT_COMMERCE_UNAVAILABLE
            - SHIPMENT_NOT_FOUND
            - SHIPMENT_INVALID_ADDRESS
            - SHIPMENT_UNAUTHENTICATED
            - UNAUTHENTICATED
            - SHIPMENT_FORBIDDEN
            - FORBIDDEN
            - SHIPMENT_WAREHOUSE_NOT_FOUND
            - SHIPMENT_SKU_NOT_FOUND
            - SHIPMENT_METHOD_NOT_ALLOWED
            - SHIPMENT_NOT_ACCEPTABLE
            - SHIPMENT_UNSUPPORTED_MEDIA_TYPE
            - SHIPMENT_NO_SERVICE
            - RATE_LIMITED
            - SHIPMENT_INTERNAL_ERROR
            - INTERNAL_ERROR
            - SHIPMENT_INVALID_CARRIER_RESPONSE
            - SHIPMENT_INVALID_CATALOG_RESPONSE
            - SHIPMENT_CARRIER_UNAVAILABLE
            - SHIPMENT_CIRCUIT_OPEN
            - SHIPMENT_CARRIER_CONFIGURATION_ERROR
            - SHIPMENT_CATALOG_UNAVAILABLE
            - SERVICE_UNAVAILABLE
            - GATEWAY_TIMEOUT
        traceId:
          type: string
          description: Present only when the request has an active trace.
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - code
              - detail
            properties:
              field:
                type: string
              code:
                type: string
              detail:
                type: string
