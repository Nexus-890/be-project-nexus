        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status:
                    type: integer
                    enum: [409]
                  code:
                    type: string
                    enum:
                      - SHIPMENT_IDEMPOTENCY_CONFLICT
