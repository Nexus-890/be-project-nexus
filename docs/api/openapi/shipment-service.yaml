      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ShipmentBadRequest:
      description: Khóa idempotency, body, UUID/enum, carrier chưa đăng ký hoặc phân trang không hợp lệ.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status:
                    type: integer
                    enum: [400]
                  code:
                    type: string
                    enum:
                      - SHIPMENT_IDEMPOTENCY_KEY_REQUIRED
                      - SHIPMENT_VALIDATION_FAILED
                      - SHIPMENT_INVALID_REQUEST_BODY
                      - SHIPMENT_INVALID_PARAMETER
          examples:
            SHIPMENT_IDEMPOTENCY_KEY_REQUIRED:
              summary: Thiếu khóa idempotency hoặc khóa chỉ chứa khoảng trắng
              value:
                type: urn:problem:domain-error
                title: Bad Request
                status: 400
                detail: Cần có Idempotency-Key
                instance: /api/v1/shipments
                code: SHIPMENT_IDEMPOTENCY_KEY_REQUIRED
            SHIPMENT_VALIDATION_FAILED:
              summary: Thiếu orderId
              value:
                type: urn:problem:validation-error
                title: Bad Request
                status: 400
                detail: Dữ liệu yêu cầu không hợp lệ
                instance: /api/v1/shipments
                code: SHIPMENT_VALIDATION_FAILED
                errors:
                  - field: orderId
                    code: VALIDATION_NOT_NULL
                    detail: must not be null
            SHIPMENT_INVALID_REQUEST_BODY:
              summary: Body không phải JSON hoặc UUID không hợp lệ
              value:
                type: urn:problem:invalid-request-body
                title: Bad Request
                status: 400
                detail: Nội dung yêu cầu không hợp lệ
                instance: /api/v1/shipments
                code: SHIPMENT_INVALID_REQUEST_BODY
            SHIPMENT_INVALID_PARAMETER:
              summary: UUID/enum query không parse được hoặc Idempotency-Key dài quá 100 ký tự
              value:
                type: urn:problem:invalid-parameter
                title: Bad Request
                status: 400
                detail: Tham số yêu cầu không hợp lệ
                instance: /api/v1/shipments
                code: SHIPMENT_INVALID_PARAMETER
    ManualOrderNotFound:
      description: Đơn không tồn tại tại commerce, hoặc kho/pickup cần chọn chưa được cấu hình.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status:
                    type: integer
                    enum: [404]
                  code:
                    type: string
                    enum: [SHIPMENT_ORDER_NOT_FOUND, SHIPMENT_WAREHOUSE_NOT_FOUND]
          example:
