  schemas:
    CreateShipmentRequest:
      type: object
      required:
        - orderId
      properties:
        orderId:
          type: string
          format: uuid
          description: UUID seller order PAID tại commerce; không cần OrderPaid đã được giao tới shipment-service.
        warehouseId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Chọn kho cho shipment mới. Bỏ trống dùng kho tin cậy trong snapshot hoặc kho mặc định đã cấu hình.
            Đổi sang kho khác cần pickup tin cậy cấu hình cho kho đó; thiếu kho/pickup trả 404 SHIPMENT_WAREHOUSE_NOT_FOUND.
            Nếu shipment đã tồn tại, giá trị gửi phải khớp kho đã lưu, nếu không trả 409 SHIPMENT_IDEMPOTENCY_CONFLICT.
        carrier:
          type: string
          nullable: true
          minLength: 1
          maxLength: 40
          pattern: '^\S+$'
          description: >-
            Chọn carrier đã đăng ký cho shipment mới; bỏ trống dùng lựa chọn từ snapshot hoặc cấu hình shipping.
            Carrier chưa đăng ký trả 400 SHIPMENT_INVALID_PARAMETER. Nếu shipment đã tồn tại, giá trị gửi
            phải bằng carrier đã lưu; khác lựa chọn trả 409 SHIPMENT_IDEMPOTENCY_CONFLICT.
          example: FAKE
        serviceType:
          type: string
          nullable: true
          minLength: 1
          maxLength: 40
          pattern: '^\S+$'
          description: >-
            Chọn dịch vụ hợp lệ cho shipment mới; bỏ trống dùng lựa chọn tin cậy hoặc mặc định của adapter.
            Dịch vụ không được hỗ trợ trả 422 SHIPMENT_NO_SERVICE. Nếu shipment đã tồn tại, giá trị gửi
            phải khớp lựa chọn đã lưu; khác lựa chọn trả 409 SHIPMENT_IDEMPOTENCY_CONFLICT.
          example: STANDARD
    ShipmentStatus:
      type: string
      enum:
        - CREATED
        - PENDING_TRACKING
        - PICKING
        - PACKED
        - READY_TO_SHIP
        - SHIPPED
        - IN_TRANSIT
        - OUT_FOR_DELIVERY
        - DELIVERED
        - DELIVERY_FAILED
        - RETURNING
        - RETURNED
        - CANCELLED
    ShipmentResponse:
      type: object
      required:
        - id
        - orderId
        - warehouseId
        - buyerId
        - carrier
        - serviceType
        - trackingCode
        - status
        - shippingFee
        - shippingInfo
        - createdAt
        - updatedAt
        - version
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        buyerId:
          type: string
          format: uuid
        carrier:
          type: string
          minLength: 1
          maxLength: 40
        serviceType:
          type: string
          nullable: true
          maxLength: 40
        trackingCode:
          type: string
          nullable: true
          minLength: 1
          maxLength: 80
          description: Null khi carrier chưa cấp mã; fake cấp mã ổn định theo shipment.id đã lưu.
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        shippingFee:
          type: number
          minimum: 0
          description: Phí VND đóng băng từ snapshot OrderPaid hoặc snapshot PAID của commerce; API serialize thành JSON number.
        shippingInfo:
          type: object
          additionalProperties: true
          description: >-
            Snapshot recipient, items, parcel và pickupAddress từ OrderPaid hoặc snapshot PAID của commerce.
            Đây là snapshot của đơn, độc lập với DTO quote #201; không tự đổi mã legacy thành mã GHN v3.
            Parcel/pickupAddress có thể null và shipment khi đó chờ chuẩn bị ở PENDING_TRACKING.
            Tracking retry không bổ sung các trường thiếu; #202 chưa có endpoint hoàn tất chuẩn bị.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
    ShipmentEnvelope:
      type: object
      required:
        - code
        - message
        - data
      additionalProperties: false
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          $ref: '#/components/schemas/ShipmentResponse'
    ShipmentListResponse:
      type: object
      required:
        - code
        - message
        - data
        - page
      additionalProperties: false
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentResponse'
        page:
          $ref: '#/components/schemas/ShipmentPageInfo'
    ShipmentPageInfo:
      type: object
      required:
        - number
        - size
        - totalElements
        - totalPages
      additionalProperties: false
      properties:
        number:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    CarrierListResponse:
      type: object
      required:
        - code
        - message
        - data
        - page
      additionalProperties: false
      properties:
        code:
          type: integer
          enum:
            - 0
          default: 0
        message:
          type: string
          default: response success
        data:
          type: array
          items:
            $ref: '#/components/schemas/CarrierResponse'
        page:
          $ref: '#/components/schemas/PageInfo'
    LocalityListResponse:
      type: object
      required:
        - code
        - message
        - data
        - page
      additionalProperties: false
      properties:
        code:
          type: integer
          enum:
            - 0
          default: 0
        message:
          type: string
          default: response success
        data:
          type: array
          items:
            $ref: '#/components/schemas/LocalityResponse'
        page:
          $ref: '#/components/schemas/PageInfo'
    ShippingQuoteListResponse:
      type: object
      required:
        - code
        - message
        - data
        - page
      additionalProperties: false
      properties:
        code:
          type: integer
          enum:
            - 0
          default: 0
        message:
          type: string
          default: response success
        data:
          type: array
          items:
            $ref: '#/components/schemas/ShippingQuoteResponse'
        page:
          $ref: '#/components/schemas/PageInfo'
    CarrierResponse:
      type: object
      required:
        - code
        - name
        - isDefault
        - available
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - GHN
            - FAKE
        name:
          type: string
          minLength: 1
        isDefault:
          type: boolean
          description: Adapter mặc định do registry chọn.
        available:
          type: boolean
          description: >-
            Trạng thái đủ điều kiện thử gọi theo circuit breaker; false khi OPEN/FORCED_OPEN. Không thực hiện
            probe mạng và không bảo đảm sức khỏe GHN tại thời điểm đọc.
    LocalityResponse:
      type: object
      required:
        - code
        - name
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[1-9][0-9]{0,8}$
          minLength: 1
          maxLength: 9
          description: >-
            Mã _id của danh mục GHN v3 hai cấp, biểu diễn bằng chuỗi số nguyên dương chuẩn; không dùng
            ProvinceID/WardCode của hệ cũ.
          example: '1003646'
        name:
          type: string
          minLength: 1
    ShippingServiceType:
      type: string
      enum:
        - STANDARD
        - HEAVY
      description: >-
        STANDARD cho kiện dưới 20.000 gram, ánh xạ GHN service_type_id=2. HEAVY cho kiện từ 20.000 gram, ánh
        xạ GHN service_type_id=5. Fake dùng cùng ngưỡng. ID số của GHN chỉ dùng nội bộ adapter.
      example: STANDARD
    ShippingQuoteResponse:
      type: object
      required:
        - carrier
        - serviceType
        - fee
        - estimatedDeliveryAt
      additionalProperties: false
      properties:
        carrier:
          type: string
          enum:
            - GHN
            - FAKE
        serviceType:
          $ref: '#/components/schemas/ShippingServiceType'
        fee:
          type: number
          minimum: 0
          description: Phí khách phải trả sau khi áp dụng FREE_SHIPPING_THRESHOLD, đơn vị VND.
          example: 35000
        estimatedDeliveryAt:
          type: string
          format: date-time
          description: Thời điểm dự kiến giao hàng có múi giờ, từ expected_delivery_time của preview hợp lệ.
          example: '2026-11-13T16:59:59Z'
    ShippingQuoteRequest:
      type: object
      required:
        - toAddress
        - items
        - parcel
      properties:
        toAddress:
          $ref: '#/components/schemas/ShippingAddressRequest'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ShippingItemRequest'
        parcel:
          $ref: '#/components/schemas/ParcelRequest'
        warehouseId:
          type: string
          format: uuid
          nullable: true
          description: UUID kho có mapping lấy hàng đã cấu hình; bỏ trống hoặc null dùng kho mặc định.
        insuranceValue:
          type: number
          nullable: true
          minimum: 0
          maximum: 5000000
          multipleOf: 1
          default: 0
          description: >-
            Giá trị khai bảo hiểm, đơn vị VND nguyên; bỏ trống hoặc null gửi 0. Không tự dùng subtotal, không
            tự cắt ngưỡng hoặc làm tròn. Giá trị âm, có phần lẻ hoặc vượt 5.000.000 trả 400
            SHIPMENT_VALIDATION_FAILED.
          example: 200000
    ShippingAddressRequest:
      type: object
      required:
        - provinceCode
        - wardCode
        - line1
        - recipientName
        - recipientPhone
      properties:
        provinceCode:
          type: string
          pattern: ^[1-9][0-9]{0,8}$
          minLength: 1
          maxLength: 9
          description: Mã _id tỉnh/thành phố trong danh mục GHN v3.
        wardCode:
          type: string
          pattern: ^[1-9][0-9]{0,8}$
          minLength: 1
          maxLength: 9
          description: Mã _id phường/xã đang hoạt động, thuộc provinceCode trong danh mục GHN v3.
        line1:
          type: string
          minLength: 1
          maxLength: 255
          description: Dòng địa chỉ giao hàng; dùng tên line1 trong public request.
        recipientName:
          type: string
          minLength: 1
          maxLength: 1024
        recipientPhone:
          type: string
          pattern: ^(0[0-9]{9}|\+84[0-9]{9})$
          description: Số điện thoại người nhận thật; số nội địa bắt đầu bằng 0 hoặc dạng +84.
          example: '0901234567'
    ShippingItemRequest:
      type: object
      required:
        - skuId
        - quantity
      properties:
        skuId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 999
    ParcelRequest:
      type: object
      required:
        - weightGrams
        - lengthCm
        - widthCm
        - heightCm
      properties:
        weightGrams:
          type: integer
          minimum: 1
          maximum: 50000
          description: Khối lượng kiện đã đóng gói, đơn vị gram.
        lengthCm:
          type: integer
          minimum: 1
          maximum: 200
          description: Chiều dài kiện, đơn vị cm.
        widthCm:
          type: integer
          minimum: 1
          maximum: 200
          description: Chiều rộng kiện, đơn vị cm.
        heightCm:
          type: integer
          minimum: 1
          maximum: 200
          description: Chiều cao kiện, đơn vị cm.
    PageInfo:
      type: object
      required:
        - number
        - size
        - totalElements
        - totalPages
      additionalProperties: false
      properties:
        number:
          type: integer
          enum:
            - 0
        size:
          type: integer
          minimum: 1
          description: max(1, số phần tử).
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          enum:
            - 0
            - 1
          description: Bằng 0 khi danh sách rỗng, ngược lại bằng 1.
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum:
            - SHIPMENT_INVALID_REQUEST
            - SHIPMENT_VALIDATION_FAILED
            - SHIPMENT_INVALID_REQUEST_BODY
            - SHIPMENT_INVALID_PARAMETER
            - SHIPMENT_IDEMPOTENCY_KEY_REQUIRED
            - SHIPMENT_IDEMPOTENCY_CONFLICT
            - SHIPMENT_ORDER_NOT_FOUND
            - SHIPMENT_ORDER_NOT_PAID
            - SHIPMENT_INVALID_ORDER_SNAPSHOT
            - SHIPMENT_COMMERCE_UNAVAILABLE
            - SHIPMENT_NOT_FOUND
            - SHIPMENT_INVALID_ADDRESS
            - SHIPMENT_UNAUTHENTICATED
            - UNAUTHENTICATED
            - SHIPMENT_FORBIDDEN
            - FORBIDDEN
            - SHIPMENT_WAREHOUSE_NOT_FOUND
            - SHIPMENT_SKU_NOT_FOUND
            - SHIPMENT_METHOD_NOT_ALLOWED
            - SHIPMENT_NOT_ACCEPTABLE
            - SHIPMENT_UNSUPPORTED_MEDIA_TYPE
            - SHIPMENT_NO_SERVICE
            - RATE_LIMITED
            - SHIPMENT_INTERNAL_ERROR
            - INTERNAL_ERROR
            - SHIPMENT_INVALID_CARRIER_RESPONSE
            - SHIPMENT_INVALID_CATALOG_RESPONSE
            - SHIPMENT_CARRIER_UNAVAILABLE
            - SHIPMENT_CIRCUIT_OPEN
            - SHIPMENT_CARRIER_CONFIGURATION_ERROR
            - SHIPMENT_CATALOG_UNAVAILABLE
            - SERVICE_UNAVAILABLE
            - GATEWAY_TIMEOUT
        traceId:
          type: string
          description: Chỉ xuất hiện khi yêu cầu có trace đang hoạt động.
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - code
              - detail
            properties:
              field:
                type: string
              code:
                type: string
              detail:
                type: string
