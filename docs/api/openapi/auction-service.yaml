                  - title
                  - status
                  - detail
                  - instance
                  - code
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                  - detail
                  - instance
                  - code
                properties:
