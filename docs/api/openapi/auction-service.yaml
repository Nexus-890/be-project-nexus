openapi: 3.0.3
info:
  title: Nexus auction-service delivered API
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: Auctions
    description: Auction creation, configuration, scheduling, cancellation, buyer bidding and public snapshot reads
security:
  - bearerAuth: []
paths:
  /api/v1/auctions/{id}/second-chance-offers:
    get:
      tags:
        - Auctions
      operationId: getSellerSecondChanceOffers
      summary: Preview next eligible bidder and read offer history
      description: Read only. Never sends an offer/email. Candidate exists only in PAYMENT_TIMEOUT without an OFFERED row. History can contain earlier ACCEPTED offers whose orders later timed out. If Rating eligibility is unavailable, return history with eligibilityUnavailable=true, canOffer=false and candidate=null; this is not an exhausted bidder list. Other responses set eligibilityUnavailable=false. Sending still fails with 503 during Rating outage.
      x-required-roles:
        - SELLER
      x-required-privileges:
        - AUCTION.LIST
      x-ownership: JWT subject must own the auction.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current offer state; accepted order creation can still be pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecondChanceSellerResponse"
        "400":
          description: Invalid UUID or page query
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                  - detail
                  - instance
                  - code
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                  - detail
                  - instance
                  - code
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
        "403":
          description: OFFER_NOT_YOURS or AUCTION_FORBIDDEN; missing role/privilege
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                  - detail
                  - instance
                  - code
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
        "404":
          description: OFFER_NOT_FOUND or AUCTION_NOT_FOUND
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                  - detail
                  - instance
                  - code
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
        "409":
          description: OFFER_AUCTION_NOT_TIMED_OUT, OFFER_ALREADY_OPEN, OFFER_NO_ELIGIBLE_BIDDER, OFFER_EXPIRED, OFFER_ALREADY_RESPONDED or OFFER_STOCK_PENDING
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                  - detail
                  - instance
                  - code
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
        "503":
          description: AUCTION_REPUTATION_UNAVAILABLE or dependency unavailable
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                  - detail
                  - instance
                  - code
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
    post:
      tags:
        - Auctions
      operationId: sendSecondChanceOffer
      summary: Offer the item to the next eligible bidder
      description: No body. Select highest valid own bid per bidder and check Rating eligibility before acquiring an auction row lock or write transaction. Then lock and recheck auction state, open offer and candidate ranking/exclusions. A changed snapshot returns OFFER_CANDIDATE_CHANGED (409); refresh and retry. Skip timed-out winners/previously offered/ineligible bidders; stable earliest-bid tie break. One OFFERED per auction. Inventory asynchronously holds one unit; only then bidder email is sent. No eligible bidder returns 409; Rating outage returns 503.
      x-required-roles:
        - SELLER
      x-required-privileges:
        - AUCTION.UPDATE
      x-ownership: JWT subject must own the auction.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current offer state; accepted order creation can still be pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecondChanceSellerResponse"
        "400":
