    post:
      tags: [Auctions]
      operationId: createAuction
      summary: Create an auction as a seller
      description: >
        Creates an auction in CREATED status. sellerId comes from the authenticated JWT subject.
        The selected product must belong to that seller and contain the selected SKU.
        The auction stores the catalog product name and its first image URL at creation.
        The duration must be between the configured minimum and maximum, inclusive.
        Defaults are 60 minutes and 168 hours.
        startingPrice must be greater than zero. startAt must not be in the past,
        allowing up to 5 seconds of clock skew against server time.
        A non-deleted auction in CREATED, SCHEDULED or ACTIVE is live.
        A SKU can have one live auction, and each seller can have up to the configured limit (default 5).
        With FEATURE_REPUTATION_ENFORCEMENT enabled, the seller must pass the
        direct rating-service SELL eligibility check before the auction is written.
        A score below MIN_REPUTATION_TO_SELL (default 50) returns 403
        AUCTION_REPUTATION_TOO_LOW with the policy reason. When the flag is off,
        this check and its dependency calls are skipped. With enforcement on,
        unavailable rating-service, malformed decisions, machine-token failures
        or an open circuit return 503 AUCTION_REPUTATION_UNAVAILABLE. Refusal
        writes no auction or creation outbox event.
      x-catalogue-id: AUC-01
      x-required-roles: [SELLER]
      x-required-privileges: [AUCTION.CREATE]
      x-ownership: The catalog product sellerId must match the authenticated JWT subject.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuctionRequest'
            example:
              productId: 00000002-1111-4111-8111-111111111111
              skuId: 00000003-1111-4111-8111-111111111111
              startingPrice: 1000000.25
              startAt: '2026-11-05T10:00:00Z'
              endAt: '2026-11-05T12:00:00Z'
      responses:
        '201':
          description: Auction saved with currentPrice equal to startingPrice and originalEndAt equal to endAt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAuctionResponse'
              example:
                code: 0
                message: response success
                data:
                  id: 019a5509-abcd-7111-8111-111111111111
                  productId: 00000002-1111-4111-8111-111111111111
                  skuId: 00000003-1111-4111-8111-111111111111
                  sellerId: 68000000-0000-4000-8000-000000000002
                  title: Vintage film camera
                  imageUrl: https://example.com/images/vintage-film-camera.jpg
                  startingPrice: 1000000.25
                  bidIncrement: 10
                  currentPrice: 1000000.25
                  bidCount: 0
                  currency: VND
                  startAt: '2026-11-05T10:00:00Z'
                  endAt: '2026-11-05T12:00:00Z'
                  originalEndAt: '2026-11-05T12:00:00Z'
                  extensionCount: 0
                  status: CREATED
        '400':
          description: Invalid input or duration.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status:
                        enum: [400]
                      code:
                        enum: [INVALID_REQUEST_BODY, VALIDATION_FAILED, AUCTION_START_IN_PAST, AUCTION_INVALID_TIME_WINDOW, AUCTION_DURATION_TOO_SHORT, AUCTION_DURATION_TOO_LONG]
              examples:
                startInPast:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: startAt must not be in the past (5 seconds of clock skew allowed)
                    instance: /api/v1/auctions
                    code: AUCTION_START_IN_PAST
                invalidWindow:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: endAt must be after startAt
                    instance: /api/v1/auctions
                    code: AUCTION_INVALID_TIME_WINDOW
                belowMinimum:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: Auction duration must be at least 60 minutes
                    instance: /api/v1/auctions
                    code: AUCTION_DURATION_TOO_SHORT
                aboveMaximum:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: Auction duration must be at most 168 hours
                    instance: /api/v1/auctions
                    code: AUCTION_DURATION_TOO_LONG
        '401':
          description: 'UNAUTHENTICATED — A valid bearer token is required.'
          headers:
            WWW-Authenticate:
              description: Bearer challenge.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller lacks SELLER or AUCTION.CREATE, the product belongs to another seller, or enabled reputation enforcement denies SELL eligibility.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      code:
                        enum: [FORBIDDEN, AUCTION_FORBIDDEN, AUCTION_REPUTATION_TOO_LOW]
                      reason:
                        type: string
                        minLength: 1
                        description: Policy explanation included for AUCTION_REPUTATION_TOO_LOW.
              examples:
                productOwnership:
                  value:
                    type: urn:problem:domain-error
                    title: Forbidden
                    status: 403
                    detail: The product belongs to another seller
                    instance: /api/v1/auctions
                    code: AUCTION_FORBIDDEN
                reputationBelowMinimum:
                  value:
                    type: urn:problem:domain-error
                    title: Forbidden
                    status: 403
                    detail: Reputation score 39 is below 50 required for SELL
                    instance: /api/v1/auctions
                    code: AUCTION_REPUTATION_TOO_LOW
                    reason: Reputation score 39 is below 50 required for SELL
        '404':
          description: The product is unavailable in the catalog or the selected SKU does not belong to it.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      code:
                        enum: [AUCTION_PRODUCT_NOT_FOUND, AUCTION_SKU_NOT_FOUND]
              examples:
                productNotFound:
                  value:
                    type: urn:problem:domain-error
                    title: Not Found
                    status: 404
                    detail: Product not found in catalog
                    instance: /api/v1/auctions
                    code: AUCTION_PRODUCT_NOT_FOUND
                skuNotFound:
                  value:
                    type: urn:problem:domain-error
                    title: Not Found
                    status: 404
                    detail: SKU not found on the selected product
                    instance: /api/v1/auctions
                    code: AUCTION_SKU_NOT_FOUND
        '409':
          description: The product lacks a valid image, the SKU is out of stock or has a live auction, or the seller has reached the live auction limit.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status:
                        enum: [409]
                      code:
                        enum: [AUCTION_IMAGE_REQUIRED, AUCTION_SKU_ALREADY_LIVE, AUCTION_SELLER_LIMIT_REACHED, AUCTION_STOCK_UNAVAILABLE]
        '429':
          description: 'RATE_LIMITED — Gateway request limit exceeded.'
          headers:
            Retry-After:
              description: Seconds until the request can be retried.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: 'INTERNAL_ERROR — Unexpected server error.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Catalog or inventory is unavailable, an enabled reputation check cannot obtain a valid decision, or the gateway cannot reach auction-service. Reputation token/timeout/transport/malformed-response/circuit failures fail closed before any auction write.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      code:
                        enum: [AUCTION_CATALOG_UNAVAILABLE, AUCTION_INVENTORY_UNAVAILABLE, AUCTION_REPUTATION_UNAVAILABLE, SERVICE_UNAVAILABLE]
              examples:
                catalogUnavailable:
                  value:
                    type: urn:problem:domain-error
                    title: Service Unavailable
                    status: 503
                    detail: Catalog is temporarily unavailable
                    instance: /api/v1/auctions
                    code: AUCTION_CATALOG_UNAVAILABLE
                reputationUnavailable:
                  value:
                    type: urn:problem:domain-error
                    title: Service Unavailable
                    status: 503
                    detail: Reputation eligibility is temporarily unavailable
                    instance: /api/v1/auctions
                    code: AUCTION_REPUTATION_UNAVAILABLE
