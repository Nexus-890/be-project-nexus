  /api/v1/auctions/mine:
    get:
      tags: [Auctions]
      operationId: listMyAuctions
      summary: List the seller's own auctions in any status
      description: Reads the JWT seller only, including CREATED, CANCELLED and RESTRICTED auctions. Soft-deleted rows are excluded. Omitting status returns every status. Sorts by createdAt descending then id descending.
      x-catalogue-id: AUC-10
      x-required-roles: [SELLER]
      x-required-privileges: [AUCTION.LIST]
      x-ownership: sellerId equals the JWT subject; request parameters cannot override ownership.
      parameters:
        - name: status
          in: query
          description: Optional exact status filter; omitted means all statuses.
          schema: {$ref: '#/components/schemas/AuctionStatus'}
        - {$ref: '#/components/parameters/MinePage'}
        - {$ref: '#/components/parameters/MineSize'}
      responses:
        '200':
          description: Own auction snapshots with page metadata; empty/out-of-range pages retain the actual totals.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListAuctionsResponse'}
        '400': {$ref: '#/components/responses/MineInvalidQuery'}
        '401': {$ref: '#/components/responses/MineUnauthorized'}
        '403': {$ref: '#/components/responses/MineForbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auctions/manage:
    get:
      tags: [Auctions]
      operationId: listManagedAuctions
      summary: List every auction for the back office
      description: Back-office list for ADMIN and SUPPORT_STAFF including CREATED, CANCELLED and RESTRICTED auctions of every seller. Soft-deleted rows are excluded. Omitting status returns every status. Sorts by createdAt descending then id descending. The public list is unchanged.
      x-required-roles: [ADMIN, SUPPORT_STAFF]
      x-required-privileges: [AUCTION.LIST]
      x-ownership: None; auctions of every seller are readable.
      parameters:
        - name: status
          in: query
          description: Optional exact status filter; omitted means all statuses.
          schema: {$ref: '#/components/schemas/AuctionStatus'}
        - {$ref: '#/components/parameters/MinePage'}
        - {$ref: '#/components/parameters/MineSize'}
      responses:
        '200':
          description: Auction snapshots with page metadata; empty/out-of-range pages retain the actual totals.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListAuctionsResponse'}
        '400': {$ref: '#/components/responses/MineInvalidQuery'}
        '401': {$ref: '#/components/responses/MineUnauthorized'}
        '403': {$ref: '#/components/responses/MineForbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auctions/manage/{id}:
    get:
      tags: [Auctions]
      operationId: getManagedAuction
      summary: Read any auction for the back office
      description: Reads the stored snapshot regardless of status or visibility. Soft-deleted or unknown auctions return 404.
      x-required-roles: [ADMIN, SUPPORT_STAFF]
      x-required-privileges: [AUCTION.VIEW]
      x-ownership: None; auctions of every seller are readable.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Stored auction snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GetAuctionResponse'}
        '400': {$ref: '#/components/responses/MineInvalidQuery'}
        '401': {$ref: '#/components/responses/MineUnauthorized'}
        '403': {$ref: '#/components/responses/MineForbidden'}
        '404': {$ref: '#/components/responses/ManagedAuctionNotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auctions/manage/{id}/state:
    get:
      tags: [Auctions]
      operationId: getManagedAuctionState
      summary: Read the live state of any auction for the back office
      description: Same shape as the public state read, regardless of visibility. Not cached.
      x-required-roles: [ADMIN, SUPPORT_STAFF]
      x-required-privileges: [AUCTION.VIEW]
      x-ownership: None; auctions of every seller are readable.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Current auction state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GetAuctionStateResponse'}
        '400': {$ref: '#/components/responses/MineInvalidQuery'}
        '401': {$ref: '#/components/responses/MineUnauthorized'}
        '403': {$ref: '#/components/responses/MineForbidden'}
        '404': {$ref: '#/components/responses/ManagedAuctionNotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auctions/manage/{id}/bids:
