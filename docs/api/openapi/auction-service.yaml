  /api/v1/auctions/{id}/bids/{bidId}:
    get:
      tags:
        - Auctions
      operationId: getBidStatus
      summary: Read the authenticated bidder’s queued or final result
      x-required-roles:
        - BUYER
      x-required-privileges:
        - AUCTION.BID
      x-ownership: bidderId equals JWT subject; a wrong auction, another bidder or an unknown bid returns the same 404.
      parameters:
        - name: id
