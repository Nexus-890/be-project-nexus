            type: string
            format: uuid
        - name: bidId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: QUEUED while waiting, PLACED with the price/leader snapshot, or REJECTED with reason and optional minimum.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidStatusEnvelope"
        "400":
          description: Invalid UUID path.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - type: object
                    properties:
                      status:
                        type: integer
                        enum:
                          - 400
                      code:
                        type: string
                        enum:
                          - INVALID_PARAMETER
        "401":
          description: UNAUTHENTICATED — A valid bearer token is required.
          headers:
            WWW-Authenticate:
              description: Bearer challenge.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: FORBIDDEN — The caller lacks the BUYER role or the AUCTION.BID privilege.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
