    post:
      tags:
        - Auctions
      operationId: placeBid
      summary: Accept a bid request for asynchronous processing
      description: Validates amount format, ACTIVE/time window and seller exclusion without locking the auction price.
        Persists a QUEUED request and BidRequested outbox command atomically, then returns 202. Minimum-price validation
        and anti-sniping run in the consumer using requestedAt, including requests consumed after endAt. Reusing the
        same UUID Idempotency-Key for the same auction, bidder and numeric amount returns the original 202 receipt even
        after processing. A different payload returns 409. Follow the private bid-status URL until PLACED or REJECTED.
        With FEATURE_REPUTATION_ENFORCEMENT enabled, each new bid request must pass
        rating-service BID eligibility before any queued bid or outbox write.
        A score below MIN_REPUTATION_TO_BID (default 40) returns 403
        AUCTION_REPUTATION_TOO_LOW with the policy reason. When the flag is off,
        the reputation check and its dependency calls are skipped. When on,
        rating-service unavailability, malformed decisions, machine-token failures
        or an open circuit fail closed with 503 AUCTION_REPUTATION_UNAVAILABLE.
        A replay of an already accepted key still returns its original 202
        queued receipt even when reputation is now denied or rating-service is down;
        the request and command are not written again.
      x-catalogue-id: BID-01
      x-required-roles:
        - BUYER
      x-required-privileges:
        - AUCTION.BID
      x-ownership: The bidder is the authenticated JWT subject and may not be the auction seller.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            UUID identifying one bid attempt. Retry with the same key after a timeout. Uppercase and lowercase UUID
            letters identify the same key. Use a new key for a new bid.
          schema:
            type: string
            format: uuid
            minLength: 36
            maxLength: 36
          example: 68000000-0000-4000-8000-000000000004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceBidRequest"
            example:
              amount: 1200000
      responses:
        "202":
          description: Durable queued receipt, also returned for a matching idempotent replay.
          headers:
            Location:
              description: Private result resource for the authenticated bidder.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidAcceptedResponse"
              example:
                code: 0
                message: response success
                data:
                  bidId: 019a5509-abcd-7111-8111-111111111113
                  status: QUEUED
                  requestedAt: 2026-11-16T10:00:00Z
        "400":
          description: Invalid amount, missing/malformed UUID Idempotency-Key or invalid request/parameter.
          content:
            application/problem+json:
