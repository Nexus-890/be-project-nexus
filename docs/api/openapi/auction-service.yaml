        "500":
          $ref: "#/components/responses/UnexpectedError"
  /api/v1/auctions/{id}/stream:
    get:
      tags:
        - Auctions
      operationId: streamAuctionState
      summary: Stream public auction snapshots over Server-Sent Events
      description: The first named state event is the current public state. Subsequent committed auction events coalesce for
        200 ms and invalidate the one-second state cache. data is exactly GET /state data, without ApiResponse; id is
        the auction version. heartbeat events arrive every 15 seconds. Reconnect always receives the current snapshot,
        including when Last-Event-ID was supplied; this is not an event-history replay. The stream closes on ENDED, WON,
        SETTLED, FAILED, CANCELLED or PAYMENT_TIMEOUT. On failure/refusal the frontend retains its two-second polling
        fallback. Timeout is 30 minutes; each instance enforces its own configured connection cap.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: Optional browser reconnection cursor; a fresh current state is always sent.
      responses:
        "200":
          description: A long-lived SSE protocol response, without an ApiResponse wrapper.
          headers:
            X-Accel-Buffering:
              schema:
                type: string
                enum:
                  - no
            Cache-Control:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
              example: |+
                id: 12
                event: state
                data: {"auctionId":"019a5509-abcd-7111-8111-111111111111","currentPrice":1200000,"bidCount":2,"bidIncrement":50000,"leaderBidderName":"N***","endAt":"2026-11-16T11:05:00Z","status":"ACTIVE","serverTime":"2026-11-16T11:00:00Z"}

                event: heartbeat
                data: 2026-11-16T11:00:15Z

        "400":
          description: Invalid auction UUID.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - type: object
                    properties:
                      status:
                        type: integer
                        enum:
                          - 400
                      code:
                        type: string
                        enum:
                          - INVALID_PARAMETER
        "404":
          description: Unknown, restricted or soft-deleted auction; stream has not opened.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - type: object
                    properties:
                      status:
                        type: integer
                        enum:
                          - 404
                      code:
                        type: string
                        enum:
                          - AUCTION_NOT_FOUND
        "500":
          $ref: "#/components/responses/UnexpectedError"
        "503":
          description: Instance connection cap reached or shutting down; use polling.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - type: object
                    properties:
                      status:
                        type: integer
                        enum:
                          - 503
                      code:
                        type: string
                        enum:
                          - AUCTION_STREAM_BUSY
components:
  parameters:
    MinePage:
      name: page
      in: query
      description: Zero-based page number.
      schema: {type: integer, minimum: 0, default: 0}
    MineSize:
      name: size
      in: query
      description: Number of distinct result rows per page.
      schema: {type: integer, minimum: 1, maximum: 100, default: 10}
  responses:
    ManagedAuctionNotFound:
      description: AUCTION_NOT_FOUND. The auction is missing or soft-deleted.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PublicAuctionNotFound:
      description: AUCTION_NOT_FOUND. The auction is missing, deleted or restricted.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    MineInvalidQuery:
      description: INVALID_PARAMETER, VALIDATION_FAILED or INVALID_REQUEST_BODY; malformed query or paging bounds.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    MineUnauthorized:
      description: UNAUTHENTICATED; valid bearer token required.
      headers:
        WWW-Authenticate:
          description: Bearer challenge.
          schema: {type: string}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    MineForbidden:
      description: FORBIDDEN; caller lacks the endpoint role or privilege.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InvalidBearer:
      description: 'UNAUTHENTICATED — No token is needed, but an invalid supplied token is rejected.'
      headers:
        WWW-Authenticate:
          description: Bearer challenge.
          schema: {type: string}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 'RATE_LIMITED — Gateway request limit exceeded.'
      headers:
        Retry-After:
          description: Seconds until the request can be retried.
          schema: {type: string}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnexpectedError:
      description: 'INTERNAL_ERROR — Unexpected server error.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: 'SERVICE_UNAVAILABLE — The gateway could not reach auction-service.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PageInfo:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        totalElements: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    SecondChanceCandidate:
      type: object
      required:
        - bidderId
        - displayName
        - amount
      properties:
        bidderId:
          type: string
          format: uuid
        displayName:
          type: string
          description: Masked bidder name, never an email.
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          description: Offered bidder’s highest valid bid; JSON number.
    SecondChanceOffer:
      type: object
      required:
        - id
        - auctionId
        - bidderId
        - displayName
        - amount
        - status
        - stockReady
        - offeredAt
        - expiresAt
        - respondedAt
        - orderId
        - paymentDueAt
        - title
        - imageUrl
        - currency
      properties:
        id:
          type: string
          format: uuid
        auctionId:
          type: string
          format: uuid
        bidderId:
          type: string
          format: uuid
        displayName:
          type: string
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          description: Offered bidder’s highest valid bid; JSON number.
        status:
          type: string
          enum:
            - OFFERED
            - ACCEPTED
            - DECLINED
            - EXPIRED
        stockReady:
          type: boolean
          description: Accept is allowed after Inventory confirms the hold; otherwise OFFER_STOCK_PENDING.
        offeredAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
          nullable: true
        orderId:
          type: string
          format: uuid
          nullable: true
          description: Null until Commerce has created and projected the order. Read the offers again; never infer this ID.
        paymentDueAt:
          type: string
          format: date-time
          nullable: true
          description: Accept time plus configured payment deadline hours. Present even while order creation is pending.
        title:
          type: string
        imageUrl:
          type: string
          nullable: true
        currency:
          type: string
          enum:
            - VND
    SecondChanceSellerState:
      type: object
      required:
        - auctionId
        - canOffer
        - eligibilityUnavailable
        - candidate
        - offers
      properties:
        auctionId:
          type: string
          format: uuid
        canOffer:
          type: boolean
        eligibilityUnavailable:
          type: boolean
          description: True only when the candidate eligibility check failed because Rating is unavailable. Keep history and allow a read-only retry; canOffer is false and candidate is null. False when bidders are exhausted, an offer is open, or the auction is not timed out.
        candidate:
          type: object
          allOf:
            - $ref: "#/components/schemas/SecondChanceCandidate"
          nullable: true
        offers:
          type: array
          items:
            $ref: "#/components/schemas/SecondChanceOffer"
    SecondChanceSellerResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          $ref: "#/components/schemas/SecondChanceSellerState"
    SecondChanceOfferResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          $ref: "#/components/schemas/SecondChanceOffer"
    SecondChanceListResponse:
      type: object
      required:
        - code
        - message
        - data
        - page
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          type: array
          items:
            $ref: "#/components/schemas/SecondChanceOffer"
        page:
          $ref: "#/components/schemas/PageInfo"

    AuctionState:
      type: object
      additionalProperties: false
      required: [auctionId, currentPrice, bidCount, bidIncrement, leaderBidderName, endAt, status, serverTime]
      properties:
        auctionId: {type: string, format: uuid}
        currentPrice: {type: number, minimum: 0}
        bidCount: {type: integer, minimum: 0}
        bidIncrement: {type: number, minimum: 0, exclusiveMinimum: true}
        leaderBidderName:
          type: string
          nullable: true
          description: Masked name, or null when there is no leader.
          example: 'N***A'
        endAt: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/AuctionStatus'}
        serverTime: {type: string, format: date-time}
    GetAuctionStateResponse:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, default: 0}
        message: {type: string, default: response success}
        data: {$ref: '#/components/schemas/AuctionState'}
    PublicBid:
      type: object
      additionalProperties: false
      required: [amount, bidderName, placedAt]
      properties:
        amount: {type: number, minimum: 0}
        bidderName: {type: string, description: Masked display name, example: 'N***A'}
        placedAt: {type: string, format: date-time}
    ListAuctionBidsResponse:
      type: object
      required: [code, message, data, page]
      properties:
        code: {type: integer, default: 0}
        message: {type: string, default: response success}
        data:
          type: array
          items: {$ref: '#/components/schemas/PublicBid'}
        page:
          type: object
          required: [number, size, totalElements, totalPages]
          properties:
            number: {type: integer, minimum: 0}
            size: {type: integer, minimum: 1, maximum: 100}
            totalElements: {type: integer, format: int64, minimum: 0}
            totalPages: {type: integer, minimum: 0}
    MyBid:
      type: object
      additionalProperties: false
      required: [auctionId, title, amount, placedAt, auctionStatus, leading, won]
      properties:
        auctionId: {type: string, format: uuid}
        title: {type: string}
        amount: {type: number, multipleOf: 0.01, description: Latest personal bid amount as a JSON number.}
        placedAt: {type: string, format: date-time}
        auctionStatus: {$ref: '#/components/schemas/AuctionStatus'}
        leading: {type: boolean}
        won: {type: boolean}
        orderId:
          type: string
          format: uuid
          nullable: true
          description: Recorded settlement order id, returned only to the recorded winner in WON/SETTLED/PAYMENT_TIMEOUT. Null before the OrderCreated projection is stored, for other bidders and for other statuses. Never inferred from a product or bid.
        paymentDueAt:
          type: string
          format: date-time
          nullable: true
          description: Stored auction payment deadline, returned only to the recorded winner in WON/SETTLED/PAYMENT_TIMEOUT; otherwise null. This read never creates or extends the deadline.
        finalPrice:
          type: number
          multipleOf: 0.01
          minimum: 0
          nullable: true
          description: Stored final auction price as a JSON number, returned only to the recorded winner in WON/SETTLED/PAYMENT_TIMEOUT; otherwise null. Distinct from the caller's latest personal bid amount.
    ListMyBidsResponse:
      type: object
      required: [code, message, data, page]
      properties:
        code: {type: integer, default: 0}
        message: {type: string, default: response success}
        data:
          type: array
          items: {$ref: '#/components/schemas/MyBid'}
        page:
          type: object
          required: [number, size, totalElements, totalPages]
          properties:
            number: {type: integer, minimum: 0}
            size: {type: integer, minimum: 1, maximum: 100}
            totalElements: {type: integer, format: int64, minimum: 0}
            totalPages: {type: integer, minimum: 0}
    AuctionStatus:
      type: string
      enum: [CREATED, SCHEDULED, ACTIVE, ENDED, WON, SETTLED, FAILED, PAYMENT_TIMEOUT, CANCELLED]
    GetAuctionResponse:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, default: 0}
        message: {type: string, default: response success}
        data:
          $ref: '#/components/schemas/Auction'
    ListAuctionsResponse:
      type: object
      required: [code, message, data, page]
      properties:
        code: {type: integer, default: 0}
        message: {type: string, default: response success}
        data:
          type: array
          items:
            $ref: '#/components/schemas/Auction'
        page:
          type: object
          required: [number, size, totalElements, totalPages]
          properties:
            number: {type: integer, minimum: 0}
            size: {type: integer, minimum: 1, maximum: 100}
            totalElements: {type: integer, format: int64, minimum: 0}
            totalPages: {type: integer, minimum: 0}
    CreateAuctionRequest:
      type: object
      required: [productId, skuId, startingPrice, startAt, endAt]
      properties:
        productId:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
          maxLength: 255
          deprecated: true
          description: Accepted for existing clients. The stored title comes from the catalog product name.
        startingPrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          description: At most 17 integer digits and two fractional digits.
        bidIncrement:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          description: Uses nexus.auction.default-bid-increment when omitted or null. At most 17 integer digits and two fractional digits.
        startAt:
          type: string
          format: date-time
          description: Must not precede server time by more than 5 seconds.
        endAt:
          type: string
          format: date-time
    UpdateAuctionRequest:
      type: object
      required: [startingPrice, bidIncrement, startAt, endAt]
      properties:
        startingPrice:
          $ref: '#/components/schemas/CreateAuctionRequest/properties/startingPrice'
        bidIncrement:
          type: number
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          description: Required, positive; at most 17 integer digits and two fractional digits.
        startAt:
          type: string
          format: date-time
          description: Must not precede server time by more than 5 seconds.
        endAt:
          type: string
          format: date-time
          description: After startAt, with AUCTION_MIN_DURATION_MINUTES and AUCTION_MAX_DURATION_HOURS enforced.
    CancelAuctionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
          description: Must contain non-whitespace; surrounding whitespace is stripped when stored.
    CreateAuctionResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          $ref: '#/components/schemas/Auction'
    PlaceBidRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 100000000000000000
          exclusiveMaximum: true
          multipleOf: 0.01
          description: Bid amount with at most 17 integer digits and two fractional digits.
    PlaceBidResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          $ref: '#/components/schemas/BidResponse'
    BidResponse:
      type: object
      required:
        - bidId
        - status
        - requestedAt
      properties:
        bidId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - QUEUED
        requestedAt:
          type: string
          format: date-time
    BidAcceptedResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: response success
        data:
          $ref: "#/components/schemas/BidResponse"
    BidStatusEnvelope:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: response success
        data:
          $ref: "#/components/schemas/BidStatus"
    BidStatus:
      type: object
      required:
        - bidId
        - status
        - requestedAt
        - amount
      properties:
        bidId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - QUEUED
            - PLACED
            - REJECTED
            - OUTBID
            - WON
            - CANCELLED
        requestedAt:
          type: string
          format: date-time
        amount:
          type: number
          multipleOf: 0.01
        currentPrice:
          type: number
          description: Accepted price at the time this request was processed.
        leaderBidderId:
          type: string
          format: uuid
        reason:
          type: string
          enum:
            - AUCTION_BID_TOO_LOW
            - AUCTION_NOT_ACTIVE
            - AUCTION_SELLER_CANNOT_BID
        minimum:
          type: number
          description: Minimum accepted price when a too-low request was rejected.

    Auction:
      type: object
      required: [id, productId, skuId, sellerId, title, startingPrice, bidIncrement, currentPrice, bidCount, currency, startAt, endAt, originalEndAt, extensionCount, status]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        sellerId:
          type: string
          format: uuid
        title:
          type: string
        imageUrl:
          type: string
          nullable: true
        startingPrice:
          type: number
          minimum: 0
        bidIncrement:
          type: number
          minimum: 0
          exclusiveMinimum: true
        currentPrice:
          type: number
          minimum: 0
        bidCount:
          type: integer
          minimum: 0
        currency:
          type: string
          enum: [VND]
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        originalEndAt:
          type: string
          format: date-time
        extensionCount:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/AuctionStatus'
        cancelledBy:
          type: string
          nullable: true
          enum: [SELLER, ADMIN, SYSTEM]
        cancelledReason:
          type: string
          nullable: true
          maxLength: 255
        cancelledActorId:
          type: string
          format: uuid
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
    Problem:
      type: object
      required: [type, title, status, detail, instance, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, code, detail]
            properties:
              field:
                type: string
              code:
                type: string
              detail:
                type: string
