openapi: 3.0.3
info:
  title: Nexus auction-service delivered API
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: Auctions
    description: Auction creation, configuration, scheduling, cancellation, buyer bidding and public snapshot reads
security:
  - bearerAuth: []
paths:
  /api/v1/auctions/mine:
    get:
      tags: [Auctions]
      operationId: listMyAuctions
      summary: List the seller's own auctions in any status
      description: Reads the JWT seller only, including CREATED, CANCELLED and RESTRICTED auctions. Soft-deleted rows are excluded. Omitting status returns every status. Sorts by createdAt descending then id descending.
      x-catalogue-id: AUC-10
      x-required-roles: [SELLER]
      x-required-privileges: [AUCTION.LIST]
      x-ownership: sellerId equals the JWT subject; request parameters cannot override ownership.
      parameters:
        - name: status
          in: query
          description: Optional exact status filter; omitted means all statuses.
          schema: {$ref: '#/components/schemas/AuctionStatus'}
        - {$ref: '#/components/parameters/MinePage'}
        - {$ref: '#/components/parameters/MineSize'}
      responses:
        '200':
          description: Own auction snapshots with page metadata; empty/out-of-range pages retain the actual totals.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListAuctionsResponse'}
        '400': {$ref: '#/components/responses/MineInvalidQuery'}
        '401': {$ref: '#/components/responses/MineUnauthorized'}
        '403': {$ref: '#/components/responses/MineForbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/bids/mine:
    get:
      tags: [Auctions]
      operationId: listMyBids
      summary: List each auction the authenticated buyer has bid on once
      description: >
        Reads only bids belonging to the JWT subject. Groups by auction before pagination,
        including restricted auctions and cancelled bid history but excluding soft-deleted auctions.
        amount and placedAt come from the same latest personal bid (placedAt DESC, id DESC).
        Results use that same stable order. leading is true only for ACTIVE/ENDED auctions where
        the caller is leader_bidder_id and holds a non-CANCELLED bid matching current_price.
        won is true only for WON/SETTLED/PAYMENT_TIMEOUT with winner_id equal to the caller;
        a current leader is not assumed to have won. Counts and rows share a repeatable-read snapshot.
      x-catalogue-id: BID-03
      x-required-roles: [BUYER]
      x-required-privileges: [AUCTION.VIEW_BID_HISTORY]
      x-ownership: bidderId equals JWT subject; no other bidder identity is returned.
      parameters:
        - {$ref: '#/components/parameters/MinePage'}
        - {$ref: '#/components/parameters/MineSize'}
      responses:
        '200':
          description: One latest personal bid per auction; totals count distinct auctions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListMyBidsResponse'}
        '400': {$ref: '#/components/responses/MineInvalidQuery'}
        '401': {$ref: '#/components/responses/MineUnauthorized'}
        '403': {$ref: '#/components/responses/MineForbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auctions:
    get:
      tags: [Auctions]
      operationId: listAuctions
      summary: List public auctions, ending soonest first
      description: >
        Reads only auction-service tables. Excludes RESTRICTED and soft-deleted rows. CREATED and CANCELLED are hidden even when explicitly requested by status.
        When status is omitted only ACTIVE public non-deleted auctions are included.
        Sorts by endAt ascending, then id ascending for ties; client sort overrides are not supported.
        A page beyond the end returns an empty data array with the actual totals.
      x-catalogue-id: AUC-05
      security: []
      parameters:
        - name: status
          in: query
          description: Exact uppercase status filter. Defaults to ACTIVE when omitted.
          schema:
            default: ACTIVE
            allOf:
              - $ref: '#/components/schemas/AuctionStatus'
        - name: page
          in: query
          description: Zero-based page number.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Requested page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: A page of auction snapshots; title and imageUrl are read from the local row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuctionsResponse'
              example:
                code: 0
                message: response success
                data: []
                page: {number: 0, size: 10, totalElements: 0, totalPages: 0}
        '400':
          description: 'INVALID_PARAMETER for conversion failures; VALIDATION_FAILED for page/size bounds.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidStatus:
                  value:
                    type: urn:problem:invalid-parameter
                    title: Bad Request
                    status: 400
                    detail: A request parameter is invalid
                    instance: /api/v1/auctions
                    code: INVALID_PARAMETER
                invalidSize:
                  value:
                    type: urn:problem:validation-error
                    title: Bad Request
                    status: 400
                    detail: The request data is invalid
                    instance: /api/v1/auctions
                    code: VALIDATION_FAILED
                    errors: [{field: size, code: INVALID_PARAMETER, detail: must be less than or equal to 100}]
        '401':
          $ref: '#/components/responses/InvalidBearer'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Auctions]
      operationId: createAuction
      summary: Create an auction as a seller
      description: >
        Creates an auction in CREATED status. sellerId comes from the authenticated JWT subject.
        The selected product must belong to that seller and contain the selected SKU.
        The auction stores the catalog product name and its first image URL at creation.
        The duration must be between the configured minimum and maximum, inclusive.
        Defaults are 60 minutes and 168 hours.
        startingPrice must be greater than zero. startAt must not be in the past,
        allowing up to 5 seconds of clock skew against server time.
      x-catalogue-id: AUC-01
      x-required-roles: [SELLER]
      x-required-privileges: [AUCTION.CREATE]
      x-ownership: The catalog product sellerId must match the authenticated JWT subject.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuctionRequest'
            example:
              productId: 00000002-1111-4111-8111-111111111111
              skuId: 00000003-1111-4111-8111-111111111111
              startingPrice: 1000000.25
              startAt: '2026-11-05T10:00:00Z'
              endAt: '2026-11-05T12:00:00Z'
      responses:
        '201':
          description: Auction saved with currentPrice equal to startingPrice and originalEndAt equal to endAt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAuctionResponse'
              example:
                code: 0
                message: response success
                data:
                  id: 019a5509-abcd-7111-8111-111111111111
                  productId: 00000002-1111-4111-8111-111111111111
                  skuId: 00000003-1111-4111-8111-111111111111
                  sellerId: 68000000-0000-4000-8000-000000000002
                  title: Vintage film camera
                  imageUrl: https://example.com/images/vintage-film-camera.jpg
                  startingPrice: 1000000.25
                  bidIncrement: 10
                  currentPrice: 1000000.25
                  bidCount: 0
                  currency: VND
                  startAt: '2026-11-05T10:00:00Z'
                  endAt: '2026-11-05T12:00:00Z'
                  originalEndAt: '2026-11-05T12:00:00Z'
                  extensionCount: 0
                  status: CREATED
        '400':
          description: Invalid input or duration.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status:
                        enum: [400]
                      code:
                        enum: [INVALID_REQUEST_BODY, VALIDATION_FAILED, AUCTION_START_IN_PAST, AUCTION_INVALID_TIME_WINDOW, AUCTION_DURATION_TOO_SHORT, AUCTION_DURATION_TOO_LONG]
              examples:
                startInPast:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: startAt must not be in the past (5 seconds of clock skew allowed)
                    instance: /api/v1/auctions
                    code: AUCTION_START_IN_PAST
                invalidWindow:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: endAt must be after startAt
                    instance: /api/v1/auctions
                    code: AUCTION_INVALID_TIME_WINDOW
                belowMinimum:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: Auction duration must be at least 60 minutes
                    instance: /api/v1/auctions
                    code: AUCTION_DURATION_TOO_SHORT
                aboveMaximum:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: Auction duration must be at most 168 hours
                    instance: /api/v1/auctions
                    code: AUCTION_DURATION_TOO_LONG
        '401':
          description: 'UNAUTHENTICATED — A valid bearer token is required.'
          headers:
            WWW-Authenticate:
              description: Bearer challenge.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller lacks SELLER or AUCTION.CREATE, or the product belongs to another seller.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      code:
                        enum: [FORBIDDEN, AUCTION_FORBIDDEN]
              example:
                type: urn:problem:domain-error
                title: Forbidden
                status: 403
                detail: The product belongs to another seller
                instance: /api/v1/auctions
                code: AUCTION_FORBIDDEN
        '404':
          description: The product is unavailable in the catalog or the selected SKU does not belong to it.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      code:
                        enum: [AUCTION_PRODUCT_NOT_FOUND, AUCTION_SKU_NOT_FOUND]
              examples:
                productNotFound:
                  value:
                    type: urn:problem:domain-error
                    title: Not Found
                    status: 404
                    detail: Product not found in catalog
                    instance: /api/v1/auctions
                    code: AUCTION_PRODUCT_NOT_FOUND
                skuNotFound:
                  value:
                    type: urn:problem:domain-error
                    title: Not Found
                    status: 404
                    detail: SKU not found on the selected product
                    instance: /api/v1/auctions
                    code: AUCTION_SKU_NOT_FOUND
        '429':
          description: 'RATE_LIMITED — Gateway request limit exceeded.'
          headers:
            Retry-After:
              description: Seconds until the request can be retried.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: 'INTERNAL_ERROR — Unexpected server error.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The catalog is unavailable or the gateway cannot reach auction-service.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      code:
                        enum: [AUCTION_CATALOG_UNAVAILABLE, SERVICE_UNAVAILABLE]
              example:
                type: urn:problem:domain-error
                title: Service Unavailable
                status: 503
                detail: Catalog is temporarily unavailable
                instance: /api/v1/auctions
                code: AUCTION_CATALOG_UNAVAILABLE
  /api/v1/auctions/{id}:
    put:
      tags: [Auctions]
      operationId: updateAuction
      summary: Configure an auction before it starts
      description: The authenticated actor must own the auction. Only CREATED/SCHEDULED before the stored startAt; updates startingPrice/currentPrice, bidIncrement, startAt, endAt and the originalEndAt baseline atomically.
      x-catalogue-id: AUC-02
      x-required-roles: [SELLER, ADMIN]
      x-required-privileges: [AUCTION.UPDATE]
      x-ownership: The authenticated actor must own the auction. Only CREATED/SCHEDULED before the stored startAt; updates startingPrice/currentPrice, bidIncrement, startAt, endAt and the originalEndAt baseline atomically.
      parameters:
        - name: id
          in: path
          required: true
          description: Auction UUID.
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuctionRequest'
      responses:
        '200':
          description: Updated auction snapshot; status is preserved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuctionResponse'
        '400':
          description: 'VALIDATION_FAILED, INVALID_PARAMETER, INVALID_REQUEST_BODY, AUCTION_START_IN_PAST, AUCTION_INVALID_TIME_WINDOW, AUCTION_DURATION_TOO_SHORT, AUCTION_DURATION_TOO_LONG.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/InvalidBearer'
        '403':
          description: 'FORBIDDEN for missing role or privilege; AUCTION_FORBIDDEN for ownership failure.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'AUCTION_NOT_FOUND — Missing or soft-deleted auction.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'AUCTION_NOT_EDITABLE or AUCTION_HAS_BIDS. No changes are committed.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Auctions]
      operationId: getAuction
      summary: Read a public auction snapshot
      description: >
        No token is required. Reads title and nullable imageUrl from auction-service's own row,
        without calling Catalog. RESTRICTED, soft-deleted and unknown auctions return the same 404.
        The response contains no winner or leader bidder identity.
      x-catalogue-id: AUC-04
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Auction UUID. The gateway public matcher accepts UUID-shaped paths only.
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Stored auction snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuctionResponse'
        '400':
          description: 'INVALID_PARAMETER — Invalid UUID when calling the service directly.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'AUCTION_NOT_FOUND — No public, non-deleted auction matches this UUID.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Not Found
                status: 404
                detail: Auction not found
                instance: /api/v1/auctions/00000051-1111-4111-8111-111111111111
                code: AUCTION_NOT_FOUND
        '401':
          $ref: '#/components/responses/InvalidBearer'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auctions/{id}/bids:
    post:
      tags: [Auctions]
      operationId: placeBid
      summary: Place a bid as a buyer
      description: >
        Places a bid on an ACTIVE auction from startAt (inclusive) to endAt
        (exclusive). Outside that window, bids are refused even if the status is still ACTIVE.
        A conditional update prevents concurrent bids from both winning the same price.
        The authenticated buyer may not bid on their own auction.
        Anti-sniping is enabled by default: an accepted bid with at most five minutes
        remaining adds five minutes to endAt, capped at originalEndAt plus the configured
        maximum extension (30 minutes by default). The bid, extension and BidPlaced outbox
        event commit together; refused bids leave the deadline unchanged. Read the auction
        again to obtain its effective endAt and extensionCount.
        Idempotency-Key is a required UUID. A new key returns 201. Reusing a key
        for the same auction, authenticated bidder and numeric amount returns 200
        with the original bidId, accepted amount and leaderBidderId, even if the
        auction state has since changed. Amounts such as 1050000 and 1050000.00
        are equivalent. A different amount with the same key returns 409
        AUCTION_IDEMPOTENCY_KEY_CONFLICT; use a new key for a different bid.
        A replay does not extend endAt or increment extensionCount, update the auction,
        insert a bid or publish another event. UUID letter case is normalized. The key is globally unique;
        reusing it for another auction, bidder or amount returns 409 without exposing
        the original bid. Concurrent successful requests with one key create
        one bid, increment bid_count once and publish one BidPlaced event.
      x-catalogue-id: BID-01
      x-required-roles: [BUYER]
      x-required-privileges: [AUCTION.BID]
      x-ownership: The bidder is the authenticated JWT subject and may not be the auction seller.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            UUID identifying one bid attempt. Retry with the same key after a
            timeout. Uppercase and lowercase UUID letters identify the same key.
            Use a new key for a new bid.
          schema:
            type: string
            format: uuid
            minLength: 36
            maxLength: 36
          example: 68000000-0000-4000-8000-000000000004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceBidRequest'
            example:
              amount: 1200000
      responses:
        '200':
          description: >
            The key was already accepted for this auction, bidder and numeric amount. Returns
            the original response data and leaves the auction, bids and outbox unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceBidResponse'
              example:
                code: 0
                message: response success
                data:
                  bidId: 019a5509-abcd-7111-8111-111111111112
                  currentPrice: 1200000
                  leaderBidderId: 68000000-0000-4000-8000-000000000003
        '201':
          description: Bid accepted and the auction price advanced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceBidResponse'
              example:
                code: 0
                message: response success
                data:
                  bidId: 019a5509-abcd-7111-8111-111111111112
                  currentPrice: 1200000
                  leaderBidderId: 68000000-0000-4000-8000-000000000003
        '400':
          description: >
            Idempotency-Key is missing or invalid, or the bid amount is invalid
            or below the current minimum. A rejected request writes no bid.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/Problem'
                      - type: object
                        required: [minimum]
                        properties:
                          status:
                            enum: [400]
                          code:
                            enum: [AUCTION_BID_TOO_LOW]
                          minimum:
                            type: number
                            minimum: 0
                            multipleOf: 0.01
                            description: The minimum amount accepted at the time of the failed bid.
                  - allOf:
                      - $ref: '#/components/schemas/Problem'
                      - type: object
                        properties:
                          status:
                            enum: [400]
                          code:
                            enum: [AUCTION_IDEMPOTENCY_KEY_REQUIRED, AUCTION_INVALID_IDEMPOTENCY_KEY, INVALID_REQUEST_BODY, VALIDATION_FAILED, INVALID_PARAMETER]
              examples:
                missingIdempotencyKey:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: Idempotency-Key is required
                    instance: /api/v1/auctions/019a5509-abcd-7111-8111-111111111111/bids
                    code: AUCTION_IDEMPOTENCY_KEY_REQUIRED
                invalidIdempotencyKey:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: Idempotency-Key must be a UUID
                    instance: /api/v1/auctions/019a5509-abcd-7111-8111-111111111111/bids
                    code: AUCTION_INVALID_IDEMPOTENCY_KEY
                tooLow:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: Bid amount must be at least 1250000
                    instance: /api/v1/auctions/019a5509-abcd-7111-8111-111111111111/bids
                    code: AUCTION_BID_TOO_LOW
                    minimum: 1250000
        '401':
          description: 'UNAUTHENTICATED — A valid bearer token is required.'
          headers:
            WWW-Authenticate:
              description: Bearer challenge.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'FORBIDDEN — The caller lacks the BUYER role or the AUCTION.BID privilege.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Auction not found.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status:
                        enum: [404]
                      code:
                        enum: [AUCTION_NOT_FOUND]
              example:
                type: urn:problem:domain-error
                title: Not Found
                status: 404
                detail: Auction not found
                instance: /api/v1/auctions/019a5509-abcd-7111-8111-111111111111/bids
                code: AUCTION_NOT_FOUND
        '409':
          description: >
            Auction is outside its bid window, is not ACTIVE, the bidder is the auction seller,
            or the key was already accepted for another auction, bidder or amount.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status:
                        enum: [409]
                      code:
                        enum: [AUCTION_NOT_ACTIVE, AUCTION_SELLER_CANNOT_BID, AUCTION_IDEMPOTENCY_KEY_CONFLICT]
              examples:
                idempotencyKeyConflict:
                  value:
                    type: urn:problem:domain-error
                    title: Conflict
                    status: 409
                    detail: Idempotency-Key was already used for another auction, bidder or amount
                    instance: /api/v1/auctions/019a5509-abcd-7111-8111-111111111111/bids
                    code: AUCTION_IDEMPOTENCY_KEY_CONFLICT
                notActive:
                  value:
                    type: urn:problem:domain-error
                    title: Conflict
                    status: 409
                    detail: Auction is not ACTIVE
                    instance: /api/v1/auctions/019a5509-abcd-7111-8111-111111111111/bids
                    code: AUCTION_NOT_ACTIVE
                sellerCannotBid:
                  value:
                    type: urn:problem:domain-error
                    title: Conflict
                    status: 409
                    detail: The auction seller cannot place a bid
                    instance: /api/v1/auctions/019a5509-abcd-7111-8111-111111111111/bids
                    code: AUCTION_SELLER_CANNOT_BID
        '429':
          description: 'RATE_LIMITED — Gateway request limit exceeded.'
          headers:
            Retry-After:
              description: Seconds until the request can be retried.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: 'INTERNAL_ERROR — Unexpected server error.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 'SERVICE_UNAVAILABLE — The gateway could not reach auction-service.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auctions/{id}/schedule:
    post:
      tags: [Auctions]
      operationId: scheduleAuction
      summary: Publish an auction as its seller
      description: Changes an owned auction from CREATED to SCHEDULED using its existing time window.
      x-catalogue-id: AUC-03
      x-required-roles: [SELLER]
      x-required-privileges: [AUCTION.UPDATE]
      x-ownership: The auction sellerId must match the authenticated JWT subject.
      parameters:
        - name: id
          in: path
          required: true
          description: Auction UUID.
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The auction snapshot with status SCHEDULED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuctionResponse'
        '400':
          description: 'INVALID_PARAMETER — Invalid auction UUID.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 'UNAUTHENTICATED — A valid bearer token is required.'
          headers:
            WWW-Authenticate:
              description: Bearer challenge.
              schema: {type: string}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'FORBIDDEN for missing role or privilege, or AUCTION_FORBIDDEN when the seller does not own the auction.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'AUCTION_NOT_FOUND — The auction does not exist or was soft-deleted.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'AUCTION_ILLEGAL_TRANSITION — The owned auction is no longer CREATED.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auctions/{id}/cancel:
    post:
      tags: [Auctions]
      operationId: cancelAuction
      summary: Cancel an auction as its seller
      description: Only the owning Seller may cancel a non-final auction with no valid bids. PLACED/OUTBID/WON bids count as valid; CANCELLED bids do not. Records actor/reason/time and AuctionCancelled in one transaction.
      x-catalogue-id: AUC-07
      x-required-roles: [SELLER]
      x-required-privileges: [AUCTION.CANCEL]
      x-ownership: Only the owning Seller may cancel a non-final auction with no valid bids. PLACED/OUTBID/WON bids count as valid; CANCELLED bids do not. Records actor/reason/time and AuctionCancelled in one transaction.
      parameters:
        - name: id
          in: path
          required: true
          description: Auction UUID.
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAuctionRequest'
      responses:
        '200':
          description: CANCELLED snapshot with cancellation audit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuctionResponse'
        '400':
          description: 'VALIDATION_FAILED, INVALID_PARAMETER, INVALID_REQUEST_BODY.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/InvalidBearer'
        '403':
          description: 'FORBIDDEN for missing role or privilege; AUCTION_FORBIDDEN for ownership failure.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'AUCTION_NOT_FOUND — Missing or soft-deleted auction.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'AUCTION_HAS_BIDS or AUCTION_ILLEGAL_TRANSITION. Final states are SETTLED, FAILED, PAYMENT_TIMEOUT and CANCELLED.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auctions/{id}/admin-cancel:
    post:
      tags: [Auctions]
      operationId: adminCancelAuction
      summary: Cancel a non-final auction as an admin
      description: Any auction in CREATED/SCHEDULED/ACTIVE/ENDED/WON, including auctions with bids. Final SETTLED/FAILED/PAYMENT_TIMEOUT/CANCELLED cannot be cancelled. Emits one AuctionCancelled; repeated calls return 409 without another event.
      x-catalogue-id: AUC-08
      x-required-roles: [ADMIN]
      x-required-privileges: [AUCTION.ADMIN_CANCEL]
      x-ownership: Any auction in CREATED/SCHEDULED/ACTIVE/ENDED/WON, including auctions with bids. Final SETTLED/FAILED/PAYMENT_TIMEOUT/CANCELLED cannot be cancelled. Emits one AuctionCancelled; repeated calls return 409 without another event.
      parameters:
        - name: id
          in: path
          required: true
          description: Auction UUID.
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAuctionRequest'
      responses:
        '200':
          description: CANCELLED snapshot with cancelledBy ADMIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuctionResponse'
        '400':
          description: 'VALIDATION_FAILED, INVALID_PARAMETER, INVALID_REQUEST_BODY.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/InvalidBearer'
        '403':
          description: 'FORBIDDEN for missing role or privilege; AUCTION_FORBIDDEN for ownership failure.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'AUCTION_NOT_FOUND — Missing or soft-deleted auction.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'AUCTION_ILLEGAL_TRANSITION — The auction is already final.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    MinePage:
      name: page
      in: query
      description: Zero-based page number.
      schema: {type: integer, minimum: 0, default: 0}
    MineSize:
      name: size
      in: query
      description: Number of distinct result rows per page.
      schema: {type: integer, minimum: 1, maximum: 100, default: 10}
  responses:
    MineInvalidQuery:
      description: INVALID_PARAMETER, VALIDATION_FAILED or INVALID_REQUEST_BODY; malformed query or paging bounds.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    MineUnauthorized:
      description: UNAUTHENTICATED; valid bearer token required.
      headers:
        WWW-Authenticate:
          description: Bearer challenge.
          schema: {type: string}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    MineForbidden:
      description: FORBIDDEN; caller lacks the endpoint role or privilege.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InvalidBearer:
      description: 'UNAUTHENTICATED — No token is needed, but an invalid supplied token is rejected.'
      headers:
        WWW-Authenticate:
          description: Bearer challenge.
          schema: {type: string}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 'RATE_LIMITED — Gateway request limit exceeded.'
      headers:
        Retry-After:
          description: Seconds until the request can be retried.
          schema: {type: string}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnexpectedError:
      description: 'INTERNAL_ERROR — Unexpected server error.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: 'SERVICE_UNAVAILABLE — The gateway could not reach auction-service.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MyBid:
      type: object
      additionalProperties: false
      required: [auctionId, title, amount, placedAt, auctionStatus, leading, won]
      properties:
        auctionId: {type: string, format: uuid}
        title: {type: string}
        amount: {type: number, multipleOf: 0.01, description: Latest personal bid amount as a JSON number.}
        placedAt: {type: string, format: date-time}
        auctionStatus: {$ref: '#/components/schemas/AuctionStatus'}
        leading: {type: boolean}
        won: {type: boolean}
    ListMyBidsResponse:
      type: object
      required: [code, message, data, page]
      properties:
        code: {type: integer, default: 0}
        message: {type: string, default: response success}
        data:
          type: array
          items: {$ref: '#/components/schemas/MyBid'}
        page:
          type: object
          required: [number, size, totalElements, totalPages]
          properties:
            number: {type: integer, minimum: 0}
            size: {type: integer, minimum: 1, maximum: 100}
            totalElements: {type: integer, format: int64, minimum: 0}
            totalPages: {type: integer, minimum: 0}
    AuctionStatus:
      type: string
      enum: [CREATED, SCHEDULED, ACTIVE, ENDED, WON, SETTLED, FAILED, PAYMENT_TIMEOUT, CANCELLED]
    GetAuctionResponse:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, default: 0}
        message: {type: string, default: response success}
        data:
          $ref: '#/components/schemas/Auction'
    ListAuctionsResponse:
      type: object
      required: [code, message, data, page]
      properties:
        code: {type: integer, default: 0}
        message: {type: string, default: response success}
        data:
          type: array
          items:
            $ref: '#/components/schemas/Auction'
        page:
          type: object
          required: [number, size, totalElements, totalPages]
          properties:
            number: {type: integer, minimum: 0}
            size: {type: integer, minimum: 1, maximum: 100}
            totalElements: {type: integer, format: int64, minimum: 0}
            totalPages: {type: integer, minimum: 0}
    CreateAuctionRequest:
      type: object
      required: [productId, skuId, startingPrice, startAt, endAt]
      properties:
        productId:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
          maxLength: 255
          deprecated: true
          description: Accepted for existing clients. The stored title comes from the catalog product name.
        startingPrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          description: At most 17 integer digits and two fractional digits.
        bidIncrement:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          description: Uses nexus.auction.default-bid-increment when omitted or null. At most 17 integer digits and two fractional digits.
        startAt:
          type: string
          format: date-time
          description: Must not precede server time by more than 5 seconds.
        endAt:
          type: string
          format: date-time
    UpdateAuctionRequest:
      type: object
      required: [startingPrice, bidIncrement, startAt, endAt]
      properties:
        startingPrice:
          $ref: '#/components/schemas/CreateAuctionRequest/properties/startingPrice'
        bidIncrement:
          type: number
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          description: Required, positive; at most 17 integer digits and two fractional digits.
        startAt:
          type: string
          format: date-time
          description: Must not precede server time by more than 5 seconds.
        endAt:
          type: string
          format: date-time
          description: After startAt, with AUCTION_MIN_DURATION_MINUTES and AUCTION_MAX_DURATION_HOURS enforced.
    CancelAuctionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
          description: Must contain non-whitespace; surrounding whitespace is stripped when stored.
    CreateAuctionResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          $ref: '#/components/schemas/Auction'
    PlaceBidRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 100000000000000000
          exclusiveMaximum: true
          multipleOf: 0.01
          description: Bid amount with at most 17 integer digits and two fractional digits.
    PlaceBidResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          $ref: '#/components/schemas/BidResponse'
    BidResponse:
      type: object
      required: [bidId, currentPrice, leaderBidderId]
      properties:
        bidId:
          type: string
          format: uuid
        currentPrice:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: The original accepted bid amount, including on a replay after the auction price has changed.
        leaderBidderId:
          type: string
          format: uuid
    Auction:
      type: object
      required: [id, productId, skuId, sellerId, title, startingPrice, bidIncrement, currentPrice, bidCount, currency, startAt, endAt, originalEndAt, extensionCount, status]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        sellerId:
          type: string
          format: uuid
        title:
          type: string
        imageUrl:
          type: string
          nullable: true
        startingPrice:
          type: number
          minimum: 0
        bidIncrement:
          type: number
          minimum: 0
          exclusiveMinimum: true
        currentPrice:
          type: number
          minimum: 0
        bidCount:
          type: integer
          minimum: 0
        currency:
          type: string
          enum: [VND]
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        originalEndAt:
          type: string
          format: date-time
        extensionCount:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/AuctionStatus'
        cancelledBy:
          type: string
          nullable: true
          enum: [SELLER, ADMIN]
        cancelledReason:
          type: string
          nullable: true
          maxLength: 255
        cancelledActorId:
          type: string
          format: uuid
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
    Problem:
      type: object
      required: [type, title, status, detail, instance, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, code, detail]
            properties:
              field:
                type: string
              code:
                type: string
              detail:
                type: string
