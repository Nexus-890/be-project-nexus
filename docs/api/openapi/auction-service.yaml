                      - $ref: "#/components/schemas/Problem"
                      - type: object
                        required:
                          - minimum
                        properties:
                          status:
                            enum:
                              - 400
                          code:
                            enum: []
                          minimum:
                            type: number
                            minimum: 0
                            multipleOf: 0.01
                            description: The minimum amount accepted at the time of the failed bid.
                  - allOf:
                      - $ref: "#/components/schemas/Problem"
                      - type: object
                        properties:
                          status:
                            enum:
                              - 400
                          code:
                            enum:
                              - AUCTION_IDEMPOTENCY_KEY_REQUIRED
                              - AUCTION_INVALID_IDEMPOTENCY_KEY
                              - INVALID_REQUEST_BODY
                              - VALIDATION_FAILED
                              - INVALID_PARAMETER
              examples:
                missingIdempotencyKey:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: Idempotency-Key is required
                    instance: /api/v1/auctions/019a5509-abcd-7111-8111-111111111111/bids
                    code: AUCTION_IDEMPOTENCY_KEY_REQUIRED
                invalidIdempotencyKey:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: Idempotency-Key must be a UUID
                    instance: /api/v1/auctions/019a5509-abcd-7111-8111-111111111111/bids
                    code: AUCTION_INVALID_IDEMPOTENCY_KEY
        "401":
          description: UNAUTHENTICATED — A valid bearer token is required.
          headers:
            WWW-Authenticate:
              description: Bearer challenge.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'FORBIDDEN for a missing BUYER role or AUCTION.BID privilege; AUCTION_REPUTATION_TOO_LOW when enabled enforcement denies BID eligibility.'
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      code:
                        enum: [FORBIDDEN, AUCTION_REPUTATION_TOO_LOW]
                      reason:
                        type: string
                        minLength: 1
                        description: Policy explanation included for AUCTION_REPUTATION_TOO_LOW.
              example:
                type: urn:problem:domain-error
                title: Forbidden
                status: 403
                detail: Reputation score 39 is below 40 required for BID
                instance: /api/v1/auctions/019afe64-9800-7000-8000-000000000001/bids
                code: AUCTION_REPUTATION_TOO_LOW
                reason: Reputation score 39 is below 40 required for BID
        '404':
          description: Auction not found.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - type: object
                    properties:
                      status:
                        enum:
                          - 404
                      code:
                        enum:
                          - AUCTION_NOT_FOUND
              example:
                type: urn:problem:domain-error
                title: Not Found
                status: 404
                detail: Auction not found
                instance: /api/v1/auctions/019a5509-abcd-7111-8111-111111111111/bids
                code: AUCTION_NOT_FOUND
        "409":
          description: >
            Auction is outside its bid window, is not ACTIVE, the bidder is the auction seller, or the key was already
            accepted for another auction, bidder or amount.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - type: object
                    properties:
                      status:
                        enum:
                          - 409
                      code:
                        enum:
                          - AUCTION_NOT_ACTIVE
                          - AUCTION_SELLER_CANNOT_BID
                          - AUCTION_IDEMPOTENCY_KEY_CONFLICT
              examples:
                idempotencyKeyConflict:
                  value:
                    type: urn:problem:domain-error
                    title: Conflict
                    status: 409
                    detail: Idempotency-Key was already used for another auction, bidder or amount
                    instance: /api/v1/auctions/019a5509-abcd-7111-8111-111111111111/bids
                    code: AUCTION_IDEMPOTENCY_KEY_CONFLICT
                notActive:
                  value:
                    type: urn:problem:domain-error
                    title: Conflict
                    status: 409
                    detail: Auction is not ACTIVE
                    instance: /api/v1/auctions/019a5509-abcd-7111-8111-111111111111/bids
                    code: AUCTION_NOT_ACTIVE
                sellerCannotBid:
                  value:
                    type: urn:problem:domain-error
                    title: Conflict
                    status: 409
                    detail: The auction seller cannot place a bid
                    instance: /api/v1/auctions/019a5509-abcd-7111-8111-111111111111/bids
                    code: AUCTION_SELLER_CANNOT_BID
        "429":
          description: RATE_LIMITED — Gateway request limit exceeded.
          headers:
            Retry-After:
              description: Seconds until the request can be retried.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: INTERNAL_ERROR — Unexpected server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 'AUCTION_REPUTATION_UNAVAILABLE when an enabled check has token, timeout, transport, circuit or malformed-decision failure; SERVICE_UNAVAILABLE when the gateway cannot reach auction-service. No bid, price, deadline or outbox write occurs.'
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      code:
                        enum: [AUCTION_REPUTATION_UNAVAILABLE, SERVICE_UNAVAILABLE]
              example:
                type: urn:problem:domain-error
                title: Service Unavailable
                status: 503
                detail: Reputation eligibility is temporarily unavailable
                instance: /api/v1/auctions/019afe64-9800-7000-8000-000000000001/bids
                code: AUCTION_REPUTATION_UNAVAILABLE
  /api/v1/auctions/{id}/schedule:
    post:
      tags: [Auctions]
      operationId: scheduleAuction
      summary: Publish an auction as its seller
      description: Changes an owned auction from CREATED to SCHEDULED using its existing time window.
      x-catalogue-id: AUC-03
      x-required-roles: [SELLER]
      x-required-privileges: [AUCTION.UPDATE]
      x-ownership: The auction sellerId must match the authenticated JWT subject.
      parameters:
        - name: id
          in: path
          required: true
          description: Auction UUID.
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The auction snapshot with status SCHEDULED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuctionResponse'
        '400':
          description: 'INVALID_PARAMETER — Invalid auction UUID.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 'UNAUTHENTICATED — A valid bearer token is required.'
          headers:
            WWW-Authenticate:
              description: Bearer challenge.
              schema: {type: string}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'FORBIDDEN for missing role or privilege, or AUCTION_FORBIDDEN when the seller does not own the auction.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'AUCTION_NOT_FOUND — The auction does not exist or was soft-deleted.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'AUCTION_ILLEGAL_TRANSITION — The owned auction is no longer CREATED.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auctions/{id}/cancel:
    post:
      tags: [Auctions]
      operationId: cancelAuction
      summary: Cancel an auction as its seller
      description: Only the owning Seller may cancel a non-final auction with no valid bids. PLACED/OUTBID/WON bids count as valid; CANCELLED bids do not. Records actor/reason/time and AuctionCancelled in one transaction.
      x-catalogue-id: AUC-07
      x-required-roles: [SELLER]
      x-required-privileges: [AUCTION.CANCEL]
      x-ownership: Only the owning Seller may cancel a non-final auction with no valid bids. PLACED/OUTBID/WON bids count as valid; CANCELLED bids do not. Records actor/reason/time and AuctionCancelled in one transaction.
      parameters:
        - name: id
          in: path
          required: true
          description: Auction UUID.
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAuctionRequest'
      responses:
        '200':
          description: CANCELLED snapshot with cancellation audit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuctionResponse'
        '400':
          description: 'VALIDATION_FAILED, INVALID_PARAMETER, INVALID_REQUEST_BODY.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/InvalidBearer'
        '403':
          description: 'FORBIDDEN for missing role or privilege; AUCTION_FORBIDDEN for ownership failure.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'AUCTION_NOT_FOUND — Missing or soft-deleted auction.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'AUCTION_HAS_BIDS or AUCTION_ILLEGAL_TRANSITION. Final states are SETTLED, FAILED, PAYMENT_TIMEOUT and CANCELLED.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UnexpectedError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auctions/{id}/admin-cancel:
