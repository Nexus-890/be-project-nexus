  /api/v1/notifications/{id}/read:
    patch:
      tags: [Notifications]
      operationId: markNotificationAsRead
      summary: "Mark one own notification as read"
      description: "Requires NOTIFICATION.VIEW and ownership by the JWT subject. Another owner returns 403; absent ID returns 404. Already-read rows are unchanged."
      security:
        - bearerAuth: []
      x-required-privileges: [NOTIFICATION.VIEW]
      x-required-roles: []
      x-gateway-privilege: NOTIFICATION.VIEW
      x-ownership: "Only notifications belonging to the JWT subject."
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
          description: Notification ID.
      responses:
        "204":
          description: Read state recorded; no response body.
        "400":
          description: "Bad Request. Codes: INVALID_PARAMETER."
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - type: object
                    properties:
                      status: {type: integer, enum: [400]}
                      code:
                        type: string
                        enum: ["INVALID_PARAMETER"]
              examples:
                INVALID_PARAMETER:
                  value:
                    type: "urn:problem:invalid-parameter"
                    title: "Bad Request"
                    status: 400
                    detail: "A request parameter is invalid"
                    instance: "/api/v1/notifications/c8000000-0000-4000-8000-000000000005/read"
                    code: "INVALID_PARAMETER"
        "401":
          description: "Unauthorized. Codes: UNAUTHENTICATED, NOTIFICATION_UNAUTHENTICATED."
          headers:
            WWW-Authenticate:
              schema: {type: string}
              description: Bearer challenge for security failures.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - type: object
                    properties:
                      status: {type: integer, enum: [401]}
                      code:
                        type: string
                        enum: ["UNAUTHENTICATED","NOTIFICATION_UNAUTHENTICATED"]
              examples:
                UNAUTHENTICATED:
                  value:
                    type: "urn:problem:unauthenticated"
                    title: "Unauthorized"
                    status: 401
                    detail: "A valid access token is required to access this resource"
                    instance: "/api/v1/notifications/c8000000-0000-4000-8000-000000000005/read"
                    code: "UNAUTHENTICATED"
                NOTIFICATION_UNAUTHENTICATED:
