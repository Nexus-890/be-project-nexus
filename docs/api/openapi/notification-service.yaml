                        type: string
                        enum: ["FORBIDDEN","NOTIFICATION_NOT_OWNER"]
              examples:
                FORBIDDEN:
                  value:
                    type: "urn:problem:forbidden"
                    title: "Forbidden"
                    status: 403
                    detail: "You do not have permission to access this resource"
                    instance: "/api/v1/notifications/c8000000-0000-4000-8000-000000000005/read"
                    code: "FORBIDDEN"
                NOTIFICATION_NOT_OWNER:
                  value:
