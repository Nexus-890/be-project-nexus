        page:
          $ref: '#/components/schemas/PageInfo'
      additionalProperties: false
    HealthStatus:
      type: "string"
      enum: ["UP", "DOWN", "UNKNOWN"]
      description: "UNKNOWN is only used for brokers: not checked yet, or the Redis health state is unreachable."
    ServiceHealth:
