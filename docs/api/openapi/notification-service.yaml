                    code: "FORBIDDEN"
        "405":
          description: "Method Not Allowed. Codes: `METHOD_NOT_ALLOWED`."
          content:
            application/problem+json:
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problem"

                  -
                    type: "object"
                    required: []
                    properties:
                      status:
                        type: "integer"
                        enum:
                          - 405
                      code:
                        type: "string"
                        enum:
