              examples:
                SERVICE_UNAVAILABLE:
                  summary: "SERVICE_UNAVAILABLE"
                  value:
                    type: "urn:problem:service-unavailable"
                    title: "Service Unavailable"
                    status: 503
                    detail: "A required service is unavailable"
                    instance: "/api/v1/notifications"
                    code: "SERVICE_UNAVAILABLE"
        "504":
          description: "Gateway Timeout. Codes: `GATEWAY_TIMEOUT`."
          content:
            application/problem+json:
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problem"

                  -
                    type: "object"
                    required: []
                    properties:
                      status:
                        type: "integer"
                        enum:
                          - 504
                      code:
                        type: "string"
                        enum:
                          - "GATEWAY_TIMEOUT"

              examples:
                GATEWAY_TIMEOUT:
                  summary: "GATEWAY_TIMEOUT"
                  value:
                    type: "urn:problem:gateway-timeout"
                    title: "Gateway Timeout"
                    status: 504
                    detail: "The service did not answer in time"
                    instance: "/api/v1/notifications"
                    code: "GATEWAY_TIMEOUT"
      x-gateway-privilege: "NOTIFICATION.VIEW"
      parameters:
        -
          name: "page"
          in: "query"
          description: "Zero-based page number."
          schema:
            type: "integer"
            minimum: 0
            default: 0

        -
          name: "size"
          in: "query"
          description: "Requested page size."
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 10

