# Delivered API contract reconciled with develop for issue #248.
openapi: "3.0.3"
info:
  title: "Nexus notification-service delivered API"
  version: "1.0.0"
  description: "Delivered notification reads reconciled with #248 after the develop merge. Application JSON uses code (default 0), message (default response success), data and sibling page for lists. Errors use symbolic Problem Details codes. ADR approval and the coordinated FE cutover remain pending."
servers:
  -
    url: "http://localhost:8080"
    description: "Local API gateway."

tags:
  -
    name: "Notifications"
    description: "Own notifications and unread count."

security:
  -
    bearerAuth: []

paths:
  /api/v1/notifications:
    get:
      tags:
        - "Notifications"
      operationId: "listNotifications"
      summary: "List the current user's notifications"
      description: "Requires NOTIFICATION.VIEW. JWT subject only. Zero-based pagination, newest createdAt first then id descending. Defaults page=0, size=10; size must be 1 to 100. An empty/beyond-end page returns data:[] with actual totals."
      security:
        -
          bearerAuth: []

      x-required-privileges:
        - "NOTIFICATION.VIEW"
      x-required-roles: []
      x-ownership: "See operation description."
      responses:
        "200":
          description: "Successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
              examples:
                success:
                  summary: "Success"
                  value:
                    code: 0
                    message: "response success"
                    data:
                      -
                        id: "c8000000-0000-4000-8000-000000000005"
                        type: "ORDER_CREATED"
                        title: "Order placed"
                        content: "Your order was placed."
                        readAt: null
                        createdAt: "2026-10-29T08:00:00Z"

                    page:
                      number: 0
                      size: 10
                      totalElements: 1
                      totalPages: 1
        "400":
          description: "Bad Request. Codes: `INVALID_PARAMETER`, `NOTIFICATION_DATA_INVALID`."
          content:
            application/problem+json:
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problem"

                  -
                    type: "object"
                    required: []
                    properties:
                      status:
                        type: "integer"
                        enum:
                          - 400
                      code:
                        type: "string"
                        enum:
                          - "INVALID_PARAMETER"
                          - "NOTIFICATION_DATA_INVALID"

              examples:
                INVALID_PARAMETER:
                  summary: "INVALID_PARAMETER"
                  value:
                    type: "urn:problem:invalid-parameter"
                    title: "Bad Request"
                    status: 400
                    detail: "A request parameter is invalid"
                    instance: "/api/v1/notifications"
                    code: "INVALID_PARAMETER"
                NOTIFICATION_DATA_INVALID:
                  summary: "NOTIFICATION_DATA_INVALID"
                  value:
                    type: "urn:problem:domain-error"
                    title: "Bad Request"
                    status: 400
                    detail: "Invalid data"
                    instance: "/api/v1/notifications"
                    code: "NOTIFICATION_DATA_INVALID"
        "401":
          description: "Unauthorized. Codes: `UNAUTHENTICATED`, `NOTIFICATION_UNAUTHENTICATED`."
          headers:
            WWW-Authenticate:
              description: "Bearer challenge for security failures; domain failures may omit it."
              schema:
                type: "string"
                example: "Bearer"
          content:
            application/problem+json:
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problem"

                  -
                    type: "object"
                    required: []
                    properties:
                      status:
                        type: "integer"
                        enum:
                          - 401
                      code:
                        type: "string"
                        enum:
                          - "UNAUTHENTICATED"
                          - "NOTIFICATION_UNAUTHENTICATED"

              examples:
                UNAUTHENTICATED:
                  summary: "UNAUTHENTICATED"
                  value:
                    type: "urn:problem:unauthenticated"
                    title: "Unauthorized"
                    status: 401
                    detail: "A valid access token is required to access this resource"
                    instance: "/api/v1/notifications"
                    code: "UNAUTHENTICATED"
                NOTIFICATION_UNAUTHENTICATED:
                  summary: "NOTIFICATION_UNAUTHENTICATED"
                  value:
                    type: "urn:problem:domain-error"
                    title: "Unauthorized"
                    status: 401
                    detail: "Unauthenticated!"
                    instance: "/api/v1/notifications"
                    code: "NOTIFICATION_UNAUTHENTICATED"
        "403":
          description: "Forbidden. Codes: `FORBIDDEN`."
