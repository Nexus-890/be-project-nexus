                    required: []
                    properties:
                      status:
                        type: "integer"
                        enum:
                          - 406
                      code:
                        type: "string"
                        enum:
                          - "NOT_ACCEPTABLE"

              examples:
                NOT_ACCEPTABLE:
                  summary: "NOT_ACCEPTABLE"
                  value:
                    type: "urn:problem:not-acceptable"
                    title: "Not Acceptable"
                    status: 406
                    detail: "The requested response format is not supported"
                    instance: "/api/v1/notifications"
                    code: "NOT_ACCEPTABLE"
        "429":
          description: "Too Many Requests. Codes: `RATE_LIMITED`."
          content:
            application/problem+json:
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problem"

                  -
                    type: "object"
                    required: []
                    properties:
                      status:
                        type: "integer"
                        enum:
                          - 429
                      code:
                        type: "string"
                        enum:
                          - "RATE_LIMITED"

              examples:
                RATE_LIMITED:
                  summary: "RATE_LIMITED"
                  value:
                    type: "urn:problem:rate-limited"
                    title: "Too Many Requests"
                    status: 429
                    detail: "Too many requests; retry after the indicated delay"
                    instance: "/api/v1/notifications"
                    code: "RATE_LIMITED"
          headers:
            Retry-After:
              description: "Present when supplied by the limiter."
              schema:
                type: "string"
        "500":
          description: "Internal Server Error. Codes: `INTERNAL_ERROR`."
          content:
            application/problem+json:
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problem"

                  -
                    type: "object"
                    required: []
                    properties:
                      status:
                        type: "integer"
                        enum:
                          - 500
                      code:
                        type: "string"
                        enum:
                          - "INTERNAL_ERROR"

              examples:
                INTERNAL_ERROR:
                  summary: "INTERNAL_ERROR"
                  value:
                    type: "urn:problem:internal-error"
                    title: "Internal Server Error"
                    status: 500
                    detail: "An unexpected error occurred"
                    instance: "/api/v1/notifications"
                    code: "INTERNAL_ERROR"
        "503":
          description: "Service Unavailable. Codes: `SERVICE_UNAVAILABLE`."
          content:
            application/problem+json:
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problem"

                  -
                    type: "object"
                    required: []
                    properties:
