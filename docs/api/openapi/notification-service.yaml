components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
  schemas:
    Problem:
      type: "object"
      required:
        - "type"
        - "title"
        - "status"
        - "detail"
        - "instance"
        - "code"
      properties:
        type:
          type: "string"
          format: "uri-reference"
        title:
          type: "string"
        status:
          type: "integer"
          minimum: 400
          maximum: 599
        detail:
          type: "string"
        instance:
          type: "string"
          format: "uri-reference"
        code:
          type: "string"
          pattern: "\\S"
          minLength: 1
          description: "Stable symbolic identifier. Branch on code and status; tolerate future unknown codes."
        traceId:
          type: "string"
          pattern: "\\S"
          minLength: 1
          description: "Active trace/correlation identifier when available; optional without tracing."
        errors:
          type: "array"
          items:
            $ref: "#/components/schemas/ValidationError"
    ValidationError:
      type: "object"
      required:
        - "field"
        - "code"
        - "detail"
      properties:
        field:
          type: "string"
          description: "Failed request field; an object-level failure uses the object name."
        code:
          type: "string"
          description: "Constraint identifier, for example VALIDATION_NOT_BLANK, VALIDATION_EMAIL, VALIDATION_SIZE or INVALID_PARAMETER."
        detail:
          type: "string"
    PageInfo:
      type: "object"
      required:
        - "number"
        - "size"
        - "totalElements"
        - "totalPages"
      properties:
        number:
          type: "integer"
          minimum: 0
        size:
          type: "integer"
          minimum: 1
        totalElements:
          type: "integer"
          format: "int64"
          minimum: 0
        totalPages:
          type: "integer"
          minimum: 0
    Notification:
      type: "object"
      required:
        - "id"
        - "type"
        - "title"
        - "content"
        - "readAt"
        - "createdAt"
      properties:
        id:
          type: "string"
          format: "uuid"
        type:
          type: "string"
          maxLength: 60
        title:
          type: "string"
          maxLength: 255
        content:
          type: "string"
        readAt:
          type: "string"
          format: "date-time"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
    NotificationListResponse:
      type: "object"
      required:
        - "code"
        - "message"
        - "data"
        - "page"
      properties:
        code:
          type: "integer"
          default: 0
        message:
          type: "string"
          default: "response success"
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/Notification"
        page:
          $ref: "#/components/schemas/PageInfo"
      additionalProperties: false
    UnreadNotificationCountResponse:
      type: "object"
      required:
        - "code"
        - "message"
        - "data"
      properties:
        code:
          type: "integer"
          default: 0
        message:
          type: "string"
          default: "response success"
        data:
          type: "object"
          required:
            - "count"
          properties:
            count:
              type: "integer"
              format: "int64"
              minimum: 0
      additionalProperties: false
    HealthStatus:
      type: "string"
      enum: ["UP", "DOWN"]
    ServiceHealth:
      type: "object"
      required: ["name", "status"]
      properties:
        name:
          type: "string"
          description: "Eureka service id, or keycloak."
        status:
          $ref: "#/components/schemas/HealthStatus"
    BrokerStatus:
      type: "object"
      required: ["name", "status", "lastCheckedAt"]
      properties:
        name:
          type: "string"
        status:
          $ref: "#/components/schemas/HealthStatus"
        lastCheckedAt:
          type: "string"
          format: "date-time"
    BrokerHealth:
      type: "object"
      required: ["name", "status", "lastCheckedAt", "lastFailureAt", "lastRecoveredAt"]
      properties:
        name:
          type: "string"
        status:
          $ref: "#/components/schemas/HealthStatus"
        lastCheckedAt:
          type: "string"
          format: "date-time"
        lastFailureAt:
          type: "string"
          format: "date-time"
          nullable: true
        lastRecoveredAt:
          type: "string"
          format: "date-time"
          nullable: true
    SystemHealthResponse:
      type: "object"
      required: ["code", "message", "data"]
      properties:
        code:
          type: "integer"
          default: 0
        message:
          type: "string"
          default: "response success"
        data:
          type: "object"
          required: ["services", "brokers"]
          properties:
            services:
              type: "array"
              items:
                $ref: "#/components/schemas/ServiceHealth"
            brokers:
              type: "array"
              items:
                $ref: "#/components/schemas/BrokerStatus"
      additionalProperties: false
    BrokerHealthListResponse:
      type: "object"
      required: ["code", "message", "data", "page"]
      properties:
        code:
          type: "integer"
          default: 0
        message:
          type: "string"
          default: "response success"
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/BrokerHealth"
        page:
          $ref: "#/components/schemas/PageInfo"
      additionalProperties: false
x-service: "notification-service"
x-business-error-codes:
  NOTIFICATION_DATA_INVALID:
    status: 400
    detail: "Invalid data"
  NOTIFICATION_UNAUTHENTICATED:
    status: 401
