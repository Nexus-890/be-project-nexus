      operationId: "getUnreadNotificationCount"
      summary: "Count the current user's unread notifications"
      description: "Requires NOTIFICATION.VIEW. JWT subject only. Counts rows with readAt unset."
      security:
        -
          bearerAuth: []

      x-required-privileges:
        - "NOTIFICATION.VIEW"
      x-required-roles: []
      x-ownership: "See operation description."
      responses:
        "200":
          description: "Successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadNotificationCountResponse"
              examples:
                success:
                  summary: "Success"
                  value:
                    code: 0
                    message: "response success"
                    data:
                      count: 1
        "401":
          description: "Unauthorized. Codes: `UNAUTHENTICATED`, `NOTIFICATION_UNAUTHENTICATED`."
          headers:
