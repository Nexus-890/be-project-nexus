                        type: "integer"
                        enum:
                          - 403
                      code:
                        type: "string"
                        enum:
                          - "FORBIDDEN"

              examples:
                FORBIDDEN:
                  summary: "FORBIDDEN"
                  value:
                    type: "urn:problem:forbidden"
                    title: "Forbidden"
                    status: 403
                    detail: "You do not have permission to access this resource"
                    instance: "/api/v1/notifications"
                    code: "FORBIDDEN"
        "405":
          description: "Method Not Allowed. Codes: `METHOD_NOT_ALLOWED`."
          content:
            application/problem+json:
