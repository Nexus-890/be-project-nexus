                    type: "urn:problem:unauthenticated"
                    title: "Unauthorized"
                    status: 401
                    detail: "A valid access token is required to access this resource"
                    instance: "/api/v1/system/health"
                    code: "UNAUTHENTICATED"
        "403":
          description: "Forbidden. Codes: FORBIDDEN."
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - type: object
                    properties:
                      status: {type: integer, enum: [403]}
                      code:
                        type: string
                        enum: ["FORBIDDEN"]
              examples:
                FORBIDDEN:
                  value:
                    type: "urn:problem:forbidden"
                    title: "Forbidden"
                    status: 403
                    detail: "You do not have permission to access this resource"
                    instance: "/api/v1/system/health"
                    code: "FORBIDDEN"
        "405":
          description: "Method Not Allowed. Codes: METHOD_NOT_ALLOWED."
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - type: object
                    properties:
                      status: {type: integer, enum: [405]}
                      code:
                        type: string
                        enum: ["METHOD_NOT_ALLOWED"]
