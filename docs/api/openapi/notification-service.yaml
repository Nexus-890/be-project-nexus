                      code:
                        type: "string"
                        enum:
                          - "UNAUTHENTICATED"
                          - "NOTIFICATION_UNAUTHENTICATED"

              examples:
                UNAUTHENTICATED:
                  summary: "UNAUTHENTICATED"
                  value:
                    type: "urn:problem:unauthenticated"
                    title: "Unauthorized"
                    status: 401
                    detail: "A valid access token is required to access this resource"
                    instance: "/api/v1/notifications/unread-count"
                    code: "UNAUTHENTICATED"
                NOTIFICATION_UNAUTHENTICATED:
                  summary: "NOTIFICATION_UNAUTHENTICATED"
                  value:
                    type: "urn:problem:domain-error"
                    title: "Unauthorized"
                    status: 401
                    detail: "Unauthenticated!"
                    instance: "/api/v1/notifications/unread-count"
                    code: "NOTIFICATION_UNAUTHENTICATED"
        "403":
          description: "Forbidden. Codes: `FORBIDDEN`."
          content:
