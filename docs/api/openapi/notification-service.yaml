        "406":
          description: "Not Acceptable. Codes: `NOT_ACCEPTABLE`."
          content:
            application/problem+json:
              schema:
                allOf:
                  -
                    $ref: "#/components/schemas/Problem"

                  -
                    type: "object"
                    required: []
                    properties:
                      status:
                        type: "integer"
                        enum:
