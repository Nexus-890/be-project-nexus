                        enum:
                          - 400
                      code:
                        type: "string"
                        enum:
                          - "INVALID_PARAMETER"
                          - "NOTIFICATION_DATA_INVALID"

              examples:
                INVALID_PARAMETER:
                  summary: "INVALID_PARAMETER"
                  value:
                    type: "urn:problem:invalid-parameter"
                    title: "Bad Request"
                    status: 400
                    detail: "A request parameter is invalid"
                    instance: "/api/v1/notifications"
                    code: "INVALID_PARAMETER"
                NOTIFICATION_DATA_INVALID:
                  summary: "NOTIFICATION_DATA_INVALID"
                  value:
                    type: "urn:problem:domain-error"
                    title: "Bad Request"
                    status: 400
                    detail: "Invalid data"
                    instance: "/api/v1/notifications"
                    code: "NOTIFICATION_DATA_INVALID"
        "401":
          description: "Unauthorized. Codes: `UNAUTHENTICATED`, `NOTIFICATION_UNAUTHENTICATED`."
          headers:
            WWW-Authenticate:
              description: "Bearer challenge for security failures; domain failures may omit it."
