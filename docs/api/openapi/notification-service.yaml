# Delivered API contract reconciled with develop for issue #248.
openapi: "3.0.3"
info:
  title: "Nexus notification-service delivered API"
  version: "1.0.0"
  description: "Delivered notification reads reconciled with #248 after the develop merge. Application JSON uses code (default 0), message (default response success), data and sibling page for lists. Errors use symbolic Problem Details codes. ADR approval and the coordinated FE cutover remain pending."
servers:
  -
    url: "http://localhost:8080"
    description: "Local API gateway."

tags:
  -
    name: "Notifications"
    description: "Own notifications and unread count."

security:
  -
    bearerAuth: []

paths:
  /api/v1/notifications:
    get:
      tags:
        - "Notifications"
      operationId: "listNotifications"
      summary: "List the current user's notifications"
      description: "Requires NOTIFICATION.VIEW. JWT subject only. Zero-based pagination, newest createdAt first then id descending. Defaults page=0, size=10; size must be 1 to 100. An empty/beyond-end page returns data:[] with actual totals."
      security:
        -
          bearerAuth: []

      x-required-privileges:
        - "NOTIFICATION.VIEW"
      x-required-roles: []
      x-ownership: "See operation description."
      responses:
        "200":
          description: "Successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
              examples:
                success:
                  summary: "Success"
                  value:
                    code: 0
                    message: "response success"
                    data:
                      -
                        id: "c8000000-0000-4000-8000-000000000005"
                        type: "ORDER_CREATED"
                        title: "Order placed"
                        content: "Your order was placed."
                        readAt: null
                        createdAt: "2026-10-29T08:00:00Z"

                    page:
                      number: 0
                      size: 10
                      totalElements: 1
                      totalPages: 1
        "400":
          description: "Bad Request. Codes: `INVALID_PARAMETER`, `NOTIFICATION_DATA_INVALID`."
