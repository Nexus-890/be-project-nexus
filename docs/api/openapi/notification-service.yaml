components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
  schemas:
    Problem:
      type: "object"
      required:
        - "type"
        - "title"
        - "status"
        - "detail"
        - "instance"
        - "code"
      properties:
        type:
          type: "string"
          format: "uri-reference"
        title:
          type: "string"
        status:
          type: "integer"
          minimum: 400
          maximum: 599
        detail:
          type: "string"
        instance:
          type: "string"
          format: "uri-reference"
        code:
          type: "string"
          pattern: "\\S"
          minLength: 1
          description: "Stable symbolic identifier. Branch on code and status; tolerate future unknown codes."
        traceId:
          type: "string"
          pattern: "\\S"
          minLength: 1
          description: "Active trace/correlation identifier when available; optional without tracing."
        errors:
          type: "array"
          items:
            $ref: "#/components/schemas/ValidationError"
    ValidationError:
      type: "object"
      required:
        - "field"
        - "code"
        - "detail"
      properties:
        field:
          type: "string"
          description: "Failed request field; an object-level failure uses the object name."
        code:
          type: "string"
          description: "Constraint identifier, for example VALIDATION_NOT_BLANK, VALIDATION_EMAIL, VALIDATION_SIZE or INVALID_PARAMETER."
        detail:
          type: "string"
    PageInfo:
      type: "object"
      required:
        - "number"
        - "size"
        - "totalElements"
        - "totalPages"
      properties:
        number:
          type: "integer"
          minimum: 0
        size:
          type: "integer"
          minimum: 1
        totalElements:
          type: "integer"
          format: "int64"
          minimum: 0
        totalPages:
          type: "integer"
          minimum: 0
    Notification:
      type: "object"
      required:
        - "id"
        - "type"
        - "title"
        - "content"
        - "readAt"
        - "createdAt"
      properties:
        id:
          type: "string"
          format: "uuid"
        type:
          type: "string"
          maxLength: 60
        title:
          type: "string"
          maxLength: 255
        content:
          type: "string"
        readAt:
          type: "string"
          format: "date-time"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
    NotificationListResponse:
      type: "object"
      required:
        - "code"
        - "message"
        - "data"
        - "page"
      properties:
        code:
          type: "integer"
          default: 0
        message:
          type: "string"
          default: "response success"
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/Notification"
        page:
          $ref: "#/components/schemas/PageInfo"
      additionalProperties: false
    UnreadNotificationCountResponse:
      type: "object"
      required:
        - "code"
        - "message"
        - "data"
      properties:
        code:
          type: "integer"
          default: 0
        message:
          type: "string"
          default: "response success"
        data:
          type: "object"
          required:
            - "count"
          properties:
            count:
              type: "integer"
              format: "int64"
              minimum: 0
      additionalProperties: false
    NotificationDeliveryAttempt:
      type: "object"
      required: ["id","attemptNumber","status","attemptedAt","completedAt","errorCode","retryable"]
      properties:
        id: {type: "string", format: "uuid"}
        attemptNumber: {type: "integer", minimum: 1}
        status: {type: "string", enum: ["STARTED","SUCCEEDED","FAILED"]}
        attemptedAt: {type: "string", format: "date-time"}
        completedAt: {type: "string", format: "date-time", nullable: true}
        errorCode: {type: "string", nullable: true, description: "Symbolic failure code such as SMTP_UNAVAILABLE or RECIPIENT_NOT_FOUND; null on success."}
        retryable: {type: "boolean"}
    NotificationDelivery:
      type: "object"
      required: ["id","channel","status","attemptCount","nextAttemptAt","createdAt","updatedAt","attempts"]
      properties:
        id: {type: "string", format: "uuid"}
        channel: {type: "string", enum: ["EMAIL","PUSH","SMS"]}
        status: {type: "string", enum: ["PENDING","SENT","FAILED","SKIPPED"]}
        attemptCount: {type: "integer", minimum: 0}
        nextAttemptAt: {type: "string", format: "date-time", nullable: true, description: "When the next send is due while PENDING; null once SENT or FAILED."}
        createdAt: {type: "string", format: "date-time"}
        updatedAt: {type: "string", format: "date-time"}
        attempts:
          type: "array"
          items:
            $ref: "#/components/schemas/NotificationDeliveryAttempt"
    NotificationDeliveryListResponse:
      type: "object"
      required: ["code","message","data"]
      properties:
        code: {type: "integer", default: 0}
        message: {type: "string", default: "response success"}
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/NotificationDelivery"
      additionalProperties: false
x-service: "notification-service"
x-business-error-codes:
  NOTIFICATION_DATA_INVALID:
    status: 400
    detail: "Invalid data"
  NOTIFICATION_UNAUTHENTICATED:
    status: 401
    detail: "Unauthenticated!"
  NOTIFICATION_NOT_FOUND:
    status: 404
    detail: "Notification not found"
  NOTIFICATION_NOT_OWNER:
    status: 403
    detail: "Notification belongs to another user"
