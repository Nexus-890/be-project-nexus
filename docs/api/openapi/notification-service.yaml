components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
  schemas:
    Problem:
      type: "object"
      required:
        - "type"
        - "title"
        - "status"
        - "detail"
        - "instance"
        - "code"
      properties:
        type:
          type: "string"
          format: "uri-reference"
        title:
          type: "string"
        status:
          type: "integer"
          minimum: 400
          maximum: 599
        detail:
          type: "string"
        instance:
          type: "string"
          format: "uri-reference"
        code:
          type: "string"
          pattern: "\\S"
          minLength: 1
          description: "Stable symbolic identifier. Branch on code and status; tolerate future unknown codes."
        traceId:
          type: "string"
          pattern: "\\S"
          minLength: 1
          description: "Active trace/correlation identifier when available; optional without tracing."
        errors:
          type: "array"
          items:
            $ref: "#/components/schemas/ValidationError"
    ValidationError:
      type: "object"
      required:
        - "field"
        - "code"
        - "detail"
      properties:
        field:
          type: "string"
          description: "Failed request field; an object-level failure uses the object name."
        code:
          type: "string"
          description: "Constraint identifier, for example VALIDATION_NOT_BLANK, VALIDATION_EMAIL, VALIDATION_SIZE or INVALID_PARAMETER."
        detail:
          type: "string"
    PageInfo:
      type: "object"
      required:
        - "number"
        - "size"
        - "totalElements"
        - "totalPages"
      properties:
        number:
          type: "integer"
          minimum: 0
        size:
          type: "integer"
          minimum: 1
        totalElements:
          type: "integer"
          format: "int64"
          minimum: 0
        totalPages:
          type: "integer"
          minimum: 0
    Notification:
      type: "object"
      required:
        - "id"
        - "type"
        - "title"
        - "content"
        - "readAt"
        - "createdAt"
      properties:
        id:
          type: "string"
          format: "uuid"
        type:
          type: "string"
          maxLength: 60
        title:
          type: "string"
          maxLength: 255
        content:
          type: "string"
        readAt:
          type: "string"
          format: "date-time"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
    NotificationListResponse:
      type: "object"
      required:
        - "code"
        - "message"
        - "data"
        - "page"
