    SellerBankAccountRequest:
      type: "object"
      required: ["bankCode","accountNumber","accountHolderName"]
      properties:
        bankCode:
          type: "string"
          pattern: "^[0-9]{6}$"
          description: "NAPAS bank BIN."
        accountNumber:
          type: "string"
          pattern: "^[0-9]{4,34}$"
          minLength: 4
          maxLength: 34
          writeOnly: true
          description: "Keep leading zeroes. Encrypted at rest; never included in responses or logs."
        accountHolderName:
          type: "string"
          minLength: 1
          maxLength: 100
          pattern: "\\S"
        isDefault:
          type: "boolean"
          description: "Optional; false on create, preserve existing value on update."
        active:
          type: "boolean"
          description: "Optional; true on create, preserve existing value on update."
    SellerBankVerificationRequest:
      type: "object"
      required: ["verificationStatus","expectedVersion"]
      properties:
        verificationStatus:
          type: "string"
          enum: ["VERIFIED","REJECTED"]
        reason:
          type: "string"
          minLength: 1
          maxLength: 1000
          description: "Required and nonblank when REJECTED."
        expectedVersion:
          type: "integer"
          format: "int64"
          minimum: 0
          description: "Version from the exact bank-account snapshot the administrator reviewed. Missing or negative is 400; stale is 409."
    SellerBankAccount:
      type: "object"
      required: ["id","sellerId","bankCode","accountLast4","accountHolderName","verificationStatus","isDefault","active","rejectionReason","verifiedBy","verifiedAt","createdAt","updatedAt","version"]
