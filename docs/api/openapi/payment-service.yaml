openapi: 3.0.3
info:
  title: Nexus payments, refunds and SePay webhooks
  version: 1.0.0
  description: >-
    Bank-transfer VietQR initiation, manual refunds and authenticated SePay callbacks.
    Payment initiation returns HTTP 201 with an ApiResponse containing
    code, message and data containing a numeric whole-VND amount, including repeated reads.
    CheckoutPaymentRequested creates the immutable session and seller instructions;
    the initiation endpoint never creates a transaction, memo or replacement session.
    The SePay callback verifies the original bytes and matches a session without
    changing payment or order state; its protocol acknowledgement is not wrapped.
servers:
  - url: http://localhost:8080
    description: API gateway
  - url: http://localhost:8087
    description: Payment service
tags:
  - name: Payments
    description: Read payment instructions for an existing order-group session
  - name: Refunds
    description: Refunds of cancelled, paid seller orders, completed by a manual transfer
  - name: Webhooks
    description: Provider-authenticated bank-transfer callbacks
paths:
  /api/v1/webhooks/sepay:
    post:
      tags: [Webhooks]
      operationId: receiveSepayWebhook
      summary: Verify a SePay callback and match its payment session
      description: >-
        Public at the gateway and payment service; no bearer token is required.
        Before parsing JSON or querying payment_db, verifies HMAC-SHA256 over the
        ASCII timestamp, one dot byte and the original request body bytes. Missing,
        malformed, stale or invalid signature/timestamp headers return 401. The
        absolute timestamp skew must be at most 300 seconds. A nonempty normalized
        code takes precedence over content, even if that code has no matching
        session. Otherwise content is normalized and looked up exactly first; only
        if that fails is one configured leading bank prefix (for example SEVQR)
        removed for another exact lookup. Normalization trims, uppercases using
        Locale.ROOT and removes Unicode whitespace. The remaining memo must be
        1-32 uppercase ASCII letters/digits for an exact payment_sessions.memo_code
        lookup. There is no arbitrary substring matching. Missing, invalid or
        unknown memos are accepted with one WARN naming the normalized memo.
        A valid parsed object returns 200 whether matched or unmatched. This
        operation does not check amount, account, transfer direction, session state
        or deadline, create transactions, change orders or emit events. The native
        SePay acknowledgement is exempt from ApiResponse using @ProtocolResponse.
      security: []
      parameters:
        - in: header
          name: X-SePay-Signature
          required: false
          description: >-
            Required for authentication; omission is handled as 401 rather than
            request binding failure. HMAC-SHA256 digest of the timestamp and exact
            raw body, using the server-configured webhook secret.
          schema:
            type: string
            pattern: '^sha256=[0-9a-f]{64}$'
        - in: header
          name: X-SePay-Timestamp
          required: false
          description: >-
            Required for authentication; omission is handled as 401. Original Unix
            seconds used as the signed prefix, within 300 seconds of the server clock.
          schema:
            type: string
            pattern: '^[0-9]{1,19}$'
      requestBody:
        required: false
        description: >-
          SePay sends JSON. The controller reads original bytes before JSON parsing;
          an absent body fails signature verification with 401. Unknown object
          properties are ignored, and no provider field is required by this matching
          stage. A signed body that cannot be parsed into this object returns 400.
          The example is copied from docs/api/sepay-webhook-sample.json, captured
          during the earlier provider spike; it is not a matching payment receipt
          or a claim that payment settlement was executed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SepayWebhookRequest'
            example:
              gateway: ACB
              transactionDate: '2026-10-18 16:51:32'
              accountNumber: '0000000002'
              subAccount: ''
              code: ''
              content: Giao dich thu nghiem 16h51m20s
              transferType: in
              description: Giao dich thu nghiem 16h51m20s
              transferAmount: 10000
              referenceCode: SB4D116E4198F4
              accumulated: 0
              id: 39442
      responses:
        '200':
          description: >-
            Verified, parsed callback accepted, including an unmatched memo. Native
            SePay protocol response, without code/message/data or session information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SepayWebhookAcknowledgement'
              example:
                success: true
        '400':
          description: >-
            Signature verified, but the JSON is malformed, null, not an object or
            contains a value incompatible with the DTO (PAYMENT_INVALID_WEBHOOK_REQUEST).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Bad Request
                status: 400
                detail: The webhook body must be a valid SePay JSON object
                instance: /api/v1/webhooks/sepay
                code: PAYMENT_INVALID_WEBHOOK_REQUEST
        '401':
          description: >-
            Missing body/headers, malformed signature or timestamp, expired timestamp,
            or a signature mismatch (PAYMENT_UNAUTHENTICATED). No parsing, lookup or
            business change occurs. If an invalid bearer token is supplied despite
            this public route, shared security can reject it with UNAUTHENTICATED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Unauthorized
                status: 401
                detail: The webhook signature is invalid
                instance: /api/v1/webhooks/sepay
                code: PAYMENT_UNAUTHENTICATED
  /api/v1/payments:
    post:
      tags: [Payments]
      operationId: initiateGroupPayment
      summary: Read the buyer's existing group payment instructions
      description: >-
        Requires CHECKOUT.START and ownership of the session. Data comes only from
        payment_db, populated from the complete checkout event. A canceled, paid or
        expired session never gets a replacement QR. Unknown/not-yet-consumed groups
        return 404. ExpiresAt controls server acceptance; the bank-transfer QR itself
        does not enforce the Nexus deadline at the bank. ServerNow is sampled from
        the payment service clock on every response so clients can calculate the
        remaining time without relying on their device clock. For manual bank
        transfers copy transferContent, which matches the QR description including
        any bank-required prefix; memoCode remains the immutable session reference.
      security:
        - bearerAuth: []
      x-actor-roles: [BUYER]
      x-required-privileges: [CHECKOUT.START]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderGroupId]
              properties:
                orderGroupId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Existing immutable instructions with fresh serverNow; payment fields stay the same on repeat with stable bank configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInitApiResponse'
              example:
                code: 0
                message: response success
                data:
                  sessionId: ec2a083f-868b-4d3e-9dda-1904a9c7bbdd
                  qrImageUrl: https://vietqr.app/img?acc=0000000002&bank=970416&amount=350000&des=NX20261105001&template=compact&showinfo=true&holder=DO%20VAN%20A
                  bankAccount: '0000000002'
                  amount: 350000
                  memoCode: NX20261105001
                  transferContent: NX20261105001
                  expiresAt: '2026-11-05T10:15:00Z'
                  serverNow: '2026-11-05T10:00:00Z'
        '400':
          description: Missing/invalid orderGroupId or malformed request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Missing CHECKOUT.START or session owned by another buyer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Payment session is not available
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Session is not payable, instructions are inconsistent, or amount cannot be represented as VietQR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/refunds:
    post:
      tags: [Refunds]
      operationId: requestRefund
      summary: Request the refund of a cancelled, paid seller order
      description: >-
        Requires ORDER.REFUND (Admin, Support Staff). One refund per order. The same
        Idempotency-Key with the same orderId, reason and amount returns the stored refund,
        even after it is completed; an omitted amount is compared as the full amount paid.
        Payment-side funding evidence decides whether the order was paid; the order must
        already be cancelled on the payment side. OrderCancelled already creates the full
        refund for a paid order, so this endpoint serves cancelled, paid orders that have
        no refund yet (for example data recovery). An order that already has a refund
        returns 409 PAYMENT_REFUND_EXISTS; Support completes the existing refund with
        /complete. Omitted amount means the full amount paid for this order.
      security:
        - bearerAuth: []
      x-actor-roles: [ADMIN, SUPPORT_STAFF]
      x-required-privileges: [ORDER.REFUND]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            pattern: '^[!-~]{1,100}$'
          description: Client key, printable ASCII; keys starting with system are reserved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '202':
          description: Refund requested, or the stored refund for a repeated key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResultApiResponse'
              example:
                code: 0
                message: response success
                data:
                  refundId: 01a1a602-0a8c-7c96-b2bb-1208b9900b76
                  status: REQUESTED
        '400':
          description: Missing/invalid Idempotency-Key (PAYMENT_INVALID_REFUND_REQUEST), validation error, or amount above the paid amount (PAYMENT_REFUND_AMOUNT_EXCEEDED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/invalid bearer token (UNAUTHENTICATED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Missing ORDER.REFUND (FORBIDDEN)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No payment exists for this order (PAYMENT_ORDER_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Order not cancelled or not paid (PAYMENT_ORDER_NOT_REFUNDABLE), order already refunded under another key (PAYMENT_REFUND_EXISTS), or key reused with another body (PAYMENT_REFUND_IDEMPOTENCY_CONFLICT)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags: [Refunds]
      operationId: listRefunds
      summary: List the refund of one order
      description: Requires ORDER.REFUND. R1 has at most one refund per order.
      security:
        - bearerAuth: []
      x-actor-roles: [ADMIN, SUPPORT_STAFF]
      x-required-privileges: [ORDER.REFUND]
      parameters:
        - in: query
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Zero or one refund for the order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundListApiResponse'
        '400':
          description: Missing or malformed orderId (INVALID_PARAMETER)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/invalid bearer token (UNAUTHENTICATED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Missing ORDER.REFUND (FORBIDDEN)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/refunds/{id}/complete:
    post:
      tags: [Refunds]
      operationId: completeRefund
      summary: Record that the manual transfer back to the buyer is done
      description: >-
        Requires ORDER.REFUND. Records one REFUND payment transaction (MANUAL_TRANSFER) and
        emits OrderRefundCompleted. Calling it again on a completed refund returns the stored
        refund without a second transaction or event.
      security:
        - bearerAuth: []
      x-actor-roles: [ADMIN, SUPPORT_STAFF]
      x-required-privileges: [ORDER.REFUND]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Refund completed, or already completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundApiResponse'
        '400':
          description: Malformed refund id (INVALID_PARAMETER)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/invalid bearer token (UNAUTHENTICATED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Missing ORDER.REFUND (FORBIDDEN)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Unknown refund (PAYMENT_REFUND_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Refund changed by a concurrent request (PAYMENT_REFUND_CONFLICT)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SepayWebhookRequest:
      type: object
      additionalProperties: true
      description: >-
        Provider wire object. Fields are optional and nullable at this stage;
        amount, timestamp text and direction are not business-validated here.
        Unknown fields are ignored. A missing memo produces an accepted no-match.
      properties:
        id:
          type: integer
          format: int64
          nullable: true
        gateway:
          type: string
          nullable: true
        transactionDate:
          type: string
          nullable: true
          description: Provider timestamp text, preserved without date-format validation
        accountNumber:
          type: string
          nullable: true
          description: Receiving account text; preserve leading zeros
        code:
          type: string
          nullable: true
          description: Provider-extracted memo; takes precedence when nonempty after normalization
        content:
          type: string
          nullable: true
          description: Fallback memo source; exact normalized lookup precedes a retry with one configured leading prefix removed
        transferType:
          type: string
          nullable: true
          description: Provider transfer direction; not restricted to an enum at this stage
        transferAmount:
          type: number
          nullable: true
        accumulated:
          type: number
          nullable: true
        subAccount:
          type: string
          nullable: true
        referenceCode:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
    SepayWebhookAcknowledgement:
      type: object
      required: [success]
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum: [true]
    PaymentInitApiResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          default: 0
          example: 0
        message:
          type: string
          default: response success
          example: response success
        data:
          $ref: '#/components/schemas/PaymentInitResponse'
    PaymentInitResponse:
      type: object
      required: [sessionId, qrImageUrl, bankAccount, amount, memoCode, transferContent, expiresAt, serverNow]
      properties:
        sessionId:
          type: string
          format: uuid
        qrImageUrl:
          type: string
          format: uri
          description: SePay vietqr.app/img URL using the session amount and memo, plus any host-configured bank transfer prefix
        bankAccount:
          type: string
          description: Host-configured receiving account; preserve leading zeros
        amount:
          type: number
          minimum: 1
          maximum: 9999999999999
          multipleOf: 1
          example: 350000
        memoCode:
          type: string
          pattern: '^[A-Z0-9]{1,32}$'
          description: Immutable session reference; use transferContent when copying bank transfer instructions
        transferContent:
          type: string
          minLength: 1
          description: Exact bank transfer content encoded in the QR description, including any configured bank-required prefix such as SEVQR
          example: SEVQR NX20261105001
        expiresAt:
          type: string
          format: date-time
        serverNow:
          type: string
          format: date-time
          description: Current payment-service time sampled on this response; compare with expiresAt for the countdown
    RefundRequest:
      type: object
      required: [orderId, reason]
      properties:
        orderId:
          type: string
          format: uuid
        amount:
          type: number
          exclusiveMinimum: true
          minimum: 0
          multipleOf: 0.01
          description: Optional; at most the amount paid for this order. Omitted means the full paid amount.
        reason:
          type: string
          minLength: 1
          maxLength: 500
    RefundResultApiResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          type: object
          required: [refundId, status]
          properties:
            refundId:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/RefundStatus'
    RefundStatus:
      type: string
      enum: [REQUESTED, COMPLETED]
    Refund:
      type: object
      required: [refundId, orderId, amount, currency, status, reason, requestedAt, completedAt]
      properties:
        refundId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        amount:
          type: number
          example: 300000.00
        currency:
          type: string
          example: VND
        status:
          $ref: '#/components/schemas/RefundStatus'
        reason:
          type: string
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    RefundApiResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          $ref: '#/components/schemas/Refund'
    RefundListApiResponse:
      type: object
      required: [code, message, data, page]
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/Refund'
        page:
          type: object
          required: [number, size, totalElements, totalPages]
          properties:
            number:
              type: integer
            size:
              type: integer
            totalElements:
              type: integer
              format: int64
            totalPages:
              type: integer
    Problem:
      type: object
      required: [type, title, status, detail, instance, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        traceId:
          type: string
