  /api/v1/payments/payouts/callbacks/{provider}:
    post:
      tags: ["Payouts"]
      operationId: "receivePayoutCallback"
      summary: "Accept a signed payout provider outcome"
      description: "Public to JWT authentication; authenticates the raw bytes using X-Payout-Timestamp and X-Payout-Signature. HMAC-SHA256 signs epoch seconds, one dot and the exact UTF-8 request body; maximum clock skew is 300 seconds. The payout, provider, attempt and idempotency key must match the persisted send. Duplicate callbacks create no additional money movement. ACCEPTED is PROCESSING; only confirmed SUCCEEDED writes PAYOUT evidence. Provider acknowledgement uses @ProtocolResponse, outside ApiResponse."
      security: []
      parameters: [{"name":"provider","in":"path","required":true,"schema":{"type":"string","enum":["sandbox","http"]}},{"name":"X-Payout-Timestamp","in":"header","required":false,"description":"Required for provider authentication; absent or stale headers return 401.","schema":{"type":"string","pattern":"^[0-9]{1,19}$"}},{"name":"X-Payout-Signature","in":"header","required":false,"description":"Hex HMAC-SHA256 digest of timestamp + dot + raw body.","schema":{"type":"string","pattern":"^[0-9a-fA-F]{64}$"}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutProviderCallback"
      responses:
        "200":
          description: "Native provider acknowledgement, including duplicate callbacks"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutCallbackAcknowledgement"
              example:
                status: "ok"
        "400":
          description: "Invalid signed callback body (PAYMENT_PAYOUT_CALLBACK_INVALID)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "urn:problem:domain-error"
                title: "Bad Request"
                status: 400
                detail: "Invalid signed callback body"
                instance: "/api/v1/payments/payouts"
                code: "PAYMENT_PAYOUT_CALLBACK_INVALID"
        "401":
          description: "The provider callback signature is invalid (PAYMENT_PAYOUT_CALLBACK_SIGNATURE_INVALID)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "urn:problem:domain-error"
                title: "Unauthorized"
                status: 401
                detail: "The provider callback signature is invalid"
                instance: "/api/v1/payments/payouts"
                code: "PAYMENT_PAYOUT_CALLBACK_SIGNATURE_INVALID"
        "404":
          description: "Payout not found, including a payout owned by another seller (PAYMENT_PAYOUT_NOT_FOUND)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "urn:problem:domain-error"
                title: "Not Found"
                status: 404
                detail: "Payout not found, including a payout owned by another seller"
                instance: "/api/v1/payments/payouts"
                code: "PAYMENT_PAYOUT_NOT_FOUND"
        "409":
          description: "Provider reference conflicts with the stored transfer (PAYMENT_PAYOUT_PROVIDER_CONFLICT)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "urn:problem:domain-error"
                title: "Conflict"
                status: 409
                detail: "Provider reference conflicts with the stored transfer"
                instance: "/api/v1/payments/payouts/callbacks/http"
                code: "PAYMENT_PAYOUT_PROVIDER_CONFLICT"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SepayWebhookRequest:
      type: object
      additionalProperties: true
      description: >-
        Provider wire object. Fields remain optional and nullable during parsing
        and memo matching. A matched incoming receipt requires a positive id,
        transferType=in and a nonnegative amount fitting numeric(19,2). Outgoing
        transfers are acknowledged without settlement. Provider timestamp text
        is preserved; signature freshness uses the signed HTTP timestamp header.
        Unknown fields are ignored. A missing memo produces an accepted no-match.
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Positive provider receipt identity required for matched incoming settlement; retained as txnReference
        gateway:
          type: string
          nullable: true
        transactionDate:
          type: string
          nullable: true
          description: Provider timestamp text, preserved without date-format validation
        accountNumber:
          type: string
          nullable: true
          description: Receiving account text; preserve leading zeros
        code:
          type: string
          nullable: true
          description: Provider-extracted memo; takes precedence when nonempty after normalization
        content:
          type: string
          nullable: true
          description: Fallback memo source; exact normalized lookup precedes a retry with one configured leading prefix removed
        transferType:
          type: string
          nullable: true
          description: Incoming settlement requires in (case insensitive); out is acknowledged without funding
        transferAmount:
          type: number
          nullable: true
          description: Matched incoming receipts require a nonnegative numeric(19,2) value; only the exact payable-session total funds the checkout
        accumulated:
          type: number
          nullable: true
        subAccount:
          type: string
          nullable: true
        referenceCode:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
    SepayWebhookAcknowledgement:
      type: object
      required: [success]
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum: [true]
    PaymentInitApiResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          default: 0
          example: 0
        message:
          type: string
          default: response success
          example: response success
        data:
          $ref: '#/components/schemas/PaymentInitResponse'
    PaymentInitResponse:
      type: object
      required: [sessionId, qrImageUrl, bankAccount, amount, memoCode, transferContent, expiresAt, serverNow]
      properties:
        sessionId:
          type: string
          format: uuid
        qrImageUrl:
          type: string
          format: uri
          description: SePay vietqr.app/img URL using the session amount and memo, plus any host-configured bank transfer prefix
        bankAccount:
          type: string
          description: Host-configured receiving account; preserve leading zeros
        amount:
          type: number
          minimum: 1
          maximum: 9999999999999
          multipleOf: 1
          example: 350000
        memoCode:
          type: string
          pattern: '^[A-Z0-9]{1,32}$'
          description: Immutable session reference; use transferContent when copying bank transfer instructions
        transferContent:
          type: string
          minLength: 1
          description: Exact bank transfer content encoded in the QR description, including any configured bank-required prefix such as SEVQR
          example: SEVQR NX20261105001
        expiresAt:
          type: string
          format: date-time
        serverNow:
          type: string
          format: date-time
          description: Current payment-service time sampled on this response; compare with expiresAt for the countdown
    RefundRequest:
      type: object
      required: [orderId, reason]
      properties:
        orderId:
          type: string
          format: uuid
        amount:
          type: number
          exclusiveMinimum: true
          minimum: 0
          multipleOf: 0.01
          description: Optional; at most the amount paid for this order. Omitted means the full paid amount.
        reason:
          type: string
          minLength: 1
          maxLength: 500
    RefundResultApiResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          type: object
          required: [refundId, status]
          properties:
            refundId:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/RefundStatus'
    RefundStatus:
      type: string
      enum: [REQUESTED, COMPLETED]
    Refund:
      type: object
      required: [refundId, orderId, amount, currency, status, reason, requestedAt, completedAt]
      properties:
        refundId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        amount:
          type: number
          example: 300000.00
        currency:
          type: string
          example: VND
        status:
          $ref: '#/components/schemas/RefundStatus'
        reason:
          type: string
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    RefundApiResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          $ref: '#/components/schemas/Refund'
    RefundListApiResponse:
      type: object
      required: [code, message, data, page]
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/Refund'
        page:
          type: object
          required: [number, size, totalElements, totalPages]
          properties:
            number:
              type: integer
            size:
              type: integer
            totalElements:
              type: integer
              format: int64
            totalPages:
              type: integer
    PaymentTransactionStatus:
      type: string
      enum: [PENDING, SUCCESS, FAILED, UNRECONCILED]
    PaymentView:
      type: object
      required: [transactionId, orderGroupId, provider, providerReference, amount, currency, type, status, receivedAt]
      properties:
        transactionId:
          type: string
          format: uuid
        orderGroupId:
          type: string
          format: uuid
        provider:
          type: string
          example: SEPAY
        providerReference:
          type: string
          nullable: true
          description: Provider transaction reference masked to its last four characters
          example: '****8877'
        amount:
          type: number
          example: 500000.00
        currency:
          type: string
          example: VND
        type:
          type: string
          enum: [NORMAL, REFUND]
        status:
          $ref: '#/components/schemas/PaymentTransactionStatus'
        receivedAt:
          type: string
          format: date-time
    PaymentListApiResponse:
      type: object
      required: [code, message, data, page]
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentView'
        page:
          type: object
          required: [number, size, totalElements, totalPages]
          properties:
            number:
              type: integer
            size:
              type: integer
            totalElements:
              type: integer
              format: int64
            totalPages:
              type: integer
    Problem:
