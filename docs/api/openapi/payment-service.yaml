        outcome:
          type: "string"
          description: "CONFIRMED_SENT settles UNKNOWN with transfer facts, or only closes the selected open STAFF_EXCEPTION when payout and attempt are already SUCCEEDED. That nonfinancial closure does not close seller disputes or change accounting/receipt state."
          enum:
            - "CONFIRMED_SENT"
            - "CONFIRMED_NOT_SENT"
            - "CONFIRMED_RETURNED"
            - "CONFIRMATION_RECORDED_IN_ERROR"
        reason:
          type: "string"
          minLength: 1
          maxLength: 1000
        evidenceIds:
          type: "array"
          items:
            type: "string"
            format: "uuid"
          minItems: 1
          maxItems: 3
          uniqueItems: true
        sourceAccountId:
          type: "string"
          nullable: true
          description: "Required for CONFIRMED_SENT settlement of UNKNOWN; omitted when merely closing a STAFF_EXCEPTION on an already successful attempt."
        amount:
          type: "string"
          pattern: "^[0-9]{1,17}\\.[0-9]{2}$"
          example: "95000.00"
          description: "Exact fixed-two-decimal string. Execution requires a positive whole-VND amount within the configured supported limit; never rounded."
          nullable: true
        bankTransferReference:
          type: "string"
          nullable: true
          maxLength: 120
          description: "Required for CONFIRMED_SENT settlement of UNKNOWN; do not replace the original reference for nonfinancial closure on SUCCEEDED."
        transferredAt:
          type: "string"
          format: "date-time"
          nullable: true
    ManualPayoutReviewRequest:
      type: "object"
      required:
        - "expectedAttemptVersion"
        - "expectedCaseVersion"
        - "action"
        - "reason"
      properties:
        expectedAttemptVersion:
          type: "integer"
          format: "int64"
          minimum: 0
        expectedCaseVersion:
          type: "integer"
          format: "int64"
          minimum: 0
        action:
          type: "string"
          enum:
            - "REQUEST_INFORMATION"
            - "TRANSFER_EVIDENCE_PROVIDED"
        reason:
          type: "string"
          minLength: 1
          maxLength: 1000
        evidenceIds:
          type: "array"
          items:
            type: "string"
            format: "uuid"
          maxItems: 3
          uniqueItems: true
    SellerPayoutReceiptRequest:
      type: "object"
      required:
        - "expectedReceiptVersion"
      properties:
        expectedReceiptVersion:
          type: "integer"
          format: "int64"
          minimum: 0
    SellerPayoutDisputeRequest:
      type: "object"
      required:
        - "expectedReceiptVersion"
        - "reason"
        - "explanation"
      properties:
        expectedReceiptVersion:
          type: "integer"
          format: "int64"
          minimum: 0
        reason:
          type: "string"
          enum:
            - "NOT_RECEIVED"
            - "INCORRECT_AMOUNT"
            - "CONFIRMATION_MISTAKE"
        explanation:
          type: "string"
          minLength: 1
          maxLength: 1000
      description: "Explanation is trimmed and must contain 1–1000 characters. Seller identity is exclusively derived from JWT ownership."
    ManualPayoutApiResponse:
      type: "object"
      required:
        - "code"
        - "message"
        - "data"
      properties:
        code:
          type: "integer"
          default: 0
        message:
          type: "string"
          default: "response success"
        data:
          $ref: "#/components/schemas/ManualPayoutView"
    ManualPayoutCapabilitiesApiResponse:
      type: "object"
      required:
        - "code"
        - "message"
        - "data"
      properties:
        code:
          type: "integer"
          default: 0
        message:
          type: "string"
          default: "response success"
        data:
          $ref: "#/components/schemas/ManualPayoutCapabilities"
    ManualReceiptApiResponse:
      type: "object"
      required:
        - "code"
        - "message"
        - "data"
      properties:
        code:
          type: "integer"
          default: 0
        message:
          type: "string"
          default: "response success"
        data:
          $ref: "#/components/schemas/ManualReceiptView"
    ManualPayoutPageApiResponse:
      type: "object"
      description: "Lightweight queue page: bounded summary reads, no full history or evidence fetch per row. Rows retain the ManualPayoutView wire shape with history/evidence empty and current-attempt case explanations empty."
      required:
        - "code"
        - "message"
        - "data"
        - "page"
      properties:
        code:
          type: "integer"
          default: 0
        message:
          type: "string"
          default: "response success"
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/ManualPayoutView"
        page:
          type: "object"
          required:
            - "number"
            - "size"
            - "totalElements"
            - "totalPages"
          properties:
            number:
              type: "integer"
              minimum: 0
            size:
              type: "integer"
              minimum: 1
              maximum: 100
            totalElements:
              type: "integer"
              format: "int64"
              minimum: 0
            totalPages:
              type: "integer"
              minimum: 0
