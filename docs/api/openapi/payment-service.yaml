  /api/v1/payments/payouts:
    get:
      tags: [Payouts]
      operationId: listAdminPayouts
      summary: List automatic seller payouts for administrators
      security: [{bearerAuth: []}]
      x-required-roles: [ADMIN]
      description: >-
        ADMIN only; SELLER and SUPPORT_STAFF receive 403. Combines sellerId,
        any selected status, and inclusive createdAt bounds before counting
        and pagination. Newest createdAt first, id descending for ties. Send
        repeated status parameters for needs action: ON_HOLD, UNKNOWN, FAILED,
        RETURNED. Lists existing #257 payouts without recalculating amounts,
        consuming completion events, creating payouts or retrying transfers.
        Each row includes the orderId, sellerId, frozen netAmount, attemptCount
        and updatedAt. Payout eligibility and the fee rule remain owned by #257;
        only eligible funded COMPLETED orders without refunds create payouts.
      parameters:
        - $ref: '#/components/parameters/AdminSellerId'
        - name: status
          in: query
          description: >-
            Any of the selected states; repeated query values are supported.
            Omit to include all seven statuses. Duplicate values do not duplicate rows.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PayoutStatus'
          example: [ON_HOLD, UNKNOWN, FAILED, RETURNED]
        - name: from
          in: query
          description: Inclusive lower bound on payout createdAt; ISO-8601 with a time zone.
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: Inclusive upper bound on payout createdAt; must not precede from.
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/AdminPage'
        - $ref: '#/components/parameters/AdminSize'
      responses:
        '200':
          description: Existing payout page, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutListApiResponse'
              example:
                code: 0
                message: response success
                data:
                  - id: 00000000-0000-4000-8000-000000000257
                    orderId: 00000000-0000-4000-8000-000000000001
                    sellerId: 00000000-0000-4000-8000-000000000004
                    orderAmount: 325000
                    shippingFee: 25000
                    platformFeeRate: 0
                    platformFee: 0
                    netAmount: 300000
                    currency: VND
                    status: ON_HOLD
                    attemptCount: 0
                    recipientAccountLast4: null
                    providerReference: null
                    simulated: true
                    executionMode: AUTO
                    confirmationSource: null
                    createdAt: '2026-11-16T05:00:00Z'
                    updatedAt: '2026-11-16T05:00:00Z'
                page: {number: 0, size: 20, totalElements: 1, totalPages: 1}
        '400':
          $ref: '#/components/responses/AdminListBadRequest'
        '401':
          $ref: '#/components/responses/AdminListUnauthorized'
        '403':
          $ref: '#/components/responses/AdminListForbidden'
        '500':
          $ref: '#/components/responses/AdminListInternalError'
