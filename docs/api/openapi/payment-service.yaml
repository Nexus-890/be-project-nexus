          type: "string"
          nullable: true
          enum:
            - "MANUAL_STAFF_CONFIRMED"
        orderAmount:
          type: "string"
          pattern: "^[0-9]{1,17}\\.[0-9]{2}$"
          example: "95000.00"
          description: "Exact fixed-two-decimal string. Execution requires a positive whole-VND amount within the configured supported limit; never rounded."
        shippingFee:
          type: "string"
          pattern: "^[0-9]{1,17}\\.[0-9]{2}$"
          example: "95000.00"
          description: "Exact fixed-two-decimal string. Execution requires a positive whole-VND amount within the configured supported limit; never rounded."
        platformFee:
          type: "string"
          pattern: "^[0-9]{1,17}\\.[0-9]{2}$"
          example: "95000.00"
          description: "Exact fixed-two-decimal string. Execution requires a positive whole-VND amount within the configured supported limit; never rounded."
        netAmount:
          type: "string"
          pattern: "^[0-9]{1,17}\\.[0-9]{2}$"
          example: "95000.00"
          description: "Exact fixed-two-decimal string. Execution requires a positive whole-VND amount within the configured supported limit; never rounded."
        currency:
          type: "string"
          minLength: 3
          maxLength: 3
          description: "Only VND is executable. Any unsupported currency remains blocked without changing the original liability."
