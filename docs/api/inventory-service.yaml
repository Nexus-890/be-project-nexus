components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT issued by user-service. Prism checks that the header is present, not its
        signature, roles or ownership.
  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page number.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: \S
          minLength: 1
          description: Stable symbolic identifier. Branch on code and status; tolerate future unknown
            codes.
        traceId:
          type: string
          pattern: \S
          minLength: 1
          description: Active trace/correlation identifier when available; optional without tracing.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      type: object
      required:
      - field
      - code
      - detail
      properties:
        field:
          type: string
        code:
          type: string
        detail:
          type: string
    PageInfo:
      type: object
      additionalProperties: false
      required:
      - number
      - size
      - totalElements
      - totalPages
      properties:
        number:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    IntakeRequest:
      type: object
      additionalProperties: false
      required:
      - skuId
      - quantity
      properties:
        skuId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
          description: Defaults from nexus.inventory config when left out.
        quantity:
          type: integer
          format: int32
          minimum: 1
    Balance:
      type: object
      additionalProperties: false
      required:
      - skuId
      - warehouseId
      - total
      - available
      - reserved
      - unavailable
      properties:
        skuId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        total:
          type: integer
          format: int32
          minimum: 0
        available:
          type: integer
          format: int32
          minimum: 0
        reserved:
          type: integer
          format: int32
          minimum: 0
        unavailable:
          type: integer
          format: int32
          minimum: 0
    Availability:
      type: object
      additionalProperties: false
      required:
      - skuId
      - available
      properties:
        skuId:
          type: string
          format: uuid
        available:
          type: integer
          format: int32
          minimum: 0
          description: 0 when the SKU has no balance row.
    ReserveRequest:
      type: object
      additionalProperties: false
      required:
      - orderGroupId
      - items
      properties:
        orderGroupId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReserveItem'
    ReserveItem:
      type: object
      additionalProperties: false
      required:
      - orderId
      - skuId
      - quantity
      properties:
        orderId:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
    Reservation:
      type: object
      additionalProperties: false
      required:
      - reservationIds
      - warehouseId
      - expiresAt
      properties:
        reservationIds:
          type: array
          items:
            type: string
            format: uuid
        warehouseId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    ReservationRow:
      type: object
      additionalProperties: false
      required:
      - id
      - skuId
      - warehouseId
      - orderId
      - quantity
      - status
      - expiresAt
      properties:
        id:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 0
        status:
          type: string
          enum:
          - HELD
          - CONFIRMED
          - RELEASED
          - EXPIRED
        expiresAt:
          type: string
          format: date-time
        releasedAt:
          type: string
          format: date-time
          nullable: true
    AdjustmentRequest:
      type: object
      additionalProperties: false
      required:
      - skuId
      - warehouseId
      - quantityDelta
      - reason
      properties:
        skuId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        quantityDelta:
          type: integer
          format: int32
          description: Positive adds stock, negative removes it.
        reason:
          type: string
          minLength: 1
          maxLength: 255
    Movement:
      type: object
      additionalProperties: false
      required:
      - id
      - skuId
      - warehouseId
      - movementType
      - quantity
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        movementType:
          type: string
          enum:
          - IMPORT
          - EXPORT
          - RESERVE
          - RELEASE
          - SALE
          - RETURN
          - ADJUSTMENT
          - TRANSFER
          - INTAKE
          - COMMIT
          description: The inventory_movement_type database enum with the INTAKE and COMMIT values that V6 adds (#131).
        quantity:
          type: integer
          format: int32
          description: Signed, as stored in inventory_movements.quantity; an ADJUSTMENT that removes stock is negative.
        referenceId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
