components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT issued by user-service. JWT sub supplies the caller ID; roles and privileges follow
        ADR-006. Prism checks header presence/shape only, not signatures, roles or ownership.
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        traceId:
          type: string
          minLength: 1
          description: 'Optional in shared service handlers: present only with an active tracing span. Gateway rejection
            responses always include a correlation ID.'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
      description: Wire shape of common-web GlobalExceptionHandler and common-security SecurityProblemAdvice, also
        accepting gateway SecurityConfig ProblemDetail responses. ErrorCode.getCode() is the numeric HTTP status;
        no symbolic code is emitted. errors is only the field/message list produced by bean validation, never SKU
        conflict metadata.
    ValidationError:
      type: object
      additionalProperties: false
      required:
      - field
      - message
      properties:
        field:
          type: string
        message:
          type: string
    CartItem:
      type: object
      additionalProperties: false
      required:
      - id
      - skuId
      - productId
      - productName
      - quantity
      - unitPrice
      - lineTotal
      properties:
        id:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productName:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
        unitPrice:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: VND amount, at most two decimal places; draft JSON number aligned with numeric(19,2). Calculate
            totals on the server using decimal arithmetic, not client floats.
        lineTotal:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: VND amount, at most two decimal places; draft JSON number aligned with numeric(19,2). Calculate
            totals on the server using decimal arithmetic, not client floats.
    Cart:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - items
      - subtotal
      - currency
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ACTIVE
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: VND amount, at most two decimal places; draft JSON number aligned with numeric(19,2). Calculate
            totals on the server using decimal arithmetic, not client floats.
        currency:
          type: string
          enum:
          - VND
        updatedAt:
          type: string
          format: date-time
    AddCartItem:
      type: object
      additionalProperties: false
      required:
      - skuId
      - quantity
      properties:
        skuId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
    UpdateCartItem:
      type: object
      additionalProperties: false
      required:
      - quantity
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
    ShippingAddress:
      type: object
      additionalProperties: false
      required:
      - recipientName
      - phoneNumber
      - addressLine
      - ward
      - district
      - city
      - countryCode
      properties:
        recipientName:
          type: string
          minLength: 1
          maxLength: 150
        phoneNumber:
          type: string
          minLength: 8
          maxLength: 20
        addressLine:
          type: string
          minLength: 1
          maxLength: 500
