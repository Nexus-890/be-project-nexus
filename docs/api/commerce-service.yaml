      parameters:
      - name: id
        in: path
        required: true
        description: Item UUID; subject to caller ownership checks.
        schema:
          type: string
          format: uuid
        example: 00000002-1111-4111-8111-111111111111
  /api/v1/orders:
    post:
      tags:
      - Order
      operationId: createOrderFromMyCart
      summary: Create an order from my active cart
      description: The checkout entry point; there is no separate checkout resource in Sprint 2. Revalidate availability
        and prices, snapshot items and server-computed totals, then create PENDING and check out the cart atomically.
        Return 201 for a new order and 200 on an identical idempotent retry. Reject an empty cart or missing/malformed
        Idempotency-Key with 400. A key owned by another caller returns 400 without disclosing an order; same key
        with changed payload returns 409. Changed prices require the buyer to refetch GET /api/v1/carts/me and reconfirm;
        the shared handler does not emit structured SKU/price fields in errors. Stock reservation integration is
        staged by its owning issue; no order is created when a required reservation service is unavailable. Client
        cannot set owner, status, amount or memo.
      security:
      - bearerAuth: []
      x-required-roles:
      - BUYER
      x-required-privileges:
      - CHECKOUT.START
      - ORDER.CREATE
      responses:
        '201':
          description: A newly created order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                default:
                  $ref: '#/components/examples/OrderDefault'
        '200':
          description: The existing order for an identical idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                default:
                  $ref: '#/components/examples/OrderDefault'
        '400':
          description: Invalid data
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidData:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: Invalid data
                    instance: /api/v1/orders
                malformedBody:
                  value:
                    type: urn:problem:invalid-request-body
                    title: Invalid Request Body
                    status: 400
                    detail: The request body is invalid or malformed
                    instance: /api/v1/orders
                validation:
                  value:
                    type: urn:problem:validation-error
                    title: Validation Failed
                    status: 400
                    detail: The request data is invalid
                    instance: /api/v1/orders
                    errors:
                    - field: shippingAddress.city
                      message: cannot be blank!
                invalidParameter:
                  value:
                    type: urn:problem:invalid-parameter
                    title: Invalid Parameter
                    status: 400
                    detail: Value 'abc' is not a valid UUID for parameter 'Idempotency-Key'
                    instance: /api/v1/orders
        '401':
          description: A valid bearer token is required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                gateway:
                  value:
                    type: https://nexus/errors/unauthorized
                    title: Unauthorized
                    status: 401
                    detail: A valid bearer token is required
                    instance: /api/v1/orders
                    traceId: sprint2-mock-trace-001
                service:
                  value:
                    type: urn:problem:unauthorized
                    title: Unauthorized
                    status: 401
                    detail: A valid access token is required to access this resource
                    instance: /api/v1/orders
          headers:
            WWW-Authenticate:
              description: Bearer authentication challenge from gateway or service security advice
              schema:
                type: string
              example: Bearer
        '403':
          description: The required privilege is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                gateway:
                  value:
                    type: https://nexus/errors/forbidden
                    title: Forbidden
                    status: 403
                    detail: The required privilege is missing
                    instance: /api/v1/orders
                    traceId: sprint2-mock-trace-001
                service:
                  value:
                    type: urn:problem:forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not have permission to access this resource
                    instance: /api/v1/orders
                domain:
                  value:
                    type: urn:problem:domain-error
                    title: Forbidden
                    status: 403
                    detail: You do not have permission!
                    instance: /api/v1/orders
        '409':
          description: The operation conflicts with the current resource state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                priceChanged:
                  value:
                    type: urn:problem:domain-error
                    title: Conflict
                    status: 409
                    detail: Prices changed; review updated prices before retrying.
                    instance: /api/v1/orders
                insufficientStock:
                  value:
                    type: urn:problem:domain-error
                    title: Conflict
                    status: 409
                    detail: Not enough stock for a requested SKU.
                    instance: /api/v1/orders
                idempotencyConflict:
                  value:
                    type: urn:problem:domain-error
                    title: Conflict
                    status: 409
                    detail: Idempotency key was already used with a different request.
                    instance: /api/v1/orders
        '503':
          description: A required downstream service is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:domain-error
                title: Service Unavailable
                status: 503
                detail: A required downstream service is unavailable
                instance: /api/v1/orders
        '500':
          description: An unexpected error occurred
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem:internal-server-error
                title: Internal Server Error
                status: 500
                detail: An unexpected error occurred
                instance: /api/v1/orders
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 'Required client-generated UUID. Scope to caller and request payload: a retry returns the same
          order; a different payload with an already-used key conflicts. A key belonging to another caller must
          never disclose that caller''s order.'
        schema:
          type: string
          format: uuid
        example: 70000000-1111-4111-8111-111111111111
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
            example:
              shippingAddress:
                recipientName: Nguyen Van A
                phoneNumber: '+84900000000'
                addressLine: 123 Nguyen Hue
                ward: Ben Nghe
                district: District 1
                city: Ho Chi Minh City
                countryCode: VN
              paymentMethod: SEPAY
    get:
      tags:
      - Order
      operationId: listMyOrders
      summary: List my own orders
      description: Always filter by validated JWT sub, including for ADMIN, SELLER and SUPPORT_STAFF; this is not
        a list-all administration endpoint. Newest first. Sprint 2 supports status filtering and pagination only.
        Return an empty page object when no orders match.
      security:
      - bearerAuth: []
      x-required-roles:
      - ADMIN
      - SELLER
      - BUYER
      - SUPPORT_STAFF
      x-required-privileges:
      - ORDER.LIST
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
              examples:
                populated:
                  $ref: '#/components/examples/OrderPagePopulated'
                empty:
                  $ref: '#/components/examples/OrderPageEmpty'
        '400':
          description: Invalid data
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidData:
                  value:
                    type: urn:problem:domain-error
                    title: Bad Request
                    status: 400
                    detail: Invalid data
                    instance: /api/v1/orders
