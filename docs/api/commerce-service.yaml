  /api/v1/orders:
    post:
      tags:
      - Order
      operationId: createOrderFromMyCart
      summary: Create one order group from my active cart
      description: >-
        Implemented by #113. POST /api/v1/orders is the only transactional checkout entry point.
        Revalidate current catalog unit prices, snapshot names, SKU codes, images and prices, split the cart by seller,
        and create one PENDING order group containing one STANDARD order per seller. Commit the group,
        orders, items and cart CHECKED_OUT status together. Return 201 for a new group and 200 for an
        identical caller/request replay with the same group and order IDs. Resolve replay before reading
        the current cart or catalog. Empty carts and missing/invalid keys return 400; reuse by a different
        buyer or normalized body returns 409 without disclosing another buyer's purchase. The key is
        globally unique, 1..100 visible ASCII characters with no surrounding whitespace. This sprint
        selects StubInventoryClient by configuration; no real stock is held. Every new order reads
        the current catalog prices again; price revalidation has no disable toggle. Real reservations
        and outbox publication remain #138 and #118. New group amounts are JSON
        numbers backed by BigDecimal/numeric(19,2), following the updated issue example. Client cannot
        set owner, seller, status, prices or totals. No memo or QR is generated here; payment-service
        owns the group's single payment session under #121/#240. Older GET/payment shapes below remain drafts.
      security:
      - bearerAuth: []
      x-required-privileges:
      - CHECKOUT.START
      - ORDER.CREATE
      responses:
        '201':
          description: A newly created purchase group with one order per seller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderGroup'
              examples:
                default:
                  $ref: '#/components/examples/OrderGroupCreated'
        '200':
          description: The same group and seller orders for an identical idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderGroup'
              examples:
                default:
                  $ref: '#/components/examples/OrderGroupCreated'
        '400':
