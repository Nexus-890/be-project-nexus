            totals on the server using decimal arithmetic, not client floats.
    OrderStatus:
      type: string
      enum:
      - PENDING
      - PAID
      - CANCELED
      description: Sprint 2 exposed lifecycle only. Other database statuses belong to later sprint contracts.
    Order:
      type: object
      additionalProperties: false
      required:
      - id
      - orderNumber
      - orderType
      - status
      - items
      - shippingAddress
      - paymentMethod
      - subtotal
      - discountAmount
      - taxAmount
      - shippingFee
      - totalAmount
      - currency
      - memoCode
      - paymentNote
      - paymentDueAt
      - paidAt
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
        orderType:
          type: string
          enum:
          - STANDARD
          - AUCTION
          description: Sprint 2 HTTP order creation creates STANDARD only. AUCTION creation comes from later internal
            settlement.
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        shippingAddress:
          $ref: '#/components/schemas/ShippingAddress'
        paymentMethod:
          type: string
          enum:
          - SEPAY
        subtotal:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: VND amount, at most two decimal places; draft JSON number aligned with numeric(19,2). Calculate
            totals on the server using decimal arithmetic, not client floats.
        discountAmount:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: VND amount, at most two decimal places; draft JSON number aligned with numeric(19,2). Calculate
            totals on the server using decimal arithmetic, not client floats.
        taxAmount:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: VND amount, at most two decimal places; draft JSON number aligned with numeric(19,2). Calculate
            totals on the server using decimal arithmetic, not client floats.
        shippingFee:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: VND amount, at most two decimal places; draft JSON number aligned with numeric(19,2). Calculate
            totals on the server using decimal arithmetic, not client floats.
        totalAmount:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: VND amount, at most two decimal places; draft JSON number aligned with numeric(19,2). Calculate
            totals on the server using decimal arithmetic, not client floats.
        currency:
          type: string
          enum:
          - VND
        memoCode:
          type: string
        paymentNote:
          type: string
          description: Human-readable transfer guidance; memoCode is the exact transfer memo.
        paymentDueAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderPage:
      type: object
      additionalProperties: false
      required:
      - content
      - page
      - size
      - totalElements
      - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
