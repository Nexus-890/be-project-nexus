          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productName:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
        unitPrice:
          type: string
          pattern: ^\d+\.\d{2}$
          example: '150000.50'
          description: Nonnegative VND decimal amount with exactly two fractional digits. Preserve as a string on
            the wire; use decimal arithmetic on the server and do not convert to a JavaScript Number for money calculations.
        lineTotal:
