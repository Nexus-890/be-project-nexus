              examples:
                gateway:
                  value:
                    type: https://nexus/errors/forbidden
                    title: Forbidden
                    status: 403
                    detail: The required privilege is missing
                    instance: /api/v1/carts/me/items/00000002-1111-4111-8111-111111111111
                    traceId: sprint2-mock-trace-001
                service:
                  value:
                    type: urn:problem:forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not have permission to access this resource
                    instance: /api/v1/carts/me/items/00000002-1111-4111-8111-111111111111
                domain:
                  value:
