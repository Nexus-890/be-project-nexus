server:
  port: 8888

spring:
  application:
    name: service-config

  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

nexus:
  security:
    jwt:
      issuer: ${KEYCLOAK_ISSUER_URI:http://localhost:18080/realms/nexus}
      audience: nexus-services
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:18080/realms/nexus/protocol/openid-connect/certs}
  system-config:
    keycloak:
      server-url: ${KEYCLOAK_SERVER_URL:http://localhost:18080}
      realm: ${KEYCLOAK_REALM:nexus}
      client-id: config-service
      client-secret: ${KEYCLOAK_CONFIG_SERVICE_CLIENT_SECRET:}
      timeout: 5s
    state-file: ${SYSTEM_CONFIG_STATE_FILE:./data/system-configs.json}
    notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
    user-url: ${USER_SERVICE_URL:http://localhost:8081}
    catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    commerce-url: ${COMMERCE_SERVICE_URL:http://localhost:8083}
    auction-url: ${AUCTION_SERVICE_URL:http://localhost:8084}
    inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8085}
    payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8087}
    shipment-url: ${SHIPMENT_SERVICE_URL:http://localhost:8088}
    rating-url: ${RATING_SERVICE_URL:http://localhost:8089}
    audit:
      shared-secret: ${CONFIG_AUDIT_SHARED_SECRET:}
