server:
  port: 8888

spring:
  application:
    name: service-config

  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

nexus:
  catalog:
    category-max-level: 3