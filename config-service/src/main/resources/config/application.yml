# ==========================================
# COMMON CONFIGURATION
# Các Config Client đều có thể sử dụng
# ==========================================

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:${ZIPKIN_PORT:9411}/api/v2/spans
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Only services with the Kafka starter instantiate Kafka clients.
# Override SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092 for Compose-network clients.
spring:
  kafka:
    bootstrap-servers: localhost:29092
    admin:
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        "[allow.auto.create.topics]": false
    listener:
      ack-mode: record
      concurrency: 1
      missing-topics-fatal: true

nexus:
  kafka:
    demo:
      topic: nexus.training.integration.v1
    topics:
      user: nexus.user.events
      catalog: nexus.catalog.events
      commerce: nexus.commerce.events
      auction: nexus.auction.events
      fulfillment: nexus.fulfillment.events
