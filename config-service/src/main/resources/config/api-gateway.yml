server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

              predicates:
                - name: Path
                  args:
                    pattern: "'/${app.api-prefix}/' + serviceId + '/**'"

              filters:
                - name: RewritePath
                  args:
                    regexp: "'/${app.api-prefix}/' + serviceId + '/?(?<remaining>.*)'"
                    replacement: "'/${remaining}'"

app:
  api-prefix: api

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html

    # Swagger tổng hợp
    url: /swagger-docs/all

    disable-swagger-default-url: true