server:
  port: 8080
  # Dùng IP kết nối trực tiếp; không tin header IP do client tự gửi.
  forward-headers-strategy: none

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Fetch realm keys directly from Keycloak, never through this gateway.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:18080/realms/nexus/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:18080/realms/nexus}
          audiences:
            - nexus-services
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Giới hạn thời gian chờ Redis để fail-open không làm treo request.
      connect-timeout: 200ms
      timeout: 200ms
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000

management:
  health:
    redis:
      # Redis lỗi vẫn fail-open, không làm health của Gateway chuyển DOWN.
      enabled: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html

    # Swagger tổng hợp
    url: /swagger-docs/all

    disable-swagger-default-url: true

nexus:
  security:
    # Keep endpoint policies and docs/api/gateway-permissions.md in the same MR.
    public-endpoints:
      - method: POST
        path: /api/v1/auth/register
      - method: GET
        path: /api/v1/products
      - method: GET
        path: /api/v1/products/{id}
      - method: GET
        path: /api/v1/categories/{id}
      - method: GET
        path: /api/v1/categories/tree
      - method: GET
        path: /api/v1/products/{id}/skus
      - method: GET
        path: /api/v1/skus/{id}
      - method: POST
        path: /api/v1/webhooks/sepay
      - method: POST
        path: /api/v1/webhooks/carriers/ghn
      - method: POST
        path: /api/v1/webhooks/carriers/ghtk
      - method: GET
        path: /api/v1/shipping/provinces
      - method: GET
        path: /api/v1/shipping/districts
      - method: GET
        path: /api/v1/shipping/wards
    protected-endpoints:
      - method: GET
        path: /api/v1/users/me
        privilege: PROFILE.VIEW
      - method: GET
        path: /api/v1/users
        privilege: USER.LIST
      - method: PUT
        path: /api/v1/users/me
        privilege: PROFILE.UPDATE
      - method: POST
        path: /api/v1/products
        privilege: PRODUCT.CREATE
      - method: GET
        path: /api/v1/products/mine
        privilege: PRODUCT.LIST
      - method: PUT
        path: /api/v1/products/{id}
        privilege: PRODUCT.UPDATE
      - method: PATCH
        path: /api/v1/products/{id}/status
        privilege: PRODUCT.UPDATE
      - method: DELETE
        path: /api/v1/products/{id}
        privilege: PRODUCT.DELETE
      - method: POST
        path: /api/v1/categories
        privilege: CATEGORY.CREATE
      - method: PATCH
        path: /api/v1/categories/{id}
        privilege: CATEGORY.UPDATE
      - method: DELETE
        path: /api/v1/categories/{id}
        privilege: CATEGORY.DELETE
      - method: POST
        path: /api/v1/products/{id}/skus
        privilege: PRODUCT.UPDATE
      - method: PUT
        path: /api/v1/skus/{id}
        privilege: PRODUCT.UPDATE
      - method: GET
        path: /api/v1/carts/me
        privilege: CART.VIEW
      - method: POST
        path: /api/v1/carts/me/items
        privilege: CART.UPDATE
      - method: PUT
        path: /api/v1/carts/me/items/{id}
        privilege: CART.UPDATE
      - method: DELETE
        path: /api/v1/carts/me/items/{id}
        privilege: CART.REMOVE_ITEM
      - method: POST
        path: /api/v1/orders
        privilege: ORDER.CREATE
      - method: GET
        path: /api/v1/orders/{id}/history
        privilege: ORDER.VIEW
      - method: POST
        path: /api/v1/payments
        privilege: CHECKOUT.START
      - method: GET
        path: /api/v1/orders
        privilege: ORDER.LIST
      - method: GET
        path: /api/v1/orders/manage
        privilege: ORDER.LIST
      - method: GET
        path: /api/v1/orders/sales
        privilege: ORDER.LIST
      - method: GET
        path: /api/v1/orders/{id}
        privilege: ORDER.VIEW
      - method: POST
        path: /api/v1/orders/{id}/cancel
        privilege: ORDER.CANCEL
      - method: GET
        path: /api/v1/notifications
        privilege: NOTIFICATION.VIEW
      - method: GET
        path: /api/v1/notifications/unread-count
        privilege: NOTIFICATION.VIEW
      - method: GET
        path: /api/v1/payments
        privilege: ORDER.REFUND
      - method: POST
        path: /api/v1/refunds
        privilege: ORDER.REFUND
      - method: GET
        path: /api/v1/refunds
        privilege: ORDER.REFUND
      - method: POST
        path: /api/v1/refunds/{id}/complete
        privilege: ORDER.REFUND
      - method: POST
        path: /api/v1/shipping/quotes
        privilege: SHIPPING.QUOTE
      - method: GET
        path: /api/v1/carriers
        privilege: SHIPPING.QUOTE
      - method: POST
        path: /api/v1/shipments
        privilege: SHIPPING.CREATE_SHIPMENT
      - method: GET
        path: /api/v1/shipments
        privilege: SHIPPING.VIEW_SHIPMENT
      - method: GET
        path: /api/v1/shipments/{id}
        privilege: SHIPPING.VIEW_SHIPMENT
      - method: GET
        path: /api/v1/shipments/{id}/tracking
        privilege: SHIPPING.VIEW_SHIPMENT
      - method: PATCH
        path: /api/v1/shipments/{id}/status
        privilege: SHIPPING.UPDATE_STATUS
      - method: POST
        path: /api/v1/shipments/{id}/override
        privilege: SHIPPING.MANUAL_OVERRIDE
      - method: POST
        path: /api/v1/ratings
        privilege: REPUTATION.RATE
      - method: GET
        path: /api/v1/ratings
        privilege: REPUTATION.VIEW
      - method: GET
        path: /api/v1/reputations/{userId}
        privilege: REPUTATION.VIEW
      - method: POST
        path: /api/v1/reputations/{userId}/adjustments
        privilege: USER.REPUTATION.ADJUST
      - method: GET
        path: /api/v1/reputations/{userId}/history
        privilege: USER.REPUTATION.VIEW
      - method: PATCH
        path: /api/v1/notifications/{id}/read
        privilege: NOTIFICATION.VIEW
      - method: PATCH
        path: /api/v1/notifications/read-all
        privilege: NOTIFICATION.VIEW
      - method: POST
        path: /api/v1/products/{id}/images
        privilege: PRODUCT.UPDATE
      - method: DELETE
        path: /api/v1/products/{id}/images/{imageId}
        privilege: PRODUCT.UPDATE
      - method: PUT
        path: /api/v1/products/{id}/images/order
        privilege: PRODUCT.UPDATE
      - method: POST
        path: /api/v1/auctions
        privilege: AUCTION.CREATE
      - method: GET
        path: /api/v1/event-logs
        privilege: EVENT_LOG.VIEW
      - method: GET
        path: /api/v1/event-logs/{id}
        privilege: EVENT_LOG.VIEW_DETAIL
      - method: GET
        path: /api/v1/audit-logs
        privilege: AUDIT_LOG.VIEW
  gateway:
    rate-limit:
      # Có thể đổi qua Config Server và /actuator/refresh; đủ cho polling 2 giây.
      requests-per-minute: 100
