server:
  port: 8081
nexus:
  iam:
    default-user-role: BUYER
    allow-self-registration: true
    user-soft-delete: ${USER_SOFT_DELETE:true}
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:18080}
    realm: nexus
    client-id: user-service
    client-secret: ${KEYCLOAK_USER_SERVICE_CLIENT_SECRET:}
    timeout: 5s
  security:
    jwt:
      issuer: ${KEYCLOAK_ISSUER_URI:http://localhost:18080/realms/nexus}
      audience: nexus-services
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:18080/realms/nexus/protocol/openid-connect/certs}
    public-endpoints:
      - method: POST
        path: /api/v1/auth/register

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/user_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
