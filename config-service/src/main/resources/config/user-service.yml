server:
  port: 8081
nexus:
  iam:
    access-token-expiry-minutes: 60
    max-login-attempts: 5
    lock-duration-minutes: 15
    default-user-role: BUYER
    allow-self-registration: true
    jwt:
      issuer: user-service
      audience: nexus-services
      key-id: ${JWT_KEY_ID:}
      private-key-path: ${JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:}
  security:
    jwt:
      issuer: ${KEYCLOAK_ISSUER_URI:http://localhost:18080/realms/nexus}
      audience: nexus-services
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:18080/realms/nexus/protocol/openid-connect/certs}
    public-endpoints:
      - method: POST
        path: /api/v1/auth/login
      - method: POST
        path: /api/v1/auth/register
      - method: GET
        path: /.well-known/jwks.json

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/user_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
