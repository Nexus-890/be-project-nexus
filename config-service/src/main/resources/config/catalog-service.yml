server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/catalog_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true

nexus:
  security:
    jwt:
      issuer: ${KEYCLOAK_ISSUER_URI:http://localhost:18080/realms/nexus}
      audience: nexus-services
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:18080/realms/nexus/protocol/openid-connect/certs}
    public-endpoints:
      - method: GET
        path: /api/v1/products
      - method: GET
        path: /api/v1/products/{id}
      - method: GET
        path: /api/v1/products/{id}/skus
      - method: GET
        path: /api/v1/categories/**
      - method: GET
        path: /api/v1/skus/**
      - method: GET
        path: /v3/api-docs/**
      - method: GET
        path: /swagger-ui/**
  catalog:
    category-max-level: 3
    category-tree:
      sort-type: NAME_ASC
    allow-category-delete-with-product: false
    allow-product-delete-with-order: false
