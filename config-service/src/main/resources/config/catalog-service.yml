server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/catalog_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true

nexus:
  security:
    jwt:
      issuer: user-service
      audience: nexus-services
      jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
    public-endpoints:
      - method: GET
        path: /api/v1/products
      - method: GET
        path: /api/v1/products/{id}
      - method: GET
        path: /api/v1/products/{id}/skus
      - method: GET
        path: /api/v1/categories/**
      - method: GET
        path: /api/v1/skus/**
      - method: GET
        path: /v3/api-docs/**
      - method: GET
        path: /swagger-ui/**
  catalog:
    max-product-images: ${MAX_PRODUCT_IMAGES:5}
    category-max-level: 3
    category-tree:
      sort-type: NAME_ASC
    allow-category-delete-with-product: false
    allow-product-delete-with-order: false
    order-references:
      mode: http
      base-url: ${COMMERCE_SERVICE_URL:http://localhost:8083}
      connect-timeout-millis: 1000
      read-timeout-millis: 3000
  storage:
    supabase-url: ${SUPABASE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_BUCKET:product-images}
    max-file-size: ${MAX_IMAGE_FILE_SIZE:5MB}
