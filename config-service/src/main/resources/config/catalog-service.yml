server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/catalog_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true

nexus:
  security:
    jwt:
      issuer: user-service
      audience: nexus-services
      jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
    public-endpoints:
      - method: GET
        path: /api/v1/products/{id}
      - method: GET
        path: /api/v1/categories/**
      - method: GET
        path: /v3/api-docs/**
      - method: GET
        path: /swagger-ui/**
    catalog:
      category-max-level: 3
      category-tree:
        sort-type: NAME_ASC
      allow-category-delete-with-product: false
  catalog:
    category-max-level: 3
    category-tree:
      sort-type: NAME_ASC
    allow-category-delete-with-product: false