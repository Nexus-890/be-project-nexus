server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/commerce_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true

nexus:
  security:
    public-endpoints:
      - method: POST
        path: /api/v1/carts/guest
      - method: GET
        path: /api/v1/carts/me
      - method: POST
        path: /api/v1/carts/me/items
      - method: PUT
        path: /api/v1/carts/me/items/{id}
      - method: DELETE
        path: /api/v1/carts/me/items/{id}
    jwt:
      issuer: user-service
      audience: nexus-services
      jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
  cart:
    max-active-per-user: 1
    allow-guest-cart: ${ALLOW_GUEST_CART:false}
    merge-on-login: ${CART_MERGE_ON_LOGIN:true}
    guest-token-secret: ${CART_GUEST_TOKEN_SECRET:}
    expiration-days: 7
  checkout:
    # BR-103: fixed true; invalid overrides fail configuration validation.
    price-revalidation: ${CHECKOUT_PRICE_REVALIDATION:true}
    # BR-200: VND threshold; used once shipping quote #201 is available.
    free-shipping-threshold: ${FREE_SHIPPING_THRESHOLD:1000000}
  order:
    idempotency-enabled: ${ORDER_IDEMPOTENCY_ENABLED:true}
    # Sprint 3 disables this flag when wiring a real InventoryClient.
    inventory-stub-enabled: true
    payment-timeout-minutes: 15
