server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/commerce_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true

nexus:
  security:
    public-endpoints:
      - method: GET
        path: /api/v1/vouchers
      - method: POST
        path: /api/v1/carts/guest
      - method: GET
        path: /api/v1/carts/me
      - method: POST
        path: /api/v1/carts/me/items
      - method: PUT
        path: /api/v1/carts/me/items/{id}
      - method: DELETE
        path: /api/v1/carts/me/items/{id}
    jwt:
      issuer: ${KEYCLOAK_ISSUER_URI:http://localhost:18080/realms/nexus}
      audience: nexus-services
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:18080/realms/nexus/protocol/openid-connect/certs}
  cart:
    max-active-per-user: 1
    allow-guest-cart: ${ALLOW_GUEST_CART:false}
    merge-on-login: ${CART_MERGE_ON_LOGIN:true}
    guest-token-secret: ${CART_GUEST_TOKEN_SECRET:}
    expiration-days: 7
  checkout:
    price-revalidation: ${CHECKOUT_PRICE_REVALIDATION:true}
    free-shipping-threshold: ${FREE_SHIPPING_THRESHOLD:1000000}
  order:
    idempotency-enabled: ${ORDER_IDEMPOTENCY_ENABLED:true}
    inventory-base-url: ${ORDER_INVENTORY_BASE_URL:}
    shipping-base-url: ${ORDER_SHIPPING_BASE_URL:}
    remote-timeout-ms: ${ORDER_REMOTE_TIMEOUT_MS:1800}
    remote-breaker-failure-threshold: ${ORDER_REMOTE_BREAKER_FAILURE_THRESHOLD:5}
    remote-breaker-open-ms: ${ORDER_REMOTE_BREAKER_OPEN_MS:30000}
    shipment-retry-interval: ${ORDER_SHIPMENT_RETRY_INTERVAL:5s}
    auto-complete-days: ${ORDER_AUTO_COMPLETE_DAYS:7}
    auto-complete-interval: ${ORDER_AUTO_COMPLETE_INTERVAL:1m}
