server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/commerce_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true

nexus:
  security:
    jwt:
      issuer: ${KEYCLOAK_ISSUER_URI:http://localhost:18080/realms/nexus}
      audience: nexus-services
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:18080/realms/nexus/protocol/openid-connect/certs}
  cart:
    max-active-per-user: 1
    allow-guest-cart: false
    expiration-days: 7
  checkout:
    price-revalidation: ${CHECKOUT_PRICE_REVALIDATION:true}
  order:
    idempotency-enabled: ${ORDER_IDEMPOTENCY_ENABLED:true}
    # Sprint 3 disables this flag when wiring a real InventoryClient.
    inventory-stub-enabled: true
    payment-timeout-minutes: 15
