server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/inventory_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
nexus:
  security:
    public-endpoints:
      - method: GET
        path: /api/v1/inventory
      - method: GET
        path: "/api/v1/inventory/{skuId:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}"
    jwt:
      issuer: ${KEYCLOAK_ISSUER_URI:http://localhost:18080/realms/nexus}
      audience: nexus-services
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:18080/realms/nexus/protocol/openid-connect/certs}
  inventory:
    default-warehouse-code: WH_001
