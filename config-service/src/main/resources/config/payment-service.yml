server:
  port: 8087

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/payment_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

nexus:
  security:
    public-endpoints:
      - method: POST
        path: /api/v1/webhooks/sepay
      - method: POST
        path: /api/v1/payments/payouts/callbacks/{provider}
    jwt:
      issuer: ${KEYCLOAK_ISSUER_URI:http://localhost:18080/realms/nexus}
      audience: nexus-services
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:18080/realms/nexus/protocol/openid-connect/certs}
  payment:
    provider: ${PAYMENT_PROVIDER:SEPAY}
    retry-limit: ${PAYMENT_RETRY_LIMIT:3}
    consumer-group: payment-session-events
    payout-eligibility:
      cron: ${PAYMENT_PAYOUT_ELIGIBILITY_CRON:*/30 * * * * *}
    pending-cancellations:
      cron: ${PAYMENT_PENDING_CANCELLATIONS_CRON:*/30 * * * * *}
      batch-size: ${PAYMENT_PENDING_CANCELLATIONS_BATCH_SIZE:100}
    sepay:
      bank-id: ${SEPAY_BANK_ID:970415}
      bank-account: ${SEPAY_BANK_ACCOUNT:}
      account-name: ${SEPAY_ACCOUNT_NAME:}
      vietqr-template: ${SEPAY_VIETQR_TEMPLATE:compact}
      transfer-content-prefix: ${SEPAY_TRANSFER_CONTENT_PREFIX:SEVQR}
      webhook:
        secret: ${SEPAY_WEBHOOK_SECRET:}
  payout:
    platform-fee-rate: ${PAYOUT_PLATFORM_FEE_RATE:0.00}
    provider: ${PAYOUT_PROVIDER:sandbox}
    account-encryption-key: ${PAYOUT_ACCOUNT_ENCRYPTION_KEY:}
    max-attempts: ${PAYOUT_MAX_ATTEMPTS:3}
    retry-backoff: ${PAYOUT_RETRY_BACKOFF:PT1M}
    reconcile-interval: ${PAYOUT_RECONCILE_INTERVAL:PT1M}
    provider-timeout: ${PAYOUT_PROVIDER_TIMEOUT:PT10S}
    dispatch-cron: ${PAYOUT_DISPATCH_CRON:*/10 * * * * *}
    jobs-enabled: ${PAYOUT_JOBS_ENABLED:true}
    sandbox-outcome: ${PAYOUT_SANDBOX_OUTCOME:SUCCESS}
    callback-secret: ${PAYOUT_CALLBACK_SECRET:}
    provider-url: ${PAYOUT_PROVIDER_URL:}
    provider-token: ${PAYOUT_PROVIDER_TOKEN:}
