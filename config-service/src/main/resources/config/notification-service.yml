server:
  port: 8086

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notification_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

nexus:
  security:
    jwt:
      issuer: user-service
      audience: nexus-services
      jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
  kafka:
    demo:
      group-id: nexus.notification.kafka-demo.v1
      client-id: notification-demo
      processing-delay-ms: 0
  notification:
    email-enabled: ${EMAIL_NOTIFICATION_ENABLED:false}
    group-id: nexus.notification.domain-events.v1
  outbox:
    relay:
      enabled: false
  health:
    services:
      - user-service
      - catalog-service
      - commerce-service
      - auction-service
      - inventory-service
      - payment-service
      - shipment-service
      - rating-service
      - notification-service
    keycloak-realm-url: ${KEYCLOAK_REALM_URL:http://localhost:18080/realms/nexus}
    timeout: 2s
    broker-interval: PT15S

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
