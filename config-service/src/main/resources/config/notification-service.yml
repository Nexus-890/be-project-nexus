server:
  port: 8086

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notification_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAILPIT_SMTP_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

nexus:
  security:
    jwt:
      issuer: ${KEYCLOAK_ISSUER_URI:http://localhost:18080/realms/nexus}
      audience: nexus-services
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:18080/realms/nexus/protocol/openid-connect/certs}
  kafka:
    demo:
      group-id: nexus.notification.kafka-demo.v1
      client-id: notification-demo
      processing-delay-ms: 0
  notification:
    email-enabled: ${EMAIL_NOTIFICATION_ENABLED:false}
    group-id: nexus.notification.domain-events.v1
    delivery:
      retry-limit: ${NOTIFICATION_RETRY_LIMIT:3}
      base-delay: 1s
      max-delay: 30s
      jitter: 0.2
      poll-interval: 2s
      attempt-timeout: 2m
      batch-size: 20
      from: ${NOTIFICATION_EMAIL_FROM:no-reply@nexus.local}
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:18080}
    realm: nexus
    client-id: notification-service
    client-secret: ${KEYCLOAK_NOTIFICATION_SERVICE_CLIENT_SECRET:}
    timeout: 5s
  outbox:
    relay:
      enabled: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
