server:
  port: 8086

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/notification_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

nexus:
  kafka:
    demo:
      group-id: nexus.notification.kafka-demo.v1
      client-id: notification-demo
      processing-delay-ms: 0

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
