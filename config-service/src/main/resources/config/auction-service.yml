server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/auction_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true

nexus:
  auction:
    min-duration-minutes: ${AUCTION_MIN_DURATION_MINUTES:60}
    max-duration-hours: ${AUCTION_MAX_DURATION_HOURS:168}
    anti-sniping-enabled: ${NEXUS_AUCTION_ANTI_SNIPING_ENABLED:true}
    anti-sniping-extension-minutes: ${NEXUS_AUCTION_ANTI_SNIPING_EXTENSION_MINUTES:5}
    anti-sniping-max-extension-minutes: ${NEXUS_AUCTION_ANTI_SNIPING_MAX_EXTENSION_MINUTES:30}
  security:
    public-endpoints:
      - method: GET
        path: /api/v1/auctions
      - method: GET
        path: /api/v1/auctions/{id}
    jwt:
      issuer: ${KEYCLOAK_ISSUER_URI:http://localhost:18080/realms/nexus}
      audience: nexus-services
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:18080/realms/nexus/protocol/openid-connect/certs}
