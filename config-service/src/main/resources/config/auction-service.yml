server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/auction_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  cloud:
    loadbalancer:
      retry:
        enabled: false
    openfeign:
      client:
        config:
          auctionCatalog:
            connectTimeout: 500
            readTimeout: 1500

resilience4j:
  circuitbreaker:
    instances:
      auctionCatalog:
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 1
  timelimiter:
    instances:
      auctionCatalog:
        timeoutDuration: 2s

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true

nexus:
  auction:
    min-duration-minutes: ${AUCTION_MIN_DURATION_MINUTES:60}
    max-duration-hours: ${AUCTION_MAX_DURATION_HOURS:168}
    max-active-per-seller: ${MAX_ACTIVE_AUCTIONS_PER_SELLER:5}
    anti-sniping-enabled: ${NEXUS_AUCTION_ANTI_SNIPING_ENABLED:true}
    anti-sniping-extension-minutes: ${NEXUS_AUCTION_ANTI_SNIPING_EXTENSION_MINUTES:5}
    anti-sniping-max-extension-minutes: ${NEXUS_AUCTION_ANTI_SNIPING_MAX_EXTENSION_MINUTES:30}
  security:
    public-endpoints:
      - method: GET
        path: /api/v1/auctions
      - method: GET
        path: /api/v1/auctions/{id}
      - method: GET
        path: /api/v1/auctions/{id}/state
      - method: GET
        path: /api/v1/auctions/{id}/bids
    jwt:
      issuer: ${KEYCLOAK_ISSUER_URI:http://localhost:18080/realms/nexus}
      audience: nexus-services
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:18080/realms/nexus/protocol/openid-connect/certs}
